<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health AI assurance review</title>
<!-- No webfont link, deliberately.

     This file is the dashboard for a hospital's governance records. Fetching
     a stylesheet from fonts.googleapis.com meant every page load announced
     itself to a third party, from a tool whose entire subject is where
     regulated data goes -- and it failed to render properly on the
     egress-filtered networks this is most likely to run on.

     --sans and --display in the stylesheet already name complete fallback
     stacks ending in system-ui, so the typography degrades to the platform
     UI face rather than to Times. Inline a base64 @font-face subset here if
     the exact faces ever matter more than this does.

     Keeping this file free of third-party origins is also what lets the
     Content-Security-Policy in proxy/Caddyfile be as tight as it is. -->
<style>
/*@CSS@*/
</style>
</head>
<body class="home">
<header class="top">
  <button class="brand-btn" id="brandBtn" type="button" aria-label="Go to all projects"><span class="brand">Health AI assurance review<small id="projName">Portfolio</small></span></button>
  <span class="mode" id="mode">Connecting…</span>
  <div class="spacer"></div>
  <span class="saved" id="saved" aria-live="polite"></span>
  <button class="btn ghost preview-toggle proj-only" id="openPreview" type="button">Model card</button>
  <input type="file" id="importFile" accept="application/json,.json" class="vh" aria-label="Import project JSON">
  <button class="btn proj-only" id="goReport" type="button">View report</button>
</header>
<div class="shell">
  <nav class="rail" aria-label="Review steps"><ol id="rail"></ol></nav>
  <main id="main" tabindex="-1"></main>
  <aside class="panel" id="panel" aria-label="Applied model card preview">
    <div class="panel-head"><p>Applied model card, live</p><button class="btn ghost panel-close" id="closePreview" type="button">Close</button></div>
    <div id="labelHost"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/*@JS@*/
</script>
</body>
</html>
