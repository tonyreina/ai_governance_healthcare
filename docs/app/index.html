for expert review."},{"name":"Claim Recall for Summary Factual Coverage","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The study reports TracSum as a benchmark with 500 annotated medical abstracts and 3.5K summary-citation pairs. No universal Claim Recall threshold is reported.","description":"Measures completeness of generated medical aspect-based summaries against annotated claim or aspect content, paired with sentence-level traceability to source evidence. The cited TracSum benchmark contains 500 medical abstracts and 3.5K summary-citation pairs.","intended_use":"Evaluate whether generated clinical or biomedical summaries cover required factual claims and provide traceable source support."},{"name":"Number of Integrated Wearable / RPM Device Types","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The prototype integrates vital signs, wearable accelerometer data, and visual camera or video data. No minimum device-count threshold is reported.","description":"Counts the types of remote monitoring data streams integrated into an autonomous health monitoring prototype. REMONI processes vital signs, accelerometer data from a wearable device, and visual data from patient video clips.","intended_use":"Evaluate whether a remote patient monitoring agent ingests the sensor modalities required for the intended monitoring workflow."},{"name":"Per-Record Processing Time (seconds)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"Mean prediction latency was 0.0177 seconds with SD 0.0021, memory utilization was 88.80 MB with SD 0.01, per-record processing time was 0.18 ms, and coefficient of variation was <5%.","description":"Measures computational efficiency for a web-based machine learning model by timing prediction latency, memory use, and per-record processing time during repeated batch testing.","intended_use":"Evaluate whether a deployed clinical prediction model can process patient records within operational latency constraints."},{"name":"Milestone Achievement Rate (Multi-Agent Coordination KPI)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"No universal numeric threshold is reported in the cited source. Use task-defined milestones and report the proportion achieved.","description":"Measures whether multi-agent coordination processes reach predefined intermediate milestones during collaborative task execution. The supplied source describes multi-agent coordination evaluation rather than establishing a universal milestone threshold.","intended_use":"Evaluate progress in multi-agent workflows where final task success depends on staged coordination checkpoints."},{"name":"Cost-per-Success (Cost-of-Pass)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited Efficient Agents study reports cost-of-pass of $0.228 in its evaluation setting. Outside that setting, establish a local baseline and require cost-per-success to improve without reducing safety, fairness, or policy-compliant task completion.","description":"Average operational cost required for an agent to successfully complete one task, computed as total inference, retry, tool, and infrastructure cost divided by number of successfully completed tasks. Captures whether an agentic system is economically sustainable at scale rather than only technically capable.","intended_use":"Evaluate whether an agentic AI system can achieve required task success rates under realistic production constraints, including tool use, multi-step planning, retries, and monitoring overhead."},{"name":"Slot Extraction F1 Score (SEF1)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"Fine-tuned Llama 3 8B achieved average F1 of 0.77 across the main test datasets and 0.78 when trained with both LLM-generated and human annotations. The study reports a 26 percentage-point absolute F1 increase over vanilla LLMs and a 34% relative F1 improvement over off-the-shelf extractive models. No healthcare-scheduling-specific SEF1 threshold is reported.","description":"Measures the harmonic mean of precision and recall for entity-level slot extraction by a conversational agent, computed as 2 x precision x recall / (precision + recall). The cited study evaluates lenient precision, recall, and F1 for LLM-based slot filling over conversational dialogue datasets after inverse text normalization.","intended_use":"Evaluate whether a voice scheduling agent captures structured patient information, such as name, date of birth, insurance information, and requested scheduling details, before downstream booking actions."},{"name":"Call Abandonment Rate (CAR)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The supplied citation does not report call abandonment rate or the 5% and 8% thresholds. A different peer-reviewed call-center or healthcare access study is required before using a numeric benchmark.","description":"Measures the proportion of inbound patient calls in which the caller disconnects before task completion, computed as abandoned calls divided by total inbound calls handled by the agent. The supplied citation evaluates e-health service use and does not measure call abandonment.","intended_use":"Monitor whether a deployed voice scheduling agent loses callers before appointment booking, information delivery, or handoff completion."},{"name":"Top-k Symptom-to-Visit Type Mapping Accuracy (Workflow Gap)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The study reports classification performance for patient self-reported symptom and need text, but it does not define a top-k visit-type benchmark. Use top-k accuracy only against locally annotated scheduling labels; the cited study should be treated as proxy evidence for the text-classification task.","description":"Measures whether the correct visit type derived from patient-described natural language input appears within the top k predicted outputs. The cited study evaluates classification of patient self-reported symptom and need text into structured clinical categories; it supports text-to-category classification as a proxy, not visit-type matching directly.","intended_use":"Evaluate whether a voice scheduling agent maps patient-described symptoms to the correct scheduling category, visit type, or routing queue."},{"name":"Legal Agent Intermediate Progress Rate (LAIPR)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"LegalAgentBench reports 300 annotated tasks spanning 17 legal corpora and 37 tools and computes intermediate progress rate through keyword-based intermediate-step analysis. The cited source reports progress by model and task setting, not a universal deployment threshold.","description":"Measures the proportion of intermediate reasoning and tool-use steps completed before a final answer on multi-hop legal tasks. The cited benchmark defines legal-agent tasks over corpora and tools and reports intermediate progress rates to capture partial completion beyond final success.","intended_use":"Evaluate step-level progress in legal agent workflows, such as case retrieval, rule identification, judgment prediction, and regulatory cross-reference tasks."},{"name":"Patient-Reported Experience Score (Post-Call Voice Survey)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited review reports evidence on patient-experience survey administration methods, response rates, and representativeness. It does not report an AI voice-agent top-box threshold or validate a post-call IVR score benchmark.","description":"Measures patient-reported ratings after an agent interaction across domains such as ease of scheduling, clarity of communication, and perceived request resolution. The cited systematic review evaluates survey administration strategies for response rates and representativeness, not AI voice-agent experience scores directly.","intended_use":"Compare post-call patient experience across agent-handled, human-handled, and mixed scheduling workflows and detect experience degradation after deployment changes."},{"name":"Provider Preference Match Rate (Workflow Gap)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited study supports preference-aware scheduling as an optimization problem. It does not report a fixed provider preference match-rate benchmark.","description":"Measures the proportion of scheduled appointments where the assigned provider matches the patient's stated or historically inferred provider preference. The cited scheduling study evaluates appointment scheduling under patient preferences and no-show behavior, not a standardized provider-match-rate metric.","intended_use":"Evaluate whether a scheduling agent incorporates patient provider, location, continuity-of-care, or provider-type preferences when booking appointments."},{"name":"Cost per Successful Task (CLEAR Framework)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The study does not define a fixed numeric cost threshold. It reports up to 50-fold cost variation and that cost-aware alternatives can be 4.4x to 10.8x less expensive than accuracy-only choices under comparable evaluation settings.","description":"Measures total computational or monetary cost incurred to achieve successful task outcomes, computed as total cost across task executions divided by the number of successfully completed tasks. CLEAR evaluates cost alongside latency, efficacy, accuracy, and reliability.","intended_use":"Compare agentic systems that achieve similar task success but require different inference, retry, tool-use, or infrastructure cost."},{"name":"Counterfactual Unfairness Level","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"per the Supporting Literature, Counterfactual Unfairness Level <= 0.05. PyCFRL example: baseline policies reported unfairness 0.407 \"Full\" and 0.446 \"Unaware\", while the counterfactually fair method achieved 0.042.","description":"Measures policy unfairness in sequential decision-making as the degree to which the agent's action allocation would change under a counterfactual change to a protected attribute, holding causal non-sensitive drivers constant. Evaluated at the policy or trajectory level, not only at the level of isolated predictions.","intended_use":"Assess whether an agentic AI policy, such as an offline reinforcement learning (RL) or sequential decision agent, allocates actions fairly across protected groups in settings where decisions compound over time."},{"name":"Fairness Constraint Evaluation","cat":"Fairness & equity","principle":"Fairness and Bias Management","description":"Assesses whether defined fairness constraints are incorporated into the multi-agent decision framework and empirically evaluated for equitable outcomes. The cited paper discusses fairness constraints, bias mitigation strategies, and incentive mechanisms, but does not define a decision-level Fairness Constraint Satisfaction Rate threshold.","intended_use":"Assess whether agentic AI systems include explicit fairness constraints during autonomous decision processes and whether those constraints are evaluated during testing."},{"name":"Multi-Agent Demographic Parity Fairness Score","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"The cited paper adapts demographic parity, counterfactual fairness, and conditional statistical parity to multi-agent systems. It does not report a universal +/-5% tolerance threshold.","description":"Quantifies fairness across groups of agents, or outcomes for populations influenced by agentic decisions, by measuring whether protected attributes have no systematic advantage in expected rewards, outcomes, or benefits assigned by agent actions. Adapted from demographic parity definitions into a multi-agent interaction context.","intended_use":"Assess whether an agentic AI's policies create systemic outcome disparities across groups when executing multi-step decision processes, such as resource allocation, triage, routing, or recommendation actions."},{"name":"Predictive Parity Ratio","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"No PPR >= 0.9 threshold is reported in the cited article. Report PPV by group and the resulting predictive parity ratio or disparity across prespecified protected attributes.","description":"Ratio of positive predictive values (PPV) for a key binary agentic decision outcome across protected groups. PPV is defined as the proportion of correct positive outcomes among all positive decisions for each group. The PPR = min(PPV_i / PPV_j) across all group pairs for a protected attribute.","intended_use":"Assess whether positive decisions made autonomously by an agentic AI are equally reliable across demographic subgroups, especially when agent actions produce clinically or operationally meaningful binary outcomes."},{"name":"Human Oversight and Intervention Configuration","cat":"Safety & reliability","principle":"Safety and Reliability","description":"Documents whether an agentic system is configured to use human input, correction, approval, or oversight during task execution. The cited literature supports human-in-the-loop modes and risk controls for agentic AI, but does not report a quantitative Human Intervention Rate benchmark.","intended_use":"Identify where human input or review is required to keep an agentic AI system functional, controlled, and aligned with workflow permissions. Human intervention should not be treated as uniformly undesirable in healthcare. Distinguish (1) required policy-based review, (2) appropriate safety- or uncertainty-driven escalation, and (3) failure-related rescue or correction. Report these categories separately."},{"name":"Policy-Compliant Task Completion Rate (Completion under Policies)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"ST-WebAgentBench reports Completion under Policy across 222 tasks and Risk Ratio across safety and trustworthiness dimensions. Report CuP as (# tasks completed with zero policy violations) / (total evaluated tasks), with violations stratified by severity and policy category.","description":"Measures the share of tasks the agent completes while also satisfying required policies, permissions, and workflow constraints. A task only counts as successful if the final outcome is correct and the agent's intermediate actions, tool calls, and state changes comply with applicable rules.","intended_use":"Evaluate whether an agent can achieve goals without cutting corners, bypassing controls, exposing data, or violating enterprise or clinical workflow rules during multi-step execution."},{"name":"Constraint Violation Rate (CVR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"Li et al. report outcome-driven constraint violation rates ranging from 0.0% to 62.8% across 12 LLMs, with most evaluated models at or above 25%. No universal CVR <= 0.10 threshold is reported.","description":"Measures how often an agentic AI violates formal outcome, safety, legal, ethical, or workflow constraints during multi-step tasks where certain behaviors are prohibited. A lower CVR indicates stronger adherence to constraints under realistic task pressure.","intended_use":"Empirically quantify the frequency at which an autonomous agent breaches critical rules when optimizing for task goals, capturing misalignment between performance incentives and compliant behavior."},{"name":"Safety Risk Category Coverage","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"No validated HRI >= 0.90 threshold is reported. Agent-SafetyBench evaluates 2,000 test cases across 349 environments, 8 safety-risk categories, and 10 common failure modes.","description":"Measures whether agent safety evaluation covers defined risk categories and failure modes such as unsafe actions, harmful outputs, privacy violations, robustness failures, and risk-unaware behavior. The cited preprint proposes harm-reduction indices conceptually, while Agent-SafetyBench operationalizes safety evaluation through risk categories and test cases.","intended_use":"Evaluate whether an agentic AI safety test suite includes the risk categories and failure modes needed to characterize unsafe outputs and actions before deployment."},{"name":"Safety Score (Agent-SafetyBench)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"Agent-SafetyBench contains 2,000 test cases across 349 environments, evaluates 8 categories of safety risks, and covers 10 common failure modes. The study reports that none of the 16 evaluated LLM agents achieved a safety score above 60%, so 60% should not be treated as a target threshold.","description":"A safety metric derived from Agent-SafetyBench that evaluates agentic systems across realistic interactive environments. It measures the percentage of tasks completed without triggering defined safety failure modes such as unsafe actions, harmful outputs, privacy violations, or risk-unsound behavior.","intended_use":"Empirically quantify how reliably an agentic AI avoids unsafe behavior while performing multi-turn interactive tasks and tool use in diverse scenarios."},{"name":"Clinical Agent Task Success and Checkpoint Completion","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"MedAgentBench reports Claude 3.5 Sonnet v2 at 69.67% success on 300 clinically derived EHR tasks. PhysicianBench reports 100 long-horizon EHR tasks with 670 structured checkpoints, with the best model achieving 46% pass@1 and open-source models reaching at most 19%. No TLSCAS >= 0.95 benchmark is reported.","description":"Measures whether clinical LLM agents complete EHR-grounded clinical tasks and intermediate checkpoints defined by benchmark authors or clinician reviewers. The cited clinical agent studies report task success, pass@1, and structured checkpoint completion rather than a combined TLSCAS metric.","intended_use":"Evaluate whether agentic AI systems for clinical workflows can retrieve data, reason over patient records, execute required actions, and complete clinician-defined workflow objectives before deployment or during benchmark comparison."},{"name":"Plan Adherence Score (PAS)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study reports that Agent GPA identified 95% of human-annotated errors, localized 86% of human-annotated errors, and achieved 76% to 86% error coverage for GPA judges. No PAS >= 0.85 threshold is reported.","description":"Measures whether agent plans and actions remain aligned with stated goals using the Agent GPA framework. The cited study evaluates goal, plan, and action alignment with LLM judges across public and enterprise agent settings.","intended_use":"Evaluate whether an agent follows its intended goal-plan-action structure during multi-step execution and identify where failures occur."},{"name":"Step Correctness Rate (SCR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"AgentProcessBench reports 1,000 trajectories, 8,509 human-labeled step annotations, and 89.1% inter-annotator agreement. No SCR >= 0.80 deployment threshold is reported.","description":"Measures step-level process quality in tool-using agent trajectories using human-labeled step annotations. AgentProcessBench evaluates 1,000 trajectories with 8,509 human-labeled steps and 89.1% inter-annotator agreement.","intended_use":"Evaluate whether intermediate tool-use steps are correct before relying on final task completion as the only performance measure."},{"name":"Planning Efficiency Index (PEI)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"No verified benchmark could be extracted from the supplied source link. Do not use the PEI >= 0.70 threshold without a supporting study.","description":"Measures the efficiency of an agent trajectory by comparing the number of steps or tool calls used against a task-specific reference path. The supplied source could not be verified as a peer-reviewed paper from the provided download link.","intended_use":"Evaluate whether an agent completes tasks without unnecessary planning or tool-use overhead when a task-specific reference path is available."},{"name":"Goal Adherence Score (GAS)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited report does not define a universal GAS threshold. Report the study-specific goal drift or deviation measure for each agent and task setting.","description":"Measures whether a language model agent maintains adherence to its assigned objective over extended autonomous execution. The cited report evaluates goal drift by exposing agents to competing objectives and measuring deviation from the original goal.","intended_use":"Evaluate whether long-horizon agent behavior remains consistent with the assigned goal when environmental pressure creates competing objectives."},{"name":"Intraclass Correlation Coefficient (ICC) for Agent Consistency","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study proposes ICC for agentic evaluation reliability. No universal ICC >= 0.70 or ICC >= 0.80 threshold for agent deployment is reported.","description":"Uses intraclass correlation coefficient to quantify evaluation inconsistency in repeated agentic benchmark runs by decomposing variance into between-query and within-query components.","intended_use":"Assess whether reported agent performance is stable across repeated evaluations rather than driven by stochastic variation."},{"name":"Standard Deviation of Task Success Rate (SD-TSR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The study reports that single-run pass@1 estimates vary by 2.2 to 6.0 percentage points depending on the selected run, with standard deviations exceeding 1.5 percentage points even at temperature 0. No universal SD-TSR pass/fail threshold is reported.","description":"Measures the variability in an agent's task success rate across repeated independent runs of the same evaluation set. In the study, success rates (pass@1) are computed over multiple runs per task, and standard deviation quantifies run-to-run variability caused by stochastic generation and environment interaction.","intended_use":"Quantify how much an agent's performance fluctuates across repeated executions so reported success rates can be interpreted with variance estimates rather than single-run point estimates."},{"name":"Tool Selection Accuracy (TSA)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"MCPAgentBench introduces authentic tasks, simulated MCP tools, distractor tool lists, task completion rates, and execution efficiency metrics. No universal TSA >= 0.80 threshold is reported.","description":"Measures an agent's ability to select appropriate tools from candidate lists that include distractor tools. MCPAgentBench evaluates real-world MCP tool definitions, authentic tasks, simulated MCP tools, task completion rates, and execution efficiency.","intended_use":"Evaluate whether a tool-using agent selects the correct external tool before invocation in realistic tool environments."},{"name":"Tool Invocation Correctness (TIC)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"BFCL evaluates serial and parallel function calls across programming languages using AST-based evaluation. No universal TIC >= 0.85 threshold is reported.","description":"Measures correctness of function or API calls generated by a language model using benchmark-defined evaluation methods such as abstract syntax tree comparison across real-world function-calling settings.","intended_use":"Evaluate whether an agent produces valid and correct tool invocations before connecting it to production APIs or clinical tools."},{"name":"TESR (Tool Execution Success Rate)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"FinToolBench reports 760 executable financial tools and 295 tool-required queries. No universal TESR >= 0.90 threshold is reported.","description":"Measures whether tool-augmented agent runs execute required tools successfully in a real-world runnable benchmark. The cited FinToolBench study evaluates 760 executable financial tools and 295 tool-required queries.","intended_use":"Evaluate whether an agent can complete required tool executions in domains where tool calls must be auditable and runnable."},{"name":"Task Completion Rate with Tool Use (TCR-T)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited survey does not report a universal TCR-T threshold. Use benchmark-specific task completion rate definitions and report tool-use failures separately.","description":"Measures task completion in settings where an agent must use tools to complete multi-step tasks. The cited survey describes agent evaluation objectives and processes rather than reporting a fixed task-completion benchmark.","intended_use":"Evaluate whether a tool-using agent completes benchmark tasks that require interaction with external tools or environments."},{"name":"Noise-Induced Performance Degradation (NIPD)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study introduces AgentNoiseBench for noisy-condition evaluation. No universal <=10 percentage point degradation threshold is reported in the source metadata.","description":"Measures the change in tool-using agent performance under noisy conditions compared with idealized benchmark conditions. AgentNoiseBench evaluates robustness of tool-using LLM agents under controlled noise conditions.","intended_use":"Assess whether agent performance remains stable when user inputs, tool outputs, or execution environments contain realistic noise."},{"name":"Pass@1 Task Completion Rate","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"APEX-SWE includes 100 integration tasks and 100 observability tasks. The supplied citation does not support using pass@1 >= 0.40 as a general benchmark for non-software domains.","description":"Measures the share of benchmark tasks solved on the first attempt. APEX-SWE evaluates economically valuable software engineering tasks, including 100 integration tasks and 100 observability tasks.","intended_use":"Evaluate first-attempt task completion for complex real-world agentic tasks where repeated retries would mask operational unreliability."},{"name":"Epistemic Verification Behavior Rate","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"No standardized threshold is reported in the cited source. Report verification behaviors using task-specific annotation criteria if used.","description":"Captures whether an agent verifies information before taking action in complex software engineering tasks. The cited APEX-SWE abstract supports evaluation of real-world integration and observability tasks, but does not define a quantitative verification behavior rate.","intended_use":"Evaluate whether an agent checks evidence or system state before executing consequential actions."},{"name":"Decision Accuracy Under Incomplete Information","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"Finance Agent Benchmark reports 537 expert-authored questions across nine financial task categories. No universal accuracy threshold is reported.","description":"Measures decision accuracy on finance research tasks requiring information retrieval, analysis of recent SEC filings, and reasoning under incomplete or evolving information. The cited benchmark contains 537 expert-authored finance research questions across nine task categories.","intended_use":"Evaluate agent decision accuracy in high-information-load research tasks where the system must gather relevant evidence before answering."},{"name":"Escalation Rate (ESR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"tau-bench reports that state-of-the-art agents still fail more than 50% of tasks in some customer-service domains and that pass^8 can drop below 25% in the retail setting. The study does not report an escalation-rate threshold for healthcare voice scheduling.","description":"Measures the proportion of agent-handled interactions transferred to a live human agent, computed as escalated interactions divided by total interactions handled by the agent. Escalations should be stratified as (1) required policy-based review, (2) appropriate safety/uncertainty escalation, and (3) failure-related rescue on an otherwise resolvable task. Only category (3) should be counted as agent failure.","intended_use":"Monitor whether a voice scheduling agent identifies its task boundaries and hands off to human staff when needed."},{"name":"Platform Reliability Score (PRS)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"Larsen et al. analyzed 80,381 patient safety event reports and identified 76 events associated with healthcare IT downtime. The cited sources do not report an AI voice-agent platform reliability score or validate a 99.9% uptime threshold.","description":"Measures operational stability of the AI voice-agent platform using system uptime, mean time between failures, and unplanned incident rate across telephony, LLM inference, and EHR integration components. The cited healthcare IT studies evaluate downtime procedures and patient-safety event reports, not AI voice-agent reliability directly.","intended_use":"Assess whether the deployed scheduling platform remains available for patient-facing operations and identify infrastructure failures that prevent scheduling access."},{"name":"Real-Time Oversight Layer / Independent Output Monitoring Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study supports measuring oversight error detection through sensitivity and response bias. It does not report a 100% monitoring coverage benchmark for healthcare voice agents.","description":"Measures the proportion of calls or agent turns evaluated by a secondary oversight layer against predefined dangerous-output patterns. The cited study frames oversight as an error-detection problem using signal detection theory and evaluates sensitivity and response bias concepts, not a healthcare voice-agent coverage threshold.","intended_use":"Evaluate whether agent outputs are independently screened for harmful, out-of-scope, or policy-violating content before delivery or review."},{"name":"Hard Turn Limit Compliance Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study reports degradation when models must use information located in the middle of long contexts. It does not report a 15 to 20 turn ceiling or a 100% compliance benchmark.","description":"Measures the proportion of calls in which the agent triggers handoff or graceful termination before or at a predefined conversation-turn ceiling. The cited study evaluates how language-model performance varies with relevant information position in long contexts; it does not define a healthcare scheduling turn limit.","intended_use":"Prevent unbounded conversation loops and evaluate whether stalled voice-agent calls exit through a controlled handoff or termination path."},{"name":"Output Constraint Violation Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"CONFAIDE reports that GPT-4 and ChatGPT reveal private information in 39% and 57% of evaluated cases, respectively. The study does not report a healthcare voice-scheduling constraint-violation threshold or validate a 0% benchmark.","description":"Measures the proportion of audited agent turns containing content that violates a predefined output-boundary policy, such as disallowed clinical statements, system-prompt disclosure, internal reasoning disclosure, or inappropriate sensitive-data exposure. The cited study evaluates contextual privacy failures in language-model outputs.","intended_use":"Track policy-violating output during pre-deployment red-teaming and post-deployment transcript review."},{"name":"Node-Level Regression Test Coverage Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited source supports evaluation-driven lifecycle testing for agentic AI systems. It does not report a 100% node coverage benchmark or a healthcare voice-scheduling threshold.","description":"Measures the proportion of defined workflow decision nodes with an active, versioned regression test suite. The cited evaluation-driven development study describes lifecycle evaluation practices for agentic AI systems, but does not validate a node-level coverage threshold.","intended_use":"Evaluate whether workflow nodes such as intent recognition, identity verification, eligibility checks, visit-type mapping, provider selection, and confirmation remain testable across model or prompt updates."},{"name":"End-to-End Trace Coverage Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited source supports observability and tracing for LLM-agent systems. It does not report a 100% trace-coverage benchmark or a HIPAA retention benchmark.","description":"Measures the proportion of sessions with a complete trace from intake through terminal state, including tool calls, webhook calls, slot actions, escalations, confirmations, timestamps, and outputs. The cited AgentOps paper focuses on observability concepts and trace artifacts for LLM agents.","intended_use":"Support debugging, incident review, and reliability analysis by checking whether deployed agent sessions can be replayed from complete traces."},{"name":"Pass@k Reliability for Agentic Financial Tasks","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"CLEAR reports that single-run reliability of 60% can drop to 25% under 8-run consistency and documents large cost differences across systems. It does not report pass@5 greater than or equal to 0.90 as a validated threshold.","description":"Measures the probability that an agent successfully completes a task at least once across k independent runs with identical inputs. In financial workflows, it captures stochastic reliability across repeated executions rather than single-run task success alone.","intended_use":"Evaluate reliability of agentic financial analysis, reporting, or decision-support tasks across repeated runs."},{"name":"Intermediate Step Correctness Rate","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study reports intermediate progress tracking for legal-agent tasks, but it does not define a correctness-based threshold.","description":"Measures the proportion of intermediate reasoning steps within an agentic workflow judged correct against task-specific criteria. The cited legal-agent benchmark reports intermediate progress tracking, but uses keyword-based progress analysis rather than correctness judgments for every step.","intended_use":"Evaluate whether agents maintain correct reasoning and tool-use steps during complex workflows, rather than only producing a final answer."},{"name":"Decontaminated Task Success Rate","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The supplied source does not provide a verified peer-reviewed benchmark. Use only after replacing the citation with a verifiable paper that reports decontaminated task success results.","description":"Measures the proportion of tasks successfully completed on evaluation datasets curated to exclude overlap with training data. The supplied source could not be verified as a peer-reviewed study or stable academic citation, so the row is retained with benchmark support flagged.","intended_use":"Evaluate whether software-engineering agents solve contamination-controlled tasks rather than relying on memorized training-data patterns."},{"name":"Cumulative Risk Exposure (Multi-Agent System Safety Metric)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study defines and demonstrates cumulative risk exposure but does not report a universal numeric safety threshold. Lower cumulative risk exposure is used for comparative evaluation.","description":"Measures aggregate safety risk experienced by a multi-agent system over time by summing expected risk contributions across agents and time steps. The cited study introduces cumulative risk exposure for gatekeeping and coordination in multi-agent systems.","intended_use":"Evaluate whether multi-agent systems maintain safe collective behavior rather than only minimizing individual-agent failure outcomes."},{"name":"Regression Non-Introduction Rate (RNIR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"SWE-bench contains 2,294 real GitHub issues and reports Claude 2 resolving 1.96% in the original evaluation. The cited paper does not report a 500-instance SWE-bench Verified threshold or a 70% resolve-rate benchmark.","description":"Measures the proportion of agent-generated code patches that resolve the target issue without breaking previously passing tests. The cited SWE-bench paper evaluates real GitHub issues using repository tests, including fail-to-pass behavior, but does not validate the RNIR threshold described in the CSV.","intended_use":"Evaluate whether software-engineering agents introduce unintended regressions while autonomously modifying codebases."},{"name":"Business Policy Adherence Rate (BPAR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"tau-bench evaluates retail, airline, and telecom tasks with domain-specific policies and annotated goal states. The paper reports that state-of-the-art agents can achieve less than 50% pass^1 in the retail domain and pass^8 below 25%; it does not report a universal BPAR threshold.","description":"Measures the proportion of multi-turn agent interactions where the final database or system state matches the annotated goal state without actions that violate domain-specific operational policies. It separates task completion from policy-compliant task completion.","intended_use":"Evaluate whether enterprise agents follow domain-specific business rules during autonomous multi-turn tool-use workflows."},{"name":"PPE Non-Compliance Alert Precision-Recall F1 (PNA-F1)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study reports PPE detection mAP@50 of 83.1% for a YOLOv5 hybrid dataset and reports model-specific precision, recall, and F1 values in construction footage experiments. It does not validate a universal PNA-F1 greater than or equal to 0.90 deployment threshold.","description":"Measures the harmonic mean of precision and recall for autonomous detection and alerting of personal protective equipment non-compliance events in construction or industrial video. Precision is true PPE violation alerts divided by all issued alerts, and recall is true PPE violation alerts divided by all annotated PPE violations.","intended_use":"Evaluate detection fidelity for agentic computer-vision safety monitoring systems that scan worksite video for PPE violations."},{"name":"Errors-of-Omission Rate","cat":"Safety & reliability","principle":"Safety and Reliability","description":"Measures the proportion of tasks where the agent fails to surface, act on, or flag information or actions it should have — omissions that can carry significant clinical and operational impact even when committed (commission) errors are low.","intended_use":"Evaluate whether evaluation captures what the agent failed to do, not only incorrect actions taken. Report alongside commission-error and constraint-violation metrics."},{"name":"Automation Bias / Overreliance","cat":"Safety & reliability","principle":"Safety and Reliability","description":"Measures the degree to which users accept agent outputs without appropriate scrutiny, e.g., override rate on incorrect outputs, time-to-review, and acceptance of seeded erroneous recommendations in evaluation.","intended_use":"Assess downstream human-agent team effects, not just standalone agent accuracy."},{"name":"Economically Valuable Administrative Task Success Rate (HealthAdminBench)","cat":"Usefulness, usability & efficacy","principle":"Business and Financial","benchmark":"HealthAdminBench reports 135 expert-defined tasks and 1,698 evaluation points across four simulated administrative environments, evaluating seven agent configurations. The best-performing agent (Claude Opus 4.6 CUA) reached 36.3% end-to-end task success, while GPT-5.4 CUA reached the highest subtask success rate at 82.8%. No universal deployment threshold is reported. Establish a local baseline by workflow type and report end-to-end success separately from subtask success.","description":"Measures whether an agent completes end-to-end healthcare administrative workflows that carry direct financial consequence, such as prior authorization, appeals and denials management, and durable medical equipment (DME) order processing. Healthcare administration accounts for over $1 trillion in annual spending, which is what makes these workflows an economically meaningful target for agentic automation. HealthAdminBench evaluates computer-use agents across four simulated GUI environments (an EHR, two payer portals, and a fax system) using 135 expert-defined tasks decomposed into 1,698 verifiable evaluation points, so end-to-end task success is reported separately from subtask success.","intended_use":"Evaluate whether an agentic AI system can carry an economically valuable administrative or revenue-cycle workflow all the way to completion, rather than only answering clinical questions or completing isolated steps. Report end-to-end success separately from subtask success, because strong subtask performance can coexist with low end-to-end reliability. Pair with cost-per-success so economic value is assessed on both the benefit and the cost side, and with policy-compliance and safety metrics, since actions such as submitting an authorization or an appeal are consequential and often difficult to reverse."}]},"clinical-decision-support":{"label":"Clinical decision support","url":"https://rai-content.chai.org/en/latest/clinical-decision-support/t%26e-framework.html","metrics":[{"name":"Task Completion Time","cat":"Usefulness, usability & efficacy","principle":"Usability","when":"Post-Implementation","who":"Implementer","description":"Measure how long it takes a user to complete a defined task when interacting with an AI-enabled clinical decision support system. This metric evaluates whether the system's interface, workflow integration, and learning curve enable users to perform tasks efficiently. By tracking efficiency over repeated use, this metric can identify improvements associated with user familiarity, system usability, or interface design.","intended_use":"This metric is intended to assess how effectively an AI-enabled CDS system streamlines clinical workflows and whether usability improves as users gain experience. Reductions in task completion time can indicate intuitive design, effective onboarding, and meaningful workflow integration. The metric is applicable across AI systems---including those leveraging LLMs or retrieval-augmented generation---to evaluate user learning curves, interface usability, adoption, and operational efficiency at the point of care."},{"name":"Evidence Concordance, Citation Accuracy, and Guideline Alignment","cat":"Usefulness, usability & efficacy","principle":"Efficacy","when":"Pre-Implementation","benchmark":"Suggested benchmarks include: ≥ 90% evidence concordance with specialty guidelines, 100% verifiable citations, <5% hallucinations in reference-linked outputs.","description":"Measure how well AI-enabled CDS outputs align with specialty guidelines and reference evidence while ensuring that all cited sources are verifiable and correctly attributed. Evaluates factual alignment, reference traceability, and the percentage of outputs meeting specialty-specific evidence standards.","intended_use":"Ensure the clinical validity and trustworthiness of AI-enabled CDS recommendations, confirming they adhere to accepted medical guidelines and evidence hierarchies."},{"name":"Detection Accuracy","cat":"Usefulness, usability & efficacy","principle":"Efficacy","benchmark":"Hybrid AI workflows that combine LLM-based generation with domain-specific retrieval and expert validation typically achieve higher detection accuracy---including improved F1-score and recall for clinically significant events---compared to LLM-only approaches, with minimal loss in precision.","description":"Detection Accuracy measures an AI-supported CDS system's ability to correctly identify and classify clinically relevant issues---such as medication-related risks, adverse interactions, contraindications, or other domain-specific safety events---during real-time decision support. This metric typically evaluates precision, recall, and F1-score against expert-verified ground truth, providing a quantitative assessment of the system's clinical reliability.","intended_use":"This metric is intended to validate the accuracy and safety performance of AI-generated CDS insights by ensuring that the system reliably detects and flags clinically important risks. It can be used both before and after implementation to assess model performance, inform system tuning, monitor post-deployment reliability, and ensure alignment with clinical expectations. Applicable across AI modalities---including RAG-LLMs---it helps Developers refine models and retrieval pipelines, and helps Implementers verify that the CDS system supports safe and effective medication management or other clinical tasks."},{"name":"Hallucination Rate and Response Time","cat":"Usefulness, usability & efficacy","principle":"Efficacy","benchmark":"Suggested that AI-enabled CDS achieve near-zero hallucination rates, high factual accuracy (organizational dependent), and significantly faster response times than traditional human review---demonstrating strong reliability and operational efficiency in CDS contexts.","description":"Measure the factual reliability and latency of CDS responses generated by LLMs. Quantifies hallucination frequency in clinical summaries or recommendations and the average time to produce accurate, guideline-consistent outputs.","intended_use":"Confirm operational readiness and efficiency of CDS systems in clinical workflows by ensuring low hallucination rates and acceptable generation latency relative to human review."},{"name":"Stratified Subgroup Performance","cat":"Fairness & equity","principle":"Fairness","description":"This metric evaluates whether an AI-supported CDS system performs equitably across different demographic or clinically relevant subgroups. Stratified subgroup performance analysis measures error rates, accuracy, or other performance indicators across variables such as age, gender, race/ethnicity, insurance status, or health condition. When paired with Explainable AI (XAI) techniques, the method provides interpretable insights into the root causes of observed disparities, illuminating how model features, retrieval pathways, or training data contribute to uneven performance.","intended_use":"This metric is designed to systematically detect, quantify, and explain performance disparities before---and, if monitored, after---deployment. By combining subgroup error analysis with XAI, it enables Developers and Implementers to identify where a CDS system may introduce inequities, understand why these disparities occur, and prioritize corrective interventions such as data augmentation, prompt engineering, retrieval refinement, calibration, or workflow safeguards."},{"name":"Subgroup Accuracy Across Sensitive Attributes","cat":"Fairness & equity","principle":"Fairness","when":"Pre-Implementation","description":"This metric assesses whether an AI-enabled CDS system provides equally accurate clinical responses across subgroups defined by sensitive attributes---such as race, gender, age, or other protected characteristics. By evaluating accuracy, linguistic patterns, or response quality across standardized clinical question--answer (QA) scenarios, the metric identifies subgroup-specific disparities that may indicate underlying model bias. It may also incorporate evaluation of how different prompting strategies influence fairness and accuracy.","intended_use":"This metric is intended to provide a systematic approach for detecting and minimizing bias in LLM-powered CDS systems. By comparing subgroup accuracy across diverse clinical vignettes and testing alternative prompt designs, it enables Developers and Implementers to identify which models and prompting methods yield more equitable performance."},{"name":"Cross-Site Generalizability and Calibration Gap","cat":"Fairness & equity","principle":"Bias Management","benchmark":"No universal threshold established. Aim for minimal performance degradation (e.g., ≤5--10% difference in accuracy or calibration slope) when evaluated across sites or demographic groups; Significant deviation should prompt bias investigation and potential retraining.","description":"Measure how much model performance (e.g., accuracy, calibration) changes when tested on a new hospital or population compared to its training data.","intended_use":"Identify bias or poor generalizability before deployment, ensuring consistent performance across diverse clinical sites and patient populations."},{"name":"Safety-related Overrides","cat":"Safety & reliability","principle":"Safety","when":"Post-Implementation","description":"Proportion (or count) of AI-enabled CDS outputs that are tagged with safety-related override reasons, such as when clinicians reject or modify a recommendation due to potential harm or contraindication.","intended_use":"Capture and analyze instances where clinicians identify an AI output as potentially unsafe."},{"name":"Stress and Adversarial Scenario Evaluation","cat":"Safety & reliability","principle":"Safety, Reliability","who":"Implementer","description":"Evaluation of the CDS system using challenging or problematic inputs to see how it responds. This includes testing with incomplete or confusing queries, unusual clinical scenarios, and inputs that deliberately try to trigger unsafe or inappropriate recommendations. The focus is on whether the system stays safe, gives appropriate refusals or clarifications, and avoids producing harmful/hallucinatory guidance with incomplete/incorrect/purposefully antagonistic information.","intended_use":"Identify safety issues that may not appear during routine testing. This helps determine whether the system can handle difficult or inappropriate inputs in a safe and reliable way, and whether its safeguards work as intended. Results can guide improvements before and after deployment."}]},"clinical-trials":{"label":"Clinical trials","url":"https://rai-content.chai.org/en/latest/clinical-trials/t%26e-framework.html","metrics":[{"name":"Eligibility Improvement & Enrollment Uptake","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Efficacy","benchmark":"per the Supporting Literature, >95% exclusion reduction from ML+abstraction over structured alone; 17% of surfaced patients consented in 10 days.","description":"A centralized patient screening system using structured EHR data, ML-extracted fields, and human abstraction improved eligibility identification for two oncology trials at three sites.","intended_use":"Evaluates the real-world operational impact of AI-supported protocol data extraction and criteria mapping tools; directly supports Clinical Trial Coordinators and Oncology Clinicians in validating multi-layered screening pipelines from free-text protocol ingestion to human abstraction verification."},{"name":"Enrollment Rate","cat":"Usefulness, usability & efficacy","principle":"Usability","benchmark":"per the Supporting Literature, enrollment increase by 11.1%; screening time decrease by 34%; SUS usability score = 80","description":"Tracks enrollment change after implementation of ACTES, a real-time automated EHR screening system that uses structured data, NLP, and machine learning to identify potentially eligible patients.","intended_use":"Used after deployment to compare enrollment rate, screening time, and usability before and after real-time EHR screening integration; supports clinical research teams in assessing whether automated alerts improve recruitment workflow."},{"name":"Patient-Criterion Fairness-Constrained Matching (Accuracy/F1/DP/EO)","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"per the Supporting Literature, reported metrics include accuracy, F1, demographic parity, and equalized odds across patient-criterion and patient-trial matching tasks; FairPM reduced group disparity with limited performance tradeoff.","description":"Evaluates FairPM, a patient-trial matching framework that adds patient-criterion level fairness constraints to reduce group disparities while preserving patient-criterion matching performance.","intended_use":"Used to assess whether an eligibility-matching model maintains acceptable accuracy and F1 while reducing demographic parity and equalized odds gaps across sensitive patient groups; supports pre-deployment fairness review of patient-criterion matching models."},{"name":"Prognostic Covariate-Adjusted Mixed Models for Repeated Measures (PROCOVA-MMRM)","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"per the Supporting Literature, Alzheimer's trial estimated sample size reduction was 7.1% for ADAS-Cog11 and 13.0% for CDR-SB; ALS trial estimated sample size reduction was 15.3%, with lower endpoint treatment-effect variance versus unadjusted MMRM.","description":"Uses digital-twin prognostic scores as covariates in mixed models for repeated measures to improve precision in longitudinal clinical trial outcome analyses.","intended_use":"Used during trial design or analysis planning to estimate whether prognostic covariate adjustment can reduce endpoint variance and required sample size for studies with repeated-measures outcomes."},{"name":"Relevance Explanation & Evidence Accuracy","cat":"Usefulness, usability & efficacy","principle":"Usability","benchmark":"per the Supporting Literature, 87.8% correct explanations; F1 = 88.6% for evidence retrieval","description":"Most of TrialGPT's outputs were rated as understandable and faithful by clinicians; highlighted evidence was consistent with ground truth.","intended_use":"Directly measures the faithfulness of natural language justifications and the accuracy of annotated patient record segments; essential for establishing transparency, safety, and user trust among Clinical Trial Coordinators and Oncology Clinicians auditing model outputs."},{"name":"Screening & Abstraction Efficiency: Abstraction Time, EHR Alerts","cat":"Usefulness, usability & efficacy","principle":"Usability","benchmark":"per the Supporting Literature, Abstraction median = 13.3 hrs (priority 3.0–9.9 hrs); EHR-integrated alerting system","description":"Measures operational feasibility of an EHR-integrated oncology trial screening workflow using automated alerts, prioritization, and abstraction dashboards.","intended_use":"Used after deployment to monitor abstraction turnaround time, alert routing, and dashboard workflow integration for clinical trial screening teams."},{"name":"Screening & Abstraction Efficiency: Screening Time Reduction","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"per the Supporting Literature, 42.6% avg time reduction across 36 patient-trial cases.","description":"TrialGPT reduced the time clinicians spent screening trial eligibility by 42.6% in a simulated oncology workflow at NCI.","intended_use":"Measures the concrete reduction in active screening workload achieved by Clinical Trial Coordinators and clinical research professionals using LLM assistance; validates the operational efficiency gains of automated protocol parsing and record interpretation (Steps 1–3)."},{"name":"Screening Efficiency: Funnel yield, Review time","cat":"Usefulness, usability & efficacy","principle":"Efficacy","benchmark":"per the Supporting Literature, structured exclusions: ~99%; final eligibility yield: 3.0% / 4.0%; 13.3 hr median","description":"Reports the incremental yield of each screening stage, structured EHR filtering, machine-learning extraction, and human abstraction, across large oncology patient cohorts.","intended_use":"Used to compare structured-only screening against ML-assisted and abstraction-assisted workflows, allowing teams to quantify how each stage changes exclusion rate, final eligibility yield, and review time."},{"name":"Sensitivity/Specificity (with Probability Calibration)","cat":"Usefulness, usability & efficacy","principle":"Efficacy","benchmark":"per the Supporting Literature, meta-analysis (oncology, auto-matching): pooled sensitivity ≈ 90.5%, specificity ≈ 99.3% (retrospective); prospective/pragmatic eval (4 tools, 3,800 patients): mean sensitivity ≈ 0.32 (illustrates real-world degradation vs. retrospective results; motivates calibration/operations monitoring)","description":"Quantifies how well a trial-matching/eligibility classifier correctly identifies eligible (sensitivity/recall) and excludes ineligible (specificity) patient-trial pairs. Reported both pre-deployment (model validation) and post-deployment (live screening). Include probability calibration (isotonic/Platt) so thresholded decisions reflect true risks and maintain stable sensitivity/specificity across cohorts and sites. (Sensitivity = recall of positive class; specificity = recall of negative class).","intended_use":"Benchmarks and monitors the semantic classification accuracy of LLM contextual reasoning over patient-criterion pairs; ensures the system minimizes missed opportunities for oncology trials (high sensitivity) while preventing wasted manual chart review by Clinical Trial Coordinators (high specificity)."},{"name":"System Explainability Scale (SES)","cat":"Usefulness, usability & efficacy","principle":"Usability","benchmark":"per the Supporting Literature, clinician scores: Usability = 4.71, Trust = 4.53, Understandability = 4.51 (out of 5); SES reliability: Cronbach’s alpha of 0.84; Spearman’s rho of 0.81.","description":"A 13-item clinician questionnaire measuring understandability, trust, and usability of an explainable AI clinical decision-support prototype.","intended_use":"Used to evaluate whether clinicians find an AI tool's explanations understandable, trustworthy, and usable before broader clinical workflow integration."},{"name":"Trial Matching & Ranking Evaluation: Accuracy (NDCG@10, AUROC, Accuracy)","cat":"Usefulness, usability & efficacy","principle":"Efficacy","benchmark":"per the Supporting Literature, Accuracy = 87.3% (expert range of 88.7–90.0%); AUROC = 0.7979 (vs. baseline of 0.6176)","description":"TrialGPT outperformed baselines in trial ranking and eligibility prediction.","intended_use":"Validates the LLM's capacity to perform complex contextual reasoning and mirror expert clinical judgment across semantic classification tasks; helps Implementers ensure that aggregated criteria-level decisions yield highly accurate, transparent trial choices for clinical review."},{"name":"Trial Matching & Ranking Evaluation: Match Accuracy","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"per the Supporting Literature, 45.7% of returned trials were valid matches; 91% increase in match rate when expanding radius to 20 miles.","description":"Measures the accuracy of identifying eligible patients for trials using 8 structured EHR variables (e.g., age, cancer type, stage).","intended_use":"Evaluates the baseline performance of mapping structured patient variables to extracted trial protocol criteria; helps informatics teams and related roles establish a database baseline for patient-trial semantic matching before scaling to complex, unstructured text interpretation."},{"name":"Trial Matching & Ranking Evaluation: Matching Accuracy & Ranking Quality","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Efficacy","benchmark":"per the Supporting Literature, mean precision = 0.33, mean sensitivity = 0.32, AP@3 = 0.45, and NDCG@3 = 0.34 across the four evaluated trial-matching tools; Klineo achieved mean precision = 0.52 and sensitivity = 0.50.","description":"Prospectively evaluates four automatic trial-matching tools in a molecular tumor board setting using precision, sensitivity, AP@3, and NDCG@3 against expert review.","intended_use":"Used to assess real-world matching accuracy and ranking quality of automatic trial-matching tools before clinical adoption; helps teams set human-review thresholds and identify tools that may over-solicit or miss eligible patients."},{"name":"Trial Matching & Ranking Evaluation: Matching Concordance & Speed","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Efficacy","benchmark":"per the Supporting Literature, 97.9% concordance; 0.04s median match time; zero false positives","description":"Evaluated a rule-based NLP tool for matching de-identified oncology patients to trials, comparing automated output to manual review and measuring processing speed.","intended_use":"Evaluates the system's runtime scalability and alignment with expert decisions during text extraction and semantic matching; validates the fidelity of the LLM's criteria-level eligibility annotations against a manual baseline while tracking processing speeds to resolve screening cost bottlenecks."},{"name":"Generated Narrative Quality (PDSQI-9)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability","benchmark":"per the Supporitng Literature, PDSQI-9 was validated on clinical note / discharge summarization, not on trial-eligibility rationale or patient-facing trial summaries. Reported source-study scores and inter-rater reliability are observed values in that context and should be re-baselined locally.","description":"The Provider Documentation Summarization Quality Instrument (PDSQI-9) is a validated instrument that scores AI-generated clinical summaries across nine attributes (accuracy / freedom from hallucination, thoroughness, usefulness, organization, comprehensibility, succinctness, synthesis across sources, internal consistency, and attribution/citation), each on a Likert scale. It is applied to the system's free-text narrative outputs (per-criterion eligibility rationale, clinical reasoning artifacts, audience-appropriate summary reports), not to the underlying match/no-match classification, which is evaluated separately (sensitivity/specificity, NDCG, calibration).","intended_use":"Gives Developers and Implementers a validated measure of the quality of generated text surfaced to Clinicians, Clinical Trial Coordinators, and patients. Serves two roles: (1) a validation-grade quality gate at go-live, and (2) the periodic human-calibration reference for any automated (LLM-based) narrative scoring used in high-throughput monitoring."},{"name":"AEq (Accessibility Equity)","cat":"Fairness & equity","principle":"Bias Management","benchmark":"per the Supporting Literature, Chest X-rays: AEq gap between White and Black patient groups reduced from 0.25 to 0.05 after mitigation.","description":"Measures ease-of-learning parity across demographic groups by comparing model performance at low sample sizes, using learning-curve gaps as a bias-detection signal.","intended_use":"Used during dataset and model validation to identify whether underrepresented groups require more data or mitigation before an AI model is deployed in a healthcare workflow."},{"name":"Fairness via Equalized Odds","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"per the Supporting Literature, FairPM achieved significantly lower disparity (demographic parity and equalized odds) with minimal performance drop: Patient-criterion: Accuracy ≈ 0.913, F1 ≈ 0.936 (vs baseline 0.959/0.970); Patient-trial: Accuracy ≈ 0.801–0.833, F1 ≈ 0.889–0.909 with DP ≈ 0.008–0.009, EO ≈ 0.008–0.009","description":"Proposes FairPM, a deep learning model with a task-specific fairness constraint to minimize predictive inequities at both criterion-level and trial-level matching tasks.","intended_use":"Ensures that LLM semantic classification and contextual reasoning remain equitable across sensitive patient demographic groups; provides Implementers with a mechanism to build fairness monitoring into dashboards, mitigating systemic selection bias in automated eligibility evaluations."},{"name":"Patient-Trial Fairness Gap (Demographic Parity/Equalized Odds)","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"per the Supporting Literature, FairPM reported reduced demographic parity and equalized odds gaps on patient-trial matching while maintaining trial-level accuracy and F1 within the reported performance range.","description":"Measures whether fairness-constrained patient-trial matching reduces demographic parity and equalized odds gaps across sensitive groups while preserving trial-level matching accuracy and F1.","intended_use":"Used after model validation to monitor subgroup disparity in patient-trial recommendations and determine whether a fairness-constrained matching approach reduces biased eligibility predictions."},{"name":"Representativeness Ratio","cat":"Fairness & equity","principle":"Fairness","benchmark":"per the Supporting Literature, Direct-to-Participant recruitment: 27.8% rural vs. site-based: 13.5% rural; rural Direct-to-Participant participants: 12.5% Black vs. 9.6% site-based.","description":"Percentage of trial participants from target underrepresented groups (e.g., rural residents, racial/ethnic minorities) compared to their proportion in the disease’s affected population.","intended_use":"Monitors the real-world downstream impact of the AI-supported screening tool; ensures that automated protocol criteria mapping and patient interpretation surface a diverse cohort of eligible patients matching the broader disease burden demographics."},{"name":"Deployment & Structured Output Capability (via GPT-OSS)","cat":"Safety & reliability","principle":"Reliability","benchmark":"Infrastructure capability benchmark; per the Supporting Literature, gpt-oss supports structured outputs and function calling for developer workflows.","description":"Evaluates whether an open-weight model supports structured outputs, function calling, and self-hosted deployment patterns needed for downstream integration.","intended_use":"Used as an infrastructure-readiness check before selecting a model for clinical trial matching workflows; separates deployment capability from downstream clinical validation, which must be measured with task-specific safety and accuracy metrics."},{"name":"Failure Mode Analysis (Qualitative Adverse Event & Bias Review)","cat":"Safety & reliability","principle":"Safety / Reliability","benchmark":"Qualitative framework; no quantitative benchmark reported in the Supporting Literature","description":"This commentary evaluates real-world use cases of LLMs in oncology, including trial matching, prognostic tools, and adverse event detection. It highlights major gaps in data provenance, model transparency, hallucination, and ethical use.","intended_use":"Assists Developers and Implementers in conducting safety audits of LLM contextual reasoning; systematically identifies safety gaps such as hallucinated exclusions or discrepancies in clinical notes, ensuring rigorous risk mitigation before tools reach live oncology workflows."},{"name":"Failure Mode Taxonomy & Mitigation Strategies","cat":"Safety & reliability","principle":"Safety / Reliability","benchmark":"Qualitative framework; no quantitative benchmark reported in the Supporting Literature","description":"Thorough review of LLM-specific issues and broader AI reliability concerns in clinical contexts, offering a structured approach to evaluating risks across training, inference, and deployment stages.","intended_use":"Provides Developers and Implementers a structured taxonomy to stress-test LLMs against specific deployment failure modes (e.g., hallucinated exclusions, ambiguous criteria interpretation, or clinical notes data drift); enforces layered validation and clinician-in-the-loop oversight protocols."},{"name":"Mean Time Between Failures (MTBF) + Failure Rate Framework","cat":"Safety & reliability","principle":"Reliability","benchmark":"Deployment-specific metric; compute MTBF as total uptime divided by number of failures and failure rate as failures per operating time using production system logs.","description":"Applies reliability engineering concepts, including Mean Time Between Failures, failure rate, resilience, and human-factor analysis, to assess trustworthy AI system operation.","intended_use":"Used after deployment to define log-based reliability monitoring for AI screening pipelines, including incident frequency, recovery time, failover planning, and human escalation procedures."},{"name":"Observed Detection Rate per 1,000","cat":"Safety & reliability","principle":"Safety / Reliability","benchmark":"per the Supporting Literature, Ductal Carcinoma in Situ (DCIS): 1.4 vs 0.8 per 1,000; Invasive: 5.2 vs 4.8 per 1,000 (AI vs baseline)","description":"In a nationwide AI-supported mammography screening implementation, detection rate per 1,000 screened measured population-level diagnostic yield compared with a control screening workflow.","intended_use":"Used as a post-deployment yield-monitoring template for high-volume AI screening systems; for clinical trial screening, teams can analogously track confirmed eligible candidates per 1,000 screened by site, subgroup, or time period."},{"name":"Predictive Reliability","cat":"Safety & reliability","principle":"Reliability","benchmark":"per the Supporting Literature, Simulation: AUC 0.87 vs 0.71 (reliable vs unreliable cases); Real-world MS dataset: predictive reliability successfully separated low- vs high-confidence predictions (validated in relAI package).","description":"Measures pointwise reliability of ML predictions by combining out-of-distribution detection through autoencoder reconstruction error with local performance estimates from similar samples.","intended_use":"Used to decide whether an individual clinical AI prediction should be accepted, rejected, or routed to human review; for trial matching, reliability thresholds should be validated on patient-trial data before deployment."},{"name":"QUEST Human Evaluation Framework: 5 scoring domains – Quality, Understanding & Reasoning, Expression, Safety, Trust","cat":"Safety & reliability","principle":"Safety / Reliability","benchmark":"Qualitative framework; no quantitative benchmark reported in the Supporting Literature","description":"This scoping review of 142 studies found inconsistent human evaluation practices in healthcare LLMs and proposed QUEST as a structured protocol for clinician or domain-expert evaluation.","intended_use":"Guides Developers and Implementers in designing human evaluation forms for healthcare LLM outputs, including quality, reasoning, expression, safety, and trust ratings for trial-matching explanations or eligibility summaries."},{"name":"Recall@3 (Human-in-the-Loop)","cat":"Safety & reliability","principle":"Safety","benchmark":"Recall@3 (Human-in-the-Loop, HITL): per the Supporting Literature, 67.3%; Recall@1 (HITL): 55.4%; Recall@5 (HITL): 77.9%.","description":"Percentage of cases where the correct clinical trial appears within the top three AI-ranked suggestions after clinician refinement.","intended_use":"Measures the workflow reliability of the automated screening system during pilot deployment; ensures that the aggregated trial rankings successfully surface appropriate protocols within the top suggestions to minimize missed enrollment opportunities for clinicians."},{"name":"AI-Assisted Data Cleaning Cost Savings","cat":"Usefulness, usability & efficacy","principle":"Financial","description":"In a 2025 preprint economic analysis of a representative Phase III oncology trial with about 1,100 patients over about 4 years, AI-assisted data cleaning reduced estimated operational costs, mainly through faster database lock, improved medical review efficiency, and reduced query-management burden.","intended_use":"Quantifies the financial and operational impact of AI-assisted data validation workflows for clinical data management teams; supports business-case development for data cleaning automation after deployment."},{"name":"AI-Assisted Prescreening Cost per Patient-Trial Pair","cat":"Usefulness, usability & efficacy","principle":"Financial","description":"In an MSK-MATCH preprint, an AI-assisted breast cancer trial eligibility workflow reduced manual review time for triaged cases from 20 minutes to 43 seconds and reported an average cost of $0.96 per patient-trial pair.","intended_use":"Benchmarks the unit operational cost of AI-assisted eligibility prescreening for patient-trial pairs; helps Implementers estimate screening workload, human-review savings, and deployment costs for similar oncology trial workflows."},{"name":"Database Lock Timeline and Data Cleaning Cost Reduction","cat":"Usefulness, usability & efficacy","principle":"Financial","description":"Measures timeline and cost impacts of AI-assisted clinical data cleaning, including faster database lock, improved medical review efficiency, and reduced query-management burden in a representative Phase III oncology trial model.","intended_use":"Used by clinical operations and data-management teams to estimate whether AI-assisted data cleaning reduces database-lock delay, manual review workload, and query-management costs after deployment."},{"name":"Screening Labor Cost Avoidance: Ineligible Chart Review Reduction","cat":"Usefulness, usability & efficacy","principle":"Financial","description":"In EHR-based trial recruitment, an ensemble ML screen using structured billing codes plus NLP-extracted note concepts reduced the number of ineligible patients sent to manual chart review by 40.5% at a tertiary care center and 57.0% at a community hospital, while maintaining eligibility capture (unlike a rule-based filter that reduced reviews more but excluded 22% to 27% of eligible patients).","intended_use":"Quantifies direct operational labor savings achieved by filtering out clearly incompatible candidates during initial criteria structuring and mapping; justifies the financial ROI of deploying the LLM solution to minimize non-productive manual chart review for Clinical Trial Coordinators."},{"name":"Energy Consumption Index","cat":"Usefulness, usability & efficacy","principle":"Energy","benchmark":"per the Supporting Literature, CodeCarbon-estimated training energy on TITAN Xp was approximately ResNet18 = 0.1155 kWh and EfficientNet-B3 = 0.1160 kWh.","description":"Quantifies deep learning energy use by combining direct hardware measurements with software estimates from CarbonTracker and CodeCarbon across model architectures and GPUs.","intended_use":"Used by Developers and Implementers to compare model-training or evaluation jobs on energy per unit of performance, helping select more resource-efficient configurations before scaling AI workloads."}]},"electronic-health-record-information-retrieval":{"label":"EHR information retrieval","url":"https://rai-content.chai.org/en/latest/electronic-health-record-information-retrieval/t%26e-framework.html","metrics":[{"name":"Accuracy -- Document Extraction","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Efficacy","when":"Pre-Implementation","who":"Developer","description":"Measure how effectively NLP or LLM-based pipelines extract key structured fields (e.g., medications, dosage, frequency, and lab results) from raw, unstructured clinical text prior to FHIR or OMOP normalization. Evaluates field-level correctness, recall of relevant entities, and the model's ability to capture complete medication or laboratory information across diverse patient notes.","intended_use":"Validate the reliability of upstream data capture before standardization, ensuring the extracted information feeding downstream decision support, analytics, and cohort discovery systems is accurate, complete, and clinically meaningful. High extraction accuracy is a prerequisite for successful mapping and model trust."},{"name":"Accuracy -- Data Mapping","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Efficacy","when":"Pre-Implementation","who":"Developer","benchmark":"Data mapping accuracy typically varies across structured data elements, with high performance on simpler elements (e.g., coded medication fields) and lower performance on more complex temporal or contextual attributes (e.g., dosage timing, medication form). Published results show F1-scores ranging widely (e.g., ~0.71--0.99), underscoring the need for targeted model tuning and validation for clinically complex FHIR/OMOP fields.","description":"Measure how effectively an AI-enabled system---such as an NLP pipeline, LLM, or hybrid EHR information retrieval workflow---converts extracted clinical entities into standardized representations aligned with canonical healthcare data models (e.g., FHIR, OMOP). The metric evaluates precision, recall, F1-score, and completeness across key structured elements (e.g., medication coding, dosage timing, laboratory value formats) to ensure that transformed data reflects the original clinical meaning and is interoperable across downstream systems.","intended_use":"This metric is intended to validate the interoperability, consistency, and reliability of structured data produced by AI-enabled EHR retrieval and processing systems. Accurate mapping into FHIR or OMOP is foundational for safe and meaningful use in downstream applications such as clinical decision support (CDS), population health analytics, cohort discovery, patient summarization, and automated phenotyping. By ensuring that raw clinical data---especially unstructured text---is correctly normalized and standardized prior to use, this metric helps Developers confirm that the system supports accurate inference and minimizes data quality risks."},{"name":"Deterministic Reproducibility of LLM Inference","cat":"Usefulness, usability & efficacy","principle":"Efficacy","benchmark":"Suggested benchmark (per cited study): Output stability >99% exact-match rate across 100 repeated inference runs with fixed seeds and identical input prompts; semantic variability <1% using embedding-based similarity metrics (cosine > 0.99).","description":"Evaluate the degree to which an EHR-integrated LLM produces consistent outputs when given identical inputs across runs, hardware, or parallelization settings. This metric ensures that clinicians, auditors, and regulators can
