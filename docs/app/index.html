 the speech recognition component of ambient AI captures diverse patient and clinician speech with comparable accuracy, since transcription disparities can carry forward into the clinical note."},{"name":"Cross-Demographic Automatic Speech Recognition (ASR) Gender & Accent Error Gap (CDAEG)","cat":"Fairness & equity","principle":"Fairness, Bias Management","benchmark":"No universal clinical cut point is established. Report max WER gap across defined gender, dialect, and accent groups. Use <=0.15 max WER gap as a practical internal guardrail, with remediation required when the gap is exceeded or concentrated in a protected or clinically important subgroup. Compute as: CDAEG = max(|WER_group_i - WER_group_j|).","description":"Measures absolute differences in ASR word error rates (WER) across key demographic categories such as gender, dialect, and accent groups. Compute WER for each subgroup and calculate the maximum observed gap. A smaller gap indicates more equitable transcription performance.","intended_use":"To detect systematic disparities in speech transcription quality that could affect the fairness and reliability of downstream ambient AI documentation."},{"name":"Demographic Transcription Equity Rate (DTER)","cat":"Fairness & equity","principle":"Fairness, Bias Management","benchmark":"No universal clinical cut point is established. per the Supporting Literature, use DTER >=0.90 as an internal equity guardrail across defined demographic pairs, such as Black vs White speakers or gender groups. Compute as: DTER = min(subgroup transcription accuracy) / max(subgroup transcription accuracy).","description":"Measures parity in automatic speech recognition (ASR) accuracy across protected or operationally relevant demographic groups, such as race, ethnicity, age, gender, dialect, or accent. Compute WER or a similar transcription accuracy measure for each group and report the minimum accuracy ratio relative to the best-performing group.","intended_use":"To evaluate whether an ambient AI documentation system transcribes speech with similar accuracy across diverse speakers, reducing inequitable errors in clinical records."},{"name":"Contextual and Relationship-Building Omission Rate","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No universal benchmark is established. Compute as: (# important contextual elements omitted from AI note) / (# important contextual elements present in transcript or reference documentation). Target a downward trend over time and manually review all omitted contextual elements classified as clinically or relationally important.","description":"Measures the proportion of AI-generated notes that omit non-clinical but contextually important patient information, such as social context, patient concerns, relationship-building details, or longitudinal information that may matter for continuity of care. This should be evaluated separately from biomedical omissions because information that appears nonessential may still support trust, adherence, and follow-up.","intended_use":"To assess whether ambient AI remove context that clinicians consider important for patient-centered care or longitudinal care planning."},{"name":"Audio and Transcript Data Retention Control Assessment","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No quantitative benchmark is established. Pre-implementation pass condition is documented retention period, deletion process, access control, model-training restriction, patient opt-out or consent workflow, and legal/privacy approval. Because vendor retention practices vary widely and are sometimes undisclosed (e.g., audio from immediate deletion to ~90 days; transcripts from 7 days to \"never delete\"), recommend the approved retention/deletion policy to be evidenced by primary-source documentation (configuration export, contract language) rather than vendor attestation alone. Post-deployment audits — including periodic independent third-party audit — should verify that vendor and local workflows match the approved policy on a continuous basis.","description":"Evaluates whether an ambient AI scribes minimizes storage of session audio and transcripts and gives the organization clear control over retention duration, deletion, and secondary use. Assessment should use vendor documentation, contracts, and configuration review.","intended_use":"To confirm that ambient AI scribes follow data minimization practices and reduce exposure of sensitive audio, transcript, and clinical information."},{"name":"Clinical Summary Completeness and Correctness Non-Inferiority","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"Per the Supporting Literature, AI-generated summaries should be statistically non-inferior to physician-written summaries on completeness and correctness ratings, using a pre-specified non-inferiority margin. If using a 5-point Likert quality scale, report mean score difference and confidence interval, and separately report conciseness because non-inferiority on completeness and correctness does not guarantee brevity.","description":"Evaluates whether AI-generated clinical summaries are non-inferior to clinician-written summaries on completeness and correctness. Completeness measures whether relevant clinical information is included. Correctness measures whether included information is factually and clinically accurate. Ratings should be performed by blinded clinician reviewers using a structured rubric or Likert scale.","intended_use":"To determine whether AI-generated summaries preserve core clinical content quality before being used in documentation, handoff, review, or patient-care workflows."},{"name":"Clinical Note Safety Error Rate (CNSER)","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No validated universal threshold is established. Before go-live, notes should be clinician-reviewed and the uncorrected draft error burden should be materially below the simulated-platform reference point of 3.0 moderate-to-severe harm-potential errors per case. Any moderate-to-severe harm-potential error found in a finalized note should trigger safety review.","description":"Measures the rate of clinically relevant content errors in AI-generated clinical documentation that have potential to cause moderate-to-severe patient harm, based on standardized error classification against professional transcriptions and expert review. A lower CNSER indicates safer and more reliable ambient AI output.","intended_use":"To quantify real-world safety risk in ambient AI clinical documentation by identifying how often the system introduces or preserves errors with potential clinical harm."},{"name":"Clinically Significant Error Proportion (CSEP)","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No validated universal threshold is established. Report the share of notes with at least one clinically significant error and compare against the simulated ambient-scribe reference finding of 26.3% mean key-element error rate. For finalized notes, target zero known clinically significant errors at sign-off and investigate any recurring error pattern.","description":"Measures the proportion of ambient AI-generated clinical notes that contain at least one clinically significant documentation error, where errors are identified through professional review and classified as having potential to affect patient care. A lower CSEP reflects stronger documentation safety.","intended_use":"To evaluate whether ambient AI documentation systems produce clinically safe outputs by measuring meaningful documentation errors rather than generic typo or formatting counts."},{"name":"Informed Consent and Documentation Review Compliance Rate","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"Benchmark as 100% audited compliance for encounters where ambient recording is used: patient notice or consent documented before use, consent exceptions recorded where allowed by policy, and clinician review completed before note finalization. As needed, retain per-encounter evidence (consent/notice record, any consent exception, and review-completed flag) sufficient to reconstruct, after the fact, that consent and review obligations were met for a specific encounter.","description":"Measures whether clinicians using an AI scribe have a documented process for obtaining informed consent before recording sessions and for reviewing, editing, and signing AI-generated clinical notes before they are finalized in the health record. Assessment should use policy review, workflow review, and audit logs where available.","intended_use":"To verify that ambient AI scribes are deployed with basic safeguards for patient awareness, consent, and clinician oversight."},{"name":"Usability-Adjusted Safety Reliability Score (UASRS)","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"UASRS is an internal composite, not an externally validated benchmark. If used, require SUS >=68 or the organization-specific usability target, plus non-worsening after-hours documentation work. Report SUS, after-hours work change, and safety-error measures separately so the composite does not hide poor performance in any component.","description":"A composite metric combining System Usability Scale (SUS) scores with after-hours documentation burden change to evaluate whether ambient AI is both usable and operationally safe in clinical workflow. SUS captures perceived usability; after-hours burden reduction captures whether the tool reduces delayed work rather than pushing effort later.","intended_use":"To assess whether ambient AI can be integrated into clinical workflow without creating usability friction, delayed review work, or fatigue that could indirectly affect safety."},{"name":"Medical Term Recall Rate","cat":"Safety & reliability","principle":"Safety","benchmark":"No universal threshold is established. Evaluate against human-annotated clinical transcripts and report recall for diagnoses, medications, procedures, labs, symptoms, and allergies separately. Use >=0.90 as a local pre-deployment target only when annotation quality is high, and escalate any missed high-risk medication, allergy, diagnosis, or follow-up instruction.","description":"Measures the fraction of clinically relevant medical terms in the reference transcript that are correctly captured by the AI system. These terms may include diagnoses, medications, procedures, symptoms, labs, and other details that are important for safe clinical documentation.","intended_use":"To evaluate how accurately an ambient AI transcription or documentation system captures medically meaningful language before that content is used to generate clinical notes."},{"name":"Clinician Review and Sign-Off Enforcement Rate","cat":"Safety & reliability","principle":"Safety","benchmark":"Benchmark as 100% of AI-generated clinical notes requiring clinician review, editing where needed, and sign-off before finalization in the medical record. Verify using workflow configuration and audit logs, and measure the enforcement rate longitudinally (not only at go-live) with per-encounter evidence retained for reconstruction.","description":"Assesses whether AI-generated clinical notes require mandatory clinician review, editing, and sign-off before being finalized in the medical record, verified through workflow configuration review and audit logs.","intended_use":"To ensure that clinical responsibility and accountability remain with licensed clinicians when using ambient AI scribes."},{"name":"Per-Encounter Control Evidence Retention","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No quantitative benchmark established. Pass condition is a retention design under which the listed per-encounter control evidence is captured, tamper-evident, and retrievable for the organization's defined retention window; verify by audit.","description":"Assesses whether, for each encounter, the developer/implementer retains sufficient evidence to reconstruct which safety-critical controls were in force — consent scope and notice, clinician review/sign-off, retention/deletion actions, PHI-handling configuration, and the model/version and guardrail settings applied.","intended_use":"Support post-event review, root-cause analysis, and litigation defense, given active ambient documentation litigation and narrowing AI insurance coverage."},{"name":"LLM Training Data Use Disclosure and Control Assessment","cat":"Safety & reliability","principle":"Privacy","benchmark":"No quantitative benchmark is established. Pass condition is written vendor disclosure covering secondary data use, model training, retention, deletion, opt-out or restriction controls, and contract language prohibiting model training on clinical data unless explicitly approved by the deploying organization.","description":"Evaluates whether the AI scribe vendor discloses whether session data are used for model training, whether such use is opt-in or opt-out, and whether the organization can restrict secondary data use. Assessment should use vendor policy, contract language, and configuration review.","intended_use":"To ensure transparency and organizational control over secondary use of sensitive clinical data in ambient AI systems."},{"name":"PHI Redaction / Output Guardrail Verification","cat":"Safety & reliability","principle":"Privacy","benchmark":"No universal threshold established. Test against representative samples; report detected PHI-exposure incidents and confirm guardrails were active per encounter where feasible.","description":"Verifies that PHI redaction or output guardrails are active and effective — e.g., that PHI is appropriately handled at output and unintended PHI exposure is detected.","intended_use":"Confirm privacy guardrails operate in real use, not just in vendor claims."},{"name":"Data Residency & Sub-Processor Control","cat":"Safety & reliability","principle":"Privacy","benchmark":"No quantitative benchmark. Pass condition is documented data-flow/sub-processor inventory plus audit evidence (logs, attestations, or third-party audit) that data remained within declared boundaries.","description":"Evaluates evidence that session data did not leave declared geographies or approved sub-processors.","intended_use":"Confirm contractual and regulatory data-locality commitments are honored in practice."},{"name":"Per-Encounter Consent Scope Evidence","cat":"Safety & reliability","principle":"Privacy","benchmark":"Recorded encounters have retrievable, per-encounter consent-scope evidence consistent with applicable state all-party consent and CMIA-type requirements.","description":"Verifies that the consent scope actually obtained (e.g., all-party recording consent where required) is recorded and retrievable per encounter, and matches what was relied upon for recording and transmission.","intended_use":"Ensure recording and vendor transmission stay within the consent granted, and to enable reconstruction of consent scope after the fact."},{"name":"Incremental Cost-Effectiveness Ratio (ICER), $/QALY","cat":"Usefulness, usability & efficacy","principle":"Financial","benchmark":"Benchmark ICER against the organization or payer decision threshold. For US-facing evaluation, $50,000-$150,000 per QALY gained is a common reference range, but it should not be treated as universal. Report all AI implementation, maintenance, monitoring, and clinician review costs used in the calculation.","description":"ICER quantifies the additional cost required to gain one additional quality-adjusted life year (QALY) when adopting an AI system versus standard of care: ICER = (Cost_AI - Cost_SOC) / (QALY_AI - QALY_SOC).","intended_use":"To determine whether deploying an AI system is economically justified relative to alternatives, while avoiding claims of patient outcome improvement unless QALY or outcome gains are directly measured."},{"name":"Weekly Relative Value Units (RVU) Uplift (% change)","cat":"Usefulness, usability & efficacy","principle":"Financial","benchmark":"Per the Supporting Literature, benchmark as >=+5.8% weekly RVU increase or about +1.81 RVUs per clinician per week, compared with matched controls or local baseline. Report productivity gains alongside note quality, safety review burden, and clinician workload.","description":"Percent change in clinician weekly relative value units (RVUs) after ambient AI scribe access compared with baseline or controls. RVUs represent billable clinical output and are a standard health system revenue metric.","intended_use":"To quantify whether ambient AI documentation systems are associated with measurable financial productivity gains, while still monitoring documentation quality, patient safety, and clinician review burden."},{"name":"Weekly Encounter Volume Uplift (% change)","cat":"Usefulness, usability & efficacy","principle":"Financial","benchmark":"Per the Supporting Literature, benchmark as >=+2.8% encounters per week or about +0.80 encounters per clinician per week, compared with matched controls or local baseline. Interpret as throughput only, not as evidence of improved care quality.","description":"Percent change in clinician encounters per week after ambient AI scribe adoption compared with baseline or controls. This captures operational throughput but does not by itself establish improved care quality.","intended_use":"To quantify whether ambient scribe deployment is associated with increased clinical capacity or throughput."},{"name":"Documentation Time Reduction (minutes/day)","cat":"Usefulness, usability & efficacy","principle":"Business","benchmark":"Per the Supporting Literature, benchmark as >=19.95 minutes/day reduction in total EHR time after implementation versus baseline. Report total EHR time, note time, after-hours time, and adoption rate because time savings can vary with use intensity.","description":"Median change in total EHR time per day after ambient scribe introduction. Time saved can support ROI modeling, but it should not be treated as sufficient evidence of safety, quality, or patient benefit.","intended_use":"To support ROI modeling for ambient scribes using measurable clinician time savings."}]},"agentic":{"label":"Agentic AI","url":"https://rai-content.chai.org/en/latest/agentic/t%26e-framework.html","metrics":[{"name":"Autonomy Index (AIx)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"No universal AIx threshold is reported in the cited literature. Report the study-defined AIx value by task domain, model architecture, and autonomy level, with unsafe, policy-violating, or incorrectly completed autonomous steps reported separately.","description":"A standardized metric quantifying how much of a predefined workflow the agent completes correctly without direct human intervention, while staying within defined oversight, permission, and safety boundaries. It is measured as the fraction of reference task steps (defined by expert review or a set of acceptable plans rather than a single canonical path) completed independently and correctly when the study or evaluation suite defines those steps.","intended_use":"Evaluate whether an agentic AI system can handle delegated portions of a multi-step workflow while preserving appropriate escalation paths, correctness checks, and human control points."},{"name":"Evaluation Dimension Coverage","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited review reports technical metrics in 83% of studies, human-centered assessments in 30%, safety assessments in 53%, economic assessments in 30%, and both technical and human dimensions in 15%. No BECS score or 0-1 threshold is reported.","description":"Measures whether an evaluation protocol covers the dimensions identified in the cited agent evaluation literature, including task completion, trajectory or behavior quality, tool use, reliability, safety, human-centered factors, latency, and economic assessment. The cited systematic review reports that technical metrics dominate current evaluations while human-centered, safety, and economic assessments are less frequently included.","intended_use":"Evaluate whether the assessment plan for an agentic AI system includes the evaluation dimensions needed for deployment decisions, rather than relying only on final-answer or task-success metrics."},{"name":"Goal Completion Rate (GCR)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"AlShikh et al. report an average GCR of 88.8% for the Hybrid Agent in their simulated multi-domain experiment. tau-bench reports that state-of-the-art function calling agents such as gpt-4o succeed on fewer than 50% of tasks and that pass^8 is below 25% in retail. ST-WebAgentBench reports Completion under Policy separately from raw task success.","description":"The proportion of tasks where an agentic system successfully achieves the intended user or system goal in a multi-step environment. A task is successful if the final outcome and, where applicable, the final environment state align with a predefined ground-truth objective or expert-defined target state without unsafe, unauthorized, or policy-violating actions.","intended_use":"Quantitatively assess whether autonomous agentic AI delivers intended outcomes across open-ended, multi-step tasks in realistic workflows. GCR should be reported with trajectory, policy-compliance, and safety metrics because final success alone can hide risky intermediate behavior."},{"name":"Task Success Rate in Multi-Step Clinical Agent Tasks (MedAgentBench)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"MedAgentBench reports 300 patient-specific clinically derived tasks from 10 categories, with Claude 3.5 Sonnet v2 achieving a 69.67% success rate. PhysicianBench reports 100 long-horizon EHR tasks with 670 structured checkpoints, with the best-performing model achieving 46% pass@1 and open-source models reaching at most 19%.","description":"Measures how consistently an agentic AI completes complex, clinically meaningful tasks in a realistic virtual EHR environment. Success is defined as correctly completing clinician-specified task goals involving retrieval, reasoning, and action execution in a standardized FHIR-compliant setting.","intended_use":"Evaluate whether an agentic AI system can reliably execute goal-directed clinical workflows rather than producing isolated medical answers. A major value of agents is crossing system boundaries; where possible, the simulation should occur within the EHR plus all relevant external systems — including wearables, patient voice communication, and external documents."},{"name":"Task Success Rate in WebArena Autonomous Task Benchmark","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"WebArena reports that the best GPT-4-based agent achieved 14.41% end-to-end task success, compared with 78.24% human performance. ST-WebAgentBench evaluates 222 policy-paired tasks and reports Completion under Policy and Risk Ratio rather than a universal 50% target.","description":"Measures the percentage of autonomous tasks successfully completed by an agent in a realistic web environment. Tasks span domains such as e-commerce actions, forum interactions, collaborative content management, and browsing activities. Success is defined as correct end-to-end task completion, not just isolated steps.","intended_use":"Evaluate whether an agentic AI can function reliably in real-world environments requiring planning, tool use, state tracking, and sequential decision-making. Use alongside policy-compliance and safety metrics when the environment includes rules, permissions, or enterprise constraints."},{"name":"User Satisfaction and Human-Centered Feedback Measures","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited review reports human-centered assessments in 30% of studies and both technical and human dimensions in 15%. No CSAT >= 80%, NPS, or USS >= 0.8 threshold is reported.","description":"Captures whether the evaluation includes user-facing measures such as satisfaction, perceived usefulness, workload, usability, or structured qualitative feedback. The cited review identifies human-centered assessment as underrepresented in agentic AI evaluations, rather than reporting a universal CSAT or NPS threshold.","intended_use":"Evaluate whether the agent's outputs and behaviors are assessed from the user perspective and identify usability issues that technical benchmarks miss. User feedback should be interpreted alongside correctness, safety, and policy adherence, not as a substitute for them. Satisfaction is dynamic, and because of hedonic adaptation, it should be measured longitudinally rather than at a single point."},{"name":"End-to-End Clinical Agent Response Latency (seconds)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"Observed end-to-end response time ranged from 5 to 7 seconds under live deployment conditions.","description":"Measures elapsed time between user case submission and receipt of AI-generated case-specific psychological first aid recommendations in a deployed recommendation app for rescue and first responders. The study reports live-system response times rather than simulated inference-only latency.","intended_use":"Evaluate whether a deployed clinical or emergency-response recommendation agent returns outputs quickly enough for operational use and monitor whether infrastructure delay changes after deployment."},{"name":"Triage Appropriateness Rate","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"AI-assisted triage accuracy was 89.3% compared with 74.7% for traditional triage, p < 0.001.","description":"Measures the proportion of AI-assisted emergency triage decisions that correctly prioritized patient urgency compared with traditional triage and clinical outcome assessment. The study compared 150 AI-assisted triage cases with 150 traditional triage cases.","intended_use":"Evaluate whether an AI triage tool assigns patients to appropriate urgency levels before integration into emergency department workflows."},{"name":"Summarization Editing Effort Reduction","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"LLM-generated hospital course drafts required 31.5% mean editing compared with 44.8% for physician-generated drafts.","description":"Measures editing effort required for resident physicians to revise large language model-generated hospital course summaries compared with physician-generated summaries. Editing effort was reported as the mean percentage of text changed during revision toward a predefined quality standard.","intended_use":"Evaluate whether EHR-based summarization reduces physician editing burden while preserving hospital course summary quality requirements."},{"name":"Proportion of Errors Auto-Corrected","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"Human experts confirmed 263 of 316 AI Checker-flagged mistakes as actual mistakes, giving 83.2% precision. The AI Checker proposed correct fixes for 75.8% of identified mistakes.","description":"Measures the share of objective mistakes identified in published AI papers for which an AI checker proposed a correct fix. The cited paper evaluates paper-level research integrity checking, not clinical documentation correction.","intended_use":"Evaluate automated error-detection workflows where a system flags objective errors and proposes corrections for expert review."},{"name":"Claim Recall for Summary Factual Coverage","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The study reports TracSum as a benchmark with 500 annotated medical abstracts and 3.5K summary-citation pairs. No universal Claim Recall threshold is reported.","description":"Measures completeness of generated medical aspect-based summaries against annotated claim or aspect content, paired with sentence-level traceability to source evidence. The cited TracSum benchmark contains 500 medical abstracts and 3.5K summary-citation pairs.","intended_use":"Evaluate whether generated clinical or biomedical summaries cover required factual claims and provide traceable source support."},{"name":"Number of Integrated Wearable / RPM Device Types","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The prototype integrates vital signs, wearable accelerometer data, and visual camera or video data. No minimum device-count threshold is reported.","description":"Counts the types of remote monitoring data streams integrated into an autonomous health monitoring prototype. REMONI processes vital signs, accelerometer data from a wearable device, and visual data from patient video clips.","intended_use":"Evaluate whether a remote patient monitoring agent ingests the sensor modalities required for the intended monitoring workflow."},{"name":"Per-Record Processing Time (seconds)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"Mean prediction latency was 0.0177 seconds with SD 0.0021, memory utilization was 88.80 MB with SD 0.01, per-record processing time was 0.18 ms, and coefficient of variation was <5%.","description":"Measures computational efficiency for a web-based machine learning model by timing prediction latency, memory use, and per-record processing time during repeated batch testing.","intended_use":"Evaluate whether a deployed clinical prediction model can process patient records within operational latency constraints."},{"name":"Milestone Achievement Rate (Multi-Agent Coordination KPI)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"No universal numeric threshold is reported in the cited source. Use task-defined milestones and report the proportion achieved.","description":"Measures whether multi-agent coordination processes reach predefined intermediate milestones during collaborative task execution. The supplied source describes multi-agent coordination evaluation rather than establishing a universal milestone threshold.","intended_use":"Evaluate progress in multi-agent workflows where final task success depends on staged coordination checkpoints."},{"name":"Cost-per-Success (Cost-of-Pass)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited Efficient Agents study reports cost-of-pass of $0.228 in its evaluation setting. Outside that setting, establish a local baseline and require cost-per-success to improve without reducing safety, fairness, or policy-compliant task completion.","description":"Average operational cost required for an agent to successfully complete one task, computed as total inference, retry, tool, and infrastructure cost divided by number of successfully completed tasks. Captures whether an agentic system is economically sustainable at scale rather than only technically capable.","intended_use":"Evaluate whether an agentic AI system can achieve required task success rates under realistic production constraints, including tool use, multi-step planning, retries, and monitoring overhead."},{"name":"Slot Extraction F1 Score (SEF1)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"Fine-tuned Llama 3 8B achieved average F1 of 0.77 across the main test datasets and 0.78 when trained with both LLM-generated and human annotations. The study reports a 26 percentage-point absolute F1 increase over vanilla LLMs and a 34% relative F1 improvement over off-the-shelf extractive models. No healthcare-scheduling-specific SEF1 threshold is reported.","description":"Measures the harmonic mean of precision and recall for entity-level slot extraction by a conversational agent, computed as 2 x precision x recall / (precision + recall). The cited study evaluates lenient precision, recall, and F1 for LLM-based slot filling over conversational dialogue datasets after inverse text normalization.","intended_use":"Evaluate whether a voice scheduling agent captures structured patient information, such as name, date of birth, insurance information, and requested scheduling details, before downstream booking actions."},{"name":"Call Abandonment Rate (CAR)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The supplied citation does not report call abandonment rate or the 5% and 8% thresholds. A different peer-reviewed call-center or healthcare access study is required before using a numeric benchmark.","description":"Measures the proportion of inbound patient calls in which the caller disconnects before task completion, computed as abandoned calls divided by total inbound calls handled by the agent. The supplied citation evaluates e-health service use and does not measure call abandonment.","intended_use":"Monitor whether a deployed voice scheduling agent loses callers before appointment booking, information delivery, or handoff completion."},{"name":"Top-k Symptom-to-Visit Type Mapping Accuracy (Workflow Gap)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The study reports classification performance for patient self-reported symptom and need text, but it does not define a top-k visit-type benchmark. Use top-k accuracy only against locally annotated scheduling labels; the cited study should be treated as proxy evidence for the text-classification task.","description":"Measures whether the correct visit type derived from patient-described natural language input appears within the top k predicted outputs. The cited study evaluates classification of patient self-reported symptom and need text into structured clinical categories; it supports text-to-category classification as a proxy, not visit-type matching directly.","intended_use":"Evaluate whether a voice scheduling agent maps patient-described symptoms to the correct scheduling category, visit type, or routing queue."},{"name":"Legal Agent Intermediate Progress Rate (LAIPR)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"LegalAgentBench reports 300 annotated tasks spanning 17 legal corpora and 37 tools and computes intermediate progress rate through keyword-based intermediate-step analysis. The cited source reports progress by model and task setting, not a universal deployment threshold.","description":"Measures the proportion of intermediate reasoning and tool-use steps completed before a final answer on multi-hop legal tasks. The cited benchmark defines legal-agent tasks over corpora and tools and reports intermediate progress rates to capture partial completion beyond final success.","intended_use":"Evaluate step-level progress in legal agent workflows, such as case retrieval, rule identification, judgment prediction, and regulatory cross-reference tasks."},{"name":"Patient-Reported Experience Score (Post-Call Voice Survey)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited review reports evidence on patient-experience survey administration methods, response rates, and representativeness. It does not report an AI voice-agent top-box threshold or validate a post-call IVR score benchmark.","description":"Measures patient-reported ratings after an agent interaction across domains such as ease of scheduling, clarity of communication, and perceived request resolution. The cited systematic review evaluates survey administration strategies for response rates and representativeness, not AI voice-agent experience scores directly.","intended_use":"Compare post-call patient experience across agent-handled, human-handled, and mixed scheduling workflows and detect experience degradation after deployment changes."},{"name":"Provider Preference Match Rate (Workflow Gap)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited study supports preference-aware scheduling as an optimization problem. It does not report a fixed provider preference match-rate benchmark.","description":"Measures the proportion of scheduled appointments where the assigned provider matches the patient's stated or historically inferred provider preference. The cited scheduling study evaluates appointment scheduling under patient preferences and no-show behavior, not a standardized provider-match-rate metric.","intended_use":"Evaluate whether a scheduling agent incorporates patient provider, location, continuity-of-care, or provider-type preferences when booking appointments."},{"name":"Cost per Successful Task (CLEAR Framework)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The study does not define a fixed numeric cost threshold. It reports up to 50-fold cost variation and that cost-aware alternatives can be 4.4x to 10.8x less expensive than accuracy-only choices under comparable evaluation settings.","description":"Measures total computational or monetary cost incurred to achieve successful task outcomes, computed as total cost across task executions divided by the number of successfully completed tasks. CLEAR evaluates cost alongside latency, efficacy, accuracy, and reliability.","intended_use":"Compare agentic systems that achieve similar task success but require different inference, retry, tool-use, or infrastructure cost."},{"name":"Counterfactual Unfairness Level","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"per the Supporting Literature, Counterfactual Unfairness Level <= 0.05. PyCFRL example: baseline policies reported unfairness 0.407 \"Full\" and 0.446 \"Unaware\", while the counterfactually fair method achieved 0.042.","description":"Measures policy unfairness in sequential decision-making as the degree to which the agent's action allocation would change under a counterfactual change to a protected attribute, holding causal non-sensitive drivers constant. Evaluated at the policy or trajectory level, not only at the level of isolated predictions.","intended_use":"Assess whether an agentic AI policy, such as an offline reinforcement learning (RL) or sequential decision agent, allocates actions fairly across protected groups in settings where decisions compound over time."},{"name":"Fairness Constraint Evaluation","cat":"Fairness & equity","principle":"Fairness and Bias Management","description":"Assesses whether defined fairness constraints are incorporated into the multi-agent decision framework and empirically evaluated for equitable outcomes. The cited paper discusses fairness constraints, bias mitigation strategies, and incentive mechanisms, but does not define a decision-level Fairness Constraint Satisfaction Rate threshold.","intended_use":"Assess whether agentic AI systems include explicit fairness constraints during autonomous decision processes and whether those constraints are evaluated during testing."},{"name":"Multi-Agent Demographic Parity Fairness Score","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"The cited paper adapts demographic parity, counterfactual fairness, and conditional statistical parity to multi-agent systems. It does not report a universal +/-5% tolerance threshold.","description":"Quantifies fairness across groups of agents, or outcomes for populations influenced by agentic decisions, by measuring whether protected attributes have no systematic advantage in expected rewards, outcomes, or benefits assigned by agent actions. Adapted from demographic parity definitions into a multi-agent interaction context.","intended_use":"Assess whether an agentic AI's policies create systemic outcome disparities across groups when executing multi-step decision processes, such as resource allocation, triage, routing, or recommendation actions."},{"name":"Predictive Parity Ratio","cat":"Fairness & equity","principle":"Fairness and Bias Management","benchmark":"No PPR >= 0.9 threshold is reported in the cited article. Report PPV by group and the resulting predictive parity ratio or disparity across prespecified protected attributes.","description":"Ratio of positive predictive values (PPV) for a key binary agentic decision outcome across protected groups. PPV is defined as the proportion of correct positive outcomes among all positive decisions for each group. The PPR = min(PPV_i / PPV_j) across all group pairs for a protected attribute.","intended_use":"Assess whether positive decisions made autonomously by an agentic AI are equally reliable across demographic subgroups, especially when agent actions produce clinically or operationally meaningful binary outcomes."},{"name":"Human Oversight and Intervention Configuration","cat":"Safety & reliability","principle":"Safety and Reliability","description":"Documents whether an agentic system is configured to use human input, correction, approval, or oversight during task execution. The cited literature supports human-in-the-loop modes and risk controls for agentic AI, but does not report a quantitative Human Intervention Rate benchmark.","intended_use":"Identify where human input or review is required to keep an agentic AI system functional, controlled, and aligned with workflow permissions. Human intervention should not be treated as uniformly undesirable in healthcare. Distinguish (1) required policy-based review, (2) appropriate safety- or uncertainty-driven escalation, and (3) failure-related rescue or correction. Report these categories separately."},{"name":"Policy-Compliant Task Completion Rate (Completion under Policies)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"ST-WebAgentBench reports Completion under Policy across 222 tasks and Risk Ratio across safety and trustworthiness dimensions. Report CuP as (# tasks completed with zero policy violations) / (total evaluated tasks), with violations stratified by severity and policy category.","description":"Measures the share of tasks the agent completes while also satisfying required policies, permissions, and workflow constraints. A task only counts as successful if the final outcome is correct and the agent's intermediate actions, tool calls, and state changes comply with applicable rules.","intended_use":"Evaluate whether an agent can achieve goals without cutting corners, bypassing controls, exposing data, or violating enterprise or clinical workflow rules during multi-step execution."},{"name":"Constraint Violation Rate (CVR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"Li et al. report outcome-driven constraint violation rates ranging from 0.0% to 62.8% across 12 LLMs, with most evaluated models at or above 25%. No universal CVR <= 0.10 threshold is reported.","description":"Measures how often an agentic AI violates formal outcome, safety, legal, ethical, or workflow constraints during multi-step tasks where certain behaviors are prohibited. A lower CVR indicates stronger adherence to constraints under realistic task pressure.","intended_use":"Empirically quantify the frequency at which an autonomous agent breaches critical rules when optimizing for task goals, capturing misalignment between performance incentives and compliant behavior."},{"name":"Safety Risk Category Coverage","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"No validated HRI >= 0.90 threshold is reported. Agent-SafetyBench evaluates 2,000 test cases across 349 environments, 8 safety-risk categories, and 10 common failure modes.","description":"Measures whether agent safety evaluation covers defined risk categories and failure modes such as unsafe actions, harmful outputs, privacy violations, robustness failures, and risk-unaware behavior. The cited preprint proposes harm-reduction indices conceptually, while Agent-SafetyBench operationalizes safety evaluation through risk categories and test cases.","intended_use":"Evaluate whether an agentic AI safety test suite includes the risk categories and failure modes needed to characterize unsafe outputs and actions before deployment."},{"name":"Safety Score (Agent-SafetyBench)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"Agent-SafetyBench contains 2,000 test cases across 349 environments, evaluates 8 categories of safety risks, and covers 10 common failure modes. The study reports that none of the 16 evaluated LLM agents achieved a safety score above 60%, so 60% should not be treated as a target threshold.","description":"A safety metric derived from Agent-SafetyBench that evaluates agentic systems across realistic interactive environments. It measures the percentage of tasks completed without triggering defined safety failure modes such as unsafe actions, harmful outputs, privacy violations, or risk-unsound behavior.","intended_use":"Empirically quantify how reliably an agentic AI avoids unsafe behavior while performing multi-turn interactive tasks and tool use in diverse scenarios."},{"name":"Clinical Agent Task Success and Checkpoint Completion","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"MedAgentBench reports Claude 3.5 Sonnet v2 at 69.67% success on 300 clinically derived EHR tasks. PhysicianBench reports 100 long-horizon EHR tasks with 670 structured checkpoints, with the best model achieving 46% pass@1 and open-source models reaching at most 19%. No TLSCAS >= 0.95 benchmark is reported.","description":"Measures whether clinical LLM agents complete EHR-grounded clinical tasks and intermediate checkpoints defined by benchmark authors or clinician reviewers. The cited clinical agent studies report task success, pass@1, and structured checkpoint completion rather than a combined TLSCAS metric.","intended_use":"Evaluate whether agentic AI systems for clinical workflows can retrieve data, reason over patient records, execute required actions, and complete clinician-defined workflow objectives before deployment or during benchmark comparison."},{"name":"Plan Adherence Score (PAS)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study reports that Agent GPA identified 95% of human-annotated errors, localized 86% of human-annotated errors, and achieved 76% to 86% error coverage for GPA judges. No PAS >= 0.85 threshold is reported.","description":"Measures whether agent plans and actions remain aligned with stated goals using the Agent GPA framework. The cited study evaluates goal, plan, and action alignment with LLM judges across public and enterprise agent settings.","intended_use":"Evaluate whether an agent follows its intended goal-plan-action structure during multi-step execution and identify where failures occur."},{"name":"Step Correctness Rate (SCR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"AgentProcessBench reports 1,000 trajectories, 8,509 human-labeled step annotations, and 89.1% inter-annotator agreement. No SCR >= 0.80 deployment threshold is reported.","description":"Measures step-level process quality in tool-using agent trajectories using human-labeled step annotations. AgentProcessBench evaluates 1,000 trajectories with 8,509 human-labeled steps and 89.1% inter-annotator agreement.","intended_use":"Evaluate whether intermediate tool-use steps are correct before relying on final task completion as the only performance measure."},{"name":"Planning Efficiency Index (PEI)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"No verified benchmark could be extracted from the supplied source link. Do not use the PEI >= 0.70 threshold without a supporting study.","description":"Measures the efficiency of an agent trajectory by comparing the number of steps or tool calls used against a task-specific reference path. The supplied source could not be verified as a peer-reviewed paper from the provided download link.","intended_use":"Evaluate whether an agent completes tasks without unnecessary planning or tool-use overhead when a task-specific reference path is available."},{"name":"Goal Adherence Score (GAS)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited report does not define a universal GAS threshold. Report the study-specific goal drift or deviation measure for each agent and task setting.","description":"Measures whether a language model agent maintains adherence to its assigned objective over extended autonomous execution. The cited report evaluates goal drift by exposing agents to competing objectives and measuring deviation from the original goal.","intended_use":"Evaluate whether long-horizon agent behavior remains consistent with the assigned goal when environmental pressure creates competing objectives."},{"name":"Intraclass Correlation Coefficient (ICC) for Agent Consistency","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study proposes ICC for agentic evaluation reliability. No universal ICC >= 0.70 or ICC >= 0.80 threshold for agent deployment is reported.","description":"Uses intraclass correlation coefficient to quantify evaluation inconsistency in repeated agentic benchmark runs by decomposing variance into between-query and within-query components.","intended_use":"Assess whether reported agent performance is stable across repeated evaluations rather than driven by stochastic variation."},{"name":"Standard Deviation of Task Success Rate (SD-TSR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The study reports that single-run pass@1 estimates vary by 2.2 to 6.0 percentage points depending on the selected run, with standard deviations exceeding 1.5 percentage points even at temperature 0. No universal SD-TSR pass/fail threshold is reported.","description":"Measures the variability in an agent's task success rate across repeated independent runs of the same evaluation set. In the study, success rates (pass@1) are computed over multiple runs per task, and standard deviation quantifies run-to-run variability caused by stochastic generation and environment interaction.","intended_use":"Quantify how much an agent's performance fluctuates across repeated executions so reported success rates can be interpreted with variance estimates rather than single-run point estimates."},{"name":"Tool Selection Accuracy (TSA)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"MCPAgentBench introduces authentic tasks, simulated MCP tools, distractor tool lists, task completion rates, and execution efficiency metrics. No universal TSA >= 0.80 threshold is reported.","description":"Measures an agent's ability to select appropriate tools from candidate lists that include distractor tools. MCPAgentBench evaluates real-world MCP tool definitions, authentic tasks, simulated MCP tools, task completion rates, and execution efficiency.","intended_use":"Evaluate whether a tool-using agent selects the correct external tool before invocation in realistic tool environments."},{"name":"Tool Invocation Correctness (TIC)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"BFCL evaluates serial and parallel function calls across programming languages using AST-based evaluation. No universal TIC >= 0.85 threshold is reported.","description":"Measures correctness of function or API calls generated by a language model using benchmark-defined evaluation methods such as abstract syntax tree comparison across real-world function-calling settings.","intended_use":"Evaluate whether an agent produces valid and correct tool invocations before connecting it to production APIs or clinical tools."},{"name":"TESR (Tool Execution Success Rate)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"FinToolBench reports 760 executable financial tools and 295 tool-required queries. No universal TESR >= 0.90 threshold is reported.","description":"Measures whether tool-augmented agent runs execute required tools successfully in a real-world runnable benchmark. The cited FinToolBench study evaluates 760 executable financial tools and 295 tool-required queries.","intended_use":"Evaluate whether an agent can complete required tool executions in domains where tool calls must be auditable and runnable."},{"name":"Task Completion Rate with Tool Use (TCR-T)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited survey does not report a universal TCR-T threshold. Use benchmark-specific task completion rate definitions and report tool-use failures separately.","description":"Measures task completion in settings where an agent must use tools to complete multi-step tasks. The cited survey describes agent evaluation objectives and processes rather than reporting a fixed task-completion benchmark.","intended_use":"Evaluate whether a tool-using agent completes benchmark tasks that require interaction with external tools or environments."},{"name":"Noise-Induced Performance Degradation (NIPD)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study introduces AgentNoiseBench for noisy-condition evaluation. No universal <=10 percentage point degradation threshold is reported in the source metadata.","description":"Measures the change in tool-using agent performance under noisy conditions compared with idealized benchmark conditions. AgentNoiseBench evaluates robustness of tool-using LLM agents under controlled noise conditions.","intended_use":"Assess whether agent performance remains stable when user inputs, tool outputs, or execution environments contain realistic noise."},{"name":"Pass@1 Task Completion Rate","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"APEX-SWE includes 100 integration tasks and 100 observability tasks. The supplied citation does not support using pass@1 >= 0.40 as a general benchmark for non-software domains.","description":"Measures the share of benchmark tasks solved on the first attempt. APEX-SWE evaluates economically valuable software engineering tasks, including 100 integration tasks and 100 observability tasks.","intended_use":"Evaluate first-attempt task completion for complex real-world agentic tasks where repeated retries would mask operational unreliability."},{"name":"Epistemic Verification Behavior Rate","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"No standardized threshold is reported in the cited source. Report verification behaviors using task-specific annotation criteria if used.","description":"Captures whether an agent verifies information before taking action in complex software engineering tasks. The cited APEX-SWE abstract supports evaluation of real-world integration and observability tasks, but does not define a quantitative verification behavior rate.","intended_use":"Evaluate whether an agent checks evidence or system state before executing consequential actions."},{"name":"Decision Accuracy Under Incomplete Information","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"Finance Agent Benchmark reports 537 expert-authored questions across nine financial task categories. No universal accuracy threshold is reported.","description":"Measures decision accuracy on finance research tasks requiring information retrieval, analysis of recent SEC filings, and reasoning under incomplete or evolving information. The cited benchmark contains 537 expert-authored finance research questions across nine task categories.","intended_use":"Evaluate agent decision accuracy in high-information-load research tasks where the system must gather relevant evidence before answering."},{"name":"Escalation Rate (ESR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"tau-bench reports that state-of-the-art agents still fail more than 50% of tasks in some customer-service domains and that pass^8 can drop below 25% in the retail setting. The study does not report an escalation-rate threshold for healthcare voice scheduling.","description":"Measures the proportion of agent-handled interactions transferred to a live human agent, computed as escalated interactions divided by total interactions handled by the agent. Escalations should be stratified as (1) required policy-based review, (2) appropriate safety/uncertainty escalation, and (3) failure-related rescue on an otherwise resolvable task. Only category (3) should be counted as agent failure.","intended_use":"Monitor whether a voice scheduling agent identifies its task boundaries and hands off to human staff when needed."},{"name":"Platform Reliability Score (PRS)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"Larsen et al. analyzed 80,381 patient safety event reports and identified 76 events associated with healthcare IT downtime. The cited sources do not report an AI voice-agent platform reliability score or validate a 99.9% uptime threshold.","description":"Measures operational stability of the AI voice-agent platform using system uptime, mean time between failures, and unplanned incident rate across telephony, LLM inference, and EHR integration components. The cited healthcare IT studies evaluate downtime procedures and patient-safety event reports, not AI voice-agent reliability directly.","intended_use":"Assess whether the deployed scheduling platform remains available for patient-facing operations and identify infrastructure failures that prevent scheduling access."},{"name":"Real-Time Oversight Layer / Independent Output Monitoring Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study supports measuring oversight error detection through sensitivity and response bias. It does not report a 100% monitoring coverage benchmark for healthcare voice agents.","description":"Measures the proportion of calls or agent turns evaluated by a secondary oversight layer against predefined dangerous-output patterns. The cited study frames oversight as an error-detection problem using signal detection theory and evaluates sensitivity and response bias concepts, not a healthcare voice-agent coverage threshold.","intended_use":"Evaluate whether agent outputs are independently screened for harmful, out-of-scope, or policy-violating content before delivery or review."},{"name":"Hard Turn Limit Compliance Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study reports degradation when models must use information located in the middle of long contexts. It does not report a 15 to 20 turn ceiling or a 100% compliance benchmark.","description":"Measures the proportion of calls in which the agent triggers handoff or graceful termination before or at a predefined conversation-turn ceiling. The cited study evaluates how language-model performance varies with relevant information position in long contexts; it does not define a healthcare scheduling turn limit.","intended_use":"Prevent unbounded conversation loops and evaluate whether stalled voice-agent calls exit through a controlled handoff or termination path."},{"name":"Output Constraint Violation Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"CONFAIDE reports that GPT-4 and ChatGPT reveal private information in 39% and 57% of evaluated cases, respectively. The study does not report a healthcare voice-scheduling constraint-violation threshold or validate a 0% benchmark.","description":"Measures the proportion of audited agent turns containing content that violates a predefined output-boundary policy, such as disallowed clinical statements, system-prompt disclosure, internal reasoning disclosure, or inappropriate sensitive-data exposure. The cited study evaluates contextual privacy failures in language-model outputs.","intended_use":"Track policy-violating output during pre-deployment red-teaming and post-deployment transcript review."},{"name":"Node-Level Regression Test Coverage Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited source supports evaluation-driven lifecycle testing for agentic AI systems. It does not report a 100% node coverage benchmark or a healthcare voice-scheduling threshold.","description":"Measures the proportion of defined workflow decision nodes with an active, versioned regression test suite. The cited evaluation-driven development study describes lifecycle evaluation practices for agentic AI systems, but does not validate a node-level coverage threshold.","intended_use":"Evaluate whether workflow nodes such as intent recognition, identity verification, eligibility checks, visit-type mapping, provider selection, and confirmation remain testable across model or prompt updates."},{"name":"End-to-End Trace Coverage Rate (Guard Rail)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited source supports observability and tracing for LLM-agent systems. It does not report a 100% trace-coverage benchmark or a HIPAA retention benchmark.","description":"Measures the proportion of sessions with a complete trace from intake through terminal state, including tool calls, webhook calls, slot actions, escalations, confirmations, timestamps, and outputs. The cited AgentOps paper focuses on observability concepts and trace artifacts for LLM agents.","intended_use":"Support debugging, incident review, and reliability analysis by checking whether deployed agent sessions can be replayed from complete traces."},{"name":"Pass@k Reliability for Agentic Financial Tasks","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"CLEAR reports that single-run reliability of 60% can drop to 25% under 8-run consistency and documents large cost differences across systems. It does not report pass@5 greater than or equal to 0.90 as a validated threshold.","description":"Measures the probability that an agent successfully completes a task at least once across k independent runs with identical inputs. In financial workflows, it captures stochastic reliability across repeated executions rather than single-run task success alone.","intended_use":"Evaluate reliability of agentic financial analysis, reporting, or decision-support tasks across repeated runs."},{"name":"Intermediate Step Correctness Rate","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study reports intermediate progress tracking for legal-agent tasks, but it does not define a correctness-based threshold.","description":"Measures the proportion of intermediate reasoning steps within an agentic workflow judged correct against task-specific criteria. The cited legal-agent benchmark reports intermediate progress tracking, but uses keyword-based progress analysis rather than correctness judgments for every step.","intended_use":"Evaluate whether agents maintain correct reasoning and tool-use steps during complex workflows, rather than only producing a final answer."},{"name":"Decontaminated Task Success Rate","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The supplied source does not provide a verified peer-reviewed benchmark. Use only after replacing the citation with a verifiable paper that reports decontaminated task success results.","description":"Measures the proportion of tasks successfully completed on evaluation datasets curated to exclude overlap with training data. The supplied source could not be verified as a peer-reviewed study or stable academic citation, so the row is retained with benchmark support flagged.","intended_use":"Evaluate whether software-engineering agents solve contamination-controlled tasks rather than relying on memorized training-data patterns."},{"name":"Cumulative Risk Exposure (Multi-Agent System Safety Metric)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study defines and demonstrates cumulative risk exposure but does not report a universal numeric safety threshold. Lower cumulative risk exposure is used for comparative evaluation.","description":"Measures aggregate safety risk experienced by a multi-agent system over time by summing expected risk contributions across agents and time steps. The cited study introduces cumulative risk exposure for gatekeeping and coordination in multi-agent systems.","intended_use":"Evaluate whether multi-agent systems maintain safe collective behavior rather than only minimizing individual-agent failure outcomes."},{"name":"Regression Non-Introduction Rate (RNIR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"SWE-bench contains 2,294 real GitHub issues and reports Claude 2 resolving 1.96% in the original evaluation. The cited paper does not report a 500-instance SWE-bench Verified threshold or a 70% resolve-rate benchmark.","description":"Measures the proportion of agent-generated code patches that resolve the target issue without breaking previously passing tests. The cited SWE-bench paper evaluates real GitHub issues using repository tests, including fail-to-pass behavior, but does not validate the RNIR threshold described in the CSV.","intended_use":"Evaluate whether software-engineering agents introduce unintended regressions while autonomously modifying codebases."},{"name":"Business Policy Adherence Rate (BPAR)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"tau-bench evaluates retail, airline, and telecom tasks with domain-specific policies and annotated goal states. The paper reports that state-of-the-art agents can achieve less than 50% pass^1 in the retail domain and pass^8 below 25%; it does not report a universal BPAR threshold.","description":"Measures the proportion of multi-turn agent interactions where the final database or system state matches the annotated goal state without actions that violate domain-specific operational policies. It separates task completion from policy-compliant task completion.","intended_use":"Evaluate whether enterprise agents follow domain-specific business rules during autonomous multi-turn tool-use workflows."},{"name":"PPE Non-Compliance Alert Precision-Recall F1 (PNA-F1)","cat":"Safety & reliability","principle":"Safety and Reliability","benchmark":"The cited study reports PPE detection mAP@50 of 83.1% for a YOLOv5 hybrid dataset and reports model-specific precision, recall, and F1 values in construction footage experiments. It does not validate a universal PNA-F1 greater than or equal to 0.90 deployment threshold.","description":"Measures the harmonic mean of precision and recall for autonomous detection and alerting of personal protective equipment non-compliance events in construction or industrial video. Precision is true PPE violation alerts divided by all issued alerts, and recall is true PPE violation alerts divided by all annotated PPE violations.","intended_use":"Evaluate detection fidelity for agentic computer-vision safety monitoring systems that scan worksite video for PPE violations."},{"name":"Errors-of-Omission Rate","cat":"Safety & reliability","principle":"Safety and Reliability","description":"Measures the proportion of tasks where the agent fails to surface, act on, or flag information or actions it should have — omissions that can carry significant clinical and operational impact even when committed (commission) errors are low.","intended_use":"Evaluate whether evaluation captures what the agent failed to do, not only incorrect actions taken. Report alongside commission-error and constraint-violation metrics."},{"name":"Automation Bias / Overreliance","cat":"Safety & reliability","principle":"Safety and Reliability","description":"Measures the degree to which users accept agent outputs without appropriate scrutiny, e.g., override rate on incorrect outputs, time-to-review, and acceptance of seeded erroneous recommendations in evaluation.","intended_use":"Assess downstream human-agent team effects, not just standalone agent accuracy."},{"name":"Economically Valuable Administrative Task Success Rate (HealthAdminBench)","cat":"Usefulness, usability & efficacy","principle":"Business and Financial","benchmark":"HealthAdminBench reports 135 expert-defined tasks and 1,698 evaluation points across four simulated administrative environments, evaluating seven agent configurations. The best-performing agent (Claude Opus 4.6 CUA) reached 36.3% end-to-end task success, while GPT-5.4 CUA reached the highest subtask success rate at 82.8%. No universal deployment threshold is reported. Establish a local baseline by workflow type and report end-to-end success separately from subtask success.","description":"Measures whether an agent completes end-to-end healthcare administrative workflows that carry direct financial consequence, such as prior authorization, appeals and denials management, and durable medical equipment (DME) order processing. Healthcare administration accounts for over $1 trillion in annual spending, which is what makes these workflows an economically meaningful target for agentic automation. HealthAdminBench evaluates computer-use agents across four simulated GUI environments (an EHR, two payer portals, and a fax system) using 135 expert-defined tasks decomposed into 1,698 verifiable evaluation points, so end-to-end task success is reported separately from subtask success.","intended_use":"Evaluate whether an agentic AI system can carry an economically valuable administrative or revenue-cycle workflow all the way to completion, rather than only answering clinical questions or completing isolated steps. Report end-to-end success separately from subtask success, because strong subtask performance can coexist with low end-to-end reliability. Pair with cost-per-success so economic value is assessed on both the benefit and the cost side, and with policy-compliance and safety metrics, since actions such as submitting an authorization or an appeal are consequential and often difficult to reverse."}]},"clinical-decision-support":{"label":"Clinical decision support","url":"https://rai-content.chai.org/en/latest/clinical-decision-support/t%26e-framework.html","metrics":[{"name":"Task Completion Time","cat":"Usefulness, usability & efficacy","principle":"Usability","when":"Post-Implementation","who":"Implementer","description":"Measure how long it takes a user to complete a defined task when interacting with an AI-enabled clinical decision support system. This metric evaluates whether the system's interface, workflow integration, and learning curve enable users to perform tasks efficiently. By tracking efficiency over repeated use, this metric can identify improvements associated with user familiarity, system usability, or interface design.","intended_use":"This metric is intended to assess how effectively an AI-enabled CDS system streamlines clinical workflows and whether usability improves as users gain experience. Reductions in task completion time can indicate intuitive design, effective onboarding, and meaningful workflow integration. The metric is applicable across AI systems---including those leveraging LLMs or retrieval-augmented generation---to evaluate user learning curves, interface usability, adoption, and operational efficiency at the point of care."},{"name":"Evidence Concordance, Citation Accuracy, and Guideline Alignment","cat":"Usefulness, usability & efficacy","principle":"Efficacy","when":"Pre-Implementation","benchmark":"Suggested benchmarks include: ≥ 90% evidence concordance with specialty guidelines, 100% verifiable citations, <5% hallucinations in reference-linked outputs.","description":"Measure how well AI-enabled CDS outputs align with specialty guidelines and reference evidence while ensuring that all cited sources are verifiable and correctly attributed. Evaluates factual alignment, reference traceability, and the percentage of outputs meeting specialty-specific evidence standards.","intended_use":"Ensure the clinical validity and trustworthiness of AI-enabled CDS recommendations, confirming they adhere to accepted medical guidelines and evidence hierarchies."},{"name":"Detection Accuracy","cat":"Usefulness, usability & efficacy","principle":"Efficacy","benchmark":"Hybrid AI workflows that combine LLM-based generation with domain-specific retrieval and expert validation typically achieve higher detection accuracy---including improved F1-score and recall for clinically significant events---compared to LLM-only approaches, with minimal loss in precision.","description":"Detection Accuracy measures an AI-supported CDS system's ability to correctly identify and classify clinically relevant issues---such as medication-related risks, adverse interactions, contraindications, or other domain-specific safety events---during real-time decision support. This metric typically evaluates precision, recall, and F1-score against expert-verified ground truth, providing a quantitative assessment of the system's clinical reliability.","intended_use":"This metric is intended to validate the accuracy and safety performance of AI-generated CDS insights by ensuring that the system reliably detects and flags clinically important risks. It can be used both before and after implementation to assess model performance, inform system tuning, monitor post-deployment reliability, and ensure alignment with clinical expectations. Applicable across AI modalities---including RAG-LLMs---it helps Developers refine models and retrieval pipelines, and helps Implementers verify that the CDS system supports safe and effective medication management or other clinical tasks."},{"name":"Hallucination Rate and Response Time","cat":"Usefulness, usability & efficacy","principle":"Efficacy","benchmark":"Suggested that AI-enabled CDS achieve near-zero hallucination rates, high factual accuracy (organizational dependent), and significantly faster response times than traditional human review---demonstrating strong reliability and operational efficiency in CDS contexts.","description":"Measure the factual reliability and latency of CDS responses generated by LLMs. Quantifies hallucination frequency in clinical summaries or recommendations and the average time to produce accurate, guideline-consistent outputs.","intended_use":"Confirm operational readiness and efficiency of CDS systems in clinical workflows by ensuring low hallucination rates and acceptable generation latency relative to human review."},{"name":"Stratified Subgroup Performance","cat":"Fairness & equity","principle":"Fairness","description":"This metric evaluates whether an AI-supported CDS system performs equitably across different demographic or clinically relevant subgroups. Stratified subgroup performance analysis measures error rates, accuracy, or other performance indicators across variables such as age, gender, race/ethnicity, insurance status, or health condition. When paired with Explainable AI (XAI) techniques, the method provides interpretable insights into the root causes of observed disparities, illuminating how model features, retrieval pathways, or training data contribute to uneven performance.","intended_use":"This metric is designed to systematically detect, quantify, and explain performance disparities before---and, if monitored, after---deployment. By combining subgroup error analysis with XAI, it enables Developers and Implementers to identify where a CDS system may introduce inequities, understand why these disparities occur, and prioritize corrective interventions such as data augmentation, prompt engineering, retrieval refinement, calibration, or workflow safeguards."},{"name":"Subgroup Accuracy Across Sensitive Attributes","cat":"Fairness & equity","principle":"Fairness","when":"Pre-Implementation","description":"This metric assesses whether an AI-enabled CDS system provides equally accurate clinical responses across subgroups defined by sensitive attributes---such as race, gender, age, or other protected characteristics. By evaluating accuracy, linguistic patterns, or response quality across standardized clinical question--answer (QA) scenarios, the metric identifies subgroup-specific disparities that may indicate underlying model bias. It may also incorporate evaluation of how different prompting strategies influence fairness and accuracy.","intended_use":"This metric is intended to provide a systematic approach for detecting and minimizing bias in LLM-powered CDS systems. By comparing subgroup accuracy across diverse clinical vignettes and testing alternative prompt designs, it enables Developers and Implementers to identify which models and prompting methods yield more equitable performance."},{"name":"Cross-Site Generalizability and Calibration Gap","cat":"Fairness & equity","principle":"Bias Management","benchmark":"No universal threshold established. Aim for minimal performance degradation (e.g., ≤5--10% difference in accuracy or calibration slope) when evaluated across sites or demographic groups; Significant deviation should prompt bias investigation and potential retraining.","description":"Measure how much model performance (e.g., accuracy, calibration) changes when tested on a new hospital or population compared to its training data.","intended_use":"Identify bias or poor generalizability before deployment, ensuring consistent performance across diverse clinical sites and patient populations."},{"name":"Safety-related Overrides","cat":"Safety & reliability","principle":"Safety","when":"Post-Implementation","description":"Proportion (or count) of AI-enabled CDS outputs that are tagged with safety-related override reasons, such as when clinicians reject or modify a recommendation due to potential harm or contraindication.","intended_use":"Capture and analyze instances where clinicians identify an AI output as potentially unsafe."},{"name":"Stress and Adversarial Scenario Evaluation","cat":"Safety & reliability","principle":"Safety, Reliability","who":"Implementer","description":"Evaluation of the CDS system using challenging or problematic inputs to see how it responds. This includes testing with incomplete or confusing queries, unusual clinical scenarios, and inputs that deliberately try to trigger unsafe or inappropriate recommendations. The focus is on whether the system stays safe, gives appropriate refusals or clarifications, and avoids producing harmful/hallucinatory guidance with incomplete/incorrect/purposefully antagonistic information.","intended_use":"Identify safety issues that may not appear during routine testing. This helps determine whether the system can handle difficult or inappropriate inputs in a safe and reliable way, and whether its safeguards work as intended. Results can guide improvements before and after deployment."}]},"clinical-trials":{"label":"Clinical trials","url":"https://rai-content.chai.org/en/latest/clinical-trials/t%26e-framework.html","metrics":[{"name":"Eligibility Improvement & Enrollment Uptake","cat":"Usefulness,
