[project]
site_url = "https://tonyreina.github.io/ai_governance_healthcare/"
site_name = "AI Governance for Healthcare"
site_description = "A governance review tool that walks a hospital AI team through the CHAI six-stage lifecycle and tracks the whole portfolio on one dashboard."

copyright = "Licensed under the Apache License, Version 2.0"

repo_url = "https://github.com/tonyreina/ai_governance_healthcare"
repo_name = "tonyreina/ai_governance_healthcare"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Open the dashboard" = "app/index.html" },
  { "The frameworks" = [
    "frameworks/index.md",
    "frameworks/chai.md",
    "frameworks/chai-checklist.md",
    "frameworks/chai-metrics.md",
    "frameworks/optica.md",
    "frameworks/optica-checklist.md",
    "frameworks/evidence.md",
  ] },
  { "Running it" = "running.md" },
  { "Crosswalk" = "crosswalk.md" },
  { "Compliance rules" = "compliance-rules.md" },
  { "Python exports" = "exports.md" },
  { "Self-hosting" = "self-hosting.md" },
  { "Cloud deployment" = "deploy.md" },
  { "Privacy and retention" = "privacy.md" },
  { "Security claims" = "security-claims.md" },
  { "Notice & license" = "notice.md" },
  { "chai: namespace" = "ns/index.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/tonyreina/ai_governance_healthcare"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
