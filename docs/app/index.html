<script>
/* ============================================================
   Utilities
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => o==null ? o : JSON.parse(JSON.stringify(o));
const isObj = v => v && typeof v==="object" && !Array.isArray(v);
function deepMerge(t,src){ for(const k in src){ if(isObj(src[k]) && isObj(t[k])) deepMerge(t[k],src[k]); else t[k]=clone(src[k]); } return t; }
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const TODAY = ()=> ymd(new Date());
function parseDay(s){ if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const d=new Date(s.slice(0,10)+"T00:00:00"); return isNaN(d)?null:d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtDay(s){ const d=parseDay(s); return d? d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : ""; }
function ago(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; const m=Math.round((Date.now()-d)/60000);
  if(m<1) return "just now"; if(m<60) return `${m} min ago`; const h=Math.round(m/60); if(h<24) return `${h} h ago`; const dd=Math.round(h/24); if(dd<45) return `${dd} days ago`; return fmtDay(iso.slice(0,10)); }
let _idSeq = 0;
const newId = ()=> "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+(_idSeq++).toString(36);

/* ============================================================
   Core: the project document
   Framework-agnostic. Knows a project has meta, items, gates,
   metrics and a card -- not what any of them mean.
   ============================================================ */
const blankMeta = ()=>({solution:"",org:"",developer:"",sourcing:"",sponsor:"",reviewers:"",riskTier:"",reviewCadence:"",startDate:"",scope:"",chaiUseCase:""});
function blankProject(name){
  const now=new Date().toISOString();
  return {meta:{...blankMeta(),solution:name||""}, ...frameworkBlank(), metrics:[], card:{},
    access: ME.id ? {owners:[ME.id], writers:[], readers:[]} : blankAccess(),
    archived:false, createdAt:now, createdBy:ME.id||null, updatedAt:now, updatedBy:ME.id||null, cardUpdatedAt:null};
}
function normalize(p){
  p.meta=Object.assign(blankMeta(),p.meta||{});
  p.metrics=Array.isArray(p.metrics)?p.metrics:[]; p.card=p.card||{};
  p.access=Object.assign(blankAccess(), p.access||{});
  frameworkNormalize(p); return p;
}
const cardValOf = (p,k) => ((p.card||{})[k]||"").trim() || (k==="name"?(p.meta.solution||"").trim():"") || (k==="developer"?(p.meta.developer||"").trim():"");

const STATUS = {met:"Met",partial:"Partial",notmet:"Not met",na:"N/A"};
const VAL = {met:1,partial:.5,notmet:0};

// Generic: scores any list of {id} against any items map. Framework rules
// decide WHICH list to pass; this does not know.
function scoreOf(list, items){
  items=items||S.items; let sum=0,n=0,answered=0;
  list.forEach(it=>{ const st=(items[it.id]||{}).status; if(st) answered++; if(st==="na") return; n++; sum+=VAL[st]||0; });
  return {pct:n?Math.round(sum/n*100):0,answered,total:list.length,applicable:n};
}

/* ============================================================
   Content hashing
   A short fingerprint of a project's contents, so a printed report
   can be tied to the exact record it came from, and so a later
   reader can tell whether anything moved.

   WHAT MD5 DOES AND DOES NOT DO. It answers "is this the same
   record?" perfectly well. It does NOT make the record tamper-
   evident: MD5 has been collision-broken since 2004, and anyone who
   can change the record can also compute a replacement hash. Treat
   it as a version fingerprint, not a seal.

   A SHA-256 is computed alongside for anyone who needs the stronger
   property. It is the one to quote if a hash will ever be offered as
   evidence that a record was not altered. Both travel with every
   export so the choice stays with the reader.

   CANONICALIZATION IS THE WHOLE PROBLEM. Two JSON documents with the
   same contents hash differently if their keys are in a different
   order, so the input is serialized with keys sorted at every depth.
   Volatile fields are excluded: a hash that changes when nothing
   substantive did is a hash nobody will trust. See CANON_SKIP.
   ============================================================ */

/* Excluded from the fingerprint, each for a reason:
     updatedAt/updatedBy  touched by every save, including a no-op
     cardUpdatedAt        same
     _state               the app's working copy, not the record
     contentHash          cannot hash a document containing its own hash */
const CANON_SKIP = new Set([
  "updatedAt", "updatedBy", "cardUpdatedAt", "_state", "contentHash", "generated",
]);

/* Deterministic JSON: keys sorted at every level, volatile fields
   dropped, undefined treated as absent. */
function canonicalize(value) {
  if (value === null || typeof value !== "object") return value;
  if (Array.isArray(value)) return value.map(canonicalize);
  const out = {};
  for (const key of Object.keys(value).sort()) {
    if (CANON_SKIP.has(key)) continue;
    const v = value[key];
    if (v !== undefined) out[key] = canonicalize(v);
  }
  return out;
}

const canonicalJSON = doc => JSON.stringify(canonicalize(doc));

/* MD5, implemented here because browsers do not provide it:
   crypto.subtle offers SHA family digests only, and deliberately so.
   Compact RFC 1321 implementation over a UTF-8 byte array. */
function md5(input) {
  const bytes = new TextEncoder().encode(input);
  const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K = new Uint32Array(64);
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);

  const bitLen = bytes.length * 8;
  const padded = new Uint8Array((((bytes.length + 8) >> 6) + 1) * 64);
  padded.set(bytes);
  padded[bytes.length] = 0x80;
  new DataView(padded.buffer).setUint32(padded.length - 8, bitLen >>> 0, true);
  new DataView(padded.buffer).setUint32(padded.length - 4, Math.floor(bitLen / 4294967296), true);

  let [a0, b0, c0, d0] = [0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476];
  const view = new DataView(padded.buffer);

  for (let chunk = 0; chunk < padded.length; chunk += 64) {
    const M = new Uint32Array(16);
    for (let i = 0; i < 16; i++) M[i] = view.getUint32(chunk + i * 4, true);
    let [A, B, C, D] = [a0, b0, c0, d0];
    for (let i = 0; i < 64; i++) {
      let F, g;
      if (i < 16) { F = (B & C) | (~B & D); g = i; }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = (F + A + K[i] + M[g]) >>> 0;
      A = D; D = C; C = B;
      B = (B + (((F << S[i]) | (F >>> (32 - S[i]))) >>> 0)) >>> 0;
    }
    a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0;
    c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
  }

  const hex = n => [0, 8, 16, 24].map(s => ((n >>> s) & 0xff).toString(16).padStart(2, "0")).join("");
  return hex(a0) + hex(b0) + hex(c0) + hex(d0);
}

async function sha256(input) {
  if (!(globalThis.crypto && crypto.subtle)) return "";   // file:// in some browsers
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(input));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* The fingerprint of a project, synchronously for MD5. */
function contentHash(doc) {
  return md5(canonicalJSON(doc));
}

/* Both digests, for exports. Async because SHA-256 is. */
async function contentHashes(doc) {
  const canon = canonicalJSON(doc);
  return { md5: md5(canon), sha256: await sha256(canon), bytes: canon.length };
}

/* Short form for display. Enough to distinguish versions by eye,
   and labeled as a prefix so nobody quotes it as the whole digest. */
const shortHash = h => (h || "").slice(0, 10);

/* ============================================================
   Access control
   Three roles, held per project:

     owner   everything, including deleting, archiving, and
             changing who else has access
     writer  fill in the checklist, metrics, model card and
             checkpoint decisions
     reader  see the record, change nothing

   WHAT THIS IS AND IS NOT. Everything in this file is user
   interface. A browser decides what to SHOW; it cannot decide what
   a server will ACCEPT, because the person using it can edit it.
   Real enforcement lives in server/app/access.py, which checks the
   same rules against an identity the proxy supplies and the browser
   cannot choose. If you add a permission here, add it there too, or
   you have added a label rather than a control.

   IDENTITY IS A PRECONDITION. Roles mean nothing without a
   trustworthy answer to "who is this", and the browser-only mode has
   none: localStorage has no users. In that mode the roles are
   recorded but not enforced, and the tool says so rather than
   implying a protection it cannot provide.

   LEGACY PROJECTS STAY OPEN. A project created before this existed
   has no access list. Treating that as "nobody has access" would
   lock a team out of its own governance records, so an empty owner
   list means unrestricted, exactly as before, until somebody claims
   ownership.
   ============================================================ */
const ROLES = ["owner", "writer", "reader"];
const ROLE_LABEL = { owner: "Owner", writer: "Write access", reader: "Read-only" };

const blankAccess = () => ({ owners: [], writers: [], readers: [] });

function accessOf(p) {
  const a = (p || {}).access || {};
  return {
    owners: Array.isArray(a.owners) ? a.owners : [],
    writers: Array.isArray(a.writers) ? a.writers : [],
    readers: Array.isArray(a.readers) ? a.readers : [],
  };
}

/* A project nobody has claimed. Open to all, and the state every
   project created before this feature is in. */
const unclaimed = p => accessOf(p).owners.length === 0;

/* Whether roles can mean anything here at all. Without an identity
   there is nobody to check a list against. */
const identityKnown = () => !!ME.id;

/* The current user's role, or "" for no access. Order matters:
   the most powerful role a user holds is the one that applies. */
function roleOf(p, who) {
  const id = who || ME.id;
  const a = accessOf(p);
  if (!id) return unclaimed(p) ? "owner" : "";
  if (a.owners.includes(id)) return "owner";
  if (a.writers.includes(id)) return "writer";
  if (a.readers.includes(id)) return "reader";
  return "";
}

/* Permission predicates. Each takes the project, defaulting to the
   open one. An unclaimed project grants everyone owner rights, which
   is what keeps existing records usable and lets someone claim them. */
function canRead(p) {
  const proj = p || S;
  if (!proj) return false;
  if (!identityKnown() || unclaimed(proj)) return true;
  return !!roleOf(proj);
}

function canWrite(p) {
  const proj = p || S;
  if (!proj) return false;
  if (!identityKnown() || unclaimed(proj)) return true;
  return ["owner", "writer"].includes(roleOf(proj));
}

/* Deleting, archiving and granting access are owner-only, as is
   anything else that changes who can do what. */
function canOwn(p) {
  const proj = p || S;
  if (!proj) return false;
  if (!identityKnown() || unclaimed(proj)) return true;
  return roleOf(proj) === "owner";
}

/* Grant or revoke. Returns a patch rather than applying one, so the
   caller decides how it reaches the store. A person holds at most
   one role: granting a new one removes the others. */
function accessPatch(p, id, role) {
  const a = accessOf(p);
  const next = {
    owners: a.owners.filter(x => x !== id),
    writers: a.writers.filter(x => x !== id),
    readers: a.readers.filter(x => x !== id),
  };
  if (role === "owner") next.owners.push(id);
  else if (role === "writer") next.writers.push(id);
  else if (role === "reader") next.readers.push(id);
  return next;
}

/* Refuse to remove the last owner. A project with no owner reverts to
   unrestricted, which would silently turn a locked-down record into an
   open one -- a privilege escalation dressed up as a tidy-up. */
function wouldOrphan(p, id, role) {
  const a = accessOf(p);
  return a.owners.length === 1 && a.owners[0] === id && role !== "owner";
}

/* ============================================================
   Stores: shared database, or this browser as a fallback
   ============================================================ */
class DbStore{
  constructor(db){ this.db=db; }
  col(){ return this.db.collection("projects"); }
  subscribeAll(cb,err){ return this.col().onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...clone(d.data())}))),err); }
  create(id,data){ return this.col().doc(id).set(data); }
  update(id,patch){ return this.col().doc(id).update(patch); }
  remove(id){ return this.col().doc(id).delete(); }
  log(id,e){ return this.db.collection(`projects/${id}/log`).add(e); }
  subscribeLog(id,cb){ return this.db.collection(`projects/${id}/log`).orderBy("at","desc").limit(60).onSnapshot(s=>cb(s.docs.map(d=>clone(d.data()))),()=>{}); }
}
class LocalStore{
  constructor(){ this.k="chai-portfolio-local-v1"; this.d=this.load(); this.subs=[]; this.logSubs={}; }
  load(){ try{ return JSON.parse(localStorage.getItem(this.k)) || {projects:{},logs:{}}; }catch(e){ return {projects:{},logs:{}}; } }
  persist(){ try{ localStorage.setItem(this.k,JSON.stringify(this.d)); }catch(e){} }
  emit(){ const list=Object.entries(this.d.projects).map(([id,v])=>({id,...clone(v)})); this.subs.forEach(f=>setTimeout(()=>f(list))); }
  subscribeAll(cb){ this.subs.push(cb); this.emit(); return ()=>{ this.subs=this.subs.filter(x=>x!==cb); }; }
  async create(id,data){ this.d.projects[id]=clone(data); this.persist(); this.emit(); }
  async update(id,patch){ if(!this.d.projects[id]) throw {code:"invalid_argument"}; deepMerge(this.d.projects[id],patch); this.persist(); this.emit(); }
  async remove(id){ delete this.d.projects[id]; delete this.d.logs[id]; this.persist(); this.emit(); }
  async log(id,e){ const l=(this.d.logs[id]||(this.d.logs[id]=[])); l.unshift(e); this.d.logs[id]=l.slice(0,100); this.persist(); (this.logSubs[id]||[]).forEach(f=>setTimeout(()=>f(clone(this.d.logs[id])))); }
  subscribeLog(id,cb){ (this.logSubs[id]||(this.logSubs[id]=[])).push(cb); setTimeout(()=>cb(clone(this.d.logs[id]||[]))); return ()=>{ this.logSubs[id]=(this.logSubs[id]||[]).filter(x=>x!==cb); }; }
}

/* ApiStore: a self-hosted backend over REST + Server-Sent Events.

   Selected at boot when /api/health answers, which is true when the app is
   served by the Docker Compose stack and false for the GitHub Pages copy, so
   one build covers both. Identity comes from /api/me, established by the
   reverse proxy -- the browser cannot influence who it is, which is what makes
   a checkpoint sign-off here mean something that a localStorage one does not.

   Live updates: the server sends ids, not documents, so a change notification
   is small and never races a larger body. Each event triggers one refetch of
   the list. For a governance tool with tens of projects that is cheaper than
   reconciling partial state, and it cannot drift. */
class ApiStore{
  constructor(base){ this.base=base||"/api"; this.es=null; this.cbs=[]; this.cache=[]; }

  async req(path,opts){
    const r = await fetch(this.base+path, Object.assign({
      headers:{"Content-Type":"application/json"}, credentials:"same-origin"
    }, opts||{}));
    if(!r.ok){
      // Surface the API's own code so onDbError can tell a permission problem
      // from a conflict; the app already distinguishes them.
      const err = new Error(`${r.status} ${r.statusText}`);
      err.code = r.status===403||r.status===401 ? "permission_denied"
               : r.status===409 ? "already_exists"
               : r.status===404 ? "not_found" : "unavailable";
      throw err;
    }
    return r.status===204 ? null : r.json();
  }

  async refresh(){
    const list = await this.req("/projects");
    this.cache = Array.isArray(list) ? list : [];
    this.cbs.forEach(f=>{ try{ f(clone(this.cache)); }catch(e){} });
  }

  subscribeAll(cb,err){
    this.cbs.push(cb);
    this.refresh().catch(e=>{ if(err) err(e); });
    if(!this.es){
      this.es = new EventSource(this.base+"/events");
      // The server sends NAMED events ("event: project.created"). EventSource
      // fires onmessage only for events with no name, so a handler attached
      // there never runs and the page silently stops updating -- it still
      // works, because every local write re-renders, so the failure only shows
      // when a COLLEAGUE makes a change. Each name needs its own listener.
      ApiStore.EVENTS.forEach(name=>{
        this.es.addEventListener(name, ()=>{ this.refresh().catch(()=>{}); });
      });
      // EventSource reconnects on its own; a refresh on reopen closes the gap
      // of anything missed while disconnected.
      this.es.onopen = ()=>{ this.refresh().catch(()=>{}); };
      this.es.onerror = ()=>{};
    }
    return ()=>{ this.cbs = this.cbs.filter(f=>f!==cb); };
  }

  create(id,data){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"POST",body:JSON.stringify(data)}); }
  update(id,patch){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"PATCH",body:JSON.stringify(patch)}); }
  remove(id){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"DELETE"}); }
  log(id,e){ return this.req(`/projects/${encodeURIComponent(id)}/log`,{method:"POST",body:JSON.stringify(e)}); }

  subscribeLog(id,cb){
    let stop=false;
    const pull = ()=> this.req(`/projects/${encodeURIComponent(id)}/log`)
      .then(rows=>{ if(!stop && Array.isArray(rows)) cb(rows); }).catch(()=>{});
    pull();
    // The log is append-only and low-traffic, so it rides the same change
    // signal as the project list rather than opening a second stream.
    const onChange = ()=> pull();
    this.cbs.push(onChange);
    return ()=>{ stop=true; this.cbs = this.cbs.filter(f=>f!==onChange); };
  }
}

/* Event names the API emits. Keep in step with server/app/events.py. */
ApiStore.EVENTS = ["project.created","project.updated","project.deleted","log.appended","resync"];

/* Is a self-hosted backend serving this page? Short timeout: on GitHub Pages
   the request 404s immediately, and the user should not wait on it. */
async function detectApi(base){
  try{
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 2500);
    const r = await fetch((base||"/api")+"/health",{signal:ctl.signal,credentials:"same-origin"});
    clearTimeout(t);
    if(!r.ok) return null;
    const j = await r.json();
    return j && j.status==="ok" ? j : null;
  }catch(e){ return null; }
}

/* names */
const NAMES={};
async function resolveNames(root){
  root=root||document;
  const els=[...root.querySelectorAll("[data-uid]")];
  const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];
  els.forEach(e=>{ if(!e.dataset.uid) e.textContent = MODE==="local"?"you (this browser)":"someone"; });
  const need=ids.filter(i=>!(i in NAMES));
  if(need.length && USER && USER.profiles){
    try{ const ps=await USER.profiles(need); need.forEach(i=>{ const p=ps[i]; NAMES[i]= p ? (p.isMe ? "you" : (p.name||"someone")) : "someone"; }); }catch(e){ need.forEach(i=>NAMES[i]="someone"); }
  }
  els.forEach(e=>{ const i=e.dataset.uid; if(i) e.textContent = NAMES[i] || (i===ME.id?"you":"someone"); });
}
const who = id => `<span data-uid="${esc(id||"")}">${id&&NAMES[id]?esc(NAMES[id]):"someone"}</span>`;

/* ============================================================
   Writes
   ============================================================ */
function setSaved(t){ document.getElementById("saved").textContent=t; }
function stamp(extra){ return Object.assign({updatedAt:new Date().toISOString(), updatedBy:ME.id||null}, extra||{}); }
function queuePatch(pid,patch){
  if(RO) return;
  deepMerge(pending[pid]||(pending[pid]={}), patch);
  setSaved("Saving…");
  clearTimeout(timers[pid]); timers[pid]=setTimeout(()=>flush(pid),550);
}
async function flush(pid,retry){
  if(flushing[pid]){ clearTimeout(timers[pid]); timers[pid]=setTimeout(()=>flush(pid),300); return; }
  const p=pending[pid]; if(!p) return; delete pending[pid];
  flushing[pid]=true;
  try{
    await STORE.update(pid,p);
    if(!pending[pid]) setSaved(MODE==="shared"?"Saved to shared workspace":"Saved in this browser");
  }
  catch(e){
    const c=e&&e.code;
    if(c==="unavailable" && !retry){ pending[pid]=deepMerge(p,pending[pid]||{}); flushing[pid]=false; setTimeout(()=>flush(pid,true),800+Math.random()*700); return; }
    if(c==="invalid_argument"){ setReadOnly(true); toast("You can view this workspace but not edit it"); }
    else if(c==="quota_exceeded"){ toast("The workspace is full. Archive or delete old projects."); }
    else if(c==="revoked"){ setReadOnly(true); }
    else toast("Couldn't save. Check your connection and try again.");
    setSaved("Not saved");
  } finally { flushing[pid]=false; }
}
function patchFromPath(path,val){
  const ks=path.split("."); const out={}; let o=out;
  for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]={}; } o[ks[ks.length-1]]=val; return out;
}
function setLocal(path,val){
  const ks=path.split("."); let o=S;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=="object") o[ks[i]]={}; o=o[ks[i]]; }
  o[ks[ks.length-1]]=val;
}
function edit(path,val){
  const before = path.startsWith("metrics.") ? clone(S.metrics) : clone(get(path));
  setLocal(path,val);
  let patch;
  if(path.startsWith("metrics.")) patch={metrics:clone(S.metrics), cardUpdatedAt:new Date().toISOString()};
  else { patch=patchFromPath(path,val); if(path.startsWith("card.")) patch.cardUpdatedAt=new Date().toISOString(); }
  if(patch.cardUpdatedAt) S.cardUpdatedAt=patch.cardUpdatedAt;
  const st=stamp(); S.updatedAt=st.updatedAt; S.updatedBy=st.updatedBy;
  queuePatch(CUR, Object.assign(patch,st));
  bufferChange(CUR, path, before);
  // Typing is the ONLY continuous edit: it arrives one character at a time
  // and is not finished until focus leaves. Everything else -- a status
  // button, a dropdown, a date, a programmatic change -- is complete the
  // moment it happens, so it is described straight away.
  //
  // Expressed as "flush unless typing" rather than by listing the discrete
  // controls, because a list would need extending every time a control is
  // added, and the one that got missed would silently stop logging.
  if(!TYPING) flushChanges(CUR, path);
}

/* Changelog coalescing.

   One entry per completed edit, not per keystroke and not per save.

   Two earlier versions were wrong in instructive ways. Logging inside edit()
   wrote one entry per character: forty entries to record one sentence, burying
   the record it exists to document. Logging at save-flush was better but still
   split a sentence in two whenever the typist paused longer than the 550ms
   save debounce -- which is just "stopped to think mid-sentence", a completely
   normal thing to do.

   So the trigger is the edit being FINISHED, which for a text field means
   focus leaving it. Saving still debounces independently: data is written
   while you type, and the changelog describes what you wrote once you are
   done. The two concerns were conflated; they are now separate.

   Discrete controls -- a status button, a dropdown, a date picker -- are
   complete the moment they change, so they flush immediately. */
const changeBuf = {};

/* True only while an `input` event from a text field is being handled.
   Set around the edit() call in the input handler, nowhere else. */
let TYPING = false;
const setTyping = v => { TYPING = !!v; };

function bufferChange(pid, path, before){
  if(RO) return;
  const buf = changeBuf[pid] || (changeBuf[pid] = {});
  // Keep the earliest value only; later keystrokes are the same edit.
  if(!(path in buf)) buf[path] = before;
}

/* Write the entry for one path, or for every buffered path when no path is
   given. Called on blur, when leaving a view, and before the page unloads --
   anywhere an in-progress edit stops being in progress. */
function flushChanges(pid, path){
  const buf = changeBuf[pid];
  if(!buf) return;
  const paths = path ? (path in buf ? [path] : []) : Object.keys(buf);
  for(const key of paths){
    const before = buf[key];
    delete buf[key];
    const now = key.startsWith("metrics.") ? clone(S && S.metrics) : (S ? get(key) : undefined);
    logChange(pid, key, before, now, S);
  }
  if(!Object.keys(buf).length) delete changeBuf[pid];
}

/* Everything in flight, for every project. */
function flushAllChanges(){
  Object.keys(changeBuf).forEach(pid => flushChanges(pid));
}
function saveMetrics(){
  const now=new Date().toISOString(); S.cardUpdatedAt=now; const st=stamp(); Object.assign(S,st);
  queuePatch(CUR, Object.assign({metrics:clone(S.metrics), cardUpdatedAt:now}, st));
}
function writeLog(pid,text){ if(RO) return; STORE.log(pid,{at:new Date().toISOString(),by:ME.id||null,text}).catch(()=>{}); }

async function createProject(data,logText){
  if(RO) return null;
  const id=newId();
  try{
    await STORE.create(id,data);
    STORE.log(id,{at:new Date().toISOString(),by:ME.id||null,
      text:logText||"Project created", hash:contentHash(data)}).catch(()=>{});
    return id;
  }
  catch(e){ toast(e&&e.code==="quota_exceeded"?"The workspace is full. Archive or delete old projects.":"Couldn't create the project"); return null; }
}

/* ============================================================
   Changelog
   What changed, who changed it, when, and what the record hashed to
   afterwards.

   The audit log already existed, but it recorded prose: "Archived",
   "Project created". That answers "something happened" and not "what
   is different now", which is the question a reviewer asks six
   months later when a checkpoint decision is challenged.

   So every edit is described in the terms the user sees -- the
   criterion's own text, the checkpoint's title, the model-card
   field's label -- rather than as a state path. A reader should not
   have to know that `gates.B.decision` is Checkpoint B.

   Entries are written through the store's existing log, which means
   this works in all three backends rather than only the one with a
   database. The server additionally keeps full snapshots; see
   server/migrations/002_versions.sql.
   ============================================================ */

/* Human labels for state paths. Anything not matched here falls back
   to a cleaned-up path, so a new field still logs something useful
   rather than nothing. */
function describePath(path) {
  const parts = String(path).split(".");

  if (parts[0] === "items") {
    const id = parts[1];
    const item = (typeof allItems === "function" ? allItems() : []).find(i => i.id === id);
    const what = { status: "status", evidence: "evidence", owner: "owner", due: "due date" }[parts[2]] || parts[2];
    return item ? `${what} of “${item.text}”` : `${what} of criterion ${id}`;
  }

  if (parts[0] === "gates") {
    const gate = GATES[parts[1]];
    const what = { decision: "decision", by: "decided by", date: "decision date",
                   rationale: "rationale", conditions: "conditions" }[parts[2]] || parts[2];
    return gate ? `${what} for ${gate.title}` : `${what} for checkpoint ${parts[1]}`;
  }

  if (parts[0] === "card") {
    return `model card: ${CARD_LABEL[parts[1]] || parts[1]}`;
  }

  if (parts[0] === "optica" && parts[1] === "answers") {
    const key = parts[2];
    const item = (typeof OPTICA_ITEMS !== "undefined" ? OPTICA_ITEMS : []).find(i => i.key === key);
    const what = { status: "status", evidence: "evidence", owner: "owner",
                   due: "due date", declineReason: "reason for declining" }[parts[3]] || parts[3];
    return item ? `OPTICA ${item.num}: ${what}` : `OPTICA ${key}: ${what}`;
  }

  if (parts[0] === "meta") {
    const labels = { solution: "solution name", org: "organization", developer: "developer",
      sourcing: "sourcing", sponsor: "clinical sponsor", riskTier: "risk tier",
      reviewCadence: "review cadence", startDate: "review start date",
      reviewers: "review team", scope: "scope", chaiUseCase: "CHAI use case" };
    return labels[parts[1]] || parts[1];
  }

  if (parts[0] === "metrics") return "key metrics";
  if (parts[0] === "access") return "who has access";
  if (parts[0] === "archived") return "archived state";
  return parts.join(" › ");
}

/* Values as a reader would recognize them. Statuses get their label,
   long text is elided rather than dumped into a log line. */
function describeValue(path, value) {
  if (value === undefined || value === null || value === "") return "empty";
  if (typeof value === "boolean") return value ? "yes" : "no";
  if (Array.isArray(value)) return `${value.length} item${value.length === 1 ? "" : "s"}`;
  if (typeof value === "object") return "updated";

  const text = String(value);
  if (/\.status$/.test(path)) {
    return STATUS[text] || (typeof OPTICA_STATUS !== "undefined" ? OPTICA_STATUS[text] : "") || text;
  }
  return text.length > 60 ? `“${text.slice(0, 57)}…”` : `“${text}”`;
}

/* One log entry per edit, carrying enough to reconstruct what moved.
   `from` and `to` are kept as well as the prose, so a later version of
   this tool can render a better diff from old entries. */
function logChange(pid, path, from, to, doc) {
  if (RO) return;
  const same = JSON.stringify(from ?? null) === JSON.stringify(to ?? null);
  if (same) return;   // a save that changed nothing is not a change

  const entry = {
    at: new Date().toISOString(),
    by: ME.id || null,
    text: `Changed ${describePath(path)}: ${describeValue(path, from)} → ${describeValue(path, to)}`,
    change: {
      path,
      from: from === undefined ? null : from,
      to: to === undefined ? null : to,
    },
  };
  if (doc) entry.hash = contentHash(doc);
  STORE.log(pid, entry).catch(() => {});
}

/* Compare two whole documents and list what differs, for the version
   history where only snapshots are available. Returns leaf-level
   paths, which is the granularity a reviewer wants: "the decision
   changed", not "the gates object changed". */
function diffDocs(before, after, prefix = "", out = []) {
  const a = before && typeof before === "object" ? before : {};
  const b = after && typeof after === "object" ? after : {};
  for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) {
    if (CANON_SKIP.has(key)) continue;
    const path = prefix ? `${prefix}.${key}` : key;
    const av = a[key], bv = b[key];
    const bothObjects = av && bv && typeof av === "object" && typeof bv === "object"
      && !Array.isArray(av) && !Array.isArray(bv);
    if (bothObjects) diffDocs(av, bv, path, out);
    else if (JSON.stringify(av ?? null) !== JSON.stringify(bv ?? null)) {
      out.push({ path, from: av ?? null, to: bv ?? null });
    }
  }
  return out;
}

/* ============================================================
   Core: DOM helpers
   Form fields, focus preservation and small formatters. No
   knowledge of any framework.
   ============================================================ */
const get = (path)=> path.split(".").reduce((o,k)=>o==null?undefined:o[k], S);
function field(path,label,hint,long,opts,kind){
  const v=esc(get(path)||""); const id="f_"+path.replace(/\./g,"_");

  else if(long) input=`<textarea id="${id}" data-bind="${path}" rows="3">${v}</textarea>`;

  // to type YYYY-MM-DD invites 03/04/2026, which is two different dates
  // depending on where the reader is -- not a good property for the date a
  // governance decision was taken.
  else if(kind==="date") input=`<input type="date" id="${id}" data-bind="${path}" value="${v}">`;
  else input=`<input type="text" id="${id}" data-bind="${path}" value="${v}">`;

}

}
function focusKey(el){

  if(d.set) return `[data-set="${d.set}"][data-s="${d.s}"]`;
  if(d.gate) return `[data-gate="${d.gate}"][data-d="${CSS.escape(d.d)}"]`;
  if(d.toggle) return `[data-toggle="${d.toggle}"]`;

function barCls(p){ return p>=80?"":p>=50?"mid":"low"; }

/* ============================================================
   Framework registry
   A framework is a self-contained checklist: its own items, its own
   views, its own progress. Frameworks never read each other, and the
   app shell never names one. Adding a third means adding a directory
   under app/js/10-frameworks/ that calls registerFramework().

   The contract:
     id        string, stable, used in data keys and the DOM
     label     short display name
     enabled   (p) => bool    is it switched on for this project?
     views     (p) => [view]  rail entries, in order
     render    (view, p) => html
     blank     () => object   extra keys merged into a new project
     normalize (p) => void    repair shape on load; must be idempotent

   A view is {id, kind, label, num, meta, cls, sep}. The shell renders
   the rail from these fields alone; `kind` is the framework's own
   business and is passed back to render() untouched.
   ============================================================ */
const FRAMEWORKS = [];

function registerFramework(f) {
  if (FRAMEWORKS.some(x => x.id === f.id)) throw new Error(`framework ${f.id} already registered`);
  FRAMEWORKS.push(f);
  return f;
}

const frameworkById = id => FRAMEWORKS.find(f => f.id === id);

/* Frameworks switched on for a project. CHAI is always on: it is the
   spine the compliance status and the dashboard are computed from.
   Others are opt-in per project. */
function activeFrameworks(p) {
  const proj = p || S;
  return FRAMEWORKS.filter(f => { try { return f.enabled(proj); } catch (e) { return false; } });
}

/* Every rail entry, in framework registration order, each tagged with
   the framework that owns it so the shell can route back without a
   lookup table. */
function activeViews(p) {
  const proj = p || S;
  const all = activeFrameworks(proj).flatMap(f =>
    (f.views(proj) || []).map(v => ({ ...v, fw: f }))
  );
  // A view may declare `order: "end"` to sit after everything else, whichever
  // framework contributed it. Used by reference views -- the changelog is not
  // a step in the review and should not interrupt the numbered sequence.
  return [...all.filter(v => v.order !== "end"), ...all.filter(v => v.order === "end")];
}

const viewById = (id, p) => activeViews(p).find(v => v.id === id);

/* Extra top-level keys a new project needs. Existing projects without
   them stay valid: every framework's normalize() has to cope with its
   own keys being absent, which is what keeps old exports importable. */
function frameworkBlank() {
  return FRAMEWORKS.reduce((acc, f) => Object.assign(acc, f.blank ? f.blank() : {}), {});
}

function frameworkNormalize(p) {
  FRAMEWORKS.forEach(f => { if (f.normalize) f.normalize(p); });
  return p;
}

/* ============================================================
   Project setup
   The project itself: who is reviewing what, the history, and which
   optional frameworks are switched on. This is not CHAI's screen --
   it belongs to the project, which is why it lives outside the
   framework directories and registers first so it heads the rail.

   The compliance banner does read CHAI's flags(). That is deliberate
   and documented: CHAI is the spine the dashboard status comes from,
   and only one framework can own that. See docs/crosswalk.md.
   ============================================================ */
function frameworkToggles(){
  const optional = FRAMEWORKS.filter(f => f.id !== "chai" && f.id !== "project");
  if(!optional.length) return "";

    return `<li style="display:flex;align-items:center;gap:10px;padding:6px 0">

      <span><b>${esc(f.label)}</b> \u2014 ${on?"its views appear in the rail below CHAI's":"77 adoption questions, answered by five stakeholders"}</span>

  <ul class="ro-hide" style="list-style:none;padding:0;margin:0">${rows}</ul>`;
}

function renderSetup(){

  return `<p class="eyebrow">Before stage 1</p><h1>Project setup</h1>

    ${f.length?`<ul class="gaplist">${f.map(x=>`<li>${esc(x.text)}</li>`).join("")}</ul>`:""}</div>

registerFramework({
  id: "project",
  label: "Project",
  enabled: () => true,

/* Who holds what on this project. Owner-only to change, because
   granting access is itself a privilege. */
function accessHTML(){
  const a=accessOf(S), mine=roleOf(S), owner=canOwn(S);
  const rows=ROLES.flatMap(role=>a[role+"s"].map(id=>({id,role})));

  if(!identityKnown()){
    return `<h2>Access</h2>
    <div class="note"><p><b>Roles are not enforced in this view.</b> This browser
    has no signed-in user, so there is nobody to check a permission against.

    backend, or publish it as a shared artifact, for access control to mean
    anything.</p></div>`;
  }

  const list = rows.length
    ? `<table class="tbl"><thead><tr><th>Person</th><th>Role</th>${owner?"<th><span class=\"vh\">Change</span></th>":""}</tr></thead><tbody>
       ${rows.map(r=>`<tr>
         <td>${who(r.id)}${r.id===ME.id?" <span class=\"small\">(you)</span>":""}</td>
         <td>${owner?`<select data-role-for="${esc(r.id)}">${ROLES.map(x=>`<option value="${x}"${x===r.role?" selected":""}>${esc(ROLE_LABEL[x])}</option>`).join("")}</select>`:esc(ROLE_LABEL[r.role])}</td>
         ${owner?`<td><button class="icon-btn" data-revoke="${esc(r.id)}" aria-label="Remove access">Remove</button></td>`:""}
       </tr>`).join("")}</tbody></table>`
    : `<p style="font-size:13px;color:var(--muted)">No access list recorded, so this
       project is open to everyone in the workspace. Claim it to restrict who can
       change it.</p>`;

  return `<h2>Access</h2>
  <p style="font-size:13px;color:var(--muted)">Owners can delete, archive and change
  access. Writers can fill in the review. Readers can see it and change nothing.
  You are ${esc(mine?ROLE_LABEL[mine].toLowerCase():"not listed")} on this project.</p>
  ${list}
  ${owner?`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px">
    <div class="field" style="margin:0"><label for="grantWho">Add someone</label>
      <input type="text" id="grantWho" placeholder="Their user id" data-grant-id></div>
    <div class="field" style="margin:0"><label for="grantRole">Role</label>
      <select id="grantRole" data-grant-role>${ROLES.map(x=>`<option value="${x}">${esc(ROLE_LABEL[x])}</option>`).join("")}</select></div>
    <button class="btn" data-act="grant">Grant access</button>
  </div>`:""}
  ${unclaimed(S)&&identityKnown()?`<button class="btn primary" data-act="claim" style="margin-top:10px">Claim ownership</button>`:""}`;
}

/* ============================================================
   Changelog view
   The audit trail, rendered as what changed rather than that
   something did. Grouped by day, because "what happened at this
   meeting" is how a committee reads it.
   ============================================================ */
function changelogHTML(){
  const now = contentHash(S);

  if(!LOG.length){
    return `<p class="eyebrow">Audit trail</p><h1>Changelog</h1>
    <p class="lede">Every change to this record, with who made it and when.</p>
    <div class="note"><p>No changes recorded yet.</p></div>
    ${fingerprintHTML(now)}
    ${pager()}`;
  }

  // Group by calendar day. The log arrives newest-first and stays that way.
  const days = [];
  LOG.forEach(e=>{
    const day = (e.at||"").slice(0,10);
    const last = days[days.length-1];
    if(last && last.day===day) last.entries.push(e);
    else days.push({day, entries:[e]});
  });

  const rows = days.map(d=>`
    <h2 style="font-size:15px;margin:18px 0 6px">${esc(fmtDay(d.day)||"Undated")}</h2>
    <ul class="history">${d.entries.map(e=>{
      const c = e.change;
      const detail = c
        ? `<div class="small" style="color:var(--muted);margin-top:2px">
             <code>${esc(c.path)}</code></div>`
        : "";
      return `<li>
        <time>${esc((e.at||"").slice(11,16))}</time>
        <span>${esc(e.text)}
          <span style="color:var(--muted)">by ${who(e.by)}</span>
          ${e.hash?`<span class="small" style="color:var(--muted)" title="Record fingerprint after this change">\u00b7 ${esc(shortHash(e.hash))}</span>`:""}
          ${detail}</span>
      </li>`;}).join("")}</ul>`).join("");

  return `<p class="eyebrow">Audit trail</p><h1>Changelog</h1>
  <p class="lede">Every change to this record, with who made it and when.
  ${LOG.length>=60?"The newest 60 are shown; older entries stay in the store.":""}</p>
  ${rows}
  ${fingerprintHTML(now)}
  ${pager()}`;
}

/* The record's current fingerprint, with the caveat attached. A hash
   printed without saying what it proves will be read as proving more
   than it does. */
function fingerprintHTML(md5hex){
  return `<h2 style="font-size:15px;margin-top:22px">Record fingerprint</h2>
  <p style="font-size:13px;color:var(--muted)">A fingerprint of this record's
  contents right now. Quote it alongside an exported report to tie the report to
  the exact state it came from. Volatile fields, such as the last-saved
  timestamp, are excluded so the fingerprint only moves when something
  substantive does.</p>
  <p><code style="font-size:13px">MD5 ${esc(md5hex)}</code></p>
  <div class="note"><p><b>This detects change, not tampering.</b> MD5 has been
  collision-broken since 2004, and anyone who can edit the record can also
  recompute its fingerprint. It answers "is this the same version?" and must not
  be offered as evidence that a record was not altered. A SHA-256 travels in the
  JSON export for anyone who needs the stronger property.</p></div>`;
}

const CHAI_TE = {"Ambient-AI":{"label":"Ambient documentation","url":"https://rai-content.chai.org/en/latest/Ambient-AI/t%26e-framework.html","metrics":[{"name":"AI-Generated Documentation Conciseness / Length Change","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability","benchmark":"External pass/fail threshold not established. Use clinician-written or finalized notes as the local baseline. Report: Length Change = (AI note word count - physician note word count) / physician note word count, plus clinician-rated conciseness. Flag material length increases for qualitative review, especially if conciseness ratings drop or added content does not improve completeness or correctness.","description":"Measures whether AI-generated clinical notes or summaries are longer, shorter, or comparable in length to clinician-written notes. Documentation length should be treated as a usability and quality-risk signal, not as proof that a note is better. Longer notes may capture more detail, but they can also add review burden, note bloat, and make clinically relevant information harder to find.","intended_use":"To monitor whether ambient AI creates documentation that is too long, redundant, or difficult to review, especially when added detail does not clearly improve clinical completeness or usefulness."},{"name":"Clinician Work Satisfaction Improvement","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability","benchmark":"Per the Supporting Literature, benchmark as a statistically significant improvement in clinician-reported satisfaction from baseline to post-implementation, measured with a named, validated instrument rather than an ad hoc item. Recommended instruments: the AMA Mini-Z 2.0 satisfaction items or the Stanford Professional Fulfillment Index (PFI) professional-fulfillment subscale. Report mean pre-post change, response rate, and subgroup results by specialty or usage intensity where available.","description":"Measures change in clinician satisfaction at work after implementation of an ambient AI documentation platform. This captures whether the tool improves day-to-day clinical work, even when objective EHR time savings are modest or uneven across clinicians.","intended_use":"To evaluate whether ambient AI improves clinician experience enough to support sustainable adoption, while still keeping documentation accuracy and safety as separate evaluation requirements."},{"name":"Clinician Preference for AI-Generated Clinical Summaries","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"Per the Supporting Literature, AI-generated summaries should be preferred by clinicians in >50% of blinded head-to-head comparisons against clinician-written summaries. Report as: Preference Rate = (# AI summaries preferred) / (# total paired comparisons), and report correctness, completeness, and safety separately.","description":"Measures the proportion of clinician reviewers who prefer AI-generated clinical summaries over clinician-written summaries when both are evaluated side-by-side under blinded or structured review conditions. Preference can show usefulness and acceptance, but it should not be used as a proxy for clinical correctness, safety, or downstream patient benefit.","intended_use":"To assess whether clinicians find AI-generated summaries useful enough for real documentation workflows, while separately checking whether those summaries are accurate, complete, and safe."},{"name":"Documentation Efficiency Improvement","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"Per the Supporting Literature, benchmark as approximately >=15% reduction, or >=0.9 minutes saved, in documentation time per appointment relative to pre-deployment baseline across a representative clinician sample. Compute as: ((baseline time - post-deployment time) / baseline time).","description":"Quantifies the change in clinician documentation time per appointment after implementation of an ambient AI documentation system. This should include objective EHR time measures when available and should be interpreted together with clinician review burden, note quality, and safety-error rates.","intended_use":"To measure whether ambient AI reduces real documentation workload in clinical settings without treating time savings alone as evidence of a better or safer documentation process."},{"name":"Patient-Clinician Engagement Improvement","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"External pass/fail threshold not established. Use positive change in patient or clinician-reported attention, communication, or engagement as the primary benchmark. As a study-derived reference point, Shah et al. reported 68% positive physician comments for patient engagement, so results near or below that level should be reviewed with qualitative feedback and patient survey data.","description":"Measures whether ambient AI documentation improves the patient-clinician interaction by reducing the need for clinicians to type, navigate the EHR, or divide attention during the visit. This can be assessed through patient surveys, clinician surveys, observation, or qualitative interviews.","intended_use":"To evaluate whether ambient AI improves the encounter experience, not just documentation throughput or time spent in the EHR."},{"name":"Reduction in Cognitive Task Load (NASA-TLX Change)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, Efficacy","benchmark":"Per the Supporting Literature, benchmark as statistically significant reduction in the NASA-TLX domains used for documentation workload. For operational monitoring, target >=20% relative reduction in the audited workload domain without increased documentation error burden. Compute as: (baseline TLX - post TLX) / baseline TLX.","description":"Measures the pre- to post-deployment change in clinician cognitive workload using the NASA Task Load Index (NASA-TLX) for documentation tasks supported by ambient AI. A larger decrease indicates lower mental demand, effort, and temporal pressure during documentation.","intended_use":"To assess whether ambient AI meaningfully lowers the cognitive load of clinical documentation, rather than only shifting work from note-writing to note-review."},{"name":"Same-Day Note Closure Rate Increase","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"Per the Supporting Literature, benchmark as an increase of about >=6 percentage points, or >=9% relative improvement, in same-day note closure compared with baseline. Compute as: post-AI same-day documentation rate - pre-AI same-day documentation rate.","description":"Measures the change in the percentage of clinical encounters where documentation is completed on the same day of service after the introduction of an ambient AI. Same-day completion can reflect improved workflow fit, but should be interpreted alongside note quality and clinician review requirements.","intended_use":"To quantify whether ambient AI reduces documentation delays that contribute to clinician workload, delayed chart completion, and weaker continuity of care."},{"name":"Automatic Speech Recognition (ASR) Demographic Word Error Parity (DWEP)","cat":"Fairness & equity","principle":"Fairness, Bias Management","benchmark":"No universal clinical cut point is established. Report max absolute WER gap and WER ratio across demographic subgroups. Use <=0.10 absolute WER gap as a practical remediation trigger for key groups, and require subgroup review when one group has materially higher WER than the best-performing group.","description":"Measures parity in transcription word error rates (WER) across demographic subgroups relevant to ambient AI documentation, such as race, language, dialect, accent, age cohort, or speaker role. Compute WER for each subgroup and assess whether disparities exceed a pre-specified threshold.","intended_use":"To assess whether the speech recognition component of ambient AI captures diverse patient and clinician speech with comparable accuracy, since transcription disparities can carry forward into the clinical note."},{"name":"Cross-Demographic Automatic Speech Recognition (ASR) Gender & Accent Error Gap (CDAEG)","cat":"Fairness & equity","principle":"Fairness, Bias Management","benchmark":"No universal clinical cut point is established. Report max WER gap across defined gender, dialect, and accent groups. Use <=0.15 max WER gap as a practical internal guardrail, with remediation required when the gap is exceeded or concentrated in a protected or clinically important subgroup. Compute as: CDAEG = max(|WER_group_i - WER_group_j|).","description":"Measures absolute differences in ASR word error rates (WER) across key demographic categories such as gender, dialect, and accent groups. Compute WER for each subgroup and calculate the maximum observed gap. A smaller gap indicates more equitable transcription performance.","intended_use":"To detect systematic disparities in speech transcription quality that could affect the fairness and reliability of downstream ambient AI documentation."},{"name":"Demographic Transcription Equity Rate (DTER)","cat":"Fairness & equity","principle":"Fairness, Bias Management","benchmark":"No universal clinical cut point is established. per the Supporting Literature, use DTER >=0.90 as an internal equity guardrail across defined demographic pairs, such as Black vs White speakers or gender groups. Compute as: DTER = min(subgroup transcription accuracy) / max(subgroup transcription accuracy).","description":"Measures parity in automatic speech recognition (ASR) accuracy across protected or operationally relevant demographic groups, such as race, ethnicity, age, gender, dialect, or accent. Compute WER or a similar transcription accuracy measure for each group and report the minimum accuracy ratio relative to the best-performing group.","intended_use":"To evaluate whether an ambient AI documentation system transcribes speech with similar accuracy across diverse speakers, reducing inequitable errors in clinical records."},{"name":"Contextual and Relationship-Building Omission Rate","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No universal benchmark is established. Compute as: (# important contextual elements omitted from AI note) / (# important contextual elements present in transcript or reference documentation). Target a downward trend over time and manually review all omitted contextual elements classified as clinically or relationally important.","description":"Measures the proportion of AI-generated notes that omit non-clinical but contextually important patient information, such as social context, patient concerns, relationship-building details, or longitudinal information that may matter for continuity of care. This should be evaluated separately from biomedical omissions because information that appears nonessential may still support trust, adherence, and follow-up.","intended_use":"To assess whether ambient AI remove context that clinicians consider important for patient-centered care or longitudinal care planning."},{"name":"Audio and Transcript Data Retention Control Assessment","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No quantitative benchmark is established. Pre-implementation pass condition is documented retention period, deletion process, access control, model-training restriction, patient opt-out or consent workflow, and legal/privacy approval. Because vendor retention practices vary widely and are sometimes undisclosed (e.g., audio from immediate deletion to ~90 days; transcripts from 7 days to \"never delete\"), recommend the approved retention/deletion policy to be evidenced by primary-source documentation (configuration export, contract language) rather than vendor attestation alone. Post-deployment audits — including periodic independent third-party audit — should verify that vendor and local workflows match the approved policy on a continuous basis.","description":"Evaluates whether an ambient AI scribes minimizes storage of session audio and transcripts and gives the organization clear control over retention duration, deletion, and secondary use. Assessment should use vendor documentation, contracts, and configuration review.","intended_use":"To confirm that ambient AI scribes follow data minimization practices and reduce exposure of sensitive audio, transcript, and clinical information."},{"name":"Clinical Summary Completeness and Correctness Non-Inferiority","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"Per the Supporting Literature, AI-generated summaries should be statistically non-inferior to physician-written summaries on completeness and correctness ratings, using a pre-specified non-inferiority margin. If using a 5-point Likert quality scale, report mean score difference and confidence interval, and separately report conciseness because non-inferiority on completeness and correctness does not guarantee brevity.","description":"Evaluates whether AI-generated clinical summaries are non-inferior to clinician-written summaries on completeness and correctness. Completeness measures whether relevant clinical information is included. Correctness measures whether included information is factually and clinically accurate. Ratings should be performed by blinded clinician reviewers using a structured rubric or Likert scale.","intended_use":"To determine whether AI-generated summaries preserve core clinical content quality before being used in documentation, handoff, review, or patient-care workflows."},{"name":"Clinical Note Safety Error Rate (CNSER)","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No validated universal threshold is established. Before go-live, notes should be clinician-reviewed and the uncorrected draft error burden should be materially below the simulated-platform reference point of 3.0 moderate-to-severe harm-potential errors per case. Any moderate-to-severe harm-potential error found in a finalized note should trigger safety review.","description":"Measures the rate of clinically relevant content errors in AI-generated clinical documentation that have potential to cause moderate-to-severe patient harm, based on standardized error classification against professional transcriptions and expert review. A lower CNSER indicates safer and more reliable ambient AI output.","intended_use":"To quantify real-world safety risk in ambient AI clinical documentation by identifying how often the system introduces or preserves errors with potential clinical harm."},{"name":"Clinically Significant Error Proportion (CSEP)","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No validated universal threshold is established. Report the share of notes with at least one clinically significant error and compare against the simulated ambient-scribe reference finding of 26.3% mean key-element error rate. For finalized notes, target zero known clinically significant errors at sign-off and investigate any recurring error pattern.","description":"Measures the proportion of ambient AI-generated clinical notes that contain at least one clinically significant documentation error, where errors are identified through professional review and classified as having potential to affect patient care. A lower CSEP reflects stronger documentation safety.","intended_use":"To evaluate whether ambient AI documentation systems produce clinically safe outputs by measuring meaningful documentation errors rather than generic typo or formatting counts."},{"name":"Informed Consent and Documentation Review Compliance Rate","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"Benchmark as 100% audited compliance for encounters where ambient recording is used: patient notice or consent documented before use, consent exceptions recorded where allowed by policy, and clinician review completed before note finalization. As needed, retain per-encounter evidence (consent/notice record, any consent exception, and review-completed flag) sufficient to reconstruct, after the fact, that consent and review obligations were met for a specific encounter.","description":"Measures whether clinicians using an AI scribe have a documented process for obtaining informed consent before recording sessions and for reviewing, editing, and signing AI-generated clinical notes before they are finalized in the health record. Assessment should use policy review, workflow review, and audit logs where available.","intended_use":"To verify that ambient AI scribes are deployed with basic safeguards for patient awareness, consent, and clinician oversight."},{"name":"Usability-Adjusted Safety Reliability Score (UASRS)","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"UASRS is an internal composite, not an externally validated benchmark. If used, require SUS >=68 or the organization-specific usability target, plus non-worsening after-hours documentation work. Report SUS, after-hours work change, and safety-error measures separately so the composite does not hide poor performance in any component.","description":"A composite metric combining System Usability Scale (SUS) scores with after-hours documentation burden change to evaluate whether ambient AI is both usable and operationally safe in clinical workflow. SUS captures perceived usability; after-hours burden reduction captures whether the tool reduces delayed work rather than pushing effort later.","intended_use":"To assess whether ambient AI can be integrated into clinical workflow without creating usability friction, delayed review work, or fatigue that could indirectly affect safety."},{"name":"Medical Term Recall Rate","cat":"Safety & reliability","principle":"Safety","benchmark":"No universal threshold is established. Evaluate against human-annotated clinical transcripts and report recall for diagnoses, medications, procedures, labs, symptoms, and allergies separately. Use >=0.90 as a local pre-deployment target only when annotation quality is high, and escalate any missed high-risk medication, allergy, diagnosis, or follow-up instruction.","description":"Measures the fraction of clinically relevant medical terms in the reference transcript that are correctly captured by the AI system. These terms may include diagnoses, medications, procedures, symptoms, labs, and other details that are important for safe clinical documentation.","intended_use":"To evaluate how accurately an ambient AI transcription or documentation system captures medically meaningful language before that content is used to generate clinical notes."},{"name":"Clinician Review and Sign-Off Enforcement Rate","cat":"Safety & reliability","principle":"Safety","benchmark":"Benchmark as 100% of AI-generated clinical notes requiring clinician review, editing where needed, and sign-off before finalization in the medical record. Verify using workflow configuration and audit logs, and measure the enforcement rate longitudinally (not only at go-live) with per-encounter evidence retained for reconstruction.","description":"Assesses whether AI-generated clinical notes require mandatory clinician review, editing, and sign-off before being finalized in the medical record, verified through workflow configuration review and audit logs.","intended_use":"To ensure that clinical responsibility and accountability remain with licensed clinicians when using ambient AI scribes."},{"name":"Per-Encounter Control Evidence Retention","cat":"Safety & reliability","principle":"Safety, Reliability","benchmark":"No quantitative benchmark established. Pass condition is a retention design under which the listed per-encounter control evidence is captured, tamper-evident, and retrievable for the organization's defined retention window; verify by audit.","description":"Assesses whether, for each encounter, the developer/implementer retains sufficient evidence to reconstruct which safety-critical controls were in force — consent scope and notice, clinician review/sign-off, retention/deletion actions, PHI-handling configuration, and the model/version and guardrail settings applied.","intended_use":"Support post-event review, root-cause analysis, and litigation defense, given active ambient documentation litigation and narrowing AI insurance coverage."},{"name":"LLM Training Data Use Disclosure and Control Assessment","cat":"Safety & reliability","principle":"Privacy","benchmark":"No quantitative benchmark is established. Pass condition is written vendor disclosure covering secondary data use, model training, retention, deletion, opt-out or restriction controls, and contract language prohibiting model training on clinical data unless explicitly approved by the deploying organization.","description":"Evaluates whether the AI scribe vendor discloses whether session data are used for model training, whether such use is opt-in or opt-out, and whether the organization can restrict secondary data use. Assessment should use vendor policy, contract language, and configuration review.","intended_use":"To ensure transparency and organizational control over secondary use of sensitive clinical data in ambient AI systems."},{"name":"PHI Redaction / Output Guardrail Verification","cat":"Safety & reliability","principle":"Privacy","benchmark":"No universal threshold established. Test against representative samples; report detected PHI-exposure incidents and confirm guardrails were active per encounter where feasible.","description":"Verifies that PHI redaction or output guardrails are active and effective — e.g., that PHI is appropriately handled at output and unintended PHI exposure is detected.","intended_use":"Confirm privacy guardrails operate in real use, not just in vendor claims."},{"name":"Data Residency & Sub-Processor Control","cat":"Safety & reliability","principle":"Privacy","benchmark":"No quantitative benchmark. Pass condition is documented data-flow/sub-processor inventory plus audit evidence (logs, attestations, or third-party audit) that data remained within declared boundaries.","description":"Evaluates evidence that session data did not leave declared geographies or approved sub-processors.","intended_use":"Confirm contractual and regulatory data-locality commitments are honored in practice."},{"name":"Per-Encounter Consent Scope Evidence","cat":"Safety & reliability","principle":"Privacy","benchmark":"Recorded encounters have retrievable, per-encounter consent-scope evidence consistent with applicable state all-party consent and CMIA-type requirements.","description":"Verifies that the consent scope actually obtained (e.g., all-party recording consent where required) is recorded and retrievable per encounter, and matches what was relied upon for recording and transmission.","intended_use":"Ensure recording and vendor transmission stay within the consent granted, and to enable reconstruction of consent scope after the fact."},{"name":"Incremental Cost-Effectiveness Ratio (ICER), $/QALY","cat":"Usefulness, usability & efficacy","principle":"Financial","benchmark":"Benchmark ICER against the organization or payer decision threshold. For US-facing evaluation, $50,000-$150,000 per QALY gained is a common reference range, but it should not be treated as universal. Report all AI implementation, maintenance, monitoring, and clinician review costs used in the calculation.","description":"ICER quantifies the additional cost required to gain one additional quality-adjusted life year (QALY) when adopting an AI system versus standard of care: ICER = (Cost_AI - Cost_SOC) / (QALY_AI - QALY_SOC).","intended_use":"To determine whether deploying an AI system is economically justified relative to alternatives, while avoiding claims of patient outcome improvement unless QALY or outcome gains are directly measured."},{"name":"Weekly Relative Value Units (RVU) Uplift (% change)","cat":"Usefulness, usability & efficacy","principle":"Financial","benchmark":"Per the Supporting Literature, benchmark as >=+5.8% weekly RVU increase or about +1.81 RVUs per clinician per week, compared with matched controls or local baseline. Report productivity gains alongside note quality, safety review burden, and clinician workload.","description":"Percent change in clinician weekly relative value units (RVUs) after ambient AI scribe access compared with baseline or controls. RVUs represent billable clinical output and are a standard health system revenue metric.","intended_use":"To quantify whether ambient AI documentation systems are associated with measurable financial productivity gains, while still monitoring documentation quality, patient safety, and clinician review burden."},{"name":"Weekly Encounter Volume Uplift (% change)","cat":"Usefulness, usability & efficacy","principle":"Financial","benchmark":"Per the Supporting Literature, benchmark as >=+2.8% encounters per week or about +0.80 encounters per clinician per week, compared with matched controls or local baseline. Interpret as throughput only, not as evidence of improved care quality.","description":"Percent change in clinician encounters per week after ambient AI scribe adoption compared with baseline or controls. This captures operational throughput but does not by itself establish improved care quality.","intended_use":"To quantify whether ambient scribe deployment is associated with increased clinical capacity or throughput."},{"name":"Documentation Time Reduction (minutes/day)","cat":"Usefulness, usability & efficacy","principle":"Business","benchmark":"Per the Supporting Literature, benchmark as >=19.95 minutes/day reduction in total EHR time after implementation versus baseline. Report total EHR time, note time, after-hours time, and adoption rate because time savings can vary with use intensity.","description":"Median change in total EHR time per day after ambient scribe introduction. Time saved can support ROI modeling, but it should not be treated as sufficient evidence of safety, quality, or patient benefit.","intended_use":"To support ROI modeling for ambient scribes using measurable clinician time savings."}]},"agentic":{"label":"Agentic AI","url":"https://rai-content.chai.org/en/latest/agentic/t%26e-framework.html","metrics":[{"name":"Autonomy Index (AIx)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"No universal AIx threshold is reported in the cited literature. Report the study-defined AIx value by task domain, model architecture, and autonomy level, with unsafe, policy-violating, or incorrectly completed autonomous steps reported separately.","description":"A standardized metric quantifying how much of a predefined workflow the agent completes correctly without direct human intervention, while staying within defined oversight, permission, and safety boundaries. It is measured as the fraction of reference task steps (defined by expert review or a set of acceptable plans rather than a single canonical path) completed independently and correctly when the study or evaluation suite defines those steps.","intended_use":"Evaluate whether an agentic AI system can handle delegated portions of a multi-step workflow while preserving appropriate escalation paths, correctness checks, and human control points."},{"name":"Evaluation Dimension Coverage","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited review reports technical metrics in 83% of studies, human-centered assessments in 30%, safety assessments in 53%, economic assessments in 30%, and both technical and human dimensions in 15%. No BECS score or 0-1 threshold is reported.","description":"Measures whether an evaluation protocol covers the dimensions identified in the cited agent evaluation literature, including task completion, trajectory or behavior quality, tool use, reliability, safety, human-centered factors, latency, and economic assessment. The cited systematic review reports that technical metrics dominate current evaluations while human-centered, safety, and economic assessments are less frequently included.","intended_use":"Evaluate whether the assessment plan for an agentic AI system includes the evaluation dimensions needed for deployment decisions, rather than relying only on final-answer or task-success metrics."},{"name":"Goal Completion Rate (GCR)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"AlShikh et al. report an average GCR of 88.8% for the Hybrid Agent in their simulated multi-domain experiment. tau-bench reports that state-of-the-art function calling agents such as gpt-4o succeed on fewer than 50% of tasks and that pass^8 is below 25% in retail. ST-WebAgentBench reports Completion under Policy separately from raw task success.","description":"The proportion of tasks where an agentic system successfully achieves the intended user or system goal in a multi-step environment. A task is successful if the final outcome and, where applicable, the final environment state align with a predefined ground-truth objective or expert-defined target state without unsafe, unauthorized, or policy-violating actions.","intended_use":"Quantitatively assess whether autonomous agentic AI delivers intended outcomes across open-ended, multi-step tasks in realistic workflows. GCR should be reported with trajectory, policy-compliance, and safety metrics because final success alone can hide risky intermediate behavior."},{"name":"Task Success Rate in Multi-Step Clinical Agent Tasks (MedAgentBench)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"MedAgentBench reports 300 patient-specific clinically derived tasks from 10 categories, with Claude 3.5 Sonnet v2 achieving a 69.67% success rate. PhysicianBench reports 100 long-horizon EHR tasks with 670 structured checkpoints, with the best-performing model achieving 46% pass@1 and open-source models reaching at most 19%.","description":"Measures how consistently an agentic AI completes complex, clinically meaningful tasks in a realistic virtual EHR environment. Success is defined as correctly completing clinician-specified task goals involving retrieval, reasoning, and action execution in a standardized FHIR-compliant setting.","intended_use":"Evaluate whether an agentic AI system can reliably execute goal-directed clinical workflows rather than producing isolated medical answers. A major value of agents is crossing system boundaries; where possible, the simulation should occur within the EHR plus all relevant external systems — including wearables, patient voice communication, and external documents."},{"name":"Task Success Rate in WebArena Autonomous Task Benchmark","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"WebArena reports that the best GPT-4-based agent achieved 14.41% end-to-end task success, compared with 78.24% human performance. ST-WebAgentBench evaluates 222 policy-paired tasks and reports Completion under Policy and Risk Ratio rather than a universal 50% target.","description":"Measures the percentage of autonomous tasks successfully completed by an agent in a realistic web environment. Tasks span domains such as e-commerce actions, forum interactions, collaborative content management, and browsing activities. Success is defined as correct end-to-end task completion, not just isolated steps.","intended_use":"Evaluate whether an agentic AI can function reliably in real-world environments requiring planning, tool use, state tracking, and sequential decision-making. Use alongside policy-compliance and safety metrics when the environment includes rules, permissions, or enterprise constraints."},{"name":"User Satisfaction and Human-Centered Feedback Measures","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"The cited review reports human-centered assessments in 30% of studies and both technical and human dimensions in 15%. No CSAT >= 80%, NPS, or USS >= 0.8 threshold is reported.","description":"Captures whether the evaluation includes user-facing measures such as satisfaction, perceived usefulness, workload, usability, or structured qualitative feedback. The cited review identifies human-centered assessment as underrepresented in agentic AI evaluations, rather than reporting a universal CSAT or NPS threshold.","intended_use":"Evaluate whether the agent's outputs and behaviors are assessed from the user perspective and identify usability issues that technical benchmarks miss. User feedback should be interpreted alongside correctness, safety, and policy adherence, not as a substitute for them. Satisfaction is dynamic, and because of hedonic adaptation, it should be measured longitudinally rather than at a single point."},{"name":"End-to-End Clinical Agent Response Latency (seconds)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"Observed end-to-end response time ranged from 5 to 7 seconds under live deployment conditions.","description":"Measures elapsed time between user case submission and receipt of AI-generated case-specific psychological first aid recommendations in a deployed recommendation app for rescue and first responders. The study reports live-system response times rather than simulated inference-only latency.","intended_use":"Evaluate whether a deployed clinical or emergency-response recommendation agent returns outputs quickly enough for operational use and monitor whether infrastructure delay changes after deployment."},{"name":"Triage Appropriateness Rate","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"AI-assisted triage accuracy was 89.3% compared with 74.7% for traditional triage, p < 0.001.","description":"Measures the proportion of AI-assisted emergency triage decisions that correctly prioritized patient urgency compared with traditional triage and clinical outcome assessment. The study compared 150 AI-assisted triage cases with 150 traditional triage cases.","intended_use":"Evaluate whether an AI triage tool assigns patients to appropriate urgency levels before integration into emergency department workflows."},{"name":"Summarization Editing Effort Reduction","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"LLM-generated hospital course drafts required 31.5% mean editing compared with 44.8% for physician-generated drafts.","description":"Measures editing effort required for resident physicians to revise large language model-generated hospital course summaries compared with physician-generated summaries. Editing effort was reported as the mean percentage of text changed during revision toward a predefined quality standard.","intended_use":"Evaluate whether EHR-based summarization reduces physician editing burden while preserving hospital course summary quality requirements."},{"name":"Proportion of Errors Auto-Corrected","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, and Efficacy","benchmark":"Human experts confirmed 263 of 316 AI Checker-flagged mistakes as actual mistakes, giving 83.2% precision. The AI Checker proposed correct fixes for 75.8% of identified mistakes.","description":"Measures the share of objective mistakes identified in published AI papers for which an AI checker proposed a correct fix. The cited paper evaluates paper-level research integrity checking, not clinical documentation correction.","intended_use":"Evaluate automated error-detection workflows where a system flags objective errors and proposes corrections
