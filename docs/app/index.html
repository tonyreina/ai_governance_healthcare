.flags li::before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.flags li.red::before{background:var(--red)}
.empty-state{border:1px dashed var(--rule);border-radius:10px;padding:28px;text-align:left;max-width:640px;margin:20px 0}
.empty-state p{margin:0 0 14px;color:var(--muted)}

/* lifecycle track */
.lc{display:flex;align-items:center;gap:4px;margin-top:2px}
.lc .pip{width:18px;height:18px;border:1.5px solid var(--rule);border-radius:3px;display:flex;align-items:center;justify-content:center;font:700 10px/1 var(--display);color:var(--muted);position:relative;overflow:hidden;background:var(--surface)}
.lc .pip i{position:absolute;left:0;bottom:0;width:100%;background:var(--teal);opacity:.28}
.lc .pip.full{border-color:var(--teal);color:var(--teal)}
.lc .pip.cur{border-color:var(--ink);color:var(--ink)}
.lc .gd{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--rule);flex:0 0 auto}
.lc .gd.go{background:var(--teal);border-color:var(--teal)}
.lc .gd.cond{background:var(--amber);border-color:var(--amber)}
.lc .gd.stop{background:var(--red);border-color:var(--red)}
.lc-label{font-size:12.5px;color:var(--muted);margin-top:4px}

.signed{font-size:13px;color:var(--muted);margin:14px 0 0}
.history{list-style:none;margin:0;padding:0;max-width:820px;font-size:13.5px;border-top:1px solid var(--rule)}
.history li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule)}
.history time{color:var(--muted);font-variant-numeric:tabular-nums}
/* Standing warning for the browser-only storage mode. Not dismissible: it
   describes a property of where the data is going, which does not stop being
   true because somebody clicked an x. */
#signOut{margin-left:8px;text-decoration:none}
body.locked > *:not(#lockScreen){display:none!important}
#lockScreen{position:fixed;inset:0;z-index:1000;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
#lockScreen .lock-card{max-width:440px;text-align:left}
#lockScreen h1{margin:0 0 8px}
.storage-warning{background:var(--amber-soft);border-bottom:1px solid var(--amber);color:var(--ink);padding:8px 18px;font-size:13px;line-height:1.45;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.storage-warning b{color:var(--amber)}
.storage-warning .sw-detail{color:var(--muted)}
@media print{.storage-warning{display:none}}
.banner{background:var(--teal-soft);border-left:3px solid var(--teal);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
body.ro .ro-hide{display:none!important}

@media (max-width:980px){
  .phead{display:none}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
  .prow > :nth-child(1){grid-column:1/-1}
  .prow > :nth-child(5){grid-column:1/-1}
}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(19,35,58,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px 22px;max-width:480px;width:100%;box-shadow:0 18px 50px rgba(19,35,58,.25)}
.modal p{font-size:14px;line-height:1.5}
.modal label{display:block;font-size:13px;font-weight:600;margin-top:12px}
.modal input{width:100%;margin-top:6px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;background:var(--paper);color:var(--ink)}
.modal .btn.danger[disabled]{opacity:.45;cursor:not-allowed}
@media print{.modal-backdrop{display:none!important}}
</style>

/* ============================================================
   Utilities
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => o==null ? o : JSON.parse(JSON.stringify(o));
const isObj = v => v && typeof v==="object" && !Array.isArray(v);
/* Keys that reach an object's prototype instead of a property of its own. JSON.parse
   makes "__proto__" an ordinary own key, so a document that carries one would, on a
   naive merge or path assignment, write into Object.prototype for every object on the
   page (CodeQL js/prototype-pollution-utility, #124). Every helper that walks or
   writes by key skips them. */
const UNSAFE_KEYS = Object.freeze(new Set(["__proto__", "constructor", "prototype"]));
const safeKey = k => !UNSAFE_KEYS.has(k);
function deepMerge(t,src){ for(const k in src){ if(!Object.hasOwn(src,k) || !safeKey(k)) continue; if(isObj(src[k]) && isObj(t[k])) deepMerge(t[k],src[k]); else t[k]=clone(src[k]); } return t; }
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const TODAY = ()=> ymd(new Date());
function parseDay(s){ if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const d=new Date(s.slice(0,10)+"T00:00:00"); return isNaN(d)?null:d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
/* Dates and relative times in the reader's chosen language (02-i18n.js), not the
   browser's, so the text around a date and the date itself cannot disagree. */
function fmtDay(s){ const d=parseDay(s); return d? new Intl.DateTimeFormat(intlTag(),{year:"numeric",month:"short",day:"numeric"}).format(d) : ""; }
function ago(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; const m=Math.round((Date.now()-d)/60000);
  const rel=new Intl.RelativeTimeFormat(intlTag(),{numeric:"auto"});
  if(m<1) return rel.format(0,"minute"); if(m<60) return rel.format(-m,"minute"); const h=Math.round(m/60); if(h<24) return rel.format(-h,"hour"); const dd=Math.round(h/24); if(dd<45) return rel.format(-dd,"day"); return fmtDay(iso.slice(0,10)); }
let _idSeq = 0;
const newId = ()=> "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+(_idSeq++).toString(36);

/* ============================================================
   Core: languages (#80)
   Every string a person reads comes from a message catalog, app/i18n/<locale>.json,
   embedded by the build as I18N_CATALOGS. English is the source; a key missing from
   another catalog falls back to it. t() returns plain text: callers still esc() it
   into markup, and a catalog never holds HTML.

   Safety-bearing strings (the patient-data notice, the storage-mode banners, listed
   under "@meta".safety in en.json) are shown in English until a reviewer fluent in
   the language is recorded for them in that catalog's "@meta".reviewers. A wrong
   translation of a warning is worse than an English one (D-59).
   ============================================================ */
const Locale = Object.freeze({
  EN: "en", ES: "es", FR: "fr", DE: "de", HI: "hi", RU: "ru", ZH_HANS: "zh-Hans",
  PSEUDO: "en-XA",   // accented and padded English: shows what is still hard-coded
});
/* What the picker offers, each named in its own language. PSEUDO is not offered. */
const LOCALE_CHOICES = Object.freeze([
  Locale.EN, Locale.ES, Locale.FR, Locale.DE, Locale.HI, Locale.RU, Locale.ZH_HANS,
]);
const LOCALE_KEY = "chai-locale";
/* The header's language picker, by element id, for the input handler. */
const HeaderControl = Object.freeze({ LANGUAGE: "lang" });

const catalogOf = loc => I18N_CATALOGS[loc] || null;
const SAFETY_KEYS = new Set(((I18N_CATALOGS[Locale.EN]["@meta"] || {}).safety) || []);

function isLocale(v){ return Object.values(Locale).includes(v); }

/* A saved choice, then the browser's languages, then English. zh-TW and zh-HK are
   Traditional Chinese, which this does not have, so they do not match zh-Hans. */
function resolveLocale(){
  try{ const saved = localStorage.getItem(LOCALE_KEY); if(isLocale(saved)) return saved; }catch(e){}
  const wanted = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
  for(const raw of wanted){
    const tag = String(raw || "").toLowerCase();
    if(/^zh(-hans|-cn|-sg|$)/.test(tag) || tag.startsWith("zh-hans")) return Locale.ZH_HANS;  // enum-ok: BCP 47 subtags from navigator.languages
    if(tag.startsWith("zh")) continue;  // enum-ok: BCP 47 subtag; Traditional Chinese is not offered
    const primary = tag.split("-")[0];
    const hit = LOCALE_CHOICES.find(l => l === primary);
    if(hit) return hit;
  }
  return Locale.EN;
}
let LOCALE = resolveLocale();

/* The tag Intl understands for the current locale. */
const intlTag = () => (LOCALE === Locale.PSEUDO ? Locale.EN : LOCALE);

/* Accented, bracketed and about a third longer, with {placeholders} left intact. */
const PSEUDO_MAP = Object.freeze({a:"á",b:"ƀ",c:"ç",d:"đ",e:"é",f:"ƒ",g:"ĝ",h:"ĥ",i:"í",j:"ĵ",k:"ķ",l:"ĺ",
  m:"ɱ",n:"ñ",o:"ó",p:"þ",r:"ŕ",s:"š",t:"ţ",u:"ú",w:"ŵ",y:"ý",z:"ž",A:"Á",B:"Ɓ",C:"Ç",D:"Đ",E:"É",
  F:"Ƒ",G:"Ĝ",H:"Ĥ",I:"Í",J:"Ĵ",K:"Ķ",L:"Ĺ",N:"Ñ",O:"Ó",P:"Þ",R:"Ŕ",S:"Š",T:"Ţ",U:"Ú",W:"Ŵ",Y:"Ý",Z:"Ž"});
function pseudoize(s){
  const parts = String(s).split(/(\{\w+\})/);
  const body = parts.map(p => /^\{\w+\}$/.test(p) ? p : [...p].map(c => PSEUDO_MAP[c] || c).join("")).join("");
  return `[${body}${"~".repeat(Math.ceil(String(s).length * 0.3))}]`;
}

/* Is this key's translation in this locale allowed to show? */
function reviewedFor(loc, key){
  if(!SAFETY_KEYS.has(key)) return true;
  const meta = (catalogOf(loc) || {})["@meta"] || {};
  return Boolean((meta.reviewers || {})[key]);
}

/* The raw catalog entry for a key, and the locale it came from. */
function entryFor(key){
  if(LOCALE === Locale.PSEUDO) return [I18N_CATALOGS[Locale.EN][key], Locale.PSEUDO];
  const own = catalogOf(LOCALE);
  if(own && own[key] !== undefined && reviewedFor(LOCALE, key)) return [own[key], LOCALE];
  return [I18N_CATALOGS[Locale.EN][key], Locale.EN];
}

/* A message, in the current language, with {name} placeholders filled. A plural
   message is an object keyed by Intl.PluralRules category and picks by params.count. */
function t(key, params){
  let [entry, from] = entryFor(key);
  if(entry && typeof entry === "object"){
    const tag = from === Locale.PSEUDO ? Locale.EN : from;
    const n = params && typeof params.count === "number" ? params.count : 0;
    entry = entry[new Intl.PluralRules(tag).select(n)] ?? entry.other;
  }
  if(typeof entry !== "string") return key;   // a missing key shows itself; tests catch it
  let out = from === Locale.PSEUDO ? pseudoize(entry) : entry;
  return out.replace(/\{(\w+)\}/g, (m, k) => (params && k in params ? String(params[k]) : m));
}

/* A message as HTML: the text is escaped, and each `html` param (markup the caller
   built and escaped itself, such as a person's name tag) is placed where its
   {placeholder} was. */
function tHtml(key, params, html){
  const p = Object.assign({}, params);
  const marks = Object.keys(html || {}).map((k, i) => { const m = `\u0001${i}\u0001`; p[k] = m; return [m, html[k]]; });
  let out = esc(t(key, p));
  for(const [m, h] of marks) out = out.split(m).join(h);
  return out;
}

/* English whatever the reader chose: for machine contracts (JSON, CSV headers) and
   anything an export must keep stable. */
function tEn(key, params){ return withLocale(Locale.EN, () => t(key, params)); }

/* Run `fn` as if the reader had chosen `loc`: an export renders in English whatever
   the screen shows, until exports are translated in their own right (R-55). */
function withLocale(loc, fn){
  const saved = LOCALE; LOCALE = loc;
  try{ return fn(); } finally { LOCALE = saved; }
}

/* Static markup in app/index.html names its keys: data-i18n for text, and
   data-i18n-aria / data-i18n-placeholder / data-i18n-title for attributes. */
function applyStaticI18n(root){
  (root || document).querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  (root || document).querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  (root || document).querySelectorAll("[data-i18n-placeholder]").forEach(el => el.setAttribute("placeholder", t(el.dataset.i18nPlaceholder)));

const VAL = {met:1,partial:.5,notmet:0};

// Generic: scores any list of {id} against any items map. Framework rules

/* ============================================================
   Content hashing
   A short fingerprint of a project's contents, so a printed report
   can be tied to the exact record it came from, and so a later
   reader can tell whether anything moved.

   WHAT MD5 DOES AND DOES NOT DO. It answers "is this the same
   record?" perfectly well. It does NOT make the record tamper-
   evident: MD5 has been collision-broken since 2004, and anyone who
   can change the record can also compute a replacement hash. Treat
   it as a version fingerprint, not a seal.

   A SHA-256 is computed alongside for anyone who needs the stronger
   property. It is the one to quote if a hash will ever be offered as
   evidence that a record was not altered. Both travel with every
   export so the choice stays with the reader.

   CANONICALIZATION IS THE WHOLE PROBLEM. Two JSON documents with the
   same contents hash differently if their keys are in a different
   order, so the input is serialized with keys sorted at every depth.
   Volatile fields are excluded: a hash that changes when nothing
   substantive did is a hash nobody will trust. See CANON_SKIP.
   ============================================================ */

/* Excluded from the fingerprint, each for a reason:
     updatedAt/updatedBy  touched by every save, including a no-op
     cardUpdatedAt        same
     _state               the app's working copy, not the record
     contentHash          cannot hash a document containing its own hash */
const CANON_SKIP = new Set([
  "updatedAt", "updatedBy", "cardUpdatedAt", "_state", "contentHash", "generated",
]);

/* Deterministic JSON: keys sorted at every level, volatile fields
   dropped, undefined treated as absent. */
function canonicalize(value) {
  if (value === null || typeof value !== "object") return value;
  if (Array.isArray(value)) return value.map(canonicalize);
  const out = {};
  for (const key of Object.keys(value).sort()) {
    if (CANON_SKIP.has(key)) continue;
    const v = value[key];
    if (v !== undefined) out[key] = canonicalize(v);
  }
  return out;
}

const canonicalJSON = doc => JSON.stringify(canonicalize(doc));

/* MD5, implemented here because browsers do not provide it:
   crypto.subtle offers SHA family digests only, and deliberately so.
   Compact RFC 1321 implementation over a UTF-8 byte array. */
function md5(input) {
  const bytes = new TextEncoder().encode(input);
  const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const K = new Uint32Array(64);
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);

  const bitLen = bytes.length * 8;
  const padded = new Uint8Array((((bytes.length + 8) >> 6) + 1) * 64);
  padded.set(bytes);
  padded[bytes.length] = 0x80;
  new DataView(padded.buffer).setUint32(padded.length - 8, bitLen >>> 0, true);
  new DataView(padded.buffer).setUint32(padded.length - 4, Math.floor(bitLen / 4294967296), true);

  let [a0, b0, c0, d0] = [0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476];
  const view = new DataView(padded.buffer);

  for (let chunk = 0; chunk < padded.length; chunk += 64) {
    const M = new Uint32Array(16);
    for (let i = 0; i < 16; i++) M[i] = view.getUint32(chunk + i * 4, true);
    let [A, B, C, D] = [a0, b0, c0, d0];
    for (let i = 0; i < 64; i++) {
      let F, g;
      if (i < 16) { F = (B & C) | (~B & D); g = i; }
      else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = (F + A + K[i] + M[g]) >>> 0;
      A = D; D = C; C = B;
      B = (B + (((F << S[i]) | (F >>> (32 - S[i]))) >>> 0)) >>> 0;
    }
    a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0;
    c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
  }

  const hex = n => [0, 8, 16, 24].map(s => ((n >>> s) & 0xff).toString(16).padStart(2, "0")).join("");
  return hex(a0) + hex(b0) + hex(c0) + hex(d0);
}

async function sha256(input) {
  if (!(globalThis.crypto && crypto.subtle)) return "";   // file:// in some browsers
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(input));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* The fingerprint of a project, synchronously for MD5. */
function contentHash(doc) {
  return md5(canonicalJSON(doc));
}

/* Both digests, for exports. Async because SHA-256 is. */
async function contentHashes(doc) {
  const canon = canonicalJSON(doc);
  return { md5: md5(canon), sha256: await sha256(canon), bytes: canon.length };
}

/* Short form for display. Enough to distinguish versions by eye,
   and labeled as a prefix so nobody quotes it as the whole digest. */
const shortHash = h => (h || "").slice(0, 10);

/* ============================================================
   Access control
   Three roles, held per project:

     owner   everything, including deleting, archiving, and
             changing who else has access
     writer  fill in the checklist, metrics, model card and
             checkpoint decisions
     reader  see the record, change nothing

   WHAT THIS IS AND IS NOT. Everything in this file is user
   interface. A browser decides what to SHOW; it cannot decide what
   a server will ACCEPT, because the person using it can edit it.
   Real enforcement lives in server/app/access.py, which checks the
   same rules against an identity the proxy supplies and the browser
   cannot choose. If you add a permission here, add it there too, or
   you have added a label rather than a control.

   IDENTITY IS A PRECONDITION. Roles mean nothing without a
   trustworthy answer to "who is this", and the browser-only mode has
   none: localStorage has no users. In that mode the roles are
   recorded but not enforced, and the tool says so rather than
   implying a protection it cannot provide.

   LEGACY PROJECTS STAY OPEN. A project created before this existed
   has no access list. Treating that as "nobody has access" would
   lock a team out of its own governance records, so an empty owner
   list means unrestricted, exactly as before, until somebody claims
   ownership.
   ============================================================ */
const ROLES = ["owner", "writer", "reader"];
const ROLE_LABEL = { owner: "Owner", writer: "Write access", reader: "Read-only" };
/* What the reader sees for a role, and the sentence that says which they hold. The
   English ROLE_LABEL above is kept for anything a record or an export stores. */
const ROLE_KEY = Object.freeze({ owner: "role.owner", writer: "role.writer", reader: "role.reader" });
const ROLE_YOU_KEY = Object.freeze({ owner: "access.you.owner", writer: "access.you.writer", reader: "access.you.reader" });
const roleLabel = r => t(ROLE_KEY[r]);

const blankAccess = () => ({ owners: [], writers: [], readers: [] });

function accessOf(p) {
  const a = (p || {}).access || {};
  return {
    owners: Array.isArray(a.owners) ? a.owners : [],
    writers: Array.isArray(a.writers) ? a.writers : [],
    readers: Array.isArray(a.readers) ? a.readers : [],
  };
}

/* A project nobody has claimed. Open to all, and the state every
   project created before this feature is in. */
const unclaimed = p => accessOf(p).owners.length === 0;

/* Whether roles can mean anything here at all. Without an identity
   there is nobody to check a list against. */
const identityKnown = () => !!ME.id;

/* The current user's role, or "" for no access. Order matters:
   the most powerful role a user holds is the one that applies. */
function roleOf(p, who) {
  const id = who || ME.id;
  const a = accessOf(p);
  if (!id) return unclaimed(p) ? "owner" : "";
  if (a.owners.includes(id)) return "owner";
  if (a.writers.includes(id)) return "writer";
  if (a.readers.includes(id)) return "reader";
  return "";
}

/* Permission predicates. Each takes the project, defaulting to the
   open one. An unclaimed project grants everyone owner rights, which
   is what keeps existing records usable and lets someone claim them. */
function canRead(p) {
  const proj = p || S;
  if (!proj) return false;
  if (!identityKnown() || unclaimed(proj)) return true;
  return !!roleOf(proj);
}

function canWrite(p) {
  const proj = p || S;
  if (!proj) return false;
  if (!identityKnown() || unclaimed(proj)) return true;
  return ["owner", "writer"].includes(roleOf(proj));
}

/* Deleting, archiving and granting access are owner-only, as is
   anything else that changes who can do what. */
function canOwn(p) {
  const proj = p || S;
  if (!proj) return false;
  if (!identityKnown() || unclaimed(proj)) return true;
  return roleOf(proj) === "owner";
}

/* Grant or revoke. Returns a patch rather than applying one, so the
   caller decides how it reaches the store. A person holds at most
   one role: granting a new one removes the others. */
function accessPatch(p, id, role) {
  const a = accessOf(p);
  const next = {
    owners: a.owners.filter(x => x !== id),
    writers: a.writers.filter(x => x !== id),
    readers: a.readers.filter(x => x !== id),
  };
  if (role === "owner") next.owners.push(id);
  else if (role === "writer") next.writers.push(id);
  else if (role === "reader") next.readers.push(id);
  return next;
}

/* Refuse to remove the last owner. A project with no owner reverts to
   unrestricted, which would silently turn a locked-down record into an
   open one -- a privilege escalation dressed up as a tidy-up. */
function wouldOrphan(p, id, role) {
  const a = accessOf(p);
  return a.owners.length === 1 && a.owners[0] === id && role !== "owner";
}

/* ============================================================
   Stores: shared database, or this browser as a fallback
   ============================================================ */
class DbStore{
  constructor(db){ this.db=db; }
  col(){ return this.db.collection("projects"); }
  subscribeAll(cb,err){ return this.col().onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...clone(d.data())}))),err); }
  create(id,data){ return this.col().doc(id).set(data); }
  update(id,patch){ return this.col().doc(id).update(patch); }
  remove(id){ return this.col().doc(id).delete(); }
  log(id,e){ return this.db.collection(`projects/${id}/log`).add(e); }
  subscribeLog(id,cb){ return this.db.collection(`projects/${id}/log`).orderBy("at","desc").limit(60).onSnapshot(s=>cb(s.docs.map(d=>clone(d.data()))),()=>{}); }
}
class LocalStore{
  constructor(){ this.k="chai-portfolio-local-v1"; this.d=this.load(); this.subs=[]; this.logSubs={}; }
  load(){ try{ return JSON.parse(localStorage.getItem(this.k)) || {projects:{},logs:{}}; }catch(e){ return {projects:{},logs:{}}; } }
  persist(){
    try{ localStorage.setItem(this.k,JSON.stringify(this.d)); return true; }
    catch(e){
      // A full or blocked browser store used to fail here without a word, so the
      // user kept working in a session that was not saving (#40). Say so.
      if(typeof toast==="function") toast(t("toast.storageFull"));
      return false;
    }
  }
  emit(){ const list=Object.entries(this.d.projects).map(([id,v])=>({id,...clone(v)})); this.subs.forEach(f=>setTimeout(()=>f(list))); }
  subscribeAll(cb){ this.subs.push(cb); this.emit(); return ()=>{ this.subs=this.subs.filter(x=>x!==cb); }; }
  async create(id,data){ this.d.projects[id]=clone(data); this.persist(); this.emit(); }
  async update(id,patch){ if(!this.d.projects[id]) throw {code:"invalid_argument"}; deepMerge(this.d.projects[id],patch); this.persist(); this.emit(); }
  async remove(id){ delete this.d.projects[id]; delete this.d.logs[id]; this.persist(); this.emit(); }
  /* Keeps every entry. It used to keep 100 and DELETE the rest, so in browser-only
     mode entry 101 was not hidden from a view, it was gone (#40). The browser's
     own quota is the limit, and persist() says when it is reached. */
  async log(id,e){ const l=(this.d.logs[id]||(this.d.logs[id]=[])); l.unshift(e); this.persist(); this.emitLog(id); }
  emitLog(id){ (this.logSubs[id]||[]).forEach(f=>setTimeout(()=>{ const l=clone(this.d.logs[id]||[]); f(l,{total:l.length}); })); }
  subscribeLog(id,cb){ (this.logSubs[id]||(this.logSubs[id]=[])).push(cb); setTimeout(()=>{ const l=clone(this.d.logs[id]||[]); cb(l,{total:l.length}); }); return ()=>{ this.logSubs[id]=(this.logSubs[id]||[]).filter(x=>x!==cb); }; }
}

/* ApiStore: a self-hosted backend over REST + Server-Sent Events.

   Selected at boot when /api/health answers, which is true when the app is
   served by the Docker Compose stack and false for the GitHub Pages copy, so
   one build covers both. Identity comes from /api/me, established by the
   reverse proxy -- the browser cannot influence who it is, which is what makes
   a checkpoint sign-off here mean something that a localStorage one does not.

   Live updates: the server sends ids, not documents, so a change notification
   is small and never races a larger body. Each event triggers one refetch of
   the list. For a governance tool with tens of projects that is cheaper than
   reconciling partial state, and it cannot drift. */
class ApiStore{
  constructor(base){ this.base=base||"/api"; this.es=null; this.cbs=[]; this.cache=[]; this.logDepth={}; this.logPulls={}; }

  async req(path,opts){
    const r = await fetch(this.base+path, Object.assign({
      headers:{"Content-Type":"application/json"}, credentials:"same-origin"
    }, opts||{}));
    if(!r.ok){
      // Surface the API's own code so onDbError can tell a permission problem
      // from a conflict; the app already distinguishes them.
      const err = new Error(`${r.status} ${r.statusText}`);
      err.code = r.status===403||r.status===401 ? "permission_denied"
               : r.status===409 ? "already_exists"
               : r.status===404 ? "not_found" : "unavailable";
      throw err;
    }
    return r.status===204 ? null : r.json();
  }

  async refresh(){
    const list = await this.req("/projects");
    this.cache = Array.isArray(list) ? list : [];
    this.cbs.forEach(f=>{ try{ f(clone(this.cache)); }catch(e){} });
  }

  subscribeAll(cb,err){
    this.cbs.push(cb);
    this.refresh().catch(e=>{ if(err) err(e); });
    if(!this.es){
      this.es = new EventSource(this.base+"/events");
      // The server sends NAMED events ("event: project.created"). EventSource
      // fires onmessage only for events with no name, so a handler attached
      // there never runs and the page silently stops updating -- it still
      // works, because every local write re-renders, so the failure only shows
      // when a COLLEAGUE makes a change. Each name needs its own listener.
      ApiStore.EVENTS.forEach(name=>{
        this.es.addEventListener(name, ()=>{ this.refresh().catch(()=>{}); });
      });
      // EventSource reconnects on its own; a refresh on reopen closes the gap
      // of anything missed while disconnected.
      this.es.onopen = ()=>{ this.refresh().catch(()=>{}); };
      // EventSource reconnects by itself while readyState is CONNECTING. It gives
      // up (CLOSED) when the server answers the reconnect with an error, which is
      // what a session that has ended looks like: the front door refuses it. That
      // used to be swallowed, so the page went on looking live and never updated
      // again (#49). Report it, so the app can say it is disconnected.
      const ES_CLOSED = 2;  // enum-ok: EventSource's own readyState value
      this.es.onerror = ()=>{ if(this.es && this.es.readyState===ES_CLOSED && err) err({code:"stream_closed"}); };
    }
    return ()=>{ this.cbs = this.cbs.filter(f=>f!==cb); };
  }

  create(id,data){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"POST",body:JSON.stringify(data)}); }
  update(id,patch){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"PATCH",body:JSON.stringify(patch)}); }
  remove(id){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"DELETE"}); }
  /* Destroy the content of every retained revision AND of the audit log. Owner
     only, irreversible, and a SEPARATE step from remove(): deleting a project keeps
     its version history on purpose, so deletion alone is not erasure (#36). Only
     this store has it, because only the server keeps a history; the dialog offers
     the choice when, and only when, this method exists. */
  purgeVersions(id){ return this.req(`/projects/${encodeURIComponent(id)}/versions`,{method:"DELETE"}); }
  log(id,e){ return this.req(`/projects/${encodeURIComponent(id)}/log`,{method:"POST",body:JSON.stringify(e)}); }

  /* The log arrives as a WINDOW: the newest page, with the project's total in
     X-Log-Total so a view or an export can say "newest 60 of 412". showOlderLog
     asks for a deeper page, up to the server's cap (500); older than that is
     reached through the API's `before` cursor, not through this view (#40). */
  subscribeLog(id,cb){
    let stop=false;
    const pull = async ()=>{
      try{
        const depth = this.logDepth[id];
        const r = await fetch(this.base+`/projects/${encodeURIComponent(id)}/log`+(depth?`?limit=${depth}`:""),
          {headers:{"Content-Type":"application/json"}, credentials:"same-origin"});
        if(!r.ok) return;
        const rows = await r.json();
        const total = parseInt(r.headers.get("X-Log-Total"),10);
        if(!stop && Array.isArray(rows)) cb(rows,{total:Number.isFinite(total)?total:null});
      }catch(e){}
    };
    this.logPulls[id] = pull;
    pull();
    // The log is append-only and low-traffic, so it rides the same change
    // signal as the project list rather than opening a second stream.
    const onChange = ()=> pull();
    this.cbs.push(onChange);
    return ()=>{ stop=true; delete this.logPulls[id]; this.cbs = this.cbs.filter(f=>f!==onChange); };
  }
  /* Names for identity ids, in the shape the Claude runtime's profiles() answers
     so resolveNames needs no second path: {id: {name, email, isMe}}. The server
     answers only for people the caller can already see on a project they can read,
     and omits the rest, so an absent id is "unknown", not an error. Batches are
     capped by the server (100). (#39) */
  async profiles(ids){
    const out={};
    const unique=[...new Set((ids||[]).filter(Boolean))];
    for(let i=0;i<unique.length;i+=100){
      const chunk=unique.slice(i,i+100);
      const rows=await this.req(`/principals?ids=${encodeURIComponent(chunk.join(","))}`);
      (Array.isArray(rows)?rows:[]).forEach(p=>{ out[p.id]={name:p.name||"", email:p.email||"", isMe:p.id===ME.id}; });
    }
    return out;
  }
  /* Tell the server an export was produced (#33). Exports are built here from data
     already fetched, so it cannot see one happen; this is the record of ordinary
     use, not a control, because a client can omit it. id is null for the portfolio
     CSV. */
  recordExport(id,format){
    const path = id ? `/projects/${encodeURIComponent(id)}/exports` : "/exports";
    return this.req(path,{method:"POST",body:JSON.stringify({format})});
  }
  showOlderLog(id){
    this.logDepth[id] = Math.min(500, (this.logDepth[id]||60) + 60);
    const pull = this.logPulls[id];
    return pull ? pull() : Promise.resolve();
  }
}

/* Event names the API emits. Keep in step with server/app/events.py. */
ApiStore.EVENTS = ["project.created","project.updated","project.deleted","log.appended","resync"];

/* Is a self-hosted backend serving this page, and if not, WHY not?

   This used to return null for every failure, and boot treated null as
   "no server here, use localStorage". That conflated three situations that
   must not be treated alike:

     - a genuinely static host (GitHub Pages, a file:// open) -- localStorage
       is correct;
     - a self-hosted stack whose API is restarting, slow, or behind a proxy
       having a bad minute -- falling back silently strands the user's work in
       a browser-local store their colleagues cannot see and no audit log
       records;
     - a self-hosted stack that AUTHENTICATED the user and said NO (401/403) --
       falling back hands a denied user a working private workspace, which is
       access control failing open.

   So the verdict is explicit and boot decides. Verdicts:

     ok          a healthy API answered; `health` carries its payload
     denied      the front door or the API refused this user (401/403)
     unreachable something is there but did not answer in time
     error       something answered with a server error
     absent      nothing API-shaped here; a static host

   Short timeout because on a static host the request 404s immediately and the
   user should not wait on it. */
async function detectApi(base){
  base = base || "/api";
  try{
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 2500);
    const r = await fetch(base+"/health",{signal:ctl.signal,credentials:"same-origin"});
    clearTimeout(t);
    if(r.status===401 || r.status===403) return {verdict:"denied", status:r.status};
    if(r.status>=500) return {verdict:"error", status:r.status};
    if(!r.ok) return {verdict:"absent", status:r.status};
    // A static host serving an HTML 404 page with a 200, or anything else
    // that is not our health payload, lands in the catch below or here.
    const j = await r.json();
    return j && j.status==="ok" ? {verdict:"ok", health:j} : {verdict:"absent"};
  }catch(e){
    // AbortError means the timeout fired: something may well be there. A
    // network TypeError or a JSON parse failure means there is nothing
    // API-shaped at this origin.
    return {verdict: (e && e.name==="AbortError") ? "unreachable" : "absent"};
  }
}

/* Has this origin ever served a working API to this browser?

   Without this, a self-hosted deployment whose API is down for thirty seconds
   is indistinguishable from GitHub Pages, and the safe choice would be to
   refuse to start anywhere -- including on the static host where localStorage

const MODE_PROVENANCE = Object.freeze({

let LOG_TOTAL=null;

/* names */
const NAMES={};
/* Ids a lookup could not name, so a render does not ask again for the same ghost. */
const UNNAMED=new Set();

/* What to show for a person: their name if known, "you" for the viewer, and
   otherwise what each mode can honestly say. The server-backed mode shows the id
   (ugly, but it is what a reviewer can match to a directory, and "someone" tells
   them nothing); the Claude artifact and browser-only modes keep "someone", since
   an id there is not something a person can use or should be shown (#39). */
function displayName(id){
  if(!id) return "someone";
  if(NAMES[id]) return NAMES[id];
  if(id===ME.id) return "you";

}

/* Where names come from: the Claude runtime's profiles(), or the server store's. */
function nameSource(){
  if(USER && USER.profiles) return USER;
  if(STORE && typeof STORE.profiles==="function") return STORE;
  return null;
}

/* Ask for the names of any ids not yet asked about, and remember the answers. */
async function primeNames(ids){
  const src = nameSource();
  const need=[...new Set((ids||[]).filter(i=>i && !(i in NAMES) && !UNNAMED.has(i)))];
  if(!need.length || !src) return;
  need.forEach(i=>UNNAMED.add(i));   // claimed up front, so concurrent renders do not repeat it
  try{
    const ps=await src.profiles(need);
    need.forEach(i=>{
      const p=ps[i];
      if(p){ UNNAMED.delete(i); NAMES[i]= p.isMe ? "you" : (p.name||p.email||""); if(!NAMES[i]) delete NAMES[i]; }
    });

}

/* Every person a project document names: its access lists, who signed off and who
   last edited. The same set the server will agree to name (principals.ids_in_doc). */
function idsOfProject(p){
  const found=new Set(); if(!p) return [];
  const a=p.access||{};
  ["owners","writers","readers"].forEach(k=>(Array.isArray(a[k])?a[k]:[]).forEach(i=>found.add(i)));
  Object.values(p.gates||{}).forEach(g=>{ if(g && g.signedBy) found.add(g.signedBy); });
  ["updatedBy","cardUpdatedBy"].forEach(k=>{ if(p[k]) found.add(p[k]); });
  return [...found].filter(Boolean);
}
/* Fetch names for these ids, then refresh whatever is already on screen. */
function warmNames(ids){

async function resolveNames(root){
  root=root||document;
  const els=[...root.querySelectorAll("[data-uid]")];
  const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];
  els.forEach(e=>{ if(!e.dataset.uid) e.textContent = MODE===Mode.LOCAL?"you (this browser)":"someone"; });
  await primeNames(ids);
  els.forEach(e=>{ const i=e.dataset.uid; if(i) e.textContent = displayName(i); });

/* ============================================================
   Writes
   ============================================================ */
function setSaved(t){ document.getElementById("saved").textContent=t; }
/* What a save tells the user about where it went. Keyed by Mode, so adding a
   mode without deciding its wording is a gap the test in test_boot_storage.py
   finds, and an unknown mode falls back to a label that claims nothing rather
   than to one that claims the wrong place. Only LOCAL may say "browser". */
const SAVED_LABEL = Object.freeze({   // catalog keys: the text is the reader's language
  [Mode.LOCAL]: "saved.local",
  [Mode.API]: "saved.api",
  [Mode.ARTIFACT]: "saved.artifact",
});
function savedLabel(mode){ return t(SAVED_LABEL[mode] || "saved.generic"); }
function stamp(extra){ return Object.assign({updatedAt:new Date().toISOString(), updatedBy:ME.id||null}, extra||{}); }
function queuePatch(pid,patch){
  if(RO) return;
  deepMerge(pending[pid]||(pending[pid]={}), patch);
  setSaved(t("saved.saving"));
  clearTimeout(timers[pid]); timers[pid]=setTimeout(()=>flush(pid),550);
}
/* Send one project's pending patch.

   The patch is REMOVED from `pending` before the request and put back if the
   request fails, rather than being deleted outright. It used to be deleted up
   front and restored for exactly one error code on exactly the first attempt,
   so a 403, a 404, or a second consecutive outage discarded the user's typing
   while telling them to "try again" -- with nothing left to try again with.

   `attempt` counts retries for backoff. Anything still pending when this
   returns is merged on top, so an edit made DURING the request is not lost
   either. */
const MAX_SAVE_ATTEMPTS = 6;

async function flush(pid,attempt){
  if(flushing[pid]){ clearTimeout(timers[pid]); timers[pid]=setTimeout(()=>flush(pid,attempt),300); return; }
  const p=pending[pid]; if(!p) return; delete pending[pid];
  flushing[pid]=true;
  const restore = ()=>{ pending[pid] = deepMerge(p, pending[pid]||{}); };
  try{
    await STORE.update(pid,p);
    if(!pending[pid]) setSaved(savedLabel(MODE));
  }
  catch(e){
    const c=e&&e.code;
    const n=(attempt||0)+1;

    // Transient: keep the edit and come back for it.
    if(c==="unavailable" && n < MAX_SAVE_ATTEMPTS){
      restore();
      flushing[pid]=false;
      setSaved(t("saved.retrying"));
      setTimeout(()=>flush(pid,n), Math.min(8000, 400*Math.pow(2,n)) + Math.random()*400);
      return;
    }

    // Permanent, and about permission rather than connectivity. Keep the
    // edit anyway: the user can still see and copy what they wrote, which
    // they cannot do if we drop it.
    if(c==="permission_denied" || c==="invalid_argument" || c==="revoked"){
      restore();
      setReadOnly(true);
      toast(t("toast.accessChanged"));
      setSaved(t("saved.noLongerEditable"));
    }
    else if(c==="not_found"){
      toast(t("toast.projectGone"));
      setSaved(t("saved.not"));
    }
    else if(c==="quota_exceeded"){
      restore();
      toast(t("toast.full"));
      setSaved(t("saved.full"));
    }
    else {
      restore();
      toast(t("toast.saveFailed"));
      setSaved(t("saved.not"));
    }
  } finally { flushing[pid]=false; }
}
function patchFromPath(path,val){
  const ks=path.split("."); const out={}; let o=out;
  if(!ks.every(safeKey)) return out;
  for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]={}; } o[ks[ks.length-1]]=val; return out;
}
function setLocal(path,val){
  const ks=path.split("."); let o=S;
  if(!ks.every(safeKey)) return;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=="object") o[ks[i]]={}; o=o[ks[i]]; }
  o[ks[ks.length-1]]=val;
}
function edit(path,val){
  if(!String(path).split(".").every(safeKey)) return;  // never a write to a prototype
  const before = path.startsWith("metrics.") ? clone(S.metrics) : clone(get(path));
  setLocal(path,val);
  let patch;
  if(path.startsWith("metrics.")) patch={metrics:clone(S.metrics), cardUpdatedAt:new Date().toISOString()};
  else { patch=patchFromPath(path,val); if(path.startsWith("card.")) patch.cardUpdatedAt=new Date().toISOString(); }
  if(patch.cardUpdatedAt) S.cardUpdatedAt=patch.cardUpdatedAt;
  const st=stamp(); S.updatedAt=st.updatedAt; S.updatedBy=st.updatedBy;
  queuePatch(CUR, Object.assign(patch,st));
  bufferChange(CUR, path, before);
  // Typing is the ONLY continuous edit: it arrives one character at a time
  // and is not finished until focus leaves. Everything else -- a status
  // button, a dropdown, a date, a programmatic change -- is complete the
  // moment it happens, so it is described straight away.
  //
  // Expressed as "flush unless typing" rather than by listing the discrete
  // controls, because a list would need extending every time a control is
  // added, and the one that got missed would silently stop logging.
  if(!TYPING) flushChanges(CUR, path);
}

/* Changelog coalescing.

   One entry per completed edit, not per keystroke and not per save.

   Two earlier versions were wrong in instructive ways. Logging inside edit()
   wrote one entry per character: forty entries to record one sentence, burying
   the record it exists to document. Logging at save-flush was better but still
   split a sentence in two whenever the typist paused longer than the 550ms
   save debounce -- which is just "stopped to think mid-sentence", a completely
   normal thing to do.

   So the trigger is the edit being FINISHED, which for a text field means
   focus leaving it. Saving still debounces independently: data is written
   while you type, and the changelog describes what you wrote once you are
   done. The two concerns were conflated; they are now separate.

   Discrete controls -- a status button, a dropdown, a date picker -- are
   complete the moment they change, so they flush immediately. */
const changeBuf = {};

/* True only while an `input` event from a text field is being handled.
   Set around the edit() call in the input handler, nowhere else. */
let TYPING = false;
const setTyping = v => { TYPING = !!v; };

function bufferChange(pid, path, before){
  if(RO) return;
  const buf = changeBuf[pid] || (changeBuf[pid] = {});
  // Keep the earliest value only; later keystrokes are the same edit.
  if(!(path in buf)) buf[path] = before;
}

/* Write the entry for one path, or for every buffered path when no path is
   given. Called on blur, when leaving a view, and before the page unloads --
   anywhere an in-progress edit stops being in progress. */
function flushChanges(pid, path){
  const buf = changeBuf[pid];
  if(!buf) return;
  const paths = path ? (path in buf ? [path] : []) : Object.keys(buf);
  for(const key of paths){
    const before = buf[key];
    delete buf[key];
    const now = key.startsWith("metrics.") ? clone(S && S.metrics) : (S ? get(key) : undefined);
    logChange(pid, key, before, now, S);
  }
  if(!Object.keys(buf).length) delete changeBuf[pid];
}

/* Everything in flight, for every project. */
function flushAllChanges(){
  Object.keys(changeBuf).forEach(pid => flushChanges(pid));
}
function saveMetrics(){
  const now=new Date().toISOString(); S.cardUpdatedAt=now; const st=stamp(); Object.assign(S,st);
  queuePatch(CUR, Object.assign({metrics:clone(S.metrics), cardUpdatedAt:now}, st));
}
/* Append one audit entry.

   This used to end in `.catch(()=>{})`. A log that can silently lose entries
   while continuing to look complete is worse than no log: a reviewer cannot
   tell a quiet period from a dropped write, and the whole point of the record
   is that someone will rely on it a year later.

   So a failure is retried, and a failure that survives the retries is said
   out loud rather than swallowed. The entry is kept in `logQueue` across
   retries so a transient outage does not lose it. */
const logQueue = [];
let logDraining = false;

function writeLog(pid,text){
  if(RO) return;
  enqueueLog(pid, {at:new Date().toISOString(), by:ME.id||null, text});
}

/* The one way an audit entry gets written. Every caller -- a checkpoint note,
   a created project, a per-edit changelog entry -- goes through here, so a fix
   to how failures are handled lands everywhere at once. It did not: logChange()
   kept its own copy ending in `.catch(()=>{})` after this one was fixed, and an
   edit's history could vanish without a word (#45). */
function enqueueLog(pid, entry){
  if(RO) return;
  logQueue.push({pid, entry, tries:0});
  drainLog();
}

async function drainLog(){
  if(logDraining || !logQueue.length) return;
  logDraining = true;
  try{
    while(logQueue.length){
      const item = logQueue[0];
      try{
        await STORE.log(item.pid, item.entry);
        logQueue.shift();
      }catch(e){
        const code = e && e.code;
        // A permission failure or a project that is gone will not succeed on
        // a retry. Drop the item, but say so: the user just did something the
        // record now does not show.
        if(code === "permission_denied" || code === "not_found"){
          logQueue.shift();
          setSaved(t("saved.auditNot"));
          toast(t("toast.auditFailed"));
          continue;
        }
        if(++item.tries >= 5){
          logQueue.shift();
          setSaved(t("saved.auditNot"));
          toast(t("toast.auditFailed"));
          continue;
        }
        // Back off and let a later call pick it up.
        logDraining = false;
        setTimeout(drainLog, 400 * item.tries + Math.random() * 300);
        return;
      }
    }
  } finally {
    logDraining = false;
  }
}

/* Entries still in flight, for the unload path. */
const pendingLogCount = () => logQueue.length;

async function createProject(data,logText){
  if(RO) return null;
  const id=newId();
  try{
    await STORE.create(id,data);
    // Goes through the same queue as every other entry, so a transient
    // failure here is retried rather than dropped. See writeLog().
    enqueueLog(id, {
      at:new Date().toISOString(), by:ME.id||null,
      text:logText||"Project created", hash:contentHash(data)});

  }
  catch(e){ toast(e&&e.code==="quota_exceeded"?t("toast.full"):t("toast.createFailed")); return null; }

/* ============================================================
   Changelog
   What changed, who changed it, when, and what the record hashed to
   afterwards.

   The audit log already existed, but it recorded prose: "Archived",
   "Project created". That answers "something happened" and not "what
   is different now", which is the question a reviewer asks six
   months later when a checkpoint decision is challenged.

   So every edit is described in the terms the user sees -- the
   criterion's own text, the checkpoint's title, the model-card
   field's label -- rather than as a state path. A reader should not
   have to know that `gates.B.decision` is Checkpoint B.

   Entries are written through the store's existing log, which means
   this works in all three backends rather than only the one with a
   database. The server additionally keeps full snapshots; see
   server/migrations/002_versions.sql.
   ============================================================ */

/* Human labels for state paths. Anything not matched here falls back
   to a cleaned-up path, so a new field still logs something useful
   rather than nothing. */
function describePath(path) {
  const parts = String(path).split(".");

  if (parts[0] === "items") {
    const id = parts[1];
    const item = (typeof allItems === "function" ? allItems() : []).find(i => i.id === id);
    const what = { status: "status", evidence: "evidence", owner: "owner", due: "due date" }[parts[2]] || parts[2];
    return item ? `${what} of “${item.text}”` : `${what} of criterion ${id}`;
  }

  if (parts[0] === "gates") {
    const gate = GATES[parts[1]];
    const what = { decision: "decision", by: "decided by", date: "decision date",
                   rationale: "rationale", conditions: "conditions" }[parts[2]] || parts[2];
    return gate ? `${what} for ${gate.title}` : `${what} for checkpoint ${parts[1]}`;
  }

  if (parts[0] === "card") {
    return `model card: ${CARD_LABEL[parts[1]] || parts[1]}`;
  }

  if (parts[0] === "optica" && parts[1] === "answers") {
    const key = parts[2];
    const item = (typeof OPTICA_ITEMS !== "undefined" ? OPTICA_ITEMS : []).find(i => i.key === key);
    const what = { status: "status", evidence: "evidence", owner: "owner",
                   due: "due date", declineReason: "reason for declining" }[parts[3]] || parts[3];
    return item ? `OPTICA ${item.num}: ${what}` : `OPTICA ${key}: ${what}`;
  }

  if (parts[0] === "meta") {
    const labels = { solution: "solution name", org: "organization", developer: "developer",
      sourcing: "sourcing", sponsor: "clinical sponsor", riskTier: "risk tier",
      reviewCadence: "review cadence", startDate: "review start date",
      reviewers: "review team", scope: "scope", chaiUseCase: "CHAI use case" };
    return labels[parts[1]] || parts[1];
  }

  if (parts[0] === "metrics") return "key metrics";
  if (parts[0] === "access") return "who has access";
  if (parts[0] === "archived") return "archived state";
  return parts.join(" › ");
}

/* Values as a reader would recognize them. Statuses get their label,
   long text is elided rather than dumped into a log line. */
function describeValue(path, value) {
  if (value === undefined || value === null || value === "") return "empty";
  if (typeof value === "boolean") return value ? "yes" : "no";
  if (Array.isArray(value)) return `${value.length} item${value.length === 1 ? "" : "s"}`;
  if (typeof value === "object") return "updated";

  const text = String(value);
  if (/\.status$/.test(path)) {
    return STATUS[text] || (typeof OPTICA_STATUS !== "undefined" ? OPTICA_STATUS[text] : "") || text;
  }
  return text.length > 60 ? `“${text.slice(0, 57)}…”` : `“${text}”`;
}

/* One log entry per edit, carrying enough to reconstruct what moved.
   `from` and `to` are kept as well as the prose, so a later version of
   this tool can render a better diff from old entries. */
function logChange(pid, path, from, to, doc) {
  if (RO) return;
  const same = JSON.stringify(from ?? null) === JSON.stringify(to ?? null);
  if (same) return;   // a save that changed nothing is not a change

  const entry = {
    at: new Date().toISOString(),
    by: ME.id || null,
    text: `Changed ${describePath(path)}: ${describeValue(path, from)} → ${describeValue(path, to)}`,
    change: {
      path,
      from: from === undefined ? null : from,
      to: to === undefined ? null : to,
    },
  };
  if (doc) entry.hash = contentHash(doc);
  // The shared queue retries a transient failure and says so when one cannot be
  // written (see enqueueLog). Not `.catch(() => {})`: that loses the entry and
  // leaves a history that looks complete (#45).
  enqueueLog(pid, entry);
}

/* Compare two whole documents and list what differs, for the version
   history where only snapshots are available. Returns leaf-level
   paths, which is the granularity a reviewer wants: "the decision
   changed", not "the gates object changed". */
function diffDocs(before, after, prefix = "", out = []) {
  const a = before && typeof before === "object" ? before : {};
  const b = after && typeof after === "object" ? after : {};
  for (const key of new Set([...Object.keys(a), ...Object.keys(b)])) {
    if (CANON_SKIP.has(key)) continue;
    const path = prefix ? `${prefix}.${key}` : key;
    const av = a[key], bv = b[key];
    const bothObjects = av && bv && typeof av === "object" && typeof bv === "object"
      && !Array.isArray(av) && !Array.isArray(bv);
    if (bothObjects) diffDocs(av, bv, path, out);
    else if (JSON.stringify(av ?? null) !== JSON.stringify(bv ?? null)) {
      out.push({ path, from: av ?? null, to: bv ?? null });
    }
  }
  return out;
}

/* LOG is the newest page of the history, not the history. Say so wherever it is
   shown or exported, so a view of 60 entries is never taken for all of them (#40).
   Empty when LOG is the whole of it. */
const LOG_PAGE = 60;
function logWindowNote(){
  if(LOG_TOTAL!==null && LOG_TOTAL>LOG.length) return `Showing the newest ${LOG.length} of ${LOG_TOTAL} entries.`;
  if(LOG_TOTAL===null && LOG.length>=LOG_PAGE) return `Showing the newest ${LOG.length} entries; older entries may exist.`;
  return "";
}

/* ============================================================
   Core: find text anywhere in a project (#57)
   "Where does this person, vendor or phrase appear?" without opening every
   project. Looks through every string in a project's current document; a
   person's name also finds the ids they are stored under, because access
   lists and sign-offs hold ids. Only what this browser already holds: the
   current version of each project the viewer can open. Earlier revisions and
   the audit log are not here, and the UI says so.
   ============================================================ */
const SEARCH_LABEL = Object.freeze({
  id: "project id", createdBy: "created by", updatedBy: "last changed by",
  cardUpdatedBy: "model card changed by",
});
function searchLabel(path){
  const top = path.split(".")[0];
  return SEARCH_LABEL[top] || describePath(path);
}
/* The ids whose known name contains the query: "Pat" finds pat@hosp.org. */
function idsNamed(q){
  return Object.entries(NAMES)
    .filter(([id, name]) => name && id !== ME.id && name.toLowerCase().includes(q))
    .map(([id]) => id.toLowerCase());
}
/* Where in this project the text appears, as labels a reader recognizes. */
function textHits(p, query){
  const q = String(query || "").trim().toLowerCase();
  if(!q || !p) return [];
  const terms = [q, ...idsNamed(q)];
  const hits = [];
  const walk = (v, path) => {
    if(typeof v === "string"){
      const s = v.toLowerCase();
      if(terms.some(t => s.includes(t))){
        const label = searchLabel(path);
        if(!hits.includes(label)) hits.push(label);
      }
    } else if(Array.isArray(v)){
      v.forEach(x => walk(x, path));          // a list's position is not a place a reader knows
    } else if(v && typeof v === "object"){
      for(const k of Object.keys(v)) if(safeKey(k)) walk(v[k], path ? `${path}.${k}` : k);
    }
  };
  walk(p, "");
  return hits;
}

/* ============================================================
   Core: DOM helpers
   Form fields, focus preservation and small formatters. No
   knowledge of any framework.
   ============================================================ */
/* Attributes for the multi-line fields people write evidence, rationale and
   risk notes in. A textarea defaults to spellcheck on, and a cloud-backed
   spellchecker (Chrome's "Enhanced spell check", some Safari and macOS settings)
   sends what is typed to a third party as it is typed -- before it is saved,
   and before any server-side control can apply. These fields are where a
   patient identifier gets pasted by mistake (the purge path exists for that),
   so they opt out, and out of the browser's form history too. A test sweeps the
   rendered DOM so a textarea added later is held to the same rule (#59). */
const NO_BROWSER_ASSIST = 'spellcheck="false" autocomplete="off"';
const get = (path)=> path.split(".").reduce((o,k)=>o==null||!safeKey(k)?undefined:o[k], S);
/* `label` and `hint` arrive translated. A select's options are the values stored in
   the record, which stay English so the data does not change with the reader's
   language; `optLabel` turns a stored value into what the reader sees. */
function field(path,label,hint,long,opts,kind,optLabel){
  const v=esc(get(path)||""); const id="f_"+path.replace(/\./g,"_");
  let input;
  if(opts) input=`<select id="${id}" data-bind="${path}"><option value="">${esc(t("field.choose"))}</option>${opts.map(o=>`<option value="${esc(o)}"${get(path)===o?" selected":""}>${esc(optLabel?optLabel(o):o)}</option>`).join("")}</select>`;
  else if(long) input=`<textarea id="${id}" data-bind="${path}" rows="3" ${NO_BROWSER_ASSIST}>${v}</textarea>`;
  // `date` gives the browser's own picker and its validation. Asking someone
  // to type YYYY-MM-DD invites 03/04/2026, which is two different dates
  // depending on where the reader is -- not a good property for the date a
  // governance decision was taken.
  else if(kind==="date") input=`<input type="date" id="${id}" data-bind="${path}" value="${v}">`;
  else input=`<input type="text" id="${id}" data-bind="${path}" value="${v}">`;
  return `<div class="field${long?" wide":""}"><label for="${id}">${esc(label)}</label>${hint?`<span class="hint">${esc(hint)}</span>`:""}${input}</div>`;
}
function pager(){
  // Views come from the registry, so the pager walks whatever the active
  // frameworks contributed. `short` lets a view give the pager a terser name
  // than its rail label; otherwise the label is used.
  const views=activeViews();
  const i=views.findIndex(v=>v.id===UI.view);
  const prev=views[i-1], next=views[i+1];
  const name=v=>v?(v.short||v.label||""):"";
  return `<div class="pager">${prev?`<button class="btn" data-go="${prev.id}">${esc(t("pager.back",{name:name(prev)}))}</button>`:`<button class="btn" data-home="1">${esc(t("pager.home"))}</button>`}${next?`<button class="btn primary" data-go="${next.id}">${esc(t("pager.continue",{name:name(next)}))}</button>`:""}</div>`;
}
function focusKey(el){
  if(!el||!el.dataset) return null; const d=el.dataset;
  if(d.set) return `[data-set="${d.set}"][data-s="${d.s}"]`;
  if(d.gate) return `[data-gate="${d.gate}"][data-d="${CSS.escape(d.d)}"]`;
  if(d.toggle) return `[data-toggle="${d.toggle}"]`;
  if(d.act) return `[data-act="${d.act}"]`;
  return null;
}
function editingInMain(){ const a=document.activeElement, m=document.getElementById("main"); return a && m.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
function syncInputs(){
  document.querySelectorAll("#main [data-bind]").forEach(el=>{ if(el===document.activeElement) return; const v=get(el.dataset.bind)??""; if(el.value!==v) el.value=v; });
  document.querySelectorAll("#main [data-set]").forEach(b=>b.setAttribute("aria-pressed",String((S.items[b.dataset.set]||{}).status===b.dataset.s)));
}
function barCls(p){ return p>=80?"":p>=50?"mid":"low"; }

/* ============================================================
   Framework registry
   A framework is a self-contained checklist: its own items, its own
   views, its own progress. Frameworks never read each other, and the
   app shell never names one. Adding a third means adding a directory
   under app/js/10-frameworks/ that calls registerFramework().

   The contract:
     id        string, stable, used in data keys and the DOM
     label     short display name
     enabled   (p) => bool    is it switched on for this project?
     views     (p) => [view]  rail entries, in order
     render    (view, p) => html
     blank     () => object   extra keys merged into a new project
     normalize (p) => void    repair shape on load; must be idempotent

   A view is {id, kind, label, num, meta, cls, sep}. The shell renders
   the rail from these fields alone; `kind` is the framework's own
   business and is passed back to render() untouched.
   ============================================================ */
const FRAMEWORKS = [];

function registerFramework(f) {
  if (FRAMEWORKS.some(x => x.id === f.id)) throw new Error(`framework ${f.id} already registered`);
  FRAMEWORKS.push(f);
  return f;
}

const frameworkById = id => FRAMEWORKS.find(f => f.id === id);

/* Frameworks switched on for a project. CHAI is always on: it is the
   spine the compliance status and the dashboard are computed from.
   Others are opt-in per project. */
function activeFrameworks(p) {
  const proj = p || S;
  return FRAMEWORKS.filter(f => { try { return f.enabled(proj); } catch (e) { return false; } });
}

/* Every rail entry, in framework registration order, each tagged with
   the framework that owns it so the shell can route back without a
   lookup table. */
function activeViews(p) {
  const proj = p || S;
  const all = activeFrameworks(proj).flatMap(f =>
    (f.views(proj) || []).map(v => ({ ...v, fw: f }))
  );
  // A view may declare `order: "end"` to sit after everything else, whichever
  // framework contributed it. Used by reference views -- the changelog is not
  // a step in the review and should not interrupt the numbered sequence.
  return [...all.filter(v => v.order !== "end"), ...all.filter(v => v.order === "end")];
}

const viewById = (id, p) => activeViews(p).find(v => v.id === id);

/* Extra top-level keys a new project needs. Existing projects without
   them stay valid: every framework's normalize() has to cope with its
   own keys being absent, which is what keeps old exports importable. */
function frameworkBlank() {
  return FRAMEWORKS.reduce((acc, f) => Object.assign(acc, f.blank ? f.blank() : {}), {});
}

function frameworkNormalize(p) {
  FRAMEWORKS.forEach(f => { if (f.normalize) f.normalize(p); });
  return p;
}

/* ============================================================
   Project setup
   The project itself: who is reviewing what, the history, and which
   optional frameworks are switched on. This is not CHAI's screen --
   it belongs to the project, which is why it lives outside the
   framework directories and registers first so it heads the rail.

   The compliance banner does read CHAI's flags(). That is deliberate
   and documented: CHAI is the spine the dashboard status comes from,
   and only one framework can own that. See docs/crosswalk.md.
   ============================================================ */
function frameworkToggles(){
  const optional = FRAMEWORKS.filter(f => f.id !== "chai" && f.id !== "project");
  if(!optional.length) return "";
  const rows = optional.map(f=>{
    const on = f.enabled(S);
    return `<li style="display:flex;align-items:center;gap:10px;padding:6px 0">
      <button class="btn${on?" primary":""}" data-framework="${esc(f.id)}" aria-pressed="${on}">${esc(t(on?"fw.on":"fw.off"))}</button>
      <span><b>${esc(f.label)}</b> \u2014 ${esc(t(on?"fw.onDetail":"fw.offDetail"))}</span>
    </li>`;
  }).join("");
  return `<h2 class="ro-hide">${esc(t("fw.title"))}</h2>
  <p class="ro-hide" style="font-size:13px;color:var(--muted)">${esc(t("fw.lede"))}</p>
  <ul class="ro-hide" style="list-style:none;padding:0;margin:0">${rows}</ul>`;
}

/* The stored values of the setup's choice fields (English, as records hold them),
   each with the catalog key of what the reader sees. */
const SOURCING_KEY = Object.freeze({

const RISK_KEY = Object.freeze({ Low: "opt.risk.low", Moderate: "opt.risk.moderate", High: "opt.risk.high" });
const CADENCE_KEY = Object.freeze({

});

function renderSetup(){

  <p class="lede">${esc(t("setup.lede"))}</p>

    ${f.length?`<ul class="gaplist">${f.map(x=>`<li>${esc(flagText(x))}</li>`).join("")}</ul>`:""}</div>
  <div class="fields">
    ${field("meta.solution",t("setup.f.solution"),"",0)}

    ${field("meta.developer",t("setup.f.developer"),"",0)}
    ${field("meta.sourcing",t("setup.f.sourcing"),"",0,Object.keys(SOURCING_KEY),null,v=>t(SOURCING_KEY[v]))}
    ${field("meta.sponsor",t("setup.f.sponsor"),t("setup.f.sponsorHint"),0)}
    ${field("meta.riskTier",t("setup.f.riskTier"),t("setup.f.riskTierHint"),0,Object.keys(RISK_KEY),null,v=>t(RISK_KEY[v]))}
    ${field("meta.reviewCadence",t("setup.f.cadence"),t("setup.f.cadenceHint"),0,Object.keys(CADENCE_KEY),null,v=>t(CADENCE_KEY[v]))}
    ${field("meta.startDate",t("setup.f.startDate"),"",0,null,"date")}

registerFramework({

/* Who holds what on this project. Owner-only to change, because
   granting access is itself a privilege. */
function accessHTML(){
  const a=accessOf(S), mine=roleOf(S), owner=canOwn(S);
  const rows=ROLES.flatMap(role=>a[role+"s"].map(id=>({id,role})));

  if(!identityKnown()){
    return `<h2>${esc(t("access.title"))}</h2>
    <div class="note"><p><b>${esc(t("access.unenforced.title"))}</b> ${esc(t("access.unenforced.detail"))}</p></div>`;
  }

  const list = rows.length
    ? `<table class="tbl"><thead><tr><th>${esc(t("access.col.person"))}</th><th>${esc(t("access.col.role"))}</th>${owner?`<th><span class="vh">${esc(t("access.col.change"))}</span></th>`:""}</tr></thead><tbody>
       ${rows.map(r=>`<tr>
         <td>${who(r.id)}${r.id===ME.id?` <span class="small">${esc(t("access.youTag"))}</span>`:""}</td>
         <td>${owner?`<select data-role-for="${esc(r.id)}">${ROLES.map(x=>`<option value="${x}"${x===r.role?" selected":""}>${esc(roleLabel(x))}</option>`).join("")}</select>`:esc(roleLabel(r.role))}</td>
         ${owner?`<td><button class="icon-btn" data-revoke="${esc(r.id)}" aria-label="${esc(t("access.removeLabel"))}">${esc(t("access.remove"))}</button></td>`:""}
       </tr>`).join("")}</tbody></table>`
    : `<p style="font-size:13px;color:var(--muted)">${esc(t("access.open"))}</p>`;

  /* The commonest way a record becomes unreachable: whoever created it is its
     only owner, and their account is later disabled. Nobody left can read, export,
     reassign or delete it, short of an emergency-access identity or a database
     edit (#42). Said to the one person who can fix it. */
  const soleOwner = owner && a.owners.length===1 && a.owners[0]===ME.id
    ? `<div class="note"><p><b>${esc(t("access.sole.title"))}</b> ${esc(t("access.sole.detail"))}</p></div>`
    : "";

  return `<h2>${esc(t("access.title"))}</h2>
  <p style="font-size:13px;color:var(--muted)">${esc(t("access.lede"))}
  ${esc(t(mine?ROLE_YOU_KEY[mine]:"access.you.none"))}</p>
  ${soleOwner}
  ${list}
  ${owner?`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px">
    <div class="field" style="margin:0"><label for="grantWho">${esc(t("access.add"))}</label>
      <input type="text" id="grantWho" placeholder="${esc(t("access.idPlaceholder"))}" data-grant-id></div>
    <div class="field" style="margin:0"><label for="grantRole">${esc(t("access.role"))}</label>
      <select id="grantRole" data-grant-role>${ROLES.map(x=>`<option value="${x}">${esc(roleLabel(x))}</option>`).join("")}</select></div>
    <button class="btn" data-act="grant">${esc(t("access.grant"))}</button>
  </div>`:""}
  ${unclaimed(S)&&identityKnown()?`<button class="btn primary" data-act="claim" style="margin-top:10px">${esc(t("access.claim"))}</button>`:""}`;
}

const roleNote = () => {
  const r = roleOf(S);
  return t(r ? ROLE_YOU_KEY[r] : "access.you.none");
};


/* ============================================================
   Changelog view
   The audit trail, rendered as what changed rather than that
   something did. Grouped by day, because "what happened at this
   meeting" is how a committee reads it.
   ============================================================ */
function changelogHTML(){
  const now = contentHash(S);

  if(!LOG.length){
    return `<p class="eyebrow">${esc(t("log.eyebrow"))}</p><h1>${esc(t("log.title"))}</h1>
    <p class="lede">${esc(t("log.lede"))}</p>
    <div class="note"><p>${esc(t("log.none"))}</p></div>
    ${fingerprintHTML(now)}
    ${pager()}`;
  }

  // Group by calendar day. The log arrives newest-first and stays that way.
  const days = [];
  LOG.forEach(e=>{
    const day = (e.at||"").slice(0,10);
    const last = days[days.length-1];
    if(last && last.day===day) last.entries.push(e);
    else days.push({day, entries:[e]});
  });

  const rows = days.map(d=>`
    <h2 style="font-size:15px;margin:18px 0 6px">${esc(fmtDay(d.day)||t("log.undated"))}</h2>
    <ul class="history">${d.entries.map(e=>{
      const c = e.change;
      const detail = c
        ? `<div class="small" style="color:var(--muted);margin-top:2px">
             <code>${esc(c.path)}</code></div>`
        : "";
      return `<li>
        <time>${esc((e.at||"").slice(11,16))}</time>
        <span>${esc(e.text)}
          <span style="color:var(--muted)">${tHtml("log.by",{},{who:who(e.by)})}</span>
          ${e.hash?`<span class="small" style="color:var(--muted)" title="${esc(t("log.fpAfter"))}">\u00b7 ${esc(shortHash(e.hash))}</span>`:""}
          ${detail}</span>
      </li>`;}).join("")}</ul>`).join("");

  return `<p class="eyebrow">${esc(t("log.eyebrow"))}</p><h1>${esc(t("log.title"))}</h1>
  <p class="lede">${esc(t("log.lede"))}
  ${logWindowNote()?`<br><strong>${esc(logWindowNote())}</strong>`:""}</p>
  ${olderLogControl()}
  ${rows}
  ${fingerprintHTML(now)}
  ${pager()}`;
}

/* Older entries, where the store can fetch them. Past the server's page cap the
   rest is reached through the API, and this says so rather than going quiet. */
function olderLogControl(){
  if(LOG_TOTAL===null || LOG_TOTAL<=LOG.length) return "";
  if(STORE && typeof STORE.showOlderLog==="function" && LOG.length<500)
    return `<p><button class="btn" data-act="${Act.LOG_OLDER}">${esc(t("log.older"))}</button></p>`;
  if(STORE && typeof STORE.showOlderLog==="function")
    return `<p class="small" style="color:var(--muted)">${tHtml("log.cap",{},{api:"<code>GET /api/projects/{id}/log?before=&lt;X-Log-Next&gt;</code>"})}</p>`;
  return "";
}

/* The record's current fingerprint, with the caveat attached. A hash
   printed without saying what it proves will be read as proving more
   than it does. */
function fingerprintHTML(md5hex){
  return `<h2 style="font-size:15px;margin-top:22px">${esc(t("fp.title"))}</h2>
  <p style="font-size:13px;color:var(--muted)">${esc(t("fp.lede"))}</p>
  <p><code style="font-size:13px">MD5 ${esc(md5hex)}</code></p>
  <div class="note"><p><b>${esc(t("fp.warnTitle"))}</b> ${esc(t("fp.warnDetail"))}</p></div>`;
}

const CHAI_TE = {"Ambient-AI":{"label":"Ambient documentation","url":"https://rai-content.chai.org/en/latest/Ambient-AI/t%26e-framework.html","metrics":[{"name":"AI-Generated Documentation Conciseness / Length Change","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability","benchmark":"External pass/fail threshold not established. Use clinician-written or finalized notes as the local baseline. Report: Length Change = (AI note word count - physician note word count) / physician note word count, plus clinician-rated conciseness. Flag material length increases for qualitative review, especially if conciseness ratings drop or added content does not improve completeness or correctness.","description":"Measures whether AI-generated clinical notes or summaries are longer, shorter, or comparable in length to clinician-written notes. Documentation length should be treated as a usability and quality-risk signal, not as proof that a note is better. Longer notes may capture more detail, but they can also add review burden, note bloat, and make clinically relevant information harder to find.","intended_use":"To monitor whether ambient AI creates documentation that is too long, redundant, or difficult to review, especially when added detail does not clearly improve clinical completeness or usefulness."},{"name":"Clinician Work Satisfaction Improvement","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability","benchmark":"Per the Supporting Literature, benchmark as a statistically significant improvement in clinician-reported satisfaction from baseline to post-implementation, measured with a named, validated instrument rather than an ad hoc item. Recommended instruments: the AMA Mini-Z 2.0 satisfaction items or the Stanford Professional Fulfillment Index (PFI) professional-fulfillment subscale. Report mean pre-post change, response rate, and subgroup results by specialty or usage intensity where available.","description":"Measures change in clinician satisfaction at work after implementation of an ambient AI documentation platform. This captures whether the tool improves day-to-day clinical work, even when objective EHR time savings are modest or uneven across clinicians.","intended_use":"To evaluate whether ambient AI improves clinician experience enough to support sustainable adoption, while still keeping documentation accuracy and safety as separate evaluation requirements."},{"name":"Clinician Preference for AI-Generated Clinical Summaries","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"Per the Supporting Literature, AI-generated summaries should be preferred by clinicians in >50% of blinded head-to-head comparisons against clinician-written summaries. Report as: Preference Rate = (# AI summaries preferred) / (# total paired comparisons), and report correctness, completeness, and safety separately.","description":"Measures the proportion of clinician reviewers who prefer AI-generated clinical summaries over clinician-written summaries when both are evaluated side-by-side under blinded or structured review conditions. Preference can show usefulness and acceptance, but it should not be used as a proxy for clinical correctness, safety, or downstream patient benefit.","intended_use":"To assess whether clinicians find AI-generated summaries useful enough for real documentation workflows, while separately checking whether those summaries are accurate, complete, and safe."},{"name":"Documentation Efficiency Improvement","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"Per the Supporting Literature, benchmark as approximately >=15% reduction, or >=0.9 minutes saved, in documentation time per appointment relative to pre-deployment baseline across a representative clinician sample. Compute as: ((baseline time - post-deployment time) / baseline time).","description":"Quantifies the change in clinician documentation time per appointment after implementation of an ambient AI documentation system. This should include objective EHR time measures when available and should be interpreted together with clinician review burden, note quality, and safety-error rates.","intended_use":"To measure whether ambient AI reduces real documentation workload in clinical settings without treating time savings alone as evidence of a better or safer documentation process."},{"name":"Patient-Clinician Engagement Improvement","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"External pass/fail threshold not established. Use positive change in patient or clinician-reported attention, communication, or engagement as the primary benchmark. As a study-derived reference point, Shah et al. reported 68% positive physician comments for patient engagement, so results near or below that level should be reviewed with qualitative feedback and patient survey data.","description":"Measures whether ambient AI documentation improves the patient-clinician interaction by reducing the need for clinicians to type, navigate the EHR, or divide attention during the visit. This can be assessed through patient surveys, clinician surveys, observation, or qualitative interviews.","intended_use":"To evaluate whether ambient AI improves the encounter experience, not just documentation throughput or time spent in the EHR."},{"name":"Reduction in Cognitive Task Load (NASA-TLX Change)","cat":"Usefulness, usability & efficacy","principle":"Usefulness, Usability, Efficacy","benchmark":"Per the Supporting Literature, benchmark as statistically significant reduction in the NASA-TLX domains used for documentation workload. For operational monitoring, target >=20% relative reduction in the audited workload domain without increased documentation error burden. Compute as: (baseline TLX - post TLX) / baseline TLX.","description":"Measures the pre- to post-deployment change in clinician cognitive workload using the NASA Task Load Index (NASA-TLX) for documentation tasks supported by ambient AI. A larger decrease indicates lower mental demand, effort, and temporal pressure during documentation.","intended_use":"To assess whether ambient AI meaningfully lowers the cognitive load of clinical documentation, rather than only shifting work from note-writing to note-review."},{"name":"Same-Day Note Closure Rate Increase","cat":"Usefulness, usability & efficacy","principle":"Usefulness","benchmark":"Per the Supporting Literature, benchmark as an increase of about >=6 percentage points, or >=9% relative improvement, in same-day note closure compared with baseline. Compute as: post-AI same-day documentation rate - pre-AI same-day documentation rate.","description":"Measures the change in the percentage of clinical encounters where documentation is completed on the same day of service after the introduction of an ambient AI. Same-day completion can reflect improved workflow fit, but should be interpreted alongside note quality and clinician review requirements.","intended_use":"To quantify whether ambient AI reduces documentation delays that contribute to clinician workload, delayed chart completion, and weaker continuity of care."},{"name":"Automatic Speech Recognition (ASR) Demographic Word Error Parity (DWEP)","cat":"Fairness & equity","principle":"Fairness, Bias Management","benchmark":"No universal clinical cut point is established. Report max absolute WER gap and WER ratio across demographic subgroups. Use <=0.10 absolute WER gap as a practical remediation trigger for key groups, and require subgroup review when one group has materially higher WER than the best-performing group.","description":"Measures parity in transcription word error rates (WER) across demographic subgroups relevant to ambient AI documentation, such as race, language, dialect, accent, age cohort, or speaker role. Compute WER for each subgroup and assess whether disparities exceed a pre-specified threshold.","intended_use":"To assess whether
