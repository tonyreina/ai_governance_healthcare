async function download(filename,data){
  if(STANDALONE){
    const types={html:"text/html",md:"text/markdown",json:"application/json",csv:"text/csv"};
    const ext=filename.split(".").pop();
    const url=URL.createObjectURL(new Blob([data],{type:(types[ext]||"text/plain")+";charset=utf-8"}));
    const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000); toast(t("toast.savedFile",{name:filename})); return;
  }
  if(!DL){ toast(t("toast.noDownloads")); return; }
  try{ const r=await DL.save({filename,data}); if(r&&r.status==="saved") toast(t("toast.savedFile",{name:filename})); }
  catch(e){
    const c=e&&e.code;
    if(c==="declined") return;
    if(c==="rate_limited") toast(t("toast.savePromptOpen"));
    else if(c==="extension_not_enabled") toast(t("toast.fileTypeUnavailable"));
    else { DL=null; updateDlUI(); toast(t("toast.noDownloads")); }
  }
}

/* Deleting a project destroys a governance record for everyone, and
   cannot be undone. A browser confirm() is one reflexive click away
   from that, and the click that does it looks exactly like every
   other confirm the user dismisses all day.

   So the name has to be typed. Not as friction for its own sake: it
   forces the user to read WHICH project they are about to destroy,
   which is the mistake that actually happens -- deleting the right
   kind of thing from the wrong row. */
function openDeleteDialog(){
  const name = S.meta.solution || t("project.untitled");
  /* Only the server keeps a version history, so only it can offer to destroy one.
     In the other modes deleting really does remove everything, and the plain
     wording is accurate; offering a choice with nothing behind it would not be. */
  const canPurge = typeof STORE.purgeVersions === "function";
  const heading = canPurge ? t("del.title") : t("del.titleForever");
  const consequence = canPurge
    ? `<p>${esc(t("del.removes"))}</p>
      <p><b>${esc(t("del.historyKeptTitle"))}</b> ${esc(t("del.historyKeptDetail"))}</p>`
    : `<p>${esc(t("del.destroys"))}</p>`;
  const purgeChoice = canPurge ? `
      <label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0 2px">
        <input type="checkbox" id="delPurge" aria-describedby="delPurgeHint"
               style="margin-top:4px">
        <span><b>${esc(t("del.purgeChoice"))}</b></span>
      </label>
      <p id="delPurgeHint" class="small" style="color:var(--muted);margin-top:0">${esc(t("del.purgeHint"))}</p>` : "";
  const host = document.createElement("div");
  host.className = "modal-backdrop";
  host.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delTitle">
      <h2 id="delTitle" style="margin-top:0">${esc(heading)}</h2>
      ${consequence}
      <p>${esc(t("del.archiveInstead"))}</p>${purgeChoice}
      <label for="delName">${tHtml("del.typeName",{},{name:`<b>${esc(name)}</b>`})}</label>
      <input type="text" id="delName" autocomplete="off" spellcheck="false"
             aria-describedby="delHint">
      <p id="delHint" class="small" style="color:var(--muted)">${esc(t("del.mustMatch"))}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn" data-del-cancel>${esc(t("dash.cancel"))}</button>
        <button class="btn" data-del-archive>${esc(t("del.archiveButton"))}</button>
        <button class="btn danger" data-del-go disabled>${esc(canPurge ? t("setup.delete") : t("del.forever"))}</button>
      </div>
    </div>`;
  document.body.appendChild(host);

  const field = host.querySelector("#delName");
  const go = host.querySelector("[data-del-go]");
  const purgeBox = host.querySelector("#delPurge");
  if(purgeBox) purgeBox.addEventListener("change", () => {
    go.textContent = purgeBox.checked ? t("del.goPurge") : t("setup.delete");
  });
  const close = () => { host.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key === "Escape") close(); };

  field.addEventListener("input", () => { go.disabled = field.value.trim() !== name; });
  field.addEventListener("keydown", e => { if(e.key === "Enter" && !go.disabled) go.click(); });
  host.querySelector("[data-del-cancel]").onclick = close;
  host.addEventListener("click", e => { if(e.target === host) close(); });
  document.addEventListener("keydown", onKey);

  host.querySelector("[data-del-archive]").onclick = () => {
    close();
    const v = !S.archived;
    S.archived = v;
    queuePatch(CUR, Object.assign({archived:v}, stamp()));
    writeLog(CUR, "Archived");
    renderMain(false);
    toast(t("toast.archived"));
  };

  go.onclick = async () => {
    if(field.value.trim() !== name) return;   // belt and braces
    const id = CUR;
    const destroy = !!(purgeBox && purgeBox.checked);
    go.disabled = true; go.textContent = t("del.deleting");
    close();
    delete pending[id]; clearTimeout(timers[id]);
    /* History first, then the project. If destroying the history fails, the project
       is NOT deleted, so nobody is left believing the data went when it did not.
       The other order would delete the record and then leave its history behind. */
    if(destroy){
      try{ await STORE.purgeVersions(id); }
      catch(err){ toast(t("toast.purgeFailed")); return; }
    }
    try{
      await STORE.remove(id); goHome();
      toast(destroy ? t("toast.deletedPurged") : t("toast.deleted"));
    }
    catch(err){
      toast(destroy ? t("toast.purgedNotDeleted")
                    : t("toast.deleteFailed"));
    }
  };

  setTimeout(() => field.focus(), 0);
}

/* ============================================================
   Session controls (#49)

   The application has no session of its own: identity arrives from the front door
   on every request. So the real automatic-logoff control is the front door's session
   lifetime, which docs/deploy.md says where to set. What lives here is defense in
   depth on a shared workstation:

   - an idle lock, off unless the server says how many minutes. It hides the record
     and asks for a reload, and a reload goes back through the front door, so a
     session that has ended is not quietly revived. It saves unsaved edits first, so
     locking never costs anyone work;
   - a sign-out link to wherever the front door ends a session, rendered only if the
     URL is one this page is willing to link to.
   ============================================================ */

/* The same allowlist the server applies to SIGN_OUT_URL (config._SIGN_OUT_OK): an
   https URL, or a path on this origin. Applied again here because the server's
   answer is data, and this is the last place before it becomes a link. */
const SIGN_OUT_OK = /^(https:\/\/[^\s/]+[^\s]*|\/(?!\/)[^\s]*)$/;

function renderSignOut(url){
  if(typeof url!=="string" || !SIGN_OUT_OK.test(url)) return false;
  const header=document.querySelector("header.top");
  if(!header) return false;
  let a=document.getElementById("signOut");
  if(!a){
    a=document.createElement("a");
    a.id="signOut"; a.className="btn ghost";
    const saved=document.getElementById("saved");
    header.insertBefore(a, saved ? saved.nextSibling : null);
  }
  a.setAttribute("href",url);
  a.textContent=t("session.signOut");
  return true;
}

const IDLE_EVENTS=["pointerdown","keydown","scroll","touchstart","mousemove","wheel"];
let IDLE_TIMER=null, IDLE_MS=0, IDLE_LAST=0, IDLE_BUMP=null;

function stopIdleLock(){
  if(IDLE_TIMER){ clearInterval(IDLE_TIMER); IDLE_TIMER=null; }
  if(IDLE_BUMP){ IDLE_EVENTS.forEach(e=>document.removeEventListener(e,IDLE_BUMP,true)); IDLE_BUMP=null; }
}

/* Start (or restart) the idle lock. 0 or less is off. Returns whether it is running. */
function startIdleLock(minutes){
  stopIdleLock();
  if(!(minutes>0)) return false;
  IDLE_MS=minutes*60000; IDLE_LAST=Date.now();
  IDLE_BUMP=()=>{ IDLE_LAST=Date.now(); };
  IDLE_EVENTS.forEach(e=>document.addEventListener(e,IDLE_BUMP,{passive:true,capture:true}));
  // Often enough to lock close to on time, rarely enough to cost nothing.
  IDLE_TIMER=setInterval(()=>{ if(Date.now()-IDLE_LAST>=IDLE_MS) lockNow(); },
                         Math.max(250,Math.min(IDLE_MS/4,15000)));
  return true;
}

function lockNow(){
  if(document.getElementById("lockScreen")) return;
  // Work in progress is written before anything is hidden. A lock that loses an
  // edit teaches people to turn it off.
  try{ flushAllChanges(); if(CUR && pending[CUR]) flush(CUR); }catch(e){}
  stopIdleLock();
  const el=document.createElement("div");
  el.id="lockScreen";
  el.setAttribute("role","dialog");
  el.setAttribute("aria-modal","true");
  el.setAttribute("aria-labelledby","lockTitle");
  el.innerHTML=`<div class="lock-card">
    <h1 id="lockTitle">${esc(t("session.locked"))}</h1>
    <p>${esc(t("session.lockedDetail"))}</p>
    <button class="btn primary" type="button" data-act="${Act.UNLOCK}">${esc(t("session.reload"))}</button>
  </div>`;
  document.body.classList.add("locked");
  document.body.appendChild(el);
  const b=el.querySelector("button"); if(b) b.focus();
}

/* Apply what /api/health told us. Fields an older server does not send are absent,
   which means off. */
function startSession(health){
  if(!health) return;
  renderSignOut(health.sign_out_url);
  startIdleLock(Number(health.idle_lock_minutes)||0);
}

function fillItems(p, stages, status){ STAGES.filter(s=>stages.includes(s.n)).forEach(s=>s.items.forEach(it=>p.items[it.id]={status,evidence:"",owner:"",due:""})); }

function buildSample(spec, now){
  const d=n=>ymd(addDays(now,n)), iso=n=>addDays(now,n).toISOString();
  const p=blankProject(spec.name);
  Object.assign(p.meta,{org:"Example Regional Health",chaiUseCase:spec.use||""},spec.meta||{});
  fillItems(p, spec.stages||[], "met");
  Object.entries(spec.items||{}).forEach(([id,[status,evidence,owner,due]])=>{
    p.items[id]={status,evidence:evidence||"",owner:owner||"",due:due==null?"":d(due)};
  });
  Object.entries(spec.gates||{}).forEach(([k,[decision,day]])=>{
    p.gates[k]={decision,by:"AI governance committee",date:d(day),
      rationale:/Stop|Revise/.test(decision)?"See the review record.":"Met criteria for this stage.",
      signedBy:ME.id||null,signedAt:iso(day)};
  });
  if(spec.card) p.card=Object.assign(spec.use==="sepsis-risk-prediction"?clone(EX_CARD):{}, spec.card);
  if(spec.metrics) p.metrics=clone(spec.metrics);
  if(spec.cardAt!=null) p.cardUpdatedAt=iso(spec.cardAt);
  if(spec.updated!=null) p.updatedAt=iso(spec.updated);
  return p;
}

function exampleInto(p){
  const today=new Date(), d=n=>ymd(addDays(today,n));
  Object.assign(p.meta,{org:p.meta.org||"Example Regional Health",developer:"Example Vendor, Inc.",sourcing:"Purchased from a vendor",sponsor:"Dr. A. Rivera, Hospital Medicine",reviewers:"CMIO; nursing informatics lead; data science lead; compliance officer; patient and family advisor",riskTier:"Moderate",startDate:d(-40),scope:"Adult med-surg units at two hospitals; vendor version 3.2",chaiUseCase:"sepsis-risk-prediction"});
  fillItems(p,[1,2],"met");
  p.items["s1-4"]={status:"partial",evidence:"Limited-English-proficiency patients not yet considered.",owner:"Nursing informatics",due:d(21)};
  p.items["s3-1"]={status:"partial",evidence:"Vendor provided a summary only; full provenance requested.",owner:"Procurement",due:d(14)};
  p.items["s3-2"]={status:"notmet",evidence:"Vendor has not shared development cohort demographics.",owner:"Procurement",due:d(14)};
  p.gates.A={decision:"Proceed",by:"AI governance committee",date:d(-30),rationale:"Clear clinical need; strong sponsor.",signedBy:ME.id||null,signedAt:new Date().toISOString()};
  p.metrics=clone(EX_METRICS);
  p.card=Object.assign(clone(EX_CARD),{releaseStage:"Silent evaluation"}); p.cardUpdatedAt=new Date().toISOString();
}

/* Additive and repeatable. The samples used to be loadable only into an
   empty workspace, from a button that vanished as soon as anything existed --
   so anyone who loaded them once could never get the ones added later, and
   there was no way to top up. Matching on name keeps a second press from
   duplicating what is already there. */
async function loadSamples(){
  const now=new Date();
  const have=new Set([...PROJECTS.values()].map(p=>(p.meta.solution||"").trim()));
  const missing=SAMPLES.filter(spec=>!have.has(spec.name));
  if(!missing.length){ toast(t("toast.samplesHere")); return; }
  for(const spec of missing) await createProject(buildSample(spec, now), "Sample project added");
  toast(t("toast.samplesAdded",{count:missing.length}));
}

document.addEventListener("click",async e=>{

  if(!btn) return;
  if(btn.dataset.archive && !WORKSPACE_RO){
    const id=btn.dataset.archive, p=PROJECTS.get(id);
    if(!p) return;
    if(!canOwn(p)){ toast(t("toast.ownerArchive")); return; }
    const v=!p.archived;
    p.archived=v;
    queuePatch(id, Object.assign({archived:v}, stamp()));
    writeLog(id, v?"Archived":"Restored");
    updateDashboard();
    toast(v?t("toast.archived"):t("toast.restored"));
    return;
  }
  if(btn.dataset.revoke && canOwn(S)){
    const id=btn.dataset.revoke;
    if(wouldOrphan(S,id,"")){ toast(t("toast.keepOwner")); return; }
    S.access=accessPatch(S,id,""); queuePatch(CUR,Object.assign({access:S.access},stamp()));
    writeLog(CUR,`Removed access for ${id}`); renderMain(false); toast(t("toast.accessRemoved")); return;
  }
  if(btn.dataset.open){ openProject(btn.dataset.open); return; }
  if(btn.dataset.home){ goHome(); return; }
  if(btn.dataset.go){ go(btn.dataset.go); return; }
  if(btn.dataset.framework && !RO){
    const f=frameworkById(btn.dataset.framework);
    if(f && f.id==="optica") setOpticaEnabled(!f.enabled(S));
    return;
  }
  if(btn.dataset.filter){ UI.filter=btn.dataset.filter; saveUI(); updateDashboard(); document.querySelector(`[data-filter="${UI.filter}"]`)?.focus(); return; }
  if(btn.dataset.set && !RO){
    const id=btn.dataset.set, store=btn.dataset.store||"items";
    const cur=((get(store)||{})[id]||{}).status||"";
    const val = cur===btn.dataset.s ? "" : btn.dataset.s;
    edit(`${store}.${id}.status`, val);
    const li=btn.closest(".ci");
    li.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.s===val)));
    if((val==="partial"||val==="notmet") && !openItems.has(id)){ openItems.add(id); li.classList.add("open"); const m=li.querySelector(".more"); m.textContent="Hide details"; m.setAttribute("aria-expanded","true"); }
    renderRail(); return;
  }
  if(btn.dataset.toggle){
    const id=btn.dataset.toggle, li=btn.closest(".ci"); const open=!openItems.has(id);
    open?openItems.add(id):openItems.delete(id);
    li.classList.toggle("open",open); btn.textContent=open?"Hide details":"Evidence & owner"; btn.setAttribute("aria-expanded",String(open));
    if(open && !RO) li.querySelector("textarea").focus();
    return;
  }
  if(btn.dataset.gate && !RO){
    const k=btn.dataset.gate, g=S.gates[k]||{};
    const val = g.decision===btn.dataset.d ? "" : btn.dataset.d;
    const now=new Date().toISOString();
    const patch={gates:{[k]:{decision:val, signedBy:val?(ME.id||null):null, signedAt:val?now:null, date: val ? (g.date||TODAY()) : (g.date||"")}}};
    deepMerge(S,patch); const st=stamp(); Object.assign(S,st);
    queuePatch(CUR, Object.assign(patch,st));
    writeLog(CUR, val?`${GATES[k].title}: ${val}`:`${GATES[k].title}: decision cleared`);
    renderRail(); renderMain(false); return;
  }
  // Add a CHAI-recommended metric. Name and category only: the value, the
  // interval and the population are measurements the organization has to make,
  // and pre-filling them would be inventing results.
  if(btn.dataset.te && !RO){
    const name=btn.dataset.te;
    if(!S.metrics.some(m=>(m.name||"").trim().toLowerCase()===name.trim().toLowerCase())){
      S.metrics.push({cat:btn.dataset.teCat||METRIC_CATS[0],name,value:"",ci:"",pop:""});
      saveMetrics();
    }
    renderMain(false); renderLabel();
    // Put the cursor where the user now has to type.
    const rows=[...document.querySelectorAll('.mtable input[aria-label="Metric"]')];
    const row=rows.find(i=>i.value===name);
    if(row) row.closest("tr").querySelector('input[aria-label="Value"]').focus();
    return;
  }
  if(btn.dataset.delmetric!=null && !RO){ S.metrics.splice(+btn.dataset.delmetric,1); saveMetrics(); renderMain(false); renderLabel(); return; }
  const a=btn.dataset.act; if(!a) return;
  if(a===Act.UNLOCK){ location.reload(); return; }
  if(a==="new"){ const f=document.getElementById("newform"); if(f){ f.hidden=false; document.getElementById("newname").focus(); } return; }
  if(a==="new-cancel"){ document.getElementById("newform").hidden=true; return; }
  if(a==="samples"){
    btn.disabled=true;
    try{ await loadSamples(); }
    finally{ btn.disabled=false; }
    return;
  }
  if(a==="legacy"){
    try{ const j=JSON.parse(localStorage.getItem("chai-review-v1")); const p=normalize(Object.assign(blankProject(j.meta.solution),{meta:j.meta,items:j.items||{},gates:j.gates||{},metrics:j.metrics||[],card:j.card||{}}));
      Object.values(p.items).forEach(x=>{ if(x) delete x._open; });
      const id=await createProject(p,"Imported from a review saved in this browser"); if(id){ localStorage.setItem("chai-legacy-imported","1"); document.getElementById("legacyBanner")?.remove(); toast("Review added to the workspace"); }
    }catch(err){ toast(t("toast.legacyFailed")); }
    return;
  }
  if(a==="legacy-dismiss"){ try{localStorage.setItem("chai-legacy-imported","1");}catch(e){} document.getElementById("legacyBanner")?.remove(); return; }
  if(a==="import"){ document.getElementById("importFile").click(); return; }
  if(a==="dl-csv"){ download(`ai-governance-portfolio-${TODAY()}.csv`, exportCSV()); noteExport(ExportFormat.CSV); return; }
  if(!S) return;
  if(a===Act.LOG_OLDER){ if(STORE && STORE.showOlderLog) STORE.showOlderLog(CUR); return; }
  if(a==="claim"){
    if(!ME.id){ toast(t("toast.noUserClaim")); return; }
    S.access=accessPatch(S,ME.id,"owner"); queuePatch(CUR,Object.assign({access:S.access},stamp()));
    writeLog(CUR,"Claimed ownership"); RO=false; CAN_DELETE=true; renderProject(false); toast(t("toast.nowOwner")); return;
  }
  if(a==="grant"){
    if(!canOwn(S)){ toast(t("toast.ownerGrant")); return; }
    const el=document.querySelector("[data-grant-id]");
    const id=el&&el.value?el.value.trim():"";
    const roleEl=document.querySelector("[data-grant-role]");
    const role=roleEl?roleEl.value:"reader";
    if(!id){ toast(t("toast.enterId")); return; }
    S.access=accessPatch(S,id,role); queuePatch(CUR,Object.assign({access:S.access},stamp()));
    writeLog(CUR,`Granted ${ROLE_LABEL[role].toLowerCase()} to ${id}`); renderMain(false); toast(t("toast.accessGranted")); return;
  }
  if(a==="addmetric"){ S.metrics.push({cat:METRIC_CATS[0],name:"",value:"",ci:"",pop:""}); saveMetrics(); renderMain(false); const ins=document.querySelectorAll('.mtable input[aria-label="Metric"]'); ins[ins.length-1]?.focus(); }
  else if(a==="example"){ exampleInto(S); const st=stamp(); queuePatch(CUR,Object.assign({meta:clone(S.meta),items:clone(S.items),gates:clone(S.gates),metrics:clone(S.metrics),card:clone(S.card),cardUpdatedAt:S.cardUpdatedAt},st)); writeLog(CUR,"Example data filled in"); renderProject(false); toast("Example filled in"); }
  else if(a==="archive"){ if(!canOwn(S)){ toast(t("toast.ownerArchive")); return; } const v=!S.archived; S.archived=v; queuePatch(CUR,Object.assign({archived:v},stamp())); writeLog(CUR,v?"Archived":"Restored"); renderMain(false); toast(v?t("toast.archived"):t("toast.restored")); }
  else if(a==="delete"){ if(!canOwn(S)){ toast(t("toast.ownerDelete")); return; } openDeleteDialog(); }
  else if(a==="newreview"){ const now=new Date().toISOString(); const patch={gates:{D:{date:TODAY(),signedBy:ME.id||null,signedAt:now}}}; deepMerge(S,patch); queuePatch(CUR,Object.assign(patch,stamp())); writeLog(CUR,`Checkpoint D: periodic review recorded (${S.gates.D.decision})`); renderRail(); renderMain(false); toast("Periodic review recorded"); }
  else if(a==="dl-html"){ download(`${slug(S.meta.solution)}-chai-review.html`, exportHTML()); noteExport(ExportFormat.HTML); }
  else if(a==="dl-md"){ download(`${slug(S.meta.solution)}-chai-review.md`, exportMD()); noteExport(ExportFormat.MD); }
  else if(a==="dl-json"){ download(`${slug(S.meta.solution)}-chai-review.json`, JSON.stringify(projectJSON(S),null,2)); noteExport(ExportFormat.JSON); }
  else if(a==="dl-pdf"){ exportPDF(); noteExport(ExportFormat.PDF); }
  else if(a==="print"){ window.print(); noteExport(ExportFormat.PDF); }
});

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id===HeaderControl.LANGUAGE){ setLocale(el.value); relocalize(); return; }
  if(el.id===SearchField.QUERY){ UI.q=el.value; updateDashboard(); return; }
  if(el.id===SearchField.ALL_TEXT){
    UI.qAll=el.checked;
    const q=document.getElementById(SearchField.QUERY);
    if(q) q.placeholder = t(UI.qAll ? SEARCH_HINT.ALL_TEXT : SEARCH_HINT.NAMES);
    // Names are what people search for, and the lists hold ids: learn the names first.
    if(UI.qAll) warmNames([...PROJECTS.values()].flatMap(idsOfProject)).then(updateDashboard);
    updateDashboard(); return;
  }
  const p=el.dataset && el.dataset.bind; if(!p || RO || !S) return;
  // Mark this as live typing so the changelog waits for the field to be
  // finished rather than describing each keystroke.
  setTyping(true);
  try{ edit(p, el.value); } finally { setTyping(false); }
  if(p.startsWith("meta.")||p.startsWith("card.")||p.startsWith("metrics.")) renderLabel();
  if(p==="meta.solution"||p.startsWith("card.")) renderRail();
});
/* A text edit is finished when focus leaves the field. Capture phase, because
   `blur` does not bubble. This is what turns a sentence into one changelog
   entry regardless of how long the typist paused in the middle of it. */
document.addEventListener("blur", e=>{
  const el=e.target;
  const p=el && el.dataset && el.dataset.bind;
  if(p && CUR) flushChanges(CUR, p);
}, true);

document.addEventListener("change",e=>{
  const el=e.target;
  // The use-case picker is stored on the project, so the chosen framework
  // persists and the suggestions are there next time someone opens stage 4.
  if(el.dataset && el.dataset.teUse!=null && S && !RO){ edit("meta.chaiUseCase", el.value); renderMain(false); return; }
  if(el.dataset && el.dataset.bind && S && !RO && (el.tagName==="SELECT" || el.type==="date")){
    edit(el.dataset.bind, el.value);   // discrete: edit() flushes it already
    renderLabel(); renderRail();
  }
});
/* An edit still in the buffer when the page goes away would never be
   described. pagehide covers closing, navigating and mobile backgrounding;
   visibilitychange catches a tab switch, which is a common way to stop
   mid-sentence. */

addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushAllChanges(); });

(async()=>{
  let db=null, user=null;
  const hasClaude = window.claude && typeof window.claude.use==="function";
  if(hasClaude){
    const dlP = window.claude.use("downloads").then(d=>{DL=d;}).catch(()=>{}).finally(()=>{dlChecked=true; updateDlUI();});
    [db,user] = await Promise.all([window.claude.use("db").catch(()=>null), window.claude.use("user").catch(()=>null)]);
  } else { dlChecked=true; }
  USER=user;
  if(user){
    try{ ME.id = await user.id(); }catch(e){}
    try{ const c=await user.can("data.write"); if(db && c===false) WORKSPACE_RO=RO=true; }catch(e){}
    try{ CAN_DELETE = (await user.canEdit()) || (await user.isOwner()); }catch(e){ CAN_DELETE=false; }
  }
  if(db){
    STORE=new DbStore(db); MODE=Mode.ARTIFACT;
    if(RO) setMode(t("mode.viewOnly"),"ro"); else setModeFor(MODE);
    showArtifactNotice();
  }
  else {
    // Self-hosted backend, if this page is served by one. Checked only when
    // there is no artifact database, so the artifact path costs nothing.
    const api = await detectApi("/api");

    if(api.verdict === "ok"){
      rememberApiHere();
      STORE=new ApiStore("/api"); MODE=Mode.API; CAN_DELETE=true;
      setModeFor(MODE);
      showScopeNotice();
      startSession(api.health);   // sign-out link and idle lock, as the server configured
      // Identity is established by the proxy, so the browser cannot choose it.
      try{
        const me = await fetch("/api/me",{credentials:"same-origin"}).then(r=>r.json());
        if(me && me.id){ ME.id=me.id; if(me.name) NAMES[me.id]=me.name; }
      }catch(e){}
    }
    else if(api.verdict === "denied"){
      // The server knows who you are and said no. Falling back here would
      // hand a denied user a working private workspace -- access control
      // failing open into a usable app. Stop instead.
      fatalError(t("fatal.denied.title"), t("fatal.denied.detail"),
        {mode:t("mode.noAccess"), hint:t("fatal.denied.hint")});
      return;
    }
    else if(api.verdict === "error" || api.verdict === "unreachable" || apiSeenHere()){
      // This origin has served a real API before, or something is there and
      // failing. Either way this is a deployment with a server, and browser-
      // local storage is not a substitute for it: the work would be invisible
      // to colleagues, absent from the audit log, and stranded on this machine.
      fatalError(t("fatal.unreachable.title"), t("fatal.unreachable.detail"),
        {hint:t("fatal.unreachable.hint")});
      return;
    }
    else {
      // Nothing API-shaped at this origin and none ever seen: a genuinely
      // static host. localStorage is the intended mode here.
      STORE=new LocalStore(); MODE=Mode.LOCAL; CAN_DELETE=true;
      setModeFor(MODE);
      showStorageWarning();
    }
  }
  document.body.classList.toggle("ro",RO);
  STORE.subscribeAll(onProjects,onDbError);
})();
