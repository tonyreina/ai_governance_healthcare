lly necessary terminology, rather than categorically suppressing all flagged content. * The objective is to extend existing toxicity measurement frameworks to this use case by capturing subtler forms of potentially harmful language. While overtly toxic content (e.g., hate or sexual speech) is unlikely in prior authorization decisions, language perceived as condescending, dismissive, or minimizing patient suffering may occur. The toxicity measurement should therefore account for such nuanced expressions within the Toxicity Language Score."},{"name":"Auto-Approval vs. Manual Review Outcome Disparity","cat":"Fairness & equity","principle":"Bias Management","description":"Compare health and access outcomes for patients whose prior auth requests were auto-approved versus those that required manual review. Stratify by demographic and clinical subpopulations to detect disparities that may not be visible in overall metrics. This approach addresses the \"Symptoms Paradox,\" where seemingly appropriate use of manual review in high-risk or ambiguous cases can unintentionally concentrate delays or burdens on vulnerable subgroups.","intended_use":"Identify subpopulations that experience differential access, approval, or clinical outcomes based on how their requests are routed (auto vs. manual). Surface cases where routing logic may exacerbate disparities or clinical risks. Support refinement of triage thresholds or review escalation rules. Note: \"identify subpopulations\" should be done within clinical conditions to avoid confounding by condition."},{"name":"Demographic Appeal Delay Difference","cat":"Fairness & equity","principle":"Bias Management","when":"Pre-Implementation for Developers; Post-Implementation for Implementers","benchmark":"No recommended benchmark","description":"Evaluate claims based on expected time to approval, or on appeal, by demographic group within clinical categories of care. A process may have parity in percentage approved, but that process may auto-approve without appeal at a rate different than another demographic group's claims that experience a higher appeals rate.","intended_use":"Evaluate whether the AI-supported prior authorization process produces equitable turnaround times and appeal experiences across demographic groups. This metric identifies if certain populations face longer delays or higher reliance on appeals to achieve approval, even when overall approval rates appear similar. It ensures that efficiency gains from automation do not introduce administrative inequities."},{"name":"Failure Analysis","cat":"Safety & reliability","principle":"Safety","when":"Pre-Implementation","benchmark":"Example benchmark includes: Risk Priority Number (RPN) < 100; the RPN scale typically ranges from 1 to 1000 (S, O, D each rated 1--10). A value of 100 (e.g., 5×5×4) indicates a moderate level of risk. Keeping all critical failure modes below 100 ensures that the AI solution does not go live with any unacceptably high-risk scenarios.","description":"Software failure analysis involves identifying the root cause of software failures to improve reliability and prevent future occurrences. Common types of software failure analysis include: Fault Tree Analysis (FTA), Failure Modes and Effects Analysis (FMEA), and Root Cause Analysis. These techniques help analyze potential failure scenarios, their impact, and the underlying reasons for failure.","intended_use":"Identify and mitigate risks in AI-supported criteria matching prior to live deployment. This means systematically evaluating where and how the AI might fail, such as misalignment with payer criteria, and determining how severe these failures would be if they occurred in real-world use. As an example in this context, FMEA is adapted to the AI lifecycle to account for unique risks like data drift, model bias, and hallucinations in generated outputs. Each identified failure mode is scored based on Severity (S), Occurrence (O), and Detection (D), producing a Risk Priority Number (RPN = S×O×D). * Example scenario: in an AI-enabled prior authorization system, model performance can rapidly degrade when payer medical policies change, rendering historical approval/denial patterns obsolete. Failure Analysis (FMEA) helps identify this as a high-severity failure mode, assess its likelihood, and implement mitigations such as automated policy-change alerts, shadow model testing, and timely retraining. This ensures the AI remains aligned with current payer rules, avoiding non-compliant decisions and care delays."},{"name":"Uptime Ratio / System Reliability","cat":"Safety & reliability","principle":"Reliability","benchmark":"Vendor organizations should strive for system uptime ≥ 99.9%","description":"Quantifies system reliability by measuring the proportion of time AI services are available and functional.","intended_use":"Ensure AI-based criteria matching services are consistently operational within clinical workflows. An example is Google's Cloud Healthcare Service Level Agreement (SLA)"}]},"sepsis-risk-prediction":{"label":"Sepsis risk prediction","url":"https://rai-content.chai.org/en/latest/sepsis-risk-prediction/te.html","metrics":[{"name":"Sequential Organ Failure Assessment (SOFA) score","cat":"Usefulness, usability & efficacy","intended_use":"numerically quantifies the number and severity of failed organs."},{"name":"Risk Ratio","cat":"Usefulness, usability & efficacy","intended_use":"metric computes the area under the curve (AUC) for the Receiver Operating Characteristic Curve (ROC). The return values represent how well the model used is predicting the correct classes, based on the input data. A score of 0.5 means that the model is predicting exactly at chance"},{"name":"Area under the curve (AUC)—precision recall curve (PRC) (AUC-PRC)","cat":"Usefulness, usability & efficacy","intended_use":"model performance metric for binary responses that is appropriate for rare events and not dependent on model specificity"},{"name":"Precision (or Positive Predictive Value, PPV)","cat":"Usefulness, usability & efficacy","intended_use":"the fraction of correctly labeled positive examples out of all of the examples that were labeled as positive. It is computed via the equation: Precision = TP / (TP + FP) where TP is the True positives (i.e. the examples correctly labeled as positive) and FP is the False positive examples (i.e. the examples incorrectly labeled as positive). Retrospective cohort studies: recommended PPV at Sensitivity = 0.9"},{"name":"Recall (or Sensitivity)","cat":"Usefulness, usability & efficacy","intended_use":"Recall is the fraction of the positive examples that were correctly labeled by the model as positive. It can be computed with the equation: Recall = TP / (TP + FN) Where TP is the number of true positives and FN is the number of false negatives. Retrospective cohort studies: Recommended PPV at Sensitivity = 0.9"},{"name":"Specificity","cat":"Usefulness, usability & efficacy","intended_use":"measure performance in external validation cohort; measure performance on different floors / inpatient services. Recommended PPV at Sensitivity = 0.9"},{"name":"F1 score","cat":"Usefulness, usability & efficacy","intended_use":"calculated from the precision and recall of the test, where the precision is the number of true positive results divided by the number of all positive results, including those not identified correctly, and the recall is the number of true positive results divided by the number of all samples that should have been identified as positive."},{"name":"Root Mean Squared Error (RMSE)","cat":"Usefulness, usability & efficacy","intended_use":"measure of the differences between values (sample or population values) predicted by a model or an estimator and the values observed. The RMSE represents the square root of the second sample moment of the differences between predicted values and observed values or the quadratic mean of these differences."},{"name":"Coefficient of Determination (R-squared)","cat":"Usefulness, usability & efficacy","intended_use":"the proportion of the variance in the dependent variable that is predictable from the independent variables."},{"name":"Time-to-Event","cat":"Usefulness, usability & efficacy","intended_use":"Assessment of the time between prediction and event/outcome. For example, the average number of hours between an alert and administration of antibiotics."},{"name":"Inclusion / Exclusion Analysis","cat":"Usefulness, usability & efficacy","intended_use":"Assessment of model performance after applying conditions of use. For example, measuring performance characteristics following exclusion of patients on antibiotics, patients with invasive surgery in the last 24 hours, bone marrow transplant patients, etc."},{"name":"Ground Theory Analysis","cat":"Usefulness, usability & efficacy","intended_use":"Use this qualitative research method to develop theories based on systematically gathered and analyzed data. Conduct semi-structured interviews with clinicians or relevant end-users to gather insights. Focus on themes such as how clinicians perceive the AI system’s accuracy and trustworthiness and how well the AI system fits into existing clinical workflows. Use iterative coding and constant comparison to analyze interview data. Generate theories that are grounded in the actual experiences and needs of end-users."},{"name":"HOUsing-based SocioEconomic Status measure (HOUSES) Index","cat":"Usefulness, usability & efficacy","intended_use":"compare balanced error rate (BER) against different socioeconomic status (SES) levels"},{"name":"Differential Missingness","cat":"Usefulness, usability & efficacy","intended_use":"probability of data being missing varies across different groups or conditions within a study. This can lead to biased estimates and affect the validity of the study's conclusions."},{"name":"Equality of Opportunity Difference (EOD)","cat":"Usefulness, usability & efficacy","intended_use":"measures the deviation from the equality of opportunity, which means that the same proportion of each population receives the favorable outcome. This measure must be equal to 0 to be fair."},{"name":"Confusion Matrix","cat":"Usefulness, usability & efficacy"},{"name":"Equalized Odds","cat":"Usefulness, usability & efficacy","intended_use":"prediction errors are distributed equally across different groups"},{"name":"Slice Finding","cat":"Usefulness, usability & efficacy","intended_use":"Automatically identify subgroups in the data where the model is underperforming (e.g. based on demographics, comorbidities, etc.)"},{"name":"Accuracy","cat":"Safety & reliability","intended_use":"Evaluate the correctness of the AI model's predictions (e.g., percentage of correct predictions). Accuracy = (TP + TN) / (TP + TN + FP + FN) , where: TP = True Positive; TN = True Negative; FP = False Positive; FN = False Negative."},{"name":"Risk Framework","cat":"Safety & reliability","intended_use":"assess the safety and reliability of predictive AI algorithms using a risk framework."},{"name":"Task Analysis","cat":"Safety & reliability","intended_use":"Conduct a task analysis, failure modes and effects analysis (FMEA), or detailed walkthroughs to identify potential failure points."},{"name":"Non-Inferiority Assessment","cat":"Safety & reliability","intended_use":"Compare the AI system to clinician experts, particularly in cases where prioritization tools are used, to ensure adequacy."},{"name":"Likelihood of Failure at Identified Failure Points","cat":"Safety & reliability","intended_use":"measure developed and evaluated during pre-implementation."},{"name":"Number of Successful Predictions","cat":"Safety & reliability","intended_use":"quantitative measure of reliability (e.g., number of correct predictions over total cases)."},{"name":"Percentage of Errors","cat":"Safety & reliability","intended_use":"Quantitative measure of errors over a given number of cases."},{"name":"Predetermined Change Control Plan","cat":"Safety & reliability","intended_use":"Identify performance metrics that will be monitored and their corresponding control limits to trigger model updates."},{"name":"Saliency Maps","cat":"Usefulness, usability & efficacy","intended_use":"highlight the important regions of the input data, such as images, that influenced the model's decisions, but also consider the reliability of these maps and the rational for that region of the data being included"},{"name":"Locally Interpretable Model-Agnostic Explanations (LIME)","cat":"Usefulness, usability & efficacy","intended_use":"method developed to enhance the explainability and transparency of machine learning models, particularly those that are complex and difficult to interpret. The core idea of LIME is to approximate the behavior of a complex model with a simpler, more interpretable model in the context of a specific prediction."},{"name":"Shapley Additive Explanation (SHAP)","cat":"Usefulness, usability & efficacy","intended_use":"method that quantifies the contribution of each feature to the output of a predictive model. Rooted in cooperative game theory, SHAP values provide a theoretically sound approach for interpreting complex models by distributing the prediction difference fairly among the input features."},{"name":"Prototypical Explanations","cat":"Usefulness, usability & efficacy","intended_use":"identify which parts of the model are contributing to the model's decisions. This approach relies on human experts to identify prototypes for the explanation to use as a comparison, which can be a limitation of the approach"},{"name":"Availability of AI System Facts","cat":"Usefulness, usability & efficacy","intended_use":"Automated alert followed by manual screening allows for additional transparency relative to completely automated solutions."},{"name":"Locality of the assessment","cat":"Safety & reliability","intended_use":"observe and characterize the stakeholders receiving information on patient."},{"name":"Consult security experts","cat":"Safety & reliability","intended_use":"this may include folks such as Data Protection Officer in the planning phase to develop a data governance strategy."},{"name":"Leverage industry security guidelines","cat":"Safety & reliability","intended_use":"use security guidelines (e.g., NIST, ISO/IEC, OECD) and refine them with nuanced expert judgment."},{"name":"Data Protection Impact Assessments (DPIA)","cat":"Safety & reliability","intended_use":"conducting Data Protection Impact Assessments (DPIA) during the design phase."},{"name":"Threat Modeling","cat":"Safety & reliability","intended_use":"anticipate and prepare for potential breaches, including attacker incentives and impact evaluations."},{"name":"Evaluation of the likelihood and impact of various attack vectors","cat":"Safety & reliability"},{"name":"Data Provenance Tracking","cat":"Safety & reliability","intended_use":"ensure data integrity."},{"name":"Numeric results from risk assessments","cat":"Safety & reliability"},{"name":"Outcomes of privacy preservation evaluations","cat":"Safety & reliability"},{"name":"System Usability Scale (SUS)","cat":"Usefulness, usability & efficacy","intended_use":"this metric refers to the possibility that an AI model or system performs differently based on the socioeconomic background of the users or subjects. It evaluates whether individuals from different SES levels (e.g., income, education, occupation) experience varying levels of accuracy, error rates, or outcomes from the system, potentially highlighting biases or inequities in how the system treats different socioeconomic groups"},{"name":"Usability Testing and Heuristic Evaluation","cat":"Usefulness, usability & efficacy","intended_use":"In addition to the intrinsic and extrinsic evaluation conducted in the pre-implementation stages, one must consider the user's interaction with the system. Use usability testing and heuristic evaluation to evaluate the AI system's interface."},{"name":"User Satisfaction Survey","cat":"Usefulness, usability & efficacy"},{"name":"Sensitivity, Specificity, PPV","cat":"Usefulness, usability & efficacy","intended_use":"measure performance in external validation cohort; measure performance on different floors / inpatient service. PPV at Sensitivity = 0.9"},{"name":"Pre-post implementation differences in usefulness metrics","cat":"Usefulness, usability & efficacy","intended_use":"calculate pre-post rate differences in before and after cohorts: - Proportion of positives leading to treatment - % treaded for sepsis - Time to first IV antibiotic - Time to first IVF bolus - Volume of IVF - ICU-free d to d 30 - 30-day mortality - Rates of systolic hypotension in ED - Rates of Intubation - Rates of CPR required - Rates of required pressor - Median initial serum lactic acid - Positive blood culture - Time from arrival to hypotension"},{"name":"balanced error rate (BER)","cat":"Fairness & equity","intended_use":"average of the errors on each class: BER = 0.5*(FP/(TN+FP) + FN/(FN+TP)), where: TP = True Positive; TN = True Negative; FP = False Positive; FN = False Negative."},{"name":"Comparative Biases","cat":"Fairness & equity","intended_use":"compare the biases of the general population, the specific population, and the data used"},{"name":"Implement a process for identifying and recognizing model drift","cat":"Fairness & equity","intended_use":"three main types of drift that should be acknowledged, monitored and mitigated: concept drift, data drift, label drift."},{"name":"False alarm rate","cat":"Safety & reliability","intended_use":"probability that a detection decision of \"yes\" is made when the phenomena of interest is absent; specific quantitative measure of how often the algorithm generates false positives."},{"name":"False negative rate","cat":"Safety & reliability","intended_use":"number of false negatives, divided by the number of all samples that are actually positives; specific quantitative measure of how often the algorithm fails to detect sepsis"},{"name":"Proportion of patients who received IV antibiotics","cat":"Safety & reliability","intended_use":"Retrospective cohort study comparing patients of a predefined age presenting to an ED who triggered a false-positive sepsis alert during 2 different n-month time periods: a silent alert period when alerts were generated but not visible to clinicians and an active alert period when alerts were visible."},{"name":"Admissions and LOS differences","cat":"Safety & reliability","intended_use":"Assess user engagement with the model recommendations. For example, the acknowledgement reasons on a Best Practice Advisory."},{"name":"Technical Support","cat":"Safety & reliability","intended_use":"Point(s) of contact for clinical end-users to escalate model issues."},{"name":"Random Forest","cat":"Usefulness, usability & efficacy","intended_use":"identify the 10 most important features used in predictions and send those features to users to determine where to start the evaluation to explain output; users can focus on the data elements that can change the least to impact the prediction class. Store all predictions of the model for a specified time period to allow for ongoing monitoring of performance degradation"},{"name":"Determine who on the care team is receiving alerts (components of screening)","cat":"Usefulness, usability & efficacy","intended_use":"Automated alert followed by manual screening allows for additional transparency relative to completely automated solutions."},{"name":"Dynamic Post-implementation Audits","cat":"Safety & reliability","intended_use":"include regularly updated security protocols based on new threats and emerging vulnerabilities."},{"name":"Limiting Access to AI Models","cat":"Safety & reliability","intended_use":"to mitigate privacy attacks, ensuring only authorized users have access to sensitive parts of the model and its output."},{"name":"Intercepting AI Model Outputs","cat":"Safety & reliability","intended_use":"leverage to counter security threats and prevent adversarial data extraction."},{"name":"Input Filtering","cat":"Safety & reliability","intended_use":"leverage to mitigate adversarial attacks, though acknowledging its potential weaknesses."},{"name":"Authenticated Inputs or Inputs with Provenance","cat":"Safety & reliability","intended_use":"leverage to defend against adversarial attacks, particularly in sensitive applications like imaging."}]}};

/* ============================================================
   CHAI: lifecycle rules
   Phase, review cadence, compliance flags and status. These read
   STAGES and GATES from 00-definition.js and are CHAI's alone;
   nothing here is shared with another framework.
   ============================================================ */
function allItems(){ return STAGES.flatMap(s=>s.items.map(it=>({...it,stage:s}))); }
function gapsUpTo(p,stageId){
  const idx=STAGES.findIndex(s=>s.id===stageId);
  return STAGES.slice(0,idx+1).flatMap(s=>s.items.filter(it=>{const st=(p.items[it.id]||{}).status; return !st||st==="notmet";}).map(it=>({...it,stage:s})));
}
const dec = (p,k)=> ((p.gates||{})[k]||{}).decision||"";
const isGo = d => /^(Proceed|Continue)/.test(d||"");
function phase(p){
  if([dec(p,"A"),dec(p,"B"),dec(p,"C")].includes("Stop")) return {key:"retired",label:"Stopped"};
  if(dec(p,"D")==="Retire") return {key:"retired",label:"Retired"};
  if(isGo(dec(p,"C"))) return {key:"deployed",label:"Deployed",stage:6};
  if(isGo(dec(p,"B"))) return {key:"pilot",label:"Pilot",stage:5};
  if(isGo(dec(p,"A"))) return {key:"build",label:"Design, build & assess",stage:2};
  return {key:"intake",label:"Intake & planning",stage:1};
}
function cadenceMonths(p){ const n=parseInt(p.meta.reviewCadence,10); return n>0?n:(p.meta.riskTier==="High"?6:12); }
function nextReview(p){
  if(phase(p).key!=="deployed") return null;
  const base = parseDay(dec(p,"D") ? p.gates.D.date : "") || parseDay(p.gates.C.date);
  if(!base) return null;
  return ymd(addMonths(base,cadenceMonths(p)));
}
function latestGo(p){
  let best=null;
  ["A","B","C","D"].forEach(k=>{ const g=p.gates[k]||{}; if(isGo(g.decision)){ const d=parseDay(g.date); if(d && (!best||d>best.d)) best={k,d}; }});
  return best;
}

/* Compliance rules. Red = out of compliance, amber = needs update. */
function flags(p){
  const F=[]; const ph=phase(p); const today=parseDay(TODAY());
  if(ph.key==="retired") return F;
  const live = ph.key==="deployed", piloting = ph.key==="pilot";
  const items=allItems();
  const overdue = items.filter(it=>{const d=p.items[it.id]||{}; const due=parseDay(d.due); return due && due<today && d.status!=="met" && d.status!=="na";});
  if(overdue.length) F.push({sev:(live||piloting)?"red":"amber",text:`${overdue.length} action${overdue.length>1?"s":""} past due`});
  if(live){
    const notmet=items.filter(it=>(p.items[it.id]||{}).status==="notmet").length;
    if(notmet) F.push({sev:"red",text:`Live with ${notmet} criteri${notmet>1?"a":"on"} not met`});
    const nr=nextReview(p);
    if(!nr) F.push({sev:"red",text:"Live with no deployment date recorded at Checkpoint C"});
    else { const d=parseDay(nr), left=daysBetween(today,d);
      if(left<0) F.push({sev:"red",text:`Periodic review overdue since ${fmtDay(nr)}`});
      else if(left<=30) F.push({sev:"amber",text:`Periodic review due ${fmtDay(nr)}`}); }
    if(dec(p,"D")==="Retrain or revise") F.push({sev:"amber",text:"Last review asked for retraining or revision"});
  }
  if(live||piloting){
    const missing=CORE_CARD.filter(k=>!cardValOf(p,k));
    if(missing.length) F.push({sev:live?"red":"amber",text:`Model card missing ${missing.length} core field${missing.length>1?"s":""}`});
    const lg=latestGo(p); const cu=p.cardUpdatedAt?new Date(p.cardUpdatedAt):null;
    if(lg && (!cu || cu < lg.d)) F.push({sev:"amber",text:`Model card not updated since ${GATES[lg.k].title}`});
    if(!p.metrics.some(m=>m.name||m.value)) F.push({sev:"amber",text:"No key metrics recorded"});
  }
  ["A","B","C","D"].forEach(k=>{ const g=p.gates[k]||{};
    if(isGo(g.decision) && !(g.rationale||"").trim()){
      if(/conditions|changes/.test(g.decision)) F.push({sev:"amber",text:`${GATES[k].title}: conditional approval with no conditions recorded`});
      else if(gapsUpTo(p,GATES[k].after).length) F.push({sev:"amber",text:`${GATES[k].title}: approved with open criteria and no rationale`});
    }});
  if(!live && p.updatedAt){ const idle=daysBetween(new Date(p.updatedAt),new Date()); if(idle>90) F.push({sev:"amber",text:`No activity in ${idle} days`}); }
  return F.sort((a,b)=>(a.sev==="red"?0:1)-(b.sev==="red"?0:1));
}
function statusOf(p){
  const ph=phase(p); if(ph.key==="retired") return {key:"retired",label:ph.label};
  const f=flags(p);
  if(f.some(x=>x.sev==="red")) return {key:"red",label:"Out of compliance"};
  if(f.length) return {key:"amber",label:"Needs update"};
  return {key:"green",label:"On track"};
}

/* CHAI publishes a consensus set of methods and metrics per use case, and says
   to consult them when completing the Applied Model Card. This is that moment,
   so the list is offered here rather than left on another website.

   Picking one fills in the name and category only. The value, the interval and
   the population are the organization's own measurements; pre-filling those
   would be inventing results. */
function teSuggestHTML(){
  const chosen = (S.meta||{}).chaiUseCase || "";
  const uc = CHAI_TE[chosen];
  const options = Object.entries(CHAI_TE)
    .map(([k,v])=>`<option value="${esc(k)}"${k===chosen?" selected":""}>${esc(v.label)}</option>`)
    .join("");

  let body;
  if(!uc){
    body = `<p style="font-size:13px;color:var(--muted);margin:8px 0 0">
      Choose a use case to see the methods and metrics CHAI's workgroups agreed on for it.</p>`;
  } else {
    const byCat = {};
    uc.metrics.forEach(m=>{ (byCat[m.cat] = byCat[m.cat] || []).push(m); });
    const have = new Set(S.metrics.map(m=>(m.name||"").trim().toLowerCase()));
    body = METRIC_CATS.filter(c=>byCat[c]).map(c=>`
      <p style="font-size:12.5px;font-weight:700;margin:12px 0 4px">${esc(c)}</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${byCat[c].map(m=>{
          const added = have.has(m.name.trim().toLowerCase());
          const note = [m.when, m.who].filter(Boolean).join(" \u00b7 ");
          return `<button class="btn ro-hide" data-te="${esc(m.name)}" data-te-cat="${esc(c)}"
            ${added?"disabled":""} style="font-size:12px;padding:4px 9px"
            title="${esc(note||"Recommended by CHAI for this use case")}">${added?"\u2713 ":""}${esc(m.name)}</button>`;
        }).join("")}
      </div>`).join("")
      + `<p style="font-size:12px;color:var(--muted);margin:12px 0 0">
        ${uc.metrics.length} methods and metrics, reproduced under CC BY 4.0 from

function renderGate(key){

  const partial = STAGES.slice(0,STAGES.indexOf(s)+1).flatMap(x=>x.items).filter(it=>(S.items[it.id]||{}).status==="partial").length;
  let note="";
  if(gaps.length){
    note=`<div class="note"><b>${gaps.length} item${gaps.length>1?"s":""} in stages 1–${s.n} ${gaps.length>1?"are":"is"} unanswered or not met${partial?`, and ${partial} partial`:""}.</b>${isGo(g.decision)?" Record the conditions or the accepted risk in the rationale.":""}

/* ============================================================
   CHAI: registration
   Declares CHAI to the shell. This is the only file that has to
   change when a CHAI screen is added or reordered.

   CHAI is always enabled. It owns the project document's `items`
   and `gates` keys, the compliance status on the dashboard, and the
   applied model card -- so the tool is a CHAI tool with other
   frameworks alongside, not a neutral host of several equals. That
   is a deliberate choice: the dashboard needs ONE status, and
   mixing two frameworks' judgements into one number would be
   meaningless. See docs/crosswalk.md.
   ============================================================ */
registerFramework({
  id: "chai",
  label: "CHAI",

  enabled: () => true,

  blank: () => ({ items: {}, gates: { A: {}, B: {}, C: {}, D: {} } }),

  normalize(p) {
    p.items = p.items || {};
    p.gates = Object.assign({ A: {}, B: {}, C: {}, D: {} }, p.gates || {});
  },

  views(p) {
    const out = [];
    STAGES.forEach(s => {
      out.push({
        id: s.id, kind: "stage", label: s.title, num: s.n, short: `Stage ${s.n}`,
        meta: () => { const c = scoreOf(s.items, p.items); return `${c.answered}/${c.total}`; },
        metaCls: () => { const c = scoreOf(s.items, p.items); return c.answered === c.total ? "done" : ""; },
      });
      Object.entries(GATES).filter(([, g]) => g.after === s.id).forEach(([key, g]) => {
        out.push({
          id: "g" + key, kind: "gate", gate: key, label: g.title, cls: "gate",
          numHTML: '<span class="diamond" aria-hidden="true"></span>',
          meta: () => { const d = (p.gates[key] || {}).decision || ""; return d ? esc(shortDecision(d)) : "open"; },
          metaCls: () => { const d = (p.gates[key] || {}).decision || ""; return !d ? "" : (/Stop|Retire|Revise|Retrain/.test(d) ? "warn" : "done"); },
        });
      });
    });
    out.push({
      id: "card", kind: "card", label: "Applied model card", glyph: "≡", sep: "before",
      meta: () => `${CARD_FIELDS.filter(k => cardValOf(p, k)).length}/${CARD_FIELDS.length}`,
    });
    out.push({ id: "report", kind: "report", label: "Report", glyph: "✓" });
    return out;
  },

  render(v) {
    if (v.kind === "stage") return renderStage(STAGES.find(s => s.id === v.id));
    if (v.kind === "gate") return renderGate(v.gate);
    if (v.kind === "card") return renderCardForm();
    return renderReport();
  },
});

","rel":"partial","chai":["s5-1","s5-2","s5-3"]}]},{"n":8,"domain":"C","title":"Explainability","purpose":"Determine whether the solution can account for its outputs both model-wide and case by case, and whether those accounts stand up to clinical scrutiny.","items":[{"key":"8-1","num":"8.1","text":"Identify which variables drive the model's behavior overall, or account for why such a ranking cannot be produced.","who":"developer","stage":"B","rel":"partial","chai":["s4-6"]},{"key":"8-2","num":"8.2","text":"State whether the solution can justify the result it produces for one specific case, and illustrate with worked examples spanning different kinds of patients.","who":"developer","stage":"B","rel":"partial","chai":["s4-6"]},{"key":"8-3","num":"8.3","text":"Give a clinician's verdict on whether the model-wide and per-case explanations hold up medically.","who":"adopter","stage":"C","rel":"partial","chai":["s4-6"]}]},{"n":9,"domain":"C","title":"Regulations, data security & privacy","purpose":"Confirm the solution can be fielded lawfully and safely — regulatory conformity, honesty with patients, protection of data against attack, and respect for privacy rules.","items":[{"key":"9-1","num":"9.1","text":"Establish whether the solution satisfies the regulatory rules that apply in this jurisdiction and this institution, drawing on legal counsel and the information security lead.","who":"adopter","stage":"C","rel":"partial","chai":["s1-7"]},{"key":"9-2","num":"9.2","text":"Decide whether patients are told clearly enough that an algorithm plays a part in their care, with legal input on what disclosure is actually owed.","who":"adopter","stage":"C","rel":"partial","chai":["s5-6","s1-7"]},{"key":"9-3","num":"9.3","text":"Verify that the solution meets the institution's requirements for safeguarding data and withstanding attack, with the information security lead involved.","who":"adopter","stage":"D","rel":"equivalent","chai":["s4-7"]},{"key":"9-4","num":"9.4","text":"Confirm that the solution's handling of identifiable information satisfies the privacy rules that apply locally, again with the information security lead involved.","who":"adopter","stage":"D","rel":"partial","chai":["s1-7","s3-6"]}]},{"n":10,"domain":"D","title":"Deployment plan","purpose":"Pins down how the solution will actually be wired into clinical work and into the organization's technical stack - where it surfaces, who acts on it, and what has to be built to serve it.","items":[{"key":"10-1","num":"10.1","text":"Pinpoint where along the care pathway the tool fires - which encounter, decision point, or step of the existing process it attaches to.","who":"adopter","stage":"C","rel":"partial","chai":["s2-2","s2-1"]},{"key":"10-2","num":"10.2","text":"Name the host application or screen where clinicians will actually see the result, and describe how using it is meant to feel day to day - how discoverable it is, how many clicks it costs, how reliably it is on hand.","who":"adopter","stage":"C","rel":"partial","chai":["s2-1","s5-2"]},{"key":"10-3","num":"10.3","text":"State whether a named human clinician stands between the model and the patient, owning the choice to act on a result or set it aside.","who":"adopter","stage":"C","rel":"partial","chai":["s2-5","s1-6"]},{"key":"10-4","num":"10.4","text":"If each result has to arrive with its rationale attached, work out how that supporting explanation gets rendered inside the host system next to the result itself.","who":"adopter","stage":"C","rel":"partial","chai":["s4-6"]},{"key":"10-5","num":"10.5","text":"Determine whether fresh interfaces or middleware must be built to carry results from whatever serves the model over to the system that will display them.","who":"either","stage":"E","rel":"partial","chai":["s2-7","s4-5"]},{"key":"10-6","num":"10.6","text":"Identify the host hardware the model will execute on and confirm its compute and memory headroom are adequate for the expected load.","who":"either","stage":"E","rel":"partial","chai":["s4-5"]},{"key":"10-7","num":"10.7","text":"Confirm that every input feed reaches that execution environment promptly enough to be useful, and flag which feeds must arrive live rather than on a batch schedule.","who":"either","stage":"E","rel":"partial","chai":["s3-4"]}]},{"n":11,"domain":"D","title":"Monitoring plan","purpose":"Establishes how the system will be watched once live, so that drift in its inputs, its outputs, its accuracy, or the underlying medical knowledge is caught rather than discovered late.","items":[{"key":"11-1","num":"11.1","text":"From the builder's standpoint, state the cadence at which the model has to be refreshed or refit.","who":"developer","stage":"B","rel":"partial","chai":["s6-3"]},{"key":"11-2","num":"11.2","text":"Say whether the system refits itself automatically in the field, and if it does, describe how each refreshed version's quality gets verified before it influences care.","who":"developer","stage":"B","rel":"partial","chai":["s6-3"]},{"key":"11-3","num":"11.3","text":"Lay out how incoming feature values will be watched for drift or outright breakage once the system is running.","who":"adopter","stage":"E","rel":"partial","chai":["s6-1"]},{"key":"11-4","num":"11.4","text":"Lay out the equivalent watch on what the model emits, so that shifts in the distribution of its results surface early.","who":"adopter","stage":"E","rel":"partial","chai":["s6-1","s6-4"]},{"key":"11-5","num":"11.5","text":"From the clinical side, state how often the medical content baked into the solution - guidelines, thresholds, standards of care - needs refreshing.","who":"adopter","stage":"F","rel":"partial","chai":["s6-3"]},{"key":"11-6","num":"11.6","text":"Set out how the solution's accuracy will keep being measured after go-live, not only before it.","who":"either","stage":"F","rel":"partial","chai":["s6-1","s6-2"]}]},{"n":12,"domain":"D","title":"Evaluation plan","purpose":"Settles in advance how the deployment's real-world benefit and harm will be measured, fed back and reported.","items":[{"key":"12-1","num":"12.1","text":"Define what counts as success for this rollout - the outcome measures the deployment itself will be judged on.","who":"adopter","stage":"F","rel":"equivalent","chai":["s1-3"]},{"key":"12-2","num":"12.2","text":"Describe the study design that will test whether the rollout genuinely helped - and whether it harmed anyone along the way.","who":"adopter","stage":"F","rel":"partial","chai":["s5-3","s5-5"]},{"key":"12-3","num":"12.3","text":"Check whether the rollout itself can be structured up front - staggered, randomized, phased by site - so that its effect can later be measured credibly.","who":"adopter","stage":"F","rel":"partial","chai":["s5-1"]},{"key":"12-4","num":"12.4","text":"Decide how you will capture what users actually think of it - perceived usefulness, friction, trust.","who":"adopter","stage":"F","rel":"partial","chai":["s5-2","s6-6"]},{"key":"12-5","num":"12.5","text":"Decide who writes up the evaluation findings, how often, and to whom they go.","who":"adopter","stage":"F","rel":"partial","chai":["s6-3","s2-6"]}]},{"n":13,"domain":"D","title":"Organizational AI strategy fit","purpose":"Gives the organization's AI leadership the final word on the quality of the answers, the merit of the solution, and its fit with the wider AI strategy.","items":[{"key":"13-1","num":"13.1","text":"Step back and judge how well the rest of the checklist was actually answered - depth, candor, and what was left open.","who":"adopter","stage":"G","rel":"optica-only","chai":[]},{"key":"13-2","num":"13.2","text":"Give an overall opinion on the proposed system itself, and on whether it genuinely answers the need stated at the very outset.","who":"adopter","stage":"G","rel":"partial","chai":["s1-2","s1-6"]},{"key":"13-3","num":"13.3","text":"Judge the fit with where the organization is heading on AI overall, including knock-on effects that reach beyond this one deployment.","who":"adopter","stage":"G","rel":"optica-only","chai":[]}]}]};
const OPTICA_ITEMS = OPTICA.chapters.flatMap(c => c.items.map(i => ({ ...i, chapter: c })));

/* ============================================================
   OPTICA: rules
   OPTICA's own progress, kept strictly apart from CHAI's.

   Two rules decide everything here, both from docs/crosswalk.md:

   1. NO STATUS PROPAGATION, in either direction. Evidence is shared
      by citing it; judgment never is. No OPTICA answer may change a
      CHAI criterion's status or a readiness percentage, and none of
      this feeds flags() or statusOf(). Breaking that would silently
      re-gate every existing project.

   2. A DECLINE IS A DISTINCT STATE. OPTICA accepts a reasoned "we
      chose not to" as a complete answer for some items; CHAI's
      local-validation obligations are unconditional. So "declined"
      is tracked separately and never folded into the percentage as
      though it were met.
   ============================================================ */
const OPTICA_STATUS = { met: "Answered", partial: "Partial", notmet: "Outstanding", declined: "Declined", na: "N/A" };
const OPTICA_VAL = { met: 1, partial: 0.5, notmet: 0, declined: 0 };

const opticaOn = p => !!((p || S).optica || {}).enabled;
const opticaAnswers = p => ((p || S).optica || {}).answers || {};
const opticaAnswer = (p, key) => opticaAnswers(p)[key] || {};

/* Progress over any list of OPTICA items. Declines are counted as
   answered (the stakeholder did respond) but contribute nothing to
   the percentage, and are reported separately so they stay visible. */
function opticaScore(items, p) {
  const answers = opticaAnswers(p);
  let sum = 0, n = 0, answered = 0, declined = 0;
  items.forEach(it => {
    const st = (answers[it.key] || {}).status;
    if (st) answered++;
    if (st === "declined") { declined++; return; }
    if (st === "na") return;
    n++; sum += OPTICA_VAL[st] || 0;
  });
  return { pct: n ? Math.round(sum / n * 100) : 0, answered, total: items.length, applicable: n, declined };
}

/* Who still owes answers. OPTICA assigns each item to one of five
   stakeholders and runs them in sequence, so "which stakeholder is
   blocking" is the question that actually moves a review along --
   and ~a third of the items can only be answered by the vendor. */
function opticaByProducer(p) {
  const answers = opticaAnswers(p);
  const out = {};
  OPTICA_ITEMS.forEach(it => {
    const who = it.who || "unassigned";
    const b = out[who] || (out[who] = { who, total: 0, answered: 0, outstanding: [] });
    b.total++;
    if ((answers[it.key] || {}).status) b.answered++;
    else b.outstanding.push(it);
  });
  return Object.values(out).sort((a, b) => b.total - a.total);
}

const opticaOutstanding = p => OPTICA_ITEMS.filter(it => !(opticaAnswer(p, it.key).status));

/* ============================================================
   OPTICA: views
   One screen per chapter, plus an overview that answers the
   question OPTICA's stakeholder relay actually turns on: who owes
   the next answers.

   Markup reuses the CHAI checklist classes (.ci, .seg, .checklist)
   so no new CSS is needed and the two checklists look like one
   tool. The state path differs -- optica.answers.<key> rather than
   items.<id> -- which is what keeps the data cleanly separable.
   ============================================================ */
const OPTICA_PRODUCER_LABEL = {
  adopter: "Your organization",
  developer: "The solution's developer",
  either: "Either party",
};

function opticaItemHTML(it) {
  const d = opticaAnswer(S, it.key);
  const st = d.status || "";
  const open = openItems.has(it.key);
  const late = d.due && parseDay(d.due) < parseDay(TODAY()) && st !== "met" && st !== "na";
  const notes = (d.evidence || d.owner || d.due || d.declineReason) && !open
    ? `<span class="has-notes">${late ? `<b style="color:var(--red)">overdue ${esc(fmtDay(d.due))}</b>` : "notes added"}</span>` : "";
  const chai = it.chai && it.chai.length
    ? `<span class="pchip" title="Partially covered by CHAI ${esc(it.chai.join(", "))}">${esc(it.chai[0])}</span>`
    : `<span class="pchip" title="No CHAI criterion covers this">—</span>`;

  return `<li class="ci${open ? " open" : ""}" data-item="${esc(it.key)}">
    <div class="ci-row">
      ${chai}
      <div class="ci-text">${esc(it.text)}<button class="more" data-toggle="${esc(it.key)}" aria-expanded="${open}">${open ? "Hide details" : "Evidence & owner"}</button>${notes}</div>
      <div class="seg" role="group" aria-label="Status">${Object.entries(OPTICA_STATUS).map(([k, l]) =>
        `<button data-set="${esc(it.key)}" data-store="optica.answers" data-s="${k}" aria-pressed="${st === k}">${l}</button>`).join("")}</div>
    </div>
    <div class="ci-detail">
      <div><label for="oev_${esc(it.key)}">Evidence or notes</label><textarea id="oev_${esc(it.key)}" rows="2" data-bind="optica.answers.${esc(it.key)}.evidence">${esc(d.evidence || "")}</textarea></div>
      <div><label for="oow_${esc(it.key)}">Owner</label><input type="text" id="oow_${esc(it.key)}" data-bind="optica.answers.${esc(it.key)}.owner" value="${esc(d.owner || "")}"></div>
      <div><label for="odu_${esc(it.key)}">Due</label><input type="date" id="odu_${esc(it.key)}" data-bind="optica.answers.${esc(it.key)}.due" value="${esc(d.due || "")}"></div>
      ${st === "declined" ? `<div class="wide"><label for="odr_${esc(it.key)}">Why this was declined</label><textarea id="odr_${esc(it.key)}" rows="2" data-bind="optica.answers.${esc(it.key)}.declineReason">${esc(d.declineReason || "")}</textarea></div>` : ""}
    </div>
  </li>`;
}

function renderOpticaChapter(n) {
  const c = OPTICA.chapters.find(x => x.n === n);
  const s = opticaScore(c.items, S);
  const vendor = c.items.filter(i => i.who === "developer").length;
  return `<p class="eyebrow">OPTICA chapter ${c.n} of 13 · domain ${c.domain}</p>
  <h1>${esc(c.title)}</h1>
  ${c.purpose ? `<p class="lede">${esc(c.purpose)}</p>` : ""}
  <div class="legend">
    <span>Questions are this project's paraphrase of OPTICA, not its published wording.</span>
  </div>
  ${vendor ? `<p style="font-size:13px;color:var(--muted)">${vendor} of ${c.items.length} item${vendor === 1 ? "" : "s"} here can only be answered by the solution's developer.</p>` : ""}
  <ol class="checklist">${c.items.map(opticaItemHTML).join("")}</ol>
  <p style="font-size:13px;color:var(--muted);margin-top:10px">${s.answered} of ${s.total} answered${s.declined ? `, ${s.declined} declined` : ""}. The chip on each row names the CHAI criterion that partially covers it, or a dash where none does.</p>
  ${pager()}`;
}

function renderOpticaOverview() {
  const all = opticaScore(OPTICA_ITEMS, S);
  const byWho = opticaByProducer(S);
  const rows = byWho.map(b => `<tr>
      <td>${esc(OPTICA_PRODUCER_LABEL[b.who] || b.who)}</td>
      <td>${b.answered}/${b.total}</td>
      <td>${b.outstanding.length ? esc(b.outstanding.slice(0, 6).map(i => i.num).join(", ")) + (b.outstanding.length > 6 ? ` +${b.outstanding.length - 6} more` : "") : "—"}</td>
    </tr>`).join("");

  return `<p class="eyebrow">OPTICA</p>
  <h1>Adoption review</h1>
  <p class="lede">77 items in 13 chapters, answered by five stakeholders in sequence. OPTICA asks whether <em>this</em> organization should adopt <em>this</em> solution; it runs alongside the CHAI lifecycle and never changes it.</p>

  <div class="cards">
    <div class="card"><h3>Answered</h3><p class="big">${all.answered}/${all.total}</p></div>
    <div class="card"><h3>Progress</h3><p class="big">${all.pct}%</p></div>
    <div class="card"><h3>Declined</h3><p class="big">${all.declined}</p></div>
  </div>

  <h2>Who owes the next answers</h2>
  <p style="font-size:13px;color:var(--muted)">OPTICA is a relay: each stage is completed by one stakeholder before the next begins. Outstanding items are listed by the party that can answer them.</p>
  <table class="tbl"><thead><tr><th>Stakeholder</th><th>Answered</th><th>Outstanding</th></tr></thead><tbody>${rows}</tbody></table>

  <div class="note">
    <p><b>OPTICA answers never change CHAI status.</b> The two checklists ask different parties for different evidence at different moments, and no OPTICA item fully discharges a CHAI criterion. Evidence can be cited in both; a judgment in one is not a judgment in the other.</p>
  </div>
  ${pager()}`;
}

function renderOpticaOff() {
  return `<p class="eyebrow">OPTICA</p><h1>Adoption review</h1>
  <p class="lede">OPTICA is not switched on for this project.</p>
  <p>Turn it on in <button class="btn" data-go="setup">Project setup</button> to add its 77 adoption questions alongside the CHAI lifecycle.</p>`;
}

/* ============================================================
   OPTICA: registration
   Opt-in per project. A project that has never switched OPTICA on
   carries no `optica` key at all, so existing exports stay valid
   and teams that only run CHAI never see 77 extra rows.
   ============================================================ */
registerFramework({
  id: "optica",
  label: "OPTICA",

  enabled: p => opticaOn(p),

  // Deliberately empty: a new project does NOT get an optica key.
  // It appears the first time someone switches the framework on.
  blank: () => ({}),

  normalize(p) {
    if (!p.optica) return;
    p.optica.enabled = !!p.optica.enabled;
    p.optica.answers = p.optica.answers || {};
  },

  views(p) {
    const out = [{
      id: "optica", kind: "overview", label: "OPTICA adoption review",
      glyph: "◇", sep: "before",
      meta: () => { const s = opticaScore(OPTICA_ITEMS, p); return `${s.answered}/${s.total}`; },
      metaCls: () => { const s = opticaScore(OPTICA_ITEMS, p); return s.answered === s.total ? "done" : ""; },
      short: "OPTICA",
    }];
    OPTICA.chapters.forEach(c => {
      out.push({
        id: "o" + c.n, kind: "chapter", chapter: c.n, label: c.title, num: c.n,
        short: `OPTICA ${c.n}`,
        meta: () => { const s = opticaScore(c.items, p); return `${s.answered}/${s.total}`; },
        metaCls: () => { const s = opticaScore(c.items, p); return s.answered === s.total ? "done" : ""; },
      });
    });
    return out;
  },

  render(v) {
    if (!opticaOn(S)) return renderOpticaOff();
    return v.kind === "chapter" ? renderOpticaChapter(v.chapter) : renderOpticaOverview();
  },
});

/* Switching the framework on or off for the open project. Turning it
   off keeps every answer: it only hides the views, so a team that
   pauses an OPTICA review does not lose the work. */
function setOpticaEnabled(on) {
  if (RO || !S) return;
  if (!S.optica) S.optica = { enabled: false, answers: {} };
  edit("optica.enabled", !!on);
  writeLog(CUR, `${on ? "Enabled" : "Disabled"} the OPTICA adoption review`);
  if (!on && String(UI.view).startsWith("o")) go("setup");
  else renderProject(false);
}

/* ============================================================
   App shell: rail and routing
   Builds the step rail from whatever views the active frameworks
   contribute, and dispatches rendering back to the framework that
   owns the current view. Nothing here names CHAI or OPTICA.
   ============================================================ */
function railRow(v) {
  const cur = UI.view === v.id ? ' aria-current="step"' : "";
  const meta = typeof v.meta === "function" ? v.meta() : (v.meta || "");
  // numHTML lets a view supply its own marker element (the checkpoint
  // diamond); glyph covers the common case of a single character.
  const num = v.numHTML ? `<span class="num">${v.numHTML}</span>`
    : v.num == null ? `<span class="num" aria-hidden="true">${esc(v.glyph || "•")}</span>`
    : `<span class="num">${esc(String(v.num))}</span>`;
  // A view that computes a state class always gets the separating space, even
  // when the class is empty this render; a view with no metaCls gets none.
  // That reproduces the markup the hand-written rail emitted exactly.
  const metaCls = v.metaCls ? ` ${esc(v.metaCls())}` : "";
  const li = `<li${v.cls ? ` class="${v.cls}"` : ""}><button data-go="${esc(v.id)}"${cur}>`
    + `${num}<span>${esc(v.label)}</span>`
    + `<span class="meta${metaCls}">${meta}</span></button></li>`;
  const sep = `<li class="sep" role="presentation"></li>`;
  return (v.sep === "before" ? sep : "") + li + (v.sep === "after" ? sep : "");
}

function renderRail() {
  const ol = document.getElementById("rail");
  const home = `<li class="home-link"><button data-home="1">`
    + `<span class="num" aria-hidden="true">←</span><span>All projects</span></button></li>`
    + `<li class="sep" role="presentation"></li>`;
  ol.innerHTML = home + activeViews().map(railRow).join("");
  document.getElementById("projName").textContent = S.meta.solution || "Untitled AI solution";
}

function renderMain(focusTop) {
  const views = activeViews();
  const v = views.find(x => x.id === UI.view) || views[0];
  const m = document.getElementById("main");
  const fk = focusTop ? null : focusKey(document.activeElement);

  m.innerHTML = v.fw.render(v, S);
  if (v.kind === "report") updateDlUI();

  applyRO(m);
  resolveNames(m);
  if (focusTop) { window.scrollTo({ top: 0 }); m.focus({ preventScroll: true }); }
  else if (fk) { const el = m.querySelector(fk); if (el) el.focus({ preventScroll: true }); }
}

function renderProject(focusTop) {
  document.body.classList.remove("home");
  renderRail(); renderMain(focusTop); renderLabel();
}

function softRefresh() {
  renderRail(); renderLabel();
  if (editingInMain()) syncInputs();
  else { const y = window.scrollY; renderMain(false); window.scrollTo(0, y); }
}

function lcTrack(p){
  const ph=phase(p);
  const pip=s=>{const c=scoreOf(s.items,p.items); const frac=c.total?c.answered/c.total:0;
    return `<span class="pip${frac===1?" full":""}${ph.stage===s.n?" cur":""}" title="Stage ${s.n}: ${c.answered}/${c.total} answered"><i style="height:${Math.round(frac*100)}%"></i>${s.n}</span>`;};
  const gd=k=>{const d=dec(p,k); const cls=!d?"":(/Stop|Retire/.test(d)?"stop":/conditions|changes|Revise|Retrain/.test(d)?"cond":"go"); return `<span class="gd ${cls}" title="${GATES[k].title}: ${esc(d||"open")}"></span>`;};
  const S_=STAGES;
  return `<div class="lc" aria-hidden="true">${pip(S_[0])}${gd("A")}${pip(S_[1])}${pip(S_[2])}${pip(S_[3])}${gd("B")}${pip(S_[4])}${gd("C")}${pip(S_[5])}${gd("D")}</div><div class="lc-label">${esc(ph.label)}</div>`;
}

  return rows;
}

function openProject(id,view){
  flushAllChanges();          // leaving a project ends any edit in progress
  const p=PROJECTS.get(id); if(!p) return;
  if(unsubLog){ unsubLog(); unsubLog=null; }
  CUR=id; S=normalize(clone(p)); LOG=[]; openItems.clear();
  // Read-only is a property of this project and this user, not of the
  // workspace: the same person may own one review and only read another.
  RO = WORKSPACE_RO || !canWrite(S);
  document.body.classList.toggle("ro", RO);
  CAN_DELETE = !WORKSPACE_RO && canOwn(S);
  UI.view=view||"setup"; saveUI();
  unsubLog=STORE.subscribeLog(id,l=>{ LOG=l||[]; if(CUR===id && (UI.view==="setup"||UI.view==="report") && !editingInMain()){ const y=window.scrollY; renderMain(false); window.scrollTo(0,y);} });
  renderProject(true);
}

/* PDF, via the browser's own print-to-PDF.

   No PDF library is bundled. Every option (jsPDF, pdfmake, html2pdf) is
   hundreds of kilobytes, and this dashboard has to stay one self-contained
   file small enough to publish as an artifact -- a PDF writer would be larger
   than the entire application. Browsers already render HTML to PDF well, with
   correct fonts, selectable text and working links, which a canvas-based
   library does not give you.

   The report is printed from an offscreen iframe holding exactly the
   standalone HTML export, not from the live page. Printing the page would
   carry the app's own print stylesheet and its DOM state; this way the PDF and
   the HTML download are the same document, and what the user sees in the print
   preview is what the HTML export contains. */
function exportPDF(){
  const frame = document.createElement("iframe");
  frame.setAttribute("aria-hidden", "true");
  frame.setAttribute("title", "Report for printing");
  frame.style.cssText = "position:fixed;left:-9999px;top:0;width:820px;height:1160px;border:0";
  frame.onload = () => {
    const win = frame.contentWindow;
    const go = () => {
      try{ win.focus(); win.print(); }
      catch(e){ toast("Couldn't open the print dialog"); }
      // Keep the frame alive briefly: some browsers run print() asynchronously
      // and removing it immediately cancels the dialog.
      setTimeout(() => frame.remove(), 60000);
    };
    // Wait for the webfonts, or the first page renders in a fallback face.
    const fonts = win.document.fonts;
    if(fonts && fonts.ready) fonts.ready.then(go).catch(go);
    else setTimeout(go, 400);
  };
  document.body.appendChild(frame);
  // srcdoc keeps it same-origin, so contentWindow.print() is reachable; a blob
  // URL would be a different origin in some browsers and throw.
  frame.srcdoc = exportHTML();
  toast("Opening the print dialog. Choose \u201cSave as PDF\u201d.");
}

function exportMD(){
  const all=allItems(), ov=scoreOf(all), m=S.meta, L=[];
  const st=s=>s?STATUS[s]:"Unanswered";
  const line=s=>String(s||"").replace(/\n+/g," ").replace(/\|/g,"\\|");
  const nm=id=>id?(NAMES[id]||"someone"):"someone";
  L.push(`# ${m.solution||"Untitled AI solution"}: CHAI assurance review`,"");
  L.push(`- **Status:** ${statusOf(S).label}`,`- **Lifecycle phase:** ${phase(S).label}`,`- **Organization:** ${m.org||"–"}`,`- **Developer:** ${m.developer||"–"}`,`- **Sourcing:** ${m.sourcing||"–"}`,`- **Risk tier:** ${m.riskTier||"–"}`,`- **Clinical sponsor:** ${m.sponsor||"–"}`,`- **Next periodic review:** ${nextReview(S)||"–"}`,`- **Review team:** ${line(m.reviewers)||"–"}`,`- **Scope:** ${line(m.scope)||"–"}`,`- **Generated:** ${TODAY()}`,"");
  const F=flags(S); L.push("## Compliance flags",""); if(F.length) F.forEach(f=>L.push(`- **${f.sev==="red"?"Out of compliance":"Needs update"}:** ${f.text}`)); else L.push("None."); L.push("");
  L.push(`## Readiness`,"",`Overall: **${ov.pct}%** of applicable criteria met (${ov.answered}/${ov.total} answered).`,"","| Principle | Score |","|---|---|");
  Object.entries(PRINCIPLES).forEach(([k,p])=>L.push(`| ${p.name} | ${scoreOf(all.filter(it=>it.p===k)).pct}% |`));
  L.push("","## Checkpoint decisions","","| Checkpoint | Decision | Decided by | Date | Rationale |","|---|---|---|---|---|");
  Object.entries(GATES).forEach(([k,G])=>{const g=S.gates[k]||{}; L.push(`| ${G.title}: ${G.q} | ${g.decision||"Not decided"} | ${line(g.by)}${g.signedBy?` (recorded by ${line(nm(g.signedBy))})`:""} | ${line(g.date)} | ${line(g.rationale)} |`);});
  L.push("","## Open gaps","");
  const gaps=all.filter(it=>{const s=(S.items[it.id]||{}).status; return !s||s==="notmet"||s==="partial";});
  if(gaps.length){ L.push("| Stage | Criterion | Status | Owner | Due |","|---|---|---|---|---|"); gaps.forEach(it=>{const d=S.items[it.id]||{}; L.push(`| ${it.stage.n} | ${line(it.text)} | ${st(d.status)} | ${line(d.owner)} | ${line(d.due)} |`);}); }
  else L.push("None.");
  L.push("","## Applied model card","");
  CARD.forEach(sec=>{L.push(`### ${sec.sec}`,""); sec.fields.forEach(f=>L.push(`- **${f[1]}:** ${line(cardValOf(S,f[0]))||"_Not provided_"}`)); L.push("");
    if(sec.sec==="Trust ingredients"){ L.push("### Key metrics",""); if(S.metrics.length){L.push("| Category | Metric | Value | 95% CI | Population |","|---|---|---|---|---|"); S.metrics.forEach(x=>L.push(`| ${x.cat} | ${line(x.name)} | ${line(x.value)} | ${line(x.ci)} | ${line(x.pop)} |`));} else L.push("_None entered_"); L.push("");}});
  L.push("## Sign-off history",""); if(LOG.length) LOG.forEach(e=>L.push(`- ${(e.at||"").slice(0,10)}: ${line(e.text)} (${line(nm(e.by))})`)); else L.push("None."); L.push("");
  L.push("## Appendix: full checklist","");
  STAGES.forEach(s=>{L.push(`### ${s.n}. ${s.title}`,""); s.items.forEach(it=>{const d=S.items[it.id]||{}; L.push(`- [${it.p}] ${it.text}: **${st(d.status)}**${d.evidence?` (${line(d.evidence)})`:""}`);}); L.push("");});
  L.push("---","_Structured around the CHAI six-stage lifecycle and Applied Model Card. Checklist wording is paraphrased; this is an internal governance record, not a CHAI certification._");
  return L.join("\n");
}
function projectJSON(p){
  const all=allItems();
  const state=clone(p); delete state.id;
  return {
    schema:"chai-review/2", generated:new Date().toISOString(),
    status:statusOf(p).label, phase:phase(p).label, next_review:nextReview(p), flags:flags(p),
    meta:p.meta, gates:p.gates, metrics:p.metrics,
    model_card:Object.fromEntries(CARD_FIELDS.map(k=>[k,cardValOf(p,k)])),
    checklist:all.map(it=>({id:it.id,stage:it.stage.n,principle:it.p,criterion:it.text,...(({status,evidence,owner,due})=>({status:status||null,evidence:evidence||"",owner:owner||"",due:due||""}))(p.items[it.id]||{})})),
    scores:{overall:scoreOf(all,p.items).pct,...Object.fromEntries(Object.keys(PRINCIPLES).map(k=>[k,scoreOf(all.filter(it=>it.p===k),p.items).pct]))},
    _state:state
  };
}
function exportCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const head=["Project","Developer","Clinical sponsor","Risk tier","Lifecycle phase","Status","Readiness %","Next review","Flags","Archived","Last updated"];
  const rows=dashData().map(r=>[r.p.meta.solution,r.p.meta.developer,r.p.meta.sponsor,r.p.meta.riskTier,phase(r.p).label,r.st.label,r.score,r.nr||"",r.f.map(f=>f.text).join("; "),r.p.archived?"yes":"",(r.p.updatedAt||"").slice(0,10)]);
  return [head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
}

let DL=null, dlChecked=false;
const STANDALONE = !(window.claude && typeof window.claude.use==="function");
function updateDlUI(){
  const fb=document.getElementById("dlFallback"); if(!fb) return;
  // dl-pdf is deliberately excluded: it goes through the browser's print
  // dialog, not the downloads API, so it keeps working in a view where saving
  // a file does not. Hiding it with the rest would remove the one export still
  // available exactly when the others are gone.
  const btns=[...document.querySelectorAll('#ractions [data-act^="dl-"]')]
    .filter(b=>b.dataset.act!=="dl-pdf");
  if(DL||STANDALONE){ btns.forEach(b=>b.hidden=false); fb.innerHTML=""; return; }
  if(!dlChecked) return;
  btns.forEach(b=>b.hidden=true);
  fb.innerHTML=`<details class="fallback"><summary style="cursor:pointer;font-size:14px;font-weight:600">Downloads aren't available in this view. Copy the export instead.</summary>
    <p style="font-size:13px;color:var(--muted)">Markdown pastes into most wikis and docs; JSON can be imported here or read from Python.</p>
    <label class="vh" for="fbmd">Markdown</label><textarea id="fbmd" readonly>${esc(exportMD())}</textarea>
    <label class="vh" for="fbjs">JSON</label><textarea id="fbjs" readonly style="margin-top:8px">${esc(JSON.stringify(projectJSON(S),null,2))}</textarea></details>`;
}
async function download(filename,data){
  if(STANDALONE){
    const types={html:"text/html",md:"text/markdown",json:"application/json",csv:"text/csv"};
    const ext=filename.split(".").pop();
    const url=URL.createObjectURL(new Blob([data],{type:(types[ext]||"text/plain")+";charset=utf-8"}));
    const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000); toast("Saved "+filename); return;
  }
  if(!DL){ toast("Downloads aren't available here"); return; }
  try{ const r=await DL.save({filename,data}); if(r&&r.status==="saved") toast("Saved "+filename); }
  catch(e){
    const c=e&&e.code;
    if(c==="declined") return;
    if(c==="rate_limited") toast("A save prompt is already open");
    else if(c==="extension_not_enabled") toast("That file type isn't available here");
    else { DL=null; updateDlUI(); toast("Downloads aren't available here"); }
  }
}

/* Deleting a project destroys a governance record for everyone, and
   cannot be undone. A browser confirm() is one reflexive click away
   from that, and the click that does it looks exactly like every
   other confirm the user dismisses all day.

   So the name has to be typed. Not as friction for its own sake: it
   forces the user to read WHICH project they are about to destroy,
   which is the mistake that actually happens -- deleting the right
   kind of thing from the wrong row. */
function openDeleteDialog(){
  const name = S.meta.solution || "Untitled AI solution";
  const host = document.createElement("div");
  host.className = "modal-backdrop";
  host.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delTitle">
      <h2 id="delTitle" style="margin-top:0">Delete this project forever?</h2>
      <p>This destroys the review for <b>everyone</b>: the checklist, every
      checkpoint decision and its sign-offs, the model card and the audit log.
      It cannot be undone.</p>
      <p><b>Archive it instead</b> if you only want it off the active portfolio.
      Archiving keeps the whole record and can be reversed.</p>
      <label for="delName">Type <b>${esc(name)}</b> to confirm</label>
      <input type="text" id="delName" autocomplete="off" spellcheck="false"
             aria-describedby="delHint">
      <p id="delHint" class="small" style="color:var(--muted)">The name must match exactly.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn" data-del-cancel>Cancel</button>
        <button class="btn" data-del-archive>Archive instead</button>
        <button class="btn danger" data-del-go disabled>Delete forever</button>
      </div>
    </div>`;
  document.body.appendChild(host);

  const field = host.querySelector("#delName");
  const go = host.querySelector("[data-del-go]");
  const close = () => { host.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key === "Escape") close(); };

  field.addEventListener("input", () => { go.disabled = field.value.trim() !== name; });
  field.addEventListener("keydown", e => { if(e.key === "Enter" && !go.disabled) go.click(); });
  host.querySelector("[data-del-cancel]").onclick = close;
  host.addEventListener("click", e => { if(e.target === host) close(); });
  document.addEventListener("keydown", onKey);

  host.querySelector("[data-del-archive]").onclick = () => {
    close();
    const v = !S.archived;
    S.archived = v;
    queuePatch(CUR, Object.assign({archived:v}, stamp()));
    writeLog(CUR, "Archived");
    renderMain(false);
    toast("Project archived");
  };

  go.onclick = async () => {
    if(field.value.trim() !== name) return;   // belt and braces
    const id = CUR;
    go.disabled = true; go.textContent = "Deleting…";
    close();
    delete pending[id]; clearTimeout(timers[id]);
    try{ await STORE.remove(id); goHome(); toast("Project deleted"); }
    catch(err){ toast("Couldn't delete the project"); }
  };

  setTimeout(() => field.focus(), 0);
}

function fillItems(p, stages, status){ STAGES.filter(s=>stages.includes(s.n)).forEach(s=>s.items.forEach(it=>p.items[it.id]={status,evidence:"",owner:"",due:""})); }

function buildSample(spec, now){
  const d=n=>ymd(addDays(now,n)), iso=n=>addDays(now,n).toISOString();
  const p=blankProject(spec.name);
  Object.assign(p.meta,{org:"Example Regional Health",chaiUseCase:spec.use||""},spec.meta||{});
  fillItems(p, spec.stages||[], "met");
  Object.entries(spec.items||{}).forEach(([id,[status,evidence,owner,due]])=>{
    p.items[id]={status,evidence:evidence||"",owner:owner||"",due:due==null?"":d(due)};
  });
  Object.entries(spec.gates||{}).forEach(([k,[decision,day]])=>{
    p.gates[k]={decision,by:"AI governance committee",date:d(day),
      rationale:/Stop|Revise/.test(decision)?"See the review record.":"Met criteria for this stage.",
      signedBy:ME.id||null,signedAt:iso(day)};
  });
  if(spec.card) p.card=Object.assign(spec.use==="sepsis-risk-prediction"?clone(EX_CARD):{}, spec.card);
  if(spec.metrics) p.metrics=clone(spec.metrics);
  if(spec.cardAt!=null) p.cardUpdatedAt=iso(spec.cardAt);
  if(spec.updated!=null) p.updatedAt=iso(spec.updated);
  return p;
}

function exampleInto(p){
  const today=new Date(), d=n=>ymd(addDays(today,n));

  p.items["s3-1"]={status:"partial",evidence:"Vendor provided a summary only; full provenance requested.",owner:"Procurement",due:d(14)};

/* Additive and repeatable. The samples used to be loadable only into an
   empty workspace, from a button that vanished as soon as anything existed --
   so anyone who loaded them once could never get the ones added later, and
   there was no way to top up. Matching on name keeps a second press from
   duplicating what is already there. */
async function loadSamples(){
  const now=new Date();
  const have=new Set([...PROJECTS.values()].map(p=>(p.meta.solution||"").trim()));
  const missing=SAMPLES.filter(spec=>!have.has(spec.name));
  if(!missing.length){ toast("All sample projects are already here"); return; }
  for(const spec of missing) await createProject(buildSample(spec, now), "Sample project added");
  toast(`${missing.length} sample project${missing.length===1?"":"s"} added`);
}

  if(t.dataset.home){ goHome(); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }

    if(f && f.id==="optica") setOpticaEnabled(!f.enabled(S));
    return;
  }
  if(t.dataset.filter){ UI.filter=t.dataset.filter; saveUI(); updateDashboard(); document.querySelector(`[data-filter="${UI.filter}"]`)?.focus(); return; }
  if(t.dataset.set && !RO){
    const id=t.dataset.set, store=t.dataset.store||"items";
    const cur=((get(store)||{})[id]||{}).status||"";
    const val = cur===t.dataset.s ? "" : t.dataset.s;
    edit(`${store}.${id}.status`, val);
    const li=t.closest(".ci");
    li.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.s===val)));

    renderRail(); return;
  }
  if(t.dataset.toggle){
    const id=t.dataset.toggle, li=t.closest(".ci"); const open=!openItems.has(id);

    li.classList.toggle("open",open); t.textContent=open?"Hide details":"Evidence & owner"; t.setAttribute("aria-expanded",String(open));
    if(open && !RO) li.querySelector("textarea").focus();
    return;

  if(t.dataset.gate && !RO){
    const k=t.dataset.gate, g=S.gates[k]||{};
    const val = g.decision===t.dataset.d ? "" : t.dataset.d;
    const now=new Date().toISOString();
    const patch={gates:{[k]:{decision:val, signedBy:val?(ME.id||null):null, signedAt:val?now:null, date: val ? (g.date||TODAY()) : (g.date||"")}}};
    deepMerge(S,patch); const st=stamp(); Object.assign(S,st);
    queuePatch(CUR, Object.assign(patch,st));
    writeLog(CUR, val?`${GATES[k].title}: ${val}`:`${GATES[k].title}: decision cleared`);
    renderRail(); renderMain(false); return;
  }
  // Add a CHAI-recommended metric. Name and category only: the value, the
  // interval and the population are measurements the organization has to make,
  // and pre-filling them would be inventing results.
  if(t.dataset.te && !RO){
    const name=t.dataset.te;
    if(!S.metrics.some(m=>(m.name||"").trim().toLowerCase()===name.trim().toLowerCase())){
      S.metrics.push({cat:t.dataset.teCat||METRIC_CATS[0],name,value:"",ci:"",pop:""});
      saveMetrics();
    }
    renderMain(false); renderLabel();
    // Put the cursor where the user now has to type.
    const rows=[...document.querySelectorAll('.mtable input[aria-label="Metric"]')];
    const row=rows.find(i=>i.value===name);
    if(row) row.closest("tr").querySelector('input[aria-label="Value"]').focus();
    return;
  }
  if(t.dataset.delmetric!=null && !RO){ S.metrics.splice(+t.dataset.delmetric,1); saveMetrics(); renderMain(false); renderLabel(); return; }
  const a=t.dataset.act; if(!a) return;
  if(a==="new"){ const f=document.getElementById("newform"); if(f){ f.hidden=false; document.getElementById("newname").focus(); } return; }
  if(a==="new-cancel"){ document.getElementById("newform").hidden=true; return; }
  if(a==="samples"){
    t.disabled=true;
    try{ await loadSamples(); }
    finally{ t.disabled=false; }
    return;
  }
  if(a==="legacy"){
    try{ const j=JSON.parse(localStorage.getItem("chai-review-v1")); const p=normalize(Object.assign(blankProject(j.meta.solution),{meta:j.meta,items:j.items||{},gates:j.gates||{},metrics:j.metrics||[],card:j.card||{}}));
      Object.values(p.items).forEach(x=>{ if(x) delete x._open; });
      const id=await createProject(p,"Imported from a review saved in this browser"); if(id){ localStorage.setItem("chai-legacy-imported","1"); document.getElementById("legacyBanner")?.remove(); toast("Review added to the workspace"); }
    }catch(err){ toast("Couldn't read the earlier review"); }
    return;
  }
  if(a==="legacy-dismiss"){ try{localStorage.setItem("chai-legacy-imported","1");}catch(e){} document.getElementById("legacyBanner")?.remove(); return; }
  if(a==="import"){ document.getElementById("importFile").click(); return; }
  if(a==="dl-csv"){ download(`ai-governance-portfolio-${TODAY()}.csv`, exportCSV()); return; }
  if(!S) return;
  if(a==="claim"){
    if(!ME.id){ toast("No signed-in user to claim ownership"); return; }
    S.access=accessPatch(S,ME.id,"owner"); queuePatch(CUR,Object.assign({access:S.access},stamp()));
    writeLog(CUR,"Claimed ownership"); RO=false; CAN_DELETE=true; renderProject(false); toast("You are now an owner"); return;
  }
  if(a==="grant"){
    if(!canOwn(S)){ toast("Only an owner can grant access"); return; }
    const el=document.querySelector("[data-grant-id]");
    const id=el&&el.value?el.value.trim():"";
    const roleEl=document.querySelector("[data-grant-role]");
    const role=roleEl?roleEl.value:"reader";
    if(!id){ toast("Enter a user id"); return; }
    S.access=accessPatch(S,id,role); queuePatch(CUR,Object.assign({access:S.access},stamp()));
    writeLog(CUR,`Granted ${ROLE_LABEL[role].toLowerCase()} to ${id}`); renderMain(false); toast("Access granted"); return;
  }
  if(a==="addmetric"){ S.metrics.push({cat:METRIC_CATS[0],name:"",value:"",ci:"",pop:""}); saveMetrics(); renderMain(false); const ins=document.querySelectorAll('.mtable input[aria-label="Metric"]'); ins[ins.length-1]?.focus(); }
  else if(a==="example"){ exampleInto(S); const st=stamp(); queuePatch(CUR,Object.assign({meta:clone(S.meta),items:clone(S.items),gates:clone(S.gates),metrics:clone(S.metrics),card:clone(S.card),cardUpdatedAt:S.cardUpdatedAt},st)); writeLog(CUR,"Example data filled in"); renderProject(false); toast("Example filled in"); }
  else if(a==="archive"){ if(!canOwn(S)){ toast("Only an owner can archive this project"); return; } const v=!S.archived; S.archived=v; queuePatch(CUR,Object.assign({archived:v},stamp())); writeLog(CUR,v?"Archived":"Restored"); renderMain(false); toast(v?"Project archived":"Project restored"); }
  else if(a==="delete"){ if(!canOwn(S)){ toast("Only an owner can delete this project"); return; } openDeleteDialog(); }
  else if(a==="newreview"){ const now=new Date().toISOString(); const patch={gates:{D:{date:TODAY(),signedBy:ME.id||null,signedAt:now}}}; deepMerge(S,patch); queuePatch(CUR,Object.assign(patch,stamp())); writeLog(CUR,`Checkpoint D: periodic review recorded (${S.gates.D.decision})`); renderRail(); renderMain(false); toast("Periodic review recorded"); }
  else if(a==="dl-html") download(`${slug(S.meta.solution)}-chai-review.html`, exportHTML());
  else if(a==="dl-md") download(`${slug(S.meta.solution)}-chai-review.md`, exportMD());
  else if(a==="dl-json") download(`${slug(S.meta.solution)}-chai-review.json`, JSON.stringify(projectJSON(S),null,2));
  else if(a==="dl-pdf") exportPDF();
  else if(a==="print") window.print();
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="newform") return; e.preventDefault();
  const name=document.getElementById("newname").value.trim(); if(!name){ document.getElementById("newname").focus(); return; }
  const id=await createProject(blankProject(name),"Project created");
  if(id){ const wait=()=>PROJECTS.has(id)?openProject(id,"setup"):setTimeout(wait,120); wait(); }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){ UI.q=el.value; updateDashboard(); return; }
  const p=el.dataset && el.dataset.bind; if(!p || RO || !S) return;
  // Mark this as live typing so the changelog waits for the field to be
  // finished rather than describing each keystroke.
  setTyping(true);
  try{ edit(p, el.value); } finally { setTyping(false); }
  if(p.startsWith("meta.")||p.startsWith("card.")||p.startsWith("metrics.")) renderLabel();
  if(p==="meta.solution"||p.startsWith("card.")) renderRail();
});
/* A text edit is finished when focus leaves the field. Capture phase, because
   `blur` does not bubble. This is what turns a sentence into one changelog
   entry regardless of how long the typist paused in the middle of it. */
document.addEventListener("blur", e=>{
  const el=e.target;
  const p=el && el.dataset && el.dataset.bind;
  if(p && CUR) flushChanges(CUR, p);
}, true);

document.addEventListener("change",e=>{
  const el=e.target;
  // The use-case picker is stored on the project, so the chosen framework
  // persists and the suggestions are there next time someone opens stage 4.
  if(el.dataset && el.dataset.teUse!=null && S && !RO){ edit("meta.chaiUseCase", el.value); renderMain(false); return; }
  if(el.dataset && el.dataset.bind && S && !RO && (el.tagName==="SELECT" || el.type==="date")){
    edit(el.dataset.bind, el.value);   // discrete: edit() flushes it already
    renderLabel(); renderRail();
  }
});
/* An edit still in the buffer when the page goes away would never be
   described. pagehide covers closing, navigating and mobile backgrounding;
   visibilitychange catches a tab switch, which is a common way to stop
   mid-sentence. */
addEventListener("pagehide", flushAllChanges);
addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushAllChanges(); });

document.getElementById("brandBtn").onclick=()=>goHome();
document.getElementById("goReport").onclick=()=>{ if(S) go("report"); };
document.getElementById("importFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const st=j._state||j;
    if(!st.meta||!st.items) throw new Error("not a review");
    const p=normalize(Object.assign(blankProject(st.meta.solution), clone(st))); delete p.id;
    Object.values(p.items).forEach(x=>{ if(x) delete x._open; }); delete p.view;
    p.updatedAt=new Date().toISOString(); p.updatedBy=ME.id||null;
    const id=await createProject(p,"Imported from a JSON export");
    if(id) toast("Project imported");
  }catch(err){ toast("That file isn't a project export from this tool"); }
  e.target.value="";
};
const panel=document.getElementById("panel");
document.getElementById("openPreview").onclick=()=>{ renderLabel(); panel.classList.add("open"); document.getElementById("closePreview").focus(); };
document.getElementById("closePreview").onclick=()=>panel.classList.remove("open");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") panel.classList.remove("open"); });
window.addEventListener("pagehide",()=>{ Object.keys(pending).forEach(flush); });

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

/* ============================================================
   Boot
   ============================================================ */
renderDashboardShell();
(async()=>{
  let db=null, user=null;
  const hasClaude = window.claude && typeof window.claude.use==="function";
  if(hasClaude){
    const dlP = window.claude.use("downloads").then(d=>{DL=d;}).catch(()=>{}).finally(()=>{dlChecked=true; updateDlUI();});
    [db,user] = await Promise.all([window.claude.use("db").catch(()=>null), window.claude.use("user").catch(()=>null)]);
  } else { dlChecked=true; }
  USER=user;
  if(user){
    try{ ME.id = await user.id(); }catch(e){}
    try{ const c=await user.can("data.write"); if(db && c===false) WORKSPACE_RO=RO=true; }catch(e){}
    try{ CAN_DELETE = (await user.canEdit()) || (await user.isOwner()); }catch(e){ CAN_DELETE=false; }
  }
  if(db){ STORE=new DbStore(db); MODE="shared"; setMode(RO?"View only":"Shared workspace", RO?"ro":"shared"); }
  else {
    // Self-hosted backend, if this page is served by one. Checked only when
    // there is no artifact database, so the artifact path costs nothing.
    const api = await detectApi("/api");
    if(api){
      STORE=new ApiStore("/api"); MODE="api"; CAN_DELETE=true;
      setMode("Shared workspace","shared");
      // Identity is established by the proxy, so the browser cannot choose it.
      try{
        const me = await fetch("/api/me",{credentials:"same-origin"}).then(r=>r.json());
        if(me && me.id){ ME.id=me.id; if(me.name) NAMES[me.id]=me.name; }
      }catch(e){}
    } else {
      STORE=new LocalStore(); MODE="local"; CAN_DELETE=true; setMode("This browser only","");
    }
  }
  document.body.classList.toggle("ro",RO);
  STORE.subscribeAll(onProjects,onDbError);
})();

</script>
