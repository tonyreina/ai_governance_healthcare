# Git hooks, run with prek (https://prek.j178.dev) — a drop-in, dependency-free
# replacement for pre-commit. Install the shims once with: pixi run hooks-install
#
# The vendored single-file dashboard is excluded from the whitespace fixers.
# It is a self-contained app with inline JS template literals, where rewriting
# whitespace is not reliably a no-op.
exclude: '^docs/app/index\.html$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      # Reads .rumdl.toml, so the mkdocs flavor applies here too and Material
      # admonitions are not reported as errors.
      - id: rumdl-check

  - repo: local
    hooks:
      # Catches broken internal links before they reach CI, where the same
      # --strict build gates the deploy. Note: --strict does NOT flag a nav
      # entry pointing at a missing page -- that builds clean, so nav changes
      # still want a look at the rendered site.
      - id: zensical-build
        name: zensical build (strict)
        entry: pixi run zensical build --clean --strict
        language: system
        pass_filenames: false
        files: '^(docs/|zensical\.toml$)'
