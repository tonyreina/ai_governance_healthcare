[workspace]
channels = ["conda-forge"]
name = "ai_governance_healthcare"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11,<3.13"

[pypi-dependencies]
zensical = "*"
prek = "*"
rumdl = "*"
pypdf = ">=6.19.0, <7"
mlcroissant = ">=1.1.1, <2"
playwright = ">=1.63.0, <2"
ruff = ">=0.16.10, <0.17"
scikit-learn = ">=1.9.1, <2"

[tasks]
docs-serve = "zensical serve"
docs-build = "zensical build --clean --strict"
lint = { depends-on = ["lint-md", "lint-py"] }
lint-md = "rumdl check ."
lint-py = "ruff check ."
lint-fix = { depends-on = ["lint-md-fix", "lint-py-fix", "format-py"] }
lint-md-fix = "rumdl check --fix ."
lint-py-fix = "ruff check --fix ."
format-py = "ruff format ."
# Generated artifacts. `gen-docs` regenerates everything derived from
# data/optica_items.json and the app itself, then rebuilds the dashboard.
gen-docs = { depends-on = ["gen-chai-docs", "gen-optica-docs", "gen-optica-module", "gen-te-page", "build-app"] }
gen-chai-docs = "python scripts/gen_chai_checklist.py"
gen-optica-docs = "python scripts/gen_optica_checklist.py"
gen-optica-module = "python scripts/gen_optica_module.py"
gen-chai-metrics = "python scripts/gen_chai_metrics.py"
gen-te-page = "python scripts/gen_te_page.py"

# The dashboard: sources live in app/, docs/app/index.html is generated.
build-app = "python scripts/build_app.py"
check-app = "python scripts/check_app.py"
test-app = "python tests/test_optica.py"
test-boot = "python tests/test_boot_storage.py"
test-exports = "python tests/test_exports.py"
# No key in a document can write to an object's prototype: merge, path set and get (#124).
test-untrusted-keys = "python tests/test_untrusted_keys.py"
# "Search all text" on the portfolio finds every project holding some text (#57).
test-text-search = "python tests/test_text_search.py"
# The dashboard in seven languages: resolution, picker, dates, safety fallback, plural
# rules, and a pseudo-locale ratchet on hard-coded text (#80).
test-i18n = "python tests/test_i18n.py"
test-audit = "python tests/test_audit_log.py"
# Free-text fields opt out of browser spellcheck and form history (#59).
test-text-fields = "python tests/test_text_fields.py"
test-no-3p = "python tests/test_no_third_party.py"
test-proxy = "python tests/test_proxy_identity.py"
test-stack = "python tests/test_stack.py"
test-pdf = "python tests/test_pdf.py"
test-te = "python tests/test_te_metrics.py"
test-access = "python tests/test_access.py"
test-changelog = "python tests/test_changelog.py"
# The delete dialog: honest about what deleting does, and a way to destroy history.
test-disposal-ui = "python tests/test_disposal_ui.py"
# A closed set of values gets an enumerated type, not a string. See CLAUDE.md.
check-enums = "python scripts/check_enums.py"
test-enums = "python tests/test_check_enums.py"
# Unit tests of the CI configuration: does CI run every test, and fail on a skip?
test-workflows = "python tests/test_workflows.py"
# The showcase video: present, bounded, first-party, streamable, honest about the mode.
test-docs-media = "python tests/test_docs_media.py"
# docs/security-claims.md: every claim quoted from where it is made and backed by a
# test CI runs. `check-claims` checks the real page; `test-claims` tests the checker.
check-claims = "python scripts/check_claims.py"
test-claims = "python tests/test_check_claims.py"
# The network isolation the security model rests on: no port on the api or db, the
# db on an internal network, loopback by default, a named volume, a pinned image.
test-compose = "python tests/test_compose_isolation.py"
# `make check-isolation`, shown to fail: a published port, a reachable API and a
# forwarded identity must each be noticed, and the exit code must say so (#56).
test-isolation = "python tests/test_check_isolation.py"
# The backup passphrase is never in a process's argv, and a failed dump or a wrong
# passphrase fails the command (#41). Needs gpg and make.
test-backup-crypto = "python tests/test_backup_crypto.py"
# examples/croissant_export.py: no named individuals unless asked (#60).
test-croissant = "python tests/test_croissant_export.py"
# The audit history is a window, and says so; LocalStore keeps every entry (#40).
test-log-window = "python tests/test_log_window.py"
# `make doctor`'s role checks: the API's restricted role, and its password (#48).
test-doctor = "python tests/test_doctor.py"
# A user id becomes a person wherever the record is shown (#39).
test-people = "python tests/test_people.py"
# The dashboard's idle lock, sign-out link and lost-stream handling (#49).
test-session-ui = "python tests/test_session_ui.py"
# The dashboard reports each export it produces, in the server-backed mode (#33).
test-export-beacon = "python tests/test_export_beacon.py"
# Every export says which storage mode produced it, in the header's own words (#93).
test-export-provenance = "python tests/test_export_provenance.py"
# The data scope (governance metadata only, never patient data, any mode) leads the docs (#34).
test-data-scope = "python tests/test_data_scope.py"
# `make verify-backup` restores a dump into a throwaway PostgreSQL and checks the
# guarantees survived; `make restore` asks first (#52). Needs Docker and gpg.
test-verify-backup = "python tests/test_verify_backup.py"
# What is running and how we learn it is vulnerable: locked, hashed, digest-pinned,
# watched, and a policy for reports (#37). The image build needs Docker.
test-supply-chain = "python tests/test_supply_chain.py"
# The deployment guide leaves the data's region to the reader and says why (#58).
test-deploy-residency = "python tests/test_deploy_residency.py"
# Finding one person's identifier across every table, on a real PostgreSQL (#57). Needs Docker.
test-subject-access = "python tests/test_subject_access.py"
# make phi-scan: a pasted patient identifier is found, a governance record is not
# flagged, against a real PostgreSQL and the sample projects (#66). Docker + Chromium.
test-phi-scan = "python tests/test_phi_scan.py"
# make restore re-applies purges: a real dump from before a purge, restored for real (#116).
test-purge-ledger = "python tests/test_purge_ledger.py"
# What a `docker build` sends to the daemon: no .env, backups, .git or licensed PDF (#63).
test-dockerignore = "python tests/test_dockerignore.py"
# The gate behind `make up`: placeholders, literal identities, plain HTTP on the network,
# and reading .env the way compose does (empty means the default; " #" starts a comment).
test-preflight = "python tests/test_preflight.py"
check-spelling = "python scripts/check_spelling.py"
# Every catalog has en.json's keys, placeholders and plural forms, and no markup (#80).
check-i18n = "python scripts/check_i18n.py"
test-check-i18n = "python tests/test_check_i18n.py"
check-chai = "python scripts/check_chai_updates.py"
check-chai-write = "python scripts/check_chai_updates.py --write"
fix-spelling = "python scripts/check_spelling.py --fix"
hooks-install = "prek install"
check = "prek run --all-files"
