<script>
/* ============================================================
   Utilities
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => o==null ? o : JSON.parse(JSON.stringify(o));
const isObj = v => v && typeof v==="object" && !Array.isArray(v);
function deepMerge(t,src){ for(const k in src){ if(isObj(src[k]) && isObj(t[k])) deepMerge(t[k],src[k]); else t[k]=clone(src[k]); } return t; }
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const TODAY = ()=> ymd(new Date());
function parseDay(s){ if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const d=new Date(s.slice(0,10)+"T00:00:00"); return isNaN(d)?null:d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtDay(s){ const d=parseDay(s); return d? d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : ""; }
function ago(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; const m=Math.round((Date.now()-d)/60000);
  if(m<1) return "just now"; if(m<60) return `${m} min ago`; const h=Math.round(m/60); if(h<24) return `${h} h ago`; const dd=Math.round(h/24); if(dd<45) return `${dd} days ago`; return fmtDay(iso.slice(0,10)); }
const newId = ()=> "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============================================================
   Core: the project document
   Framework-agnostic. Knows a project has meta, items, gates,
   metrics and a card -- not what any of them mean.
   ============================================================ */
const blankMeta = ()=>({solution:"",org:"",developer:"",sourcing:"",sponsor:"",reviewers:"",riskTier:"",reviewCadence:"",startDate:"",scope:""});
function blankProject(name){
  const now=new Date().toISOString();
  return {meta:{...blankMeta(),solution:name||""}, ...frameworkBlank(), metrics:[], card:{},
    archived:false, createdAt:now, createdBy:ME.id||null, updatedAt:now, updatedBy:ME.id||null, cardUpdatedAt:null};
}
function normalize(p){
  p.meta=Object.assign(blankMeta(),p.meta||{});
  p.metrics=Array.isArray(p.metrics)?p.metrics:[]; p.card=p.card||{};
  frameworkNormalize(p); return p;
}
const cardValOf = (p,k) => ((p.card||{})[k]||"").trim() || (k==="name"?(p.meta.solution||"").trim():"") || (k==="developer"?(p.meta.developer||"").trim():"");

const STATUS = {met:"Met",partial:"Partial",notmet:"Not met",na:"N/A"};
const VAL = {met:1,partial:.5,notmet:0};

// Generic: scores any list of {id} against any items map. Framework rules
// decide WHICH list to pass; this does not know.
function scoreOf(list, items){
  items=items||S.items; let sum=0,n=0,answered=0;
  list.forEach(it=>{ const st=(items[it.id]||{}).status; if(st) answered++; if(st==="na") return; n++; sum+=VAL[st]||0; });
  return {pct:n?Math.round(sum/n*100):0,answered,total:list.length,applicable:n};
}

/* ============================================================
   Stores: shared database, or this browser as a fallback
   ============================================================ */
class DbStore{
  constructor(db){ this.db=db; }
  col(){ return this.db.collection("projects"); }
  subscribeAll(cb,err){ return this.col().onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...clone(d.data())}))),err); }
  create(id,data){ return this.col().doc(id).set(data); }
  update(id,patch){ return this.col().doc(id).update(patch); }
  remove(id){ return this.col().doc(id).delete(); }
  log(id,e){ return this.db.collection(`projects/${id}/log`).add(e); }
  subscribeLog(id,cb){ return this.db.collection(`projects/${id}/log`).orderBy("at","desc").limit(60).onSnapshot(s=>cb(s.docs.map(d=>clone(d.data()))),()=>{}); }
}
class LocalStore{
  constructor(){ this.k="chai-portfolio-local-v1"; this.d=this.load(); this.subs=[]; this.logSubs={}; }
  load(){ try{ return JSON.parse(localStorage.getItem(this.k)) || {projects:{},logs:{}}; }catch(e){ return {projects:{},logs:{}}; } }
  persist(){ try{ localStorage.setItem(this.k,JSON.stringify(this.d)); }catch(e){} }
  emit(){ const list=Object.entries(this.d.projects).map(([id,v])=>({id,...clone(v)})); this.subs.forEach(f=>setTimeout(()=>f(list))); }
  subscribeAll(cb){ this.subs.push(cb); this.emit(); return ()=>{ this.subs=this.subs.filter(x=>x!==cb); }; }
  async create(id,data){ this.d.projects[id]=clone(data); this.persist(); this.emit(); }
  async update(id,patch){ if(!this.d.projects[id]) throw {code:"invalid_argument"}; deepMerge(this.d.projects[id],patch); this.persist(); this.emit(); }
  async remove(id){ delete this.d.projects[id]; delete this.d.logs[id]; this.persist(); this.emit(); }
  async log(id,e){ const l=(this.d.logs[id]||(this.d.logs[id]=[])); l.unshift(e); this.d.logs[id]=l.slice(0,100); this.persist(); (this.logSubs[id]||[]).forEach(f=>setTimeout(()=>f(clone(this.d.logs[id])))); }
  subscribeLog(id,cb){ (this.logSubs[id]||(this.logSubs[id]=[])).push(cb); setTimeout(()=>cb(clone(this.d.logs[id]||[]))); return ()=>{ this.logSubs[id]=(this.logSubs[id]||[]).filter(x=>x!==cb); }; }
}

/* ApiStore: a self-hosted backend over REST + Server-Sent Events.

   Selected at boot when /api/health answers, which is true when the app is
   served by the Docker Compose stack and false for the GitHub Pages copy, so
   one build covers both. Identity comes from /api/me, established by the
   reverse proxy -- the browser cannot influence who it is, which is what makes
   a checkpoint sign-off here mean something that a localStorage one does not.

   Live updates: the server sends ids, not documents, so a change notification
   is small and never races a larger body. Each event triggers one refetch of
   the list. For a governance tool with tens of projects that is cheaper than
   reconciling partial state, and it cannot drift. */
class ApiStore{
  constructor(base){ this.base=base||"/api"; this.es=null; this.cbs=[]; this.cache=[]; }

  async req(path,opts){
    const r = await fetch(this.base+path, Object.assign({
      headers:{"Content-Type":"application/json"}, credentials:"same-origin"
    }, opts||{}));
    if(!r.ok){
      // Surface the API's own code so onDbError can tell a permission problem
      // from a conflict; the app already distinguishes them.
      const err = new Error(`${r.status} ${r.statusText}`);
      err.code = r.status===403||r.status===401 ? "permission_denied"
               : r.status===409 ? "already_exists"
               : r.status===404 ? "not_found" : "unavailable";
      throw err;
    }
    return r.status===204 ? null : r.json();
  }

  async refresh(){
    const list = await this.req("/projects");
    this.cache = Array.isArray(list) ? list : [];
    this.cbs.forEach(f=>{ try{ f(clone(this.cache)); }catch(e){} });
  }

  subscribeAll(cb,err){
    this.cbs.push(cb);
    this.refresh().catch(e=>{ if(err) err(e); });
    if(!this.es){
      this.es = new EventSource(this.base+"/events");
      // The server sends NAMED events ("event: project.created"). EventSource
      // fires onmessage only for events with no name, so a handler attached
      // there never runs and the page silently stops updating -- it still
      // works, because every local write re-renders, so the failure only shows
      // when a COLLEAGUE makes a change. Each name needs its own listener.
      ApiStore.EVENTS.forEach(name=>{
        this.es.addEventListener(name, ()=>{ this.refresh().catch(()=>{}); });
      });
      // EventSource reconnects on its own; a refresh on reopen closes the gap
      // of anything missed while disconnected.
      this.es.onopen = ()=>{ this.refresh().catch(()=>{}); };
      this.es.onerror = ()=>{};
    }
    return ()=>{ this.cbs = this.cbs.filter(f=>f!==cb); };
  }

  create(id,data){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"POST",body:JSON.stringify(data)}); }
  update(id,patch){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"PATCH",body:JSON.stringify(patch)}); }
  remove(id){ return this.req(`/projects/${encodeURIComponent(id)}`,{method:"DELETE"}); }
  log(id,e){ return this.req(`/projects/${encodeURIComponent(id)}/log`,{method:"POST",body:JSON.stringify(e)}); }

  subscribeLog(id,cb){
    let stop=false;
    const pull = ()=> this.req(`/projects/${encodeURIComponent(id)}/log`)
      .then(rows=>{ if(!stop && Array.isArray(rows)) cb(rows); }).catch(()=>{});
    pull();
    // The log is append-only and low-traffic, so it rides the same change
    // signal as the project list rather than opening a second stream.
    const onChange = ()=> pull();
    this.cbs.push(onChange);
    return ()=>{ stop=true; this.cbs = this.cbs.filter(f=>f!==onChange); };
  }
}

/* Event names the API emits. Keep in step with server/app/events.py. */
ApiStore.EVENTS = ["project.created","project.updated","project.deleted","log.appended","resync"];

/* Is a self-hosted backend serving this page? Short timeout: on GitHub Pages
   the request 404s immediately, and the user should not wait on it. */
async function detectApi(base){
  try{
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 2500);
    const r = await fetch((base||"/api")+"/health",{signal:ctl.signal,credentials:"same-origin"});
    clearTimeout(t);
    if(!r.ok) return null;
    const j = await r.json();
    return j && j.status==="ok" ? j : null;
  }catch(e){ return null; }
}

/* ============================================================
   App state
   ============================================================ */
let STORE=null, MODE="connecting", RO=false, CAN_DELETE=true, USER=null;
const ME={id:null};
let PROJECTS=new Map(), LOADED=false;
let CUR=null;              // open project id
let S=null;                // working copy of open project
let LOG=[], unsubLog=null;
const openItems=new Set();
const pending={}, timers={}, flushing={};
let UI={view:"setup", project:null, filter:"all", q:""};
try{ UI=Object.assign(UI, JSON.parse(localStorage.getItem("chai-ui-v2"))||{}); }catch(e){}
function saveUI(){ try{ localStorage.setItem("chai-ui-v2",JSON.stringify({view:UI.view,project:CUR,filter:UI.filter})); }catch(e){} }

/* names */
const NAMES={};
async function resolveNames(root){
  root=root||document;
  const els=[...root.querySelectorAll("[data-uid]")];
  const ids=[...new Set(els.map(e=>e.dataset.uid).filter(Boolean))];
  els.forEach(e=>{ if(!e.dataset.uid) e.textContent = MODE==="local"?"you (this browser)":"someone"; });
  const need=ids.filter(i=>!(i in NAMES));
  if(need.length && USER && USER.profiles){
    try{ const ps=await USER.profiles(need); need.forEach(i=>{ const p=ps[i]; NAMES[i]= p ? (p.isMe ? "you" : (p.name||"someone")) : "someone"; }); }catch(e){ need.forEach(i=>NAMES[i]="someone"); }
  }
  els.forEach(e=>{ const i=e.dataset.uid; if(i) e.textContent = NAMES[i] || (i===ME.id?"you":"someone"); });
}
const who = id => `<span data-uid="${esc(id||"")}">${id&&NAMES[id]?esc(NAMES[id]):"someone"}</span>`;

/* ============================================================
   Writes
   ============================================================ */
function setSaved(t){ document.getElementById("saved").textContent=t; }
function stamp(extra){ return Object.assign({updatedAt:new Date().toISOString(), updatedBy:ME.id||null}, extra||{}); }
function queuePatch(pid,patch){
  if(RO) return;
  deepMerge(pending[pid]||(pending[pid]={}), patch);
  setSaved("Saving…");
  clearTimeout(timers[pid]); timers[pid]=setTimeout(()=>flush(pid),550);
}
async function flush(pid,retry){
  if(flushing[pid]){ clearTimeout(timers[pid]); timers[pid]=setTimeout(()=>flush(pid),300); return; }
  const p=pending[pid]; if(!p) return; delete pending[pid];
  flushing[pid]=true;
  try{ await STORE.update(pid,p); if(!pending[pid]) setSaved(MODE==="shared"?"Saved to shared workspace":"Saved in this browser"); }
  catch(e){
    const c=e&&e.code;
    if(c==="unavailable" && !retry){ pending[pid]=deepMerge(p,pending[pid]||{}); flushing[pid]=false; setTimeout(()=>flush(pid,true),800+Math.random()*700); return; }
    if(c==="invalid_argument"){ setReadOnly(true); toast("You can view this workspace but not edit it"); }
    else if(c==="quota_exceeded"){ toast("The workspace is full. Archive or delete old projects."); }
    else if(c==="revoked"){ setReadOnly(true); }
    else toast("Couldn't save. Check your connection and try again.");
    setSaved("Not saved");
  } finally { flushing[pid]=false; }
}
function patchFromPath(path,val){
  const ks=path.split("."); const out={}; let o=out;
  for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]={}; } o[ks[ks.length-1]]=val; return out;
}
function setLocal(path,val){
  const ks=path.split("."); let o=S;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=="object") o[ks[i]]={}; o=o[ks[i]]; }
  o[ks[ks.length-1]]=val;
}
function edit(path,val){
  setLocal(path,val);
  let patch;
  if(path.startsWith("metrics.")) patch={metrics:clone(S.metrics), cardUpdatedAt:new Date().toISOString()};
  else { patch=patchFromPath(path,val); if(path.startsWith("card.")) patch.cardUpdatedAt=new Date().toISOString(); }
  if(patch.cardUpdatedAt) S.cardUpdatedAt=patch.cardUpdatedAt;
  const st=stamp(); S.updatedAt=st.updatedAt; S.updatedBy=st.updatedBy;
  queuePatch(CUR, Object.assign(patch,st));
}
function saveMetrics(){
  const now=new Date().toISOString(); S.cardUpdatedAt=now; const st=stamp(); Object.assign(S,st);
  queuePatch(CUR, Object.assign({metrics:clone(S.metrics), cardUpdatedAt:now}, st));
}
function writeLog(pid,text){ if(RO) return; STORE.log(pid,{at:new Date().toISOString(),by:ME.id||null,text}).catch(()=>{}); }

async function createProject(data,logText){
  if(RO) return null;
  const id=newId();
  try{ await STORE.create(id,data); writeLog(id,logText||"Project created"); return id; }
  catch(e){ toast(e&&e.code==="quota_exceeded"?"The workspace is full. Archive or delete old projects.":"Couldn't create the project"); return null; }
}

/* ============================================================
   Core: DOM helpers
   Form fields, focus preservation and small formatters. No
   knowledge of any framework.
   ============================================================ */
const get = (path)=> path.split(".").reduce((o,k)=>o==null?undefined:o[k], S);
function field(path,label,hint,long,opts){
  const v=esc(get(path)||""); const id="f_"+path.replace(/\./g,"_");
  let input;
  if(opts) input=`<select id="${id}" data-bind="${path}"><option value="">Choose…</option>${opts.map(o=>`<option${get(path)===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(long) input=`<textarea id="${id}" data-bind="${path}" rows="3">${v}</textarea>`;
  else input=`<input type="text" id="${id}" data-bind="${path}" value="${v}">`;
  return `<div class="field${long?" wide":""}"><label for="${id}">${esc(label)}</label>${hint?`<span class="hint">${esc(hint)}</span>`:""}${input}</div>`;
}
function pager(){
  // Views come from the registry, so the pager walks whatever the active
  // frameworks contributed. `short` lets a view give the pager a terser name
  // than its rail label; otherwise the label is used.
  const views=activeViews();
  const i=views.findIndex(v=>v.id===UI.view);
  const prev=views[i-1], next=views[i+1];
  const name=v=>v?(v.short||v.label||""):"";
  return `<div class="pager">${prev?`<button class="btn" data-go="${prev.id}">Back to ${esc(name(prev))}</button>`:`<button class="btn" data-home="1">Back to all projects</button>`}${next?`<button class="btn primary" data-go="${next.id}">Continue to ${esc(name(next))}</button>`:""}</div>`;
}
function focusKey(el){
  if(!el||!el.dataset) return null; const d=el.dataset;
  if(d.set) return `[data-set="${d.set}"][data-s="${d.s}"]`;
  if(d.gate) return `[data-gate="${d.gate}"][data-d="${CSS.escape(d.d)}"]`;
  if(d.toggle) return `[data-toggle="${d.toggle}"]`;
  if(d.act) return `[data-act="${d.act}"]`;
  return null;
}
function editingInMain(){ const a=document.activeElement, m=document.getElementById("main"); return a && m.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
function syncInputs(){
  document.querySelectorAll("#main [data-bind]").forEach(el=>{ if(el===document.activeElement) return; const v=get(el.dataset.bind)??""; if(el.value!==v) el.value=v; });
  document.querySelectorAll("#main [data-set]").forEach(b=>b.setAttribute("aria-pressed",String((S.items[b.dataset.set]||{}).status===b.dataset.s)));
}
function barCls(p){ return p>=80?"":p>=50?"mid":"low"; }

/* ============================================================
   Framework registry
   A framework is a self-contained checklist: its own items, its own
   views, its own progress. Frameworks never read each other, and the
   app shell never names one. Adding a third means adding a directory
   under app/js/10-frameworks/ that calls registerFramework().

   The contract:
     id        string, stable, used in data keys and the DOM
     label     short display name
     enabled   (p) => bool    is it switched on for this project?
     views     (p) => [view]  rail entries, in order
     render    (view, p) => html
     blank     () => object   extra keys merged into a new project
     normalize (p) => void    repair shape on load; must be idempotent

   A view is {id, kind, label, num, meta, cls, sep}. The shell renders
   the rail from these fields alone; `kind` is the framework's own
   business and is passed back to render() untouched.
   ============================================================ */
const FRAMEWORKS = [];

function registerFramework(f) {
  if (FRAMEWORKS.some(x => x.id === f.id)) throw new Error(`framework ${f.id} already registered`);
  FRAMEWORKS.push(f);
  return f;
}

const frameworkById = id => FRAMEWORKS.find(f => f.id === id);

/* Frameworks switched on for a project. CHAI is always on: it is the
   spine the compliance status and the dashboard are computed from.
   Others are opt-in per project. */
function activeFrameworks(p) {
  const proj = p || S;
  return FRAMEWORKS.filter(f => { try { return f.enabled(proj); } catch (e) { return false; } });
}

/* Every rail entry, in framework registration order, each tagged with
   the framework that owns it so the shell can route back without a
   lookup table. */
function activeViews(p) {
  const proj = p || S;
  return activeFrameworks(proj).flatMap(f =>
    (f.views(proj) || []).map(v => ({ ...v, fw: f }))
  );
}

const viewById = (id, p) => activeViews(p).find(v => v.id === id);

/* Extra top-level keys a new project needs. Existing projects without
   them stay valid: every framework's normalize() has to cope with its
   own keys being absent, which is what keeps old exports importable. */
function frameworkBlank() {
  return FRAMEWORKS.reduce((acc, f) => Object.assign(acc, f.blank ? f.blank() : {}), {});
}

function frameworkNormalize(p) {
  FRAMEWORKS.forEach(f => { if (f.normalize) f.normalize(p); });
  return p;
}

/* ============================================================
   Project setup
   The project itself: who is reviewing what, the history, and which
   optional frameworks are switched on. This is not CHAI's screen --
   it belongs to the project, which is why it lives outside the
   framework directories and registers first so it heads the rail.

   The compliance banner does read CHAI's flags(). That is deliberate
   and documented: CHAI is the spine the dashboard status comes from,
   and only one framework can own that. See docs/crosswalk.md.
   ============================================================ */
function frameworkToggles(){
  const optional = FRAMEWORKS.filter(f => f.id !== "chai" && f.id !== "project");
  if(!optional.length) return "";
  const rows = optional.map(f=>{
    const on = f.enabled(S);
    return `<li style="display:flex;align-items:center;gap:10px;padding:6px 0">
      <button class="btn${on?" primary":""}" data-framework="${esc(f.id)}" aria-pressed="${on}">${on?"On":"Off"}</button>
      <span><b>${esc(f.label)}</b> \u2014 ${on?"its views appear in the rail below CHAI's":"77 adoption questions, answered by five stakeholders"}</span>
    </li>`;
  }).join("");
  return `<h2 class="ro-hide">Frameworks</h2>
  <p class="ro-hide" style="font-size:13px;color:var(--muted)">CHAI always runs. Switching another framework on adds its questions alongside; answers are kept if you switch it off again, and neither framework changes the other's status.</p>
  <ul class="ro-hide" style="list-style:none;padding:0;margin:0">${rows}</ul>`;
}

function renderSetup(){
  const f=flags(S), st=statusOf(S), nr=nextReview(S);
  const empty = !Object.keys(S.items).length && !Object.keys(S.card).length;
  return `<p class="eyebrow">Before stage 1</p><h1>Project setup</h1>
  <p class="lede">Everyone with access to this workspace sees and edits the same project. Changes save automatically.</p>

/* ============================================================
   CHAI: lifecycle rules
   Phase, review cadence, compliance flags and status. These read
   STAGES and GATES from 00-definition.js and are CHAI's alone;
   nothing here is shared with another framework.
   ============================================================ */
function allItems(){ return STAGES.flatMap(s=>s.items.map(it=>({...it,stage:s}))); }
function gapsUpTo(p,stageId){
  const idx=STAGES.findIndex(s=>s.id===stageId);
  return STAGES.slice(0,idx+1).flatMap(s=>s.items.filter(it=>{const st=(p.items[it.id]||{}).status; return !st||st==="notmet";}).map(it=>({...it,stage:s})));
}
const dec = (p,k)=> ((p.gates||{})[k]||{}).decision||"";
const isGo = d => /^(Proceed|Continue)/.test(d||"");
function phase(p){
  if([dec(p,"A"),dec(p,"B"),dec(p,"C")].includes("Stop")) return {key:"retired",label:"Stopped"};
  if(dec(p,"D")==="Retire") return {key:"retired",label:"Retired"};
  if(isGo(dec(p,"C"))) return {key:"deployed",label:"Deployed",stage:6};
  if(isGo(dec(p,"B"))) return {key:"pilot",label:"Pilot",stage:5};
  if(isGo(dec(p,"A"))) return {key:"build",label:"Design, build & assess",stage:2};
  return {key:"intake",label:"Intake & planning",stage:1};
}
function cadenceMonths(p){ const n=parseInt(p.meta.reviewCadence,10); return n>0?n:(p.meta.riskTier==="High"?6:12); }
function nextReview(p){
  if(phase(p).key!=="deployed") return null;
  const base = parseDay(dec(p,"D") ? p.gates.D.date : "") || parseDay(p.gates.C.date);
  if(!base) return null;
  return ymd(addMonths(base,cadenceMonths(p)));
}
function latestGo(p){
  let best=null;
  ["A","B","C","D"].forEach(k=>{ const g=p.gates[k]||{}; if(isGo(g.decision)){ const d=parseDay(g.date); if(d && (!best||d>best.d)) best={k,d}; }});
  return best;
}

/* Compliance rules. Red = out of compliance, amber = needs update. */
function flags(p){
  const F=[]; const ph=phase(p); const today=parseDay(TODAY());
  if(ph.key==="retired") return F;
  const live = ph.key==="deployed", piloting = ph.key==="pilot";
  const items=allItems();
  const overdue = items.filter(it=>{const d=p.items[it.id]||{}; const due=parseDay(d.due); return due && due<today && d.status!=="met" && d.status!=="na";});
  if(overdue.length) F.push({sev:(live||piloting)?"red":"amber",text:`${overdue.length} action${overdue.length>1?"s":""} past due`});
  if(live){
    const notmet=items.filter(it=>(p.items[it.id]||{}).status==="notmet").length;
    if(notmet) F.push({sev:"red",text:`Live with ${notmet} criteri${notmet>1?"a":"on"} not met`});
    const nr=nextReview(p);
    if(!nr) F.push({sev:"red",text:"Live with no deployment date recorded at Checkpoint C"});
    else { const d=parseDay(nr), left=daysBetween(today,d);
      if(left<0) F.push({sev:"red",text:`Periodic review overdue since ${fmtDay(nr)}`});
      else if(left<=30) F.push({sev:"amber",text:`Periodic review due ${fmtDay(nr)}`}); }
    if(dec(p,"D")==="Retrain or revise") F.push({sev:"amber",text:"Last review asked for retraining or revision"});
  }
  if(live||piloting){
    const missing=CORE_CARD.filter(k=>!cardValOf(p,k));
    if(missing.length) F.push({sev:live?"red":"amber",text:`Model card missing ${missing.length} core field${missing.length>1?"s":""}`});
    const lg=latestGo(p); const cu=p.cardUpdatedAt?new Date(p.cardUpdatedAt):null;
    if(lg && (!cu || cu < lg.d)) F.push({sev:"amber",text:`Model card not updated since ${GATES[lg.k].title}`});
    if(!p.metrics.some(m=>m.name||m.value)) F.push({sev:"amber",text:"No key metrics recorded"});
  }
  ["A","B","C","D"].forEach(k=>{ const g=p.gates[k]||{};
    if(isGo(g.decision) && !(g.rationale||"").trim()){
      if(/conditions|changes/.test(g.decision)) F.push({sev:"amber",text:`${GATES[k].title}: conditional approval with no conditions recorded`});
      else if(gapsUpTo(p,GATES[k].after).length) F.push({sev:"amber",text:`${GATES[k].title}: approved with open criteria and no rationale`});
    }});
  if(!live && p.updatedAt){ const idle=daysBetween(new Date(p.updatedAt),new Date()); if(idle>90) F.push({sev:"amber",text:`No activity in ${idle} days`}); }
  return F.sort((a,b)=>(a.sev==="red"?0:1)-(b.sev==="red"?0:1));
}
function statusOf(p){
  const ph=phase(p); if(ph.key==="retired") return {key:"retired",label:ph.label};
  const f=flags(p);
  if(f.some(x=>x.sev==="red")) return {key:"red",label:"Out of compliance"};
  if(f.length) return {key:"amber",label:"Needs update"};
  return {key:"green",label:"On track"};
}

    </div>
    <h2>Compliance flags</h2>
    ${F.length?`<ul class="gaplist" style="font-size:14px">${F.map(f=>`<li><span class="tag ${f.sev==="red"?"notmet":"partial"}">${f.sev==="red"?"Out of compliance":"Needs update"}</span> ${esc(f.text)}</li>`).join("")}</ul>`:`<p>No open flags.</p>`}
    <h2>Readiness</h2>
    <div class="overall"><span class="big">${ov.pct}%</span><p>of applicable criteria met (partial counts as half, unanswered as zero). ${ov.answered} of ${ov.total} items answered${unanswered?`; ${unanswered} still open`:""}.</p></div>
    <div class="bars">${Object.entries(PRINCIPLES).map(([k,p])=>{const sc=scoreOf(all.filter(it=>it.p===k)); return `<div class="bar"><span>${esc(p.name)}</span><span class="track"><span class="fill ${barCls(sc.pct)}" style="width:${sc.pct}%;display:block"></span></span><span class="pct">${sc.pct}%</span></div>`;}).join("")}</div>
    <h2>Lifecycle status</h2>
    <div class="r-wrap"><table class="rtable"><thead><tr><th>Stage</th><th>Answered</th><th>Met</th><th>Partial</th><th>Not met</th><th>Score</th></tr></thead><tbody>
    ${STAGES.map(s=>{const cnt=k=>s.items.filter(it=>(S.items[it.id]||{}).status===k).length; const sc=scoreOf(s.items);
      return `<tr><td>${s.n}. ${esc(s.title)}</td><td>${sc.answered}/${sc.total}</td><td>${cnt("met")}</td><td>${cnt("partial")}</td><td>${cnt("notmet")}</td><td><b>${sc.pct}%</b></td></tr>`;}).join("")}
    </tbody></table></div>

    ${Object.entries(GATES).map(([k,G])=>{const g=S.gates[k]||{}; return `<tr><td>${G.title}<br><span style="color:var(--muted);font-size:12px">${esc(G.q)}</span></td><td>${g.decision?`<b>${esc(g.decision)}</b>`:'<span style="color:var(--muted)">Not yet decided</span>'}</td><td>${esc(g.by||"")}${g.signedBy?`<br><span style="color:var(--muted);font-size:12px">recorded by ${nm(g.signedBy)}</span>`:""}</td><td>${esc(g.date||"")}</td><td style="white-space:pre-wrap">${esc(g.rationale||"")}</td></tr>`;}).join("")}
    </tbody></table></div>
    <h2>Open gaps and actions</h2>
    ${gaps.length?`<div class="r-wrap"><table class="rtable"><thead><tr><th>Stage</th><th>Criterion</th><th>Principle</th><th>Status</th><th>Owner</th><th>Due</th></tr></thead><tbody>
      ${gaps.map(it=>{const d=S.items[it.id]||{}; const late=d.due&&parseDay(d.due)<parseDay(TODAY()); return `<tr><td>${it.stage.n}</td><td>${esc(it.text)}${d.evidence?`<br><span style="color:var(--muted);font-size:12.5px;white-space:pre-wrap">${esc(d.evidence)}</span>`:""}</td><td>${esc(PRINCIPLES[it.p].name)}</td><td>${tag(d.status)}</td><td>${esc(d.owner||"–")}</td><td${late?' style="color:var(--red);font-weight:700"':""}>${esc(d.due||"–")}</td></tr>`;}).join("")}

    ${STAGES.map(s=>`<h3 style="font-size:15px;margin:18px 0 6px">${s.n}. ${esc(s.title)}</h3><div class="r-wrap"><table class="rtable"><tbody>
      ${s.items.map(it=>{const d=S.items[it.id]||{}; return `<tr><td style="width:46px"><span class="pchip">${it.p}</span></td><td>${esc(it.text)}${d.evidence?`<br><span style="color:var(--muted);font-size:12.5px;white-space:pre-wrap">${esc(d.evidence)}</span>`:""}</td><td style="width:110px">${tag(d.status)}</td></tr>`;}).join("")}
    </tbody></table></div>`).join("")}
    <p class="disclaimer">This report organizes a local review around the Coalition for Health AI (CHAI) six-stage lifecycle and five principles, and the structure of the CHAI Applied Model Card. Checklist wording is a paraphrased summary, not the official CHAI Responsible AI Checklist. It is an internal governance record, not a certification, legal opinion, or regulatory determination.</p>`;
}

/* ============================================================
   CHAI: registration
   Declares CHAI to the shell. This is the only file that has to
   change when a CHAI screen is added or reordered.

   CHAI is always enabled. It owns the project document's `items`
   and `gates` keys, the compliance status on the dashboard, and the
   applied model card -- so the tool is a CHAI tool with other
   frameworks alongside, not a neutral host of several equals. That
   is a deliberate choice: the dashboard needs ONE status, and
   mixing two frameworks' judgements into one number would be
   meaningless. See docs/crosswalk.md.
   ============================================================ */
registerFramework({
  id: "chai",
  label: "CHAI",

  enabled: () => true,

  blank: () => ({ items: {}, gates: { A: {}, B: {}, C: {}, D: {} } }),

  normalize(p) {
    p.items = p.items || {};
    p.gates = Object.assign({ A: {}, B: {}, C: {}, D: {} }, p.gates || {});
  },

  views(p) {
    const out = [];
    STAGES.forEach(s => {
      out.push({
        id: s.id, kind: "stage", label: s.title, num: s.n, short: `Stage ${s.n}`,
        meta: () => { const c = scoreOf(s.items, p.items); return `${c.answered}/${c.total}`; },
        metaCls: () => { const c = scoreOf(s.items, p.items); return c.answered === c.total ? "done" : ""; },
      });
      Object.entries(GATES).filter(([, g]) => g.after === s.id).forEach(([key, g]) => {
        out.push({
          id: "g" + key, kind: "gate", gate: key, label: g.title, cls: "gate",
          numHTML: '<span class="diamond" aria-hidden="true"></span>',
          meta: () => { const d = (p.gates[key] || {}).decision || ""; return d ? esc(shortDecision(d)) : "open"; },
          metaCls: () => { const d = (p.gates[key] || {}).decision || ""; return !d ? "" : (/Stop|Retire|Revise|Retrain/.test(d) ? "warn" : "done"); },
        });
      });
    });
    out.push({
      id: "card", kind: "card", label: "Applied model card", glyph: "≡", sep: "before",
      meta: () => `${CARD_FIELDS.filter(k => cardValOf(p, k)).length}/${CARD_FIELDS.length}`,
    });
    out.push({ id: "report", kind: "report", label: "Report", glyph: "✓" });
    return out;
  },

  render(v) {
    if (v.kind === "stage") return renderStage(STAGES.find(s => s.id === v.id));
    if (v.kind === "gate") return renderGate(v.gate);
    if (v.kind === "card") return renderCardForm();
    return renderReport();
  },
});

he treatment of out-of-range or outlying values during fitting, and the rule to apply to them in production.","who":"developer","stage":"B","rel":"partial","chai":["s3-4"]},{"key":"4-6","num":"4.6","text":"From a clinical viewpoint, judge whether the model is being fed the information a clinician would consider essential for the job it is meant to do.","who":"adopter","stage":"C","rel":"optica-only","chai":[]},{"key":"4-7","num":"4.7","text":"Audit the organization's own data holdings for each input the model needs, confirm they can be supplied in the required encoding, and profile how those variables are distributed and captured locally.","who":"adopter","stage":"D","rel":"partial","chai":["s1-7","s4-1"]},{"key":"4-8","num":"4.8","text":"Confirm each required input will actually be on hand at the moment and in the setting where the model is supposed to run, not merely present somewhere in retrospective archives.","who":"adopter","stage":"D","rel":"partial","chai":["s2-7","s4-4"]},{"key":"4-9","num":"4.9","text":"Weigh whether the value distributions of the developer's training inputs sit close enough to the locally observed ones for a clinician to be comfortable.","who":"adopter","stage":"F","rel":"partial","chai":["s4-1","s6-1"]},{"key":"4-10","num":"4.10","text":"Weigh whether the way the training inputs were generated and recorded matches how this organization generates and records them.","who":"adopter","stage":"F","rel":"partial","chai":["s3-1"]}]},{"n":5,"domain":"B","title":"Output data","purpose":"Characterize what the model emits and the target it was trained against, then check that same target exists locally and behaves similarly.","items":[{"key":"5-1","num":"5.1","text":"State what the model emits, in two parts: the substance of the result (for example a written summary, a continuous risk estimate, or a category assigned to a clinical finding) and its data type (free text, numeric, or categorical).","who":"developer","stage":"B","rel":"partial","chai": rm that the solution's handling of identifiable information satisfies the privacy rules that apply locally, again with the information security lead involved.","who":"adopter","stage":"D","rel":"partial","chai":["s1-7","s3-6"]}]},{"n":10,"domain":"D","title":"Deployment plan","purpose":"Pins down how the solution will actually be wired into clinical work and into the organization's technical stack - where it surfaces, who acts on it, and what has to be built to serve it.","items":[{"key":"10-1","num":"10.1","text":"Pinpoint where along the care pathway the tool fires - which encounter, decision point, or step of the existing process it attaches to.","who":"adopter","stage":"C","rel":"partial","chai":["s2-2","s2-1"]},{"key":"10-2","num":"10.2","text":"Name the host application or screen where clinicians will actually see the result, and describe how using it is meant to feel day to day - how discoverable it is, how many clicks it costs, how reliably it is on hand.","who":"adopter","stage":"C","rel":"partial","chai":["s2-1","s5-2"]},{"key":"10-3","num":"10.3","text":"State whether a named human clinician stands between the model and the patient, owning the choice to act on a result or set it aside.","who":"adopter","stage":"C","rel":"partial","chai":["s2-5","s1-6"]},{"key":"10-4","num":"10.4","text":"If each result has to arrive with its rationale attached, work out how that supporting explanation gets rendered inside the host system next to the result itself.","who":"adopter","stage":"C","rel":"partial","chai":["s4-6"]},{"key":"10-5","num":"10.5","text":"Determine whether fresh interfaces or middleware must be built to carry results from whatever serves the model over to the system that will display them.","who":"either","stage":"E","rel":"partial","chai":["s2-7","s4-5"]},{"key":"10-6","num":"10.6","text":"Identify the host hardware the model will execute on and confirm its compute and memory headroom are adequate for the expected load.","who":"either","stage":"E","r adopter","stage":"G","rel":"optica-only","chai":[]}]}]};
const OPTICA_ITEMS = OPTICA.chapters.flatMap(c => c.items.map(i => ({ ...i, chapter: c })));

/* ============================================================
   OPTICA: rules
   OPTICA's own progress, kept strictly apart from CHAI's.

   Two rules decide everything here, both from docs/crosswalk.md:

   1. NO STATUS PROPAGATION, in either direction. Evidence is shared
      by citing it; judgement never is. No OPTICA answer may change a
      CHAI criterion's status or a readiness percentage, and none of
      this feeds flags() or statusOf(). Breaking that would silently
      re-gate every existing project.

   2. A DECLINE IS A DISTINCT STATE. OPTICA accepts a reasoned "we
      chose not to" as a complete answer for some items; CHAI's
      local-validation obligations are unconditional. So "declined"
      is tracked separately and never folded into the percentage as
      though it were met.
   ============================================================ */
const OPTICA_STATUS = { met: "Answered", partial: "Partial", notmet: "Outstanding", declined: "Declined", na: "N/A" };
const OPTICA_VAL = { met: 1, partial: 0.5, notmet: 0, declined: 0 };

const opticaOn = p => !!((p || S).optica || {}).enabled;
const opticaAnswers = p => ((p || S).optica || {}).answers || {};
const opticaAnswer = (p, key) => opticaAnswers(p)[key] || {};

/* Progress over any list of OPTICA items. Declines are counted as
   answered (the stakeholder did respond) but contribute nothing to
   the percentage, and are reported separately so they stay visible. */
function opticaScore(items, p) {
  const answers = opticaAnswers(p);
  let sum = 0, n = 0, answered = 0, declined = 0;
  items.forEach(it => {
    const st = (answers[it.key] || {}).status;
    if (st) answered++;
    if (st === "declined") { declined++; return; }
    if (st === "na") return;
    n++; sum += OPTICA_VAL[st] || 0;
  });
  return { pct: n ? Math.round(sum / n * 100) : 0, answered, total: items.length, applicable: n, declined };
}

/* Who still owes answers. OPTICA assigns each item to one of five
   stakeholders and runs them in sequence, so "which stakeholder is
   blocking" is the question that actually moves a review along --
   and ~a third of the items can only be answered by the vendor. */
function opticaByProducer(p) {
  const answers = opticaAnswers(p);
  const out = {};
  OPTICA_ITEMS.forEach(it => {
    const who = it.who || "unassigned";
    const b = out[who] || (out[who] = { who, total: 0, answered: 0, outstanding: [] });
    b.total++;
    if ((answers[it.key] || {}).status) b.answered++;
    else b.outstanding.push(it);
  });
  return Object.values(out).sort((a, b) => b.total - a.total);
}

const opticaOutstanding = p => OPTICA_ITEMS.filter(it => !(opticaAnswer(p, it.key).status));

/* ============================================================
   OPTICA: views
   One screen per chapter, plus an overview that answers the
   question OPTICA's stakeholder relay actually turns on: who owes
   the next answers.

   Markup reuses the CHAI checklist classes (.ci, .seg, .checklist)
   so no new CSS is needed and the two checklists look like one
   tool. The state path differs -- optica.answers.<key> rather than
   items.<id> -- which is what keeps the data cleanly separable.
   ============================================================ */
const OPTICA_PRODUCER_LABEL = {
  adopter: "Your organization",
  developer: "The solution's developer",
  either: "Either party",
};

function opticaItemHTML(it) {
  const d = opticaAnswer(S, it.key);
  const st = d.status || "";
  const open = openItems.has(it.key);
  const late = d.due && parseDay(d.due) < parseDay(TODAY()) && st !== "met" && st !== "na";
  const notes = (d.evidence || d.owner || d.due || d.declineReason) && !open
    ? `<span class="has-notes">${late ? `<b style="color:var(--red)">overdue ${esc(fmtDay(d.due))}</b>` : "notes added"}</span>` : "";
  const chai = it.chai && it.chai.length
    ? `<span class="pchip" title="Partially covered by CHAI ${esc(it.chai.join(", "))}">${esc(it.chai[0])}</span>`
    : `<span class="pchip" title="No CHAI criterion covers this">—</span>`;

  return `<li class="ci${open ? " open" : ""}" data-item="${esc(it.key)}">
    <div class="ci-row">
      ${chai}
      <div class="ci-text">${esc(it.text)}<button class="more" data-toggle="${esc(it.key)}" aria-expanded="${open}">${open ? "Hide details" : "Evidence & owner"}</button>${notes}</div>
      <div class="seg" role="group" aria-label="Status">${Object.entries(OPTICA_STATUS).map(([k, l]) =>
        `<button data-set="${esc(it.key)}" data-store="optica.answers" data-s="${k}" aria-pressed="${st === k}">${l}</button>`).join("")}</div>
    </div>
    <div class="ci-detail">
      <div><label for="oev_${esc(it.key)}">Evidence or notes</label><textarea id="oev_${esc(it.key)}" rows="2" data-bind="optica.answers.${esc(it.key)}.evidence">${esc(d.evidence || "")}</textarea></div>
      <div><label for="oow_${esc(it.key)}">Owner</label><input type="text" id="oow_${esc(it.key)}" data-bind="optica.answers.${esc(it.key)}.owner" value="${esc(d.owner || "")}"></div>
      <div><label for="odu_${esc(it.key)}">Due</label><input type="date" id="odu_${esc(it.key)}" data-bind="optica.answers.${esc(it.key)}.due" value="${esc(d.due || "")}"></div>
      ${st === "declined" ? `<div class="wide"><label for="odr_${esc(it.key)}">Why this was declined</label><textarea id="odr_${esc(it.key)}" rows="2" data-bind="optica.answers.${esc(it.key)}.declineReason">${esc(d.declineReason || "")}</textarea></div>` : ""}
    </div>
  </li>`;
}

function renderOpticaChapter(n) {
  const c = OPTICA.chapters.find(x => x.n === n);
  const s = opticaScore(c.items, S);
  const vendor = c.items.filter(i => i.who === "developer").length;
  return `<p class="eyebrow">OPTICA chapter ${c.n} of 13 · domain ${c.domain}</p>
  <h1>${esc(c.title)}</h1>
  ${c.purpose ? `<p class="lede">${esc(c.purpose)}</p>` : ""}
  <div class="legend">
    <span>Questions are this project's paraphrase of OPTICA, not its published wording.</span>
  </div>
  ${vendor ? `<p style="font-size:13px;color:var(--muted)">${vendor} of ${c.items.length} item${vendor === 1 ? "" : "s"} here can only be answered by the solution's developer.</p>` : ""}
  <ol class="checklist">${c.items.map(opticaItemHTML).join("")}</ol>
  <p style="font-size:13px;color:var(--muted);margin-top:10px">${s.answered} of ${s.total} answered${s.declined ? `, ${s.declined} declined` : ""}. The chip on each row names the CHAI criterion that partially covers it, or a dash where none does.</p>
  ${pager()}`;
}

function renderOpticaOverview() {
  const all = opticaScore(OPTICA_ITEMS, S);
  const byWho = opticaByProducer(S);
  const rows = byWho.map(b => `<tr>
      <td>${esc(OPTICA_PRODUCER_LABEL[b.who] || b.who)}</td>
      <td>${b.answered}/${b.total}</td>
      <td>${b.outstanding.length ? esc(b.outstanding.slice(0, 6).map(i => i.num).join(", ")) + (b.outstanding.length > 6 ? ` +${b.outstanding.length - 6} more` : "") : "—"}</td>
    </tr>`).join("");

  return `<p class="eyebrow">OPTICA</p>
  <h1>Adoption review</h1>
  <p class="lede">77 items in 13 chapters, answered by five stakeholders in sequence. OPTICA asks whether <em>this</em> organization should adopt <em>this</em> solution; it runs alongside the CHAI lifecycle and never changes it.</p>

  <div class="cards">
    <div class="card"><h3>Answered</h3><p class="big">${all.answered}/${all.total}</p></div>
    <div class="card"><h3>Progress</h3><p class="big">${all.pct}%</p></div>
    <div class="card"><h3>Declined</h3><p class="big">${all.declined}</p></div>
  </div>

  <h2>Who owes the next answers</h2>
  <p style="font-size:13px;color:var(--muted)">OPTICA is a relay: each stage is completed by one stakeholder before the next begins. Outstanding items are listed by the party that can answer them.</p>
  <table class="tbl"><thead><tr><th>Stakeholder</th><th>Answered</th><th>Outstanding</th></tr></thead><tbody>${rows}</tbody></table>

  <div class="note">
    <p><b>OPTICA answers never change CHAI status.</b> The two checklists ask different parties for different evidence at different moments, and no OPTICA item fully discharges a CHAI criterion. Evidence can be cited in both; a judgement in one is not a judgement in the other.</p>
  </div>
  ${pager()}`;
}

function renderOpticaOff() {
  return `<p class="eyebrow">OPTICA</p><h1>Adoption review</h1>
  <p class="lede">OPTICA is not switched on for this project.</p>
  <p>Turn it on in <button class="btn" data-go="setup">Project setup</button> to add its 77 adoption questions alongside the CHAI lifecycle.</p>`;
}

/* ============================================================
   OPTICA: registration
   Opt-in per project. A project that has never switched OPTICA on
   carries no `optica` key at all, so existing exports stay valid
   and teams that only run CHAI never see 77 extra rows.
   ============================================================ */
registerFramework({
  id: "optica",
  label: "OPTICA",

  enabled: p => opticaOn(p),

  // Deliberately empty: a new project does NOT get an optica key.
  // It appears the first time someone switches the framework on.
  blank: () => ({}),

  normalize(p) {
    if (!p.optica) return;
    p.optica.enabled = !!p.optica.enabled;
    p.optica.answers = p.optica.answers || {};
  },

  views(p) {
    const out = [{
      id: "optica", kind: "overview", label: "OPTICA adoption review",
      glyph: "◇", sep: "before",
      meta: () => { const s = opticaScore(OPTICA_ITEMS, p); return `${s.answered}/${s.total}`; },
      metaCls: () => { const s = opticaScore(OPTICA_ITEMS, p); return s.answered === s.total ? "done" : ""; },
      short: "OPTICA",
    }];
    OPTICA.chapters.forEach(c => {
      out.push({
        id: "o" + c.n, kind: "chapter", chapter: c.n, label: c.title, num: c.n,
        short: `OPTICA ${c.n}`,
        meta: () => { const s = opticaScore(c.items, p); return `${s.answered}/${s.total}`; },
        metaCls: () => { const s = opticaScore(c.items, p); return s.answered === s.total ? "done" : ""; },
      });
    });
    return out;
  },

  render(v) {
    if (!opticaOn(S)) return renderOpticaOff();
    return v.kind === "chapter" ? renderOpticaChapter(v.chapter) : renderOpticaOverview();
  },
});

/* Switching the framework on or off for the open project. Turning it
   off keeps every answer: it only hides the views, so a team that
   pauses an OPTICA review does not lose the work. */
function setOpticaEnabled(on) {
  if (RO || !S) return;
  if (!S.optica) S.optica = { enabled: false, answers: {} };
  edit("optica.enabled", !!on);
  writeLog(CUR, `${on ? "Enabled" : "Disabled"} the OPTICA adoption review`);
  if (!on && String(UI.view).startsWith("o")) go("setup");
  else renderProject(false);
}

/* ============================================================
   App shell: rail and routing
   Builds the step rail from whatever views the active frameworks
   contribute, and dispatches rendering back to the framework that
   owns the current view. Nothing here names CHAI or OPTICA.
   ============================================================ */
function railRow(v) {
  const cur = UI.view === v.id ? ' aria-current="step"' : "";
  const meta = typeof v.meta === "function" ? v.meta() : (v.meta || "");
  // numHTML lets a view supply its own marker element (the checkpoint
  // diamond); glyph covers the common case of a single character.
  const num = v.numHTML ? `<span class="num">${v.numHTML}</span>`
    : v.num == null ? `<span class="num" aria-hidden="true">${esc(v.glyph || "•")}</span>`
    : `<span class="num">${esc(String(v.num))}</span>`;
  // A view that computes a state class always gets the separating space, even
  // when the class is empty this render; a view with no metaCls gets none.
  // That reproduces the markup the hand-written rail emitted exactly.
  const metaCls = v.metaCls ? ` ${esc(v.metaCls())}` : "";
  const li = `<li${v.cls ? ` class="${v.cls}"` : ""}><button data-go="${esc(v.id)}"${cur}>`
    + `${num}<span>${esc(v.label)}</span>`
    + `<span class="meta${metaCls}">${meta}</span></button></li>`;
  const sep = `<li class="sep" role="presentation"></li>`;
  return (v.sep === "before" ? sep : "") + li + (v.sep === "after" ? sep : "");
}

function renderRail() {
  const ol = document.getElementById("rail");
  const home = `<li class="home-link"><button data-home="1">`
    + `<span class="num" aria-hidden="true">←</span><span>All projects</span></button></li>`
    + `<li class="sep" role="presentation"></li>`;
  ol.innerHTML = home + activeViews().map(railRow).join("");
  document.getElementById("projName").textContent = S.meta.solution || "Untitled AI solution";
}

function renderMain(focusTop) {
  const views = activeViews();
  const v = views.find(x => x.id === UI.view) || views[0];
  const m = document.getElementById("main");
  const fk = focusTop ? null : focusKey(document.activeElement);

  m.innerHTML = v.fw.render(v, S);
  if (v.kind === "report") updateDlUI();

  applyRO(m);
  resolveNames(m);
  if (focusTop) { window.scrollTo({ top: 0 }); m.focus({ preventScroll: true }); }
  else if (fk) { const el = m.querySelector(fk); if (el) el.focus({ preventScroll: true }); }
}

function renderProject(focusTop) {
  document.body.classList.remove("home");
  renderRail(); renderMain(focusTop); renderLabel();
}

function softRefresh() {
  renderRail(); renderLabel();
  if (editingInMain()) syncInputs();
  else { const y = window.scrollY; renderMain(false); window.scrollTo(0, y); }
}

/* ============================================================
   Dashboard
   ============================================================ */
function lcTrack(p){
  const ph=phase(p);
  const pip=s=>{const c=scoreOf(s.items,p.items); const frac=c.total?c.answered/c.total:0;
    return `<span class="pip${frac===1?" full":""}${ph.stage===s.n?" cur":""}" title="Stage ${s.n}: ${c.answered}/${c.total} answered"><i style="height:${Math.round(frac*100)}%"></i>${s.n}</span>`;};
  const gd=k=>{const d=dec(p,k); const cls=!d?"":(/Stop|Retire/.test(d)?"stop":/conditions|changes|Revise|Retrain/.test(d)?"cond":"go"); return `<span class="gd ${cls}" title="${GATES[k].title}: ${esc(d||"open")}"></span>`;};
  const S_=STAGES;
  return `<div class="lc" aria-hidden="true">${pip(S_[0])}${gd("A")}${pip(S_[1])}${pip(S_[2])}${pip(S_[3])}${gd("B")}${pip(S_[4])}${gd("C")}${pip(S_[5])}${gd("D")}</div><div class="lc-label">${esc(ph.label)}</div>`;
}
function dashData(){
  const list=[...PROJECTS.values()].map(p=>normalize(p));
  const rows=list.map(p=>({p, st:statusOf(p), f:flags(p), score:scoreOf(allItems(),p.items).pct, nr:nextReview(p)}));
  return rows;
}

  try{ const raw=localStorage.getItem("chai-review-v1"); if(raw && !localStorage.getItem("chai-legacy-imported")){ const j=JSON.parse(raw); if(j&&j.meta&&(j.meta.solution||Object.keys(j.items||{}).length)) legacy=j; } }catch(e){}
  m.innerHTML = `
    <div class="dash-head">
      <div><p class="eyebrow">AI governance</p><h1>AI projects under review</h1>
      <p class="lede">Every AI solution your organization is evaluating or running, checked against the CHAI lifecycle. Projects out of compliance or needing an update rise to the top.</p></div>

function updateDashboard(){

  const cnt=k=>active.filter(r=>r.st.key===k).length;
  const archived=rows.length-active.length;
  const T=[["red","Out of compliance",cnt("red")],["amber","Needs update",cnt("amber")],["green","On track",cnt("green")],["retired","Retired or stopped",cnt("retired")],["all","All active",active.length]];
  if(archived) T.push(["archived","Archived",archived]);
  t.innerHTML = T.map(([k,l,n])=>`<button class="tally ${k==="archived"?"retired":k}" data-filter="${k}" aria-pressed="${UI.filter===k}"><span class="n">${n}</span><span class="t">${l}</span></button>`).join("");

  const rank={red:0,amber:1,green:2,retired:3};
  list.sort((a,b)=>(rank[a.st.key]-rank[b.st.key]) || (b.f.length-a.f.length) || (a.p.meta.solution||"").localeCompare(b.p.meta.solution||""));

function exportMD(){
  const all=allItems(), ov=scoreOf(all), m=S.meta, L=[];
  const st=s=>s?STATUS[s]:"Unanswered";
  const line=s=>String(s||"").replace(/\n+/g," ").replace(/\|/g,"\\|");
  const nm=id=>id?(NAMES[id]||"someone"):"someone";
  L.push(`# ${m.solution||"Untitled AI solution"}: CHAI assurance review`,"");
  L.push(`- **Status:** ${statusOf(S).label}`,`- **Lifecycle phase:** ${phase(S).label}`,`- **Organization:** ${m.org||"–"}`,`- **Developer:** ${m.developer||"–"}`,`- **Sourcing:** ${m.sourcing||"–"}`,`- **Risk tier:** ${m.riskTier||"–"}`,`- **Clinical sponsor:** ${m.sponsor||"–"}`,`- **Next periodic review:** ${nextReview(S)||"–"}`,`- **Review team:** ${line(m.reviewers)||"–"}`,`- **Scope:** ${line(m.scope)||"–"}`,`- **Generated:** ${TODAY()}`,"");
  const F=flags(S); L.push("## Compliance flags",""); if(F.length) F.forEach(f=>L.push(`- **${f.sev==="red"?"Out of compliance":"Needs update"}:** ${f.text}`)); else L.push("None."); L.push("");
  L.push(`## Readiness`,"",`Overall: **${ov.pct}%** of applicable criteria met (${ov.answered}/${ov.total} answered).`,"","| Principle | Score |","|---|---|");
  Object.entries(PRINCIPLES).forEach(([k,p])=>L.push(`| ${p.name} | ${scoreOf(all.filter(it=>it.p===k)).pct}% |`));
  L.push("","## Checkpoint decisions","","| Checkpoint | Decision | Decided by | Date | Rationale |","|---|---|---|---|---|");
  Object.entries(GATES).forEach(([k,G])=>{const g=S.gates[k]||{}; L.push(`| ${G.title}: ${G.q} | ${g.decision||"Not decided"} | ${line(g.by)}${g.signedBy?` (recorded by ${line(nm(g.signedBy))})`:""} | ${line(g.date)} | ${line(g.rationale)} |`);});
  L.push("","## Open gaps","");
  const gaps=all.filter(it=>{const s=(S.items[it.id]||{}).status; return !s||s==="notmet"||s==="partial";});
  if(gaps.length){ L.push("| Stage | Criterion | Status | Owner | Due |","|---|---|---|---|---|"); gaps.forEach(it=>{const d=S.items[it.id]||{}; L.push(`| ${it.stage.n} | ${line(it.text)} | ${st(d.status)} | ${line(d.owner)} | ${line(d.due)} |`);}); }
  else L.push("None.");
  L.push("","## Applied model card","");
  CARD.forEach(sec=>{L.push(`### ${sec.sec}`,""); sec.fields.forEach(f=>L.push(`- **${f[1]}:** ${line(cardValOf(S,f[0]))||"_Not provided_"}`)); L.push("");
    if(sec.sec==="Trust ingredients"){ L.push("### Key metrics",""); if(S.metrics.length){L.push("| Category | Metric | Value | 95% CI | Population |","|---|---|---|---|---|"); S.metrics.forEach(x=>L.push(`| ${x.cat} | ${line(x.name)} | ${line(x.value)} | ${line(x.ci)} | ${line(x.pop)} |`));} else L.push("_None entered_"); L.push("");}});
  L.push("## Sign-off history",""); if(LOG.length) LOG.forEach(e=>L.push(`- ${(e.at||"").slice(0,10)}: ${line(e.text)} (${line(nm(e.by))})`)); else L.push("None."); L.push("");
  L.push("## Appendix: full checklist","");
  STAGES.forEach(s=>{L.push(`### ${s.n}. ${s.title}`,""); s.items.forEach(it=>{const d=S.items[it.id]||{}; L.push(`- [${it.p}] ${it.text}: **${st(d.status)}**${d.evidence?` (${line(d.evidence)})`:""}`);}); L.push("");});
  L.push("---","_Structured around the CHAI six-stage lifecycle and Applied Model Card. Checklist wording is paraphrased; this is an internal governance record, not a CHAI certification._");
  return L.join("\n");
}

async function download(filename,data){
  if(STANDALONE){
    const types={html:"text/html",md:"text/markdown",json:"application/json",csv:"text/csv"};
    const ext=filename.split(".").pop();
    const url=URL.createObjectURL(new Blob([data],{type:(types[ext]||"text/plain")+";charset=utf-8"}));
    const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000); toast("Saved "+filename); return;
  }
  if(!DL){ toast("Downloads aren't available here"); return; }
  try{ const r=await DL.save({filename,data}); if(r&&r.status==="saved") toast("Saved "+filename); }
  catch(e){
    const c=e&&e.code;
    if(c==="declined") return;
    if(c==="rate_limited") toast("A save prompt is already open");
    else if(c==="extension_not_enabled") toast("That file type isn't available here");
    else { DL=null; updateDlUI(); toast("Downloads aren't available here"); }
  }
}

    const li=t.closest(".ci");
    li.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.s===val)));
    if((val==="partial"||val==="notmet") && !openItems.has(id)){ openItems.add(id); li.classList.add("open"); const m=li.querySelector(".more"); m.textContent="Hide details"; m.setAttribute("aria-expanded","true"); }
    renderRail(); return;
  }
  if(t.dataset.toggle){
    const id=t.dataset.toggle, li=t.closest(".ci"); const open=!openItems.has(id);
    open?openItems.add(id):openItems.delete(id);
    li.classList.toggle("open",open); t.textContent=open?"Hide details":"Evidence & owner"; t.setAttribute("aria-expanded",String(open));
    if(open && !RO) li.querySelector("textarea").focus();
    return;
  }
  if(t.dataset.gate && !RO){
    const k=t.dataset.gate, g=S.gates[k]||{};
    const val = g.decision===t.dataset.d ? "" : t.dataset.d;
    const now=new Date().toISOString();
    const patch={gates:{[k]:{decision:val, signedBy:val?(ME.id||null):null, signedAt:val?now:null, date: val ? (g.date||TODAY()) : (g.date||"")}}};
    deepMerge(S,patch); const st=stamp(); Object.assign(S,st);
    queuePatch(CUR, Object.assign(patch,st));
    writeLog(CUR, val?`${GATES[k].title}: ${val}`:`${GATES[k].title}: decision cleared`);
    renderRail(); renderMain(false); return;
  }
  if(t.dataset.delmetric!=null && !RO){ S.metrics.splice(+t.dataset.delmetric,1); saveMetrics(); renderMain(false); renderLabel(); return; }
  const a=t.dataset.act; if(!a) return;
  if(a==="new"){ const f=document.getElementById("newform"); if(f){ f.hidden=false; document.getElementById("newname").focus(); } return; }
  if(a==="new-cancel"){ document.getElementById("newform").hidden=true; return; }
  if(a==="samples"){ t.disabled=true; await loadSamples(); return; }
  if(a==="legacy"){
    try{ const j=JSON.parse(localStorage.getItem("chai-review-v1")); const p=normalize(Object.assign(blankProject(j.meta.solution),{meta:j.meta,items:j.items||{},gates:j.gates||{},metrics:j.metrics||[],card:j.card||{}}));
      Object.values(p.items).forEach(x=>{ if(x) delete x._open; });
      const id=await createProject(p,"Imported from a review saved in this browser"); if(id){ localStorage.setItem("chai-legacy-imported","1"); document.getElementById("legacyBanner")?.remove(); toast("Review added to the workspace"); }
    }catch(err){ toast("Couldn't read the earlier review"); }
    return;
  }
  if(a==="legacy-dismiss"){ try{localStorage.setItem("chai-legacy-imported","1");}catch(e){} document.getElementById("legacyBanner")?.remove(); return; }
  if(a==="import"){ document.getElementById("importFile").click(); return; }
  if(a==="dl-csv"){ download(`ai-governance-portfolio-${TODAY()}.csv`, exportCSV()); return; }
  if(!S) return;
  if(a==="addmetric"){ S.metrics.push({cat:METRIC_CATS[0],name:"",value:"",ci:"",pop:""}); saveMetrics(); renderMain(false); const ins=document.querySelectorAll('.mtable input[aria-label="Metric"]'); ins[ins.length-1]?.focus(); }
  else if(a==="example"){ exampleInto(S); const st=stamp(); queuePatch(CUR,Object.assign({meta:clone(S.meta),items:clone(S.items),gates:clone(S.gates),metrics:clone(S.metrics),card:clone(S.card),cardUpdatedAt:S.cardUpdatedAt},st)); writeLog(CUR,"Example data filled in"); renderProject(false); toast("Example filled in"); }
  else if(a==="archive"){ const v=!S.archived; S.archived=v; queuePatch(CUR,Object.assign({archived:v},stamp())); writeLog(CUR,v?"Archived":"Restored"); renderMain(false); toast(v?"Project archived":"Project restored"); }
  else if(a==="delete"){ if(!confirm(`Delete "${S.meta.solution||"this project"}" for everyone? This can't be undone. Archive it instead to keep the record.`)) return;
    const id=CUR; delete pending[id]; clearTimeout(timers[id]);
    try{ await STORE.remove(id); goHome(); toast("Project deleted"); }catch(err){ toast("Couldn't delete the project"); } }
  else if(a==="newreview"){ const now=new Date().toISOString(); const patch={gates:{D:{date:TODAY(),signedBy:ME.id||null,signedAt:now}}}; deepMerge(S,patch); queuePatch(CUR,Object.assign(patch,stamp())); writeLog(CUR,`Checkpoint D: periodic review recorded (${S.gates.D.decision})`); renderRail(); renderMain(false); toast("Periodic review recorded"); }
  else if(a==="dl-html") download(`${slug(S.meta.solution)}-chai-review.html`, exportHTML());
  else if(a==="dl-md") download(`${slug(S.meta.solution)}-chai-review.md`, exportMD());
  else if(a==="dl-json") download(`${slug(S.meta.solution)}-chai-review.json`, JSON.stringify(projectJSON(S),null,2));
  else if(a==="print") window.print();
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="newform") return; e.preventDefault();
  const name=document.getElementById("newname").value.trim(); if(!name){ document.getElementById("newname").focus(); return; }
  const id=await createProject(blankProject(name),"Project created");
  if(id){ const wait=()=>PROJECTS.has(id)?openProject(id,"setup"):setTimeout(wait,120); wait(); }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){ UI.q=el.value; updateDashboard(); return; }
  const p=el.dataset && el.dataset.bind; if(!p || RO || !S) return;
  edit(p, el.value);
  if(p.startsWith("meta.")||p.startsWith("card.")||p.startsWith("metrics.")) renderLabel();
  if(p==="meta.solution"||p.startsWith("card.")) renderRail();
});
document.addEventListener("change",e=>{
  const el=e.target; if(el.tagName==="SELECT" && el.dataset.bind && S && !RO){ edit(el.dataset.bind, el.value); renderLabel(); renderRail(); }
});
document.getElementById("brandBtn").onclick=()=>goHome();
document.getElementById("goReport").onclick=()=>{ if(S) go("report"); };
document.getElementById("importFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const st=j._state||j;
    if(!st.meta||!st.items) throw new Error("not a review");
    const p=normalize(Object.assign(blankProject(st.meta.solution), clone(st))); delete p.id;
    Object.values(p.items).forEach(x=>{ if(x) delete x._open; }); delete p.view;
    p.updatedAt=new Date().toISOString(); p.updatedBy=ME.id||null;
    const id=await createProject(p,"Imported from a JSON export");
    if(id) toast("Project imported");
  }catch(err){ toast("That file isn't a project export from this tool"); }
  e.target.value="";
};
const panel=document.getElementById("panel");
document.getElementById("openPreview").onclick=()=>{ renderLabel(); panel.classList.add("open"); document.getElementById("closePreview").focus(); };
document.getElementById("closePreview").onclick=()=>panel.classList.remove("open");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") panel.classList.remove("open"); });
window.addEventListener("pagehide",()=>{ Object.keys(pending).forEach(flush); });

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

/* ============================================================
   Boot
   ============================================================ */
renderDashboardShell();
(async()=>{
  let db=null, user=null;
  const hasClaude = window.claude && typeof window.claude.use==="function";
  if(hasClaude){
    const dlP = window.claude.use("downloads").then(d=>{DL=d;}).catch(()=>{}).finally(()=>{dlChecked=true; updateDlUI();});
    [db,user] = await Promise.all([window.claude.use("db").catch(()=>null), window.claude.use("user").catch(()=>null)]);
  } else { dlChecked=true; }
  USER=user;
  if(user){
    try{ ME.id = await user.id(); }catch(e){}
    try{ const c=await user.can("data.write"); if(db && c===false) RO=true; }catch(e){}
    try{ CAN_DELETE = (await user.canEdit()) || (await user.isOwner()); }catch(e){ CAN_DELETE=false; }
  }
  if(db){ STORE=new DbStore(db); MODE="shared"; setMode(RO?"View only":"Shared workspace", RO?"ro":"shared"); }
  else {
    // Self-hosted backend, if this page is served by one. Checked only when
    // there is no artifact database, so the artifact path costs nothing.
    const api = await detectApi("/api");
    if(api){
      STORE=new ApiStore("/api"); MODE="api"; CAN_DELETE=true;
      setMode("Shared workspace","shared");
      // Identity is established by the proxy, so the browser cannot choose it.
      try{
        const me = await fetch("/api/me",{credentials:"same-origin"}).then(r=>r.json());
        if(me && me.id){ ME.id=me.id; if(me.name) NAMES[me.id]=me.name; }
      }catch(e){}
    } else {
      STORE=new LocalStore(); MODE="local"; CAN_DELETE=true; setMode("This browser only","");
    }
  }
  document.body.classList.toggle("ro",RO);
  STORE.subscribeAll(onProjects,onDbError);
})();

</script>
