name: Test

# Runs every test in the repository on every pull request and on main.
#
# Until this existed, CI ran the linters and nothing else (#32). Twenty-four
# test files, including every regression test written to keep a closed security
# finding closed, ran only when somebody remembered to run them locally, and
# pull requests merged on a green check that had executed none of them.
#
# Three suites need three environments, so there are three kinds of job, plus a
# unit test of this configuration:
#
#   changes     is this pull request prose documentation only? (D-105)
#   workflows   the CI config itself: it must run every test that exists
#   docs        the suites that read prose docs and need no database or browser
#   server      the API against a real PostgreSQL (what it tests IS the database)
#   browser-*   the dashboard in a real browser
#   engines     the page policy and the injection suites in Firefox and WebKit
#   stack       the proxy and the whole Compose stack, end to end
#   proxy-mcp   the MCP route and its gate, each guard broken, on a real Caddy
#
# Every job starts at once, so the run takes as long as its slowest job. The slow
# ones are split to run side by side on separate runners (D-97): server is a matrix
# of its three pytest runs, each with its own PostgreSQL; the Chromium suites are
# dealt into three jobs of about the same length; and proxy-mcp is a matrix of
# shards that partition its mutants. Nothing is dropped or skipped to save time:
# test_workflows.py checks that every suite still runs, and runs once.
#
# A pull request that changes only prose documentation does not need the heavy jobs
# (D-105). The `changes` job reads the changed files (scripts/ci_changes.py) and says
# docs_only=true only when every one is a Markdown page that no heavy suite reads;
# a push to main, a workflow change, a code change or any doubt says false and runs
# everything. When docs_only is true the heavy jobs (server, browser-*, engines,
# stack, proxy-mcp) are SKIPPED, and still run: `workflows (unit)`, and `docs`, the
# suites that read prose and need no database, browser or Docker. `tests passed`
# still reports on every pull request, because branch protection requires it, and
# accepts a skipped heavy job ONLY when `changes` says docs_only. A workflow-level
# `paths-ignore` was rejected: it would stop the required check from reporting at
# all, and a docs pull request could never merge.
#
# REQUIRE_TESTS makes a suite that cannot run FAIL instead of skipping. A skip
# exits 0 and reads as a pass: without this, the 106 database tests would skip
# silently on a runner with no database, and the run would be green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REQUIRE_TESTS: "1"

jobs:
  # Decides whether the heavy jobs run (D-105). Fails closed: on any error, on a
  # push, or when it is unsure, docs_only is false and everything runs.
  changes:
    name: changes (docs only?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history, so the merge base of the pull request and its base is there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py

  # The suites that read prose documents and need no database, browser or Docker.
  # They run on every pull request, and are what a docs-only pull request is tested
  # by besides `workflows (unit)` (D-105). tests/test_ci_changes.py scans the
  # repository for the documents each suite reads, so a page cannot be read by a
  # heavy suite without the classifier knowing.
  docs:
    name: docs (prose and its checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      # Every sentence that asserts a security property is quoted where it is made
      # and backed by a test CI runs.
      - name: the claims inventory
        run: pixi run check-claims

      # Governance metadata only, never patient data, stated where a deployer reads
      # first and on every page (#34): reads every page, needs no browser.
      - name: data scope
        if: ${{ !cancelled() }}
        run: pixi run test-data-scope

      # The deployment guide names no region in its commands and has a data
      # residency section (#58).
      - name: deploy residency
        if: ${{ !cancelled() }}
        run: pixi run test-deploy-residency

      # Every ARN the docs show for the audience starts the API (#51, #62). It reads
      # every page and needs no database, so a docs-only change is checked by it here.
      - run: pip install -e "server[dev]"
        if: ${{ !cancelled() }}
      - name: every ARN the docs show starts the API
        if: ${{ !cancelled() }}
        working-directory: server
        run: pytest -q -rs tests/test_auth.py -k test_every_arn_the_docs_show_for_the_audience_starts

      # The site builds with no broken link or nav entry (lint's hook builds it too;
      # a docs-only change must not depend on another workflow for this).
      - name: the site builds, strictly
        if: ${{ !cancelled() }}
        run: pixi run docs-build

  workflows:
    name: workflows (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      # Does CI run every test that exists, and does it fail when one cannot run?
      - run: pixi run test-workflows

      # The docs lane's classifier, and the scan that keeps its list of heavy-read
      # pages exact (D-105).
      - run: pixi run test-ci-changes

      # The proxy-mcp shards run every mutant exactly once, and a selector that drops
      # or repeats one is noticed (D-97).
      - run: pixi run test-mutant-shards

      # Every skip in the test code reads REQUIRE_TESTS, so a suite that cannot run
      # fails in CI instead of passing silently (C-33).
      - run: pixi run test-require-tests
      # The identity settings the docs give per front door match what the proxy test runs (C-02).
      - run: pixi run test-front-doors

      # A stale or hand-edited generated dashboard is something the build-app hook
      # fails on, and the hook's pattern covers the generated file (C-31).
      - run: pixi run test-build-hook

      # The build embeds exactly the configured frameworks, and refuses any other (#168).
      - run: pixi run test-build-config

      - run: pixi run test-enums
      - run: pixi run test-fingerprint-skip
      - run: pixi run test-check-injection
      - run: pixi run test-check-i18n

      # The British-spelling guard: every listed word and its inflections caught,
      # exemptions no wider than they say, and mutants noticed (#169).
      - run: pixi run test-check-spelling

      # The checklist pages are their framework definitions, byte for byte (#168).
      - run: pixi run test-framework-docs

      # Framework definitions: the real ones pass, and every rule of the checker
      # is shown failing on a copy broken the way it guards against (#168).
      - run: pixi run check-framework
      - run: pixi run test-check-framework

      # docs/crosswalk.md agrees with OPTICA's definition, and the check is shown
      # failing on each way the two could drift apart (#174).
      - run: pixi run check-crosswalk
      - run: pixi run test-crosswalk

      # The showcase video on the docs site: present, under its size cap,
      # first-party, and honest about which mode it shows.
      - run: pixi run test-docs-media

      # The claims inventory: its checker is tested, and the network isolation the
      # security model rests on is asserted against the real compose.yaml.
      - run: pixi run test-claims

      # `make doctor` reads docker's answers correctly, including the role checks.
      - run: pixi run test-doctor

      # The Croissant example publishes no named people by default.
      - run: pixi run test-croissant

      # Backups: the passphrase is never in argv (gpg and make are on the runner).
      - run: pixi run test-backup-crypto

      # `make check-isolation`'s checker, with a mutation test for each thing it
      # must notice. The run against the real stack is in the stack job.
      - run: pixi run test-isolation
      - run: pixi run test-compose
      - run: pixi run test-preflight

      # Static analysis of the workflow files themselves.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # The three pytest runs, one per leg, each against its own PostgreSQL (D-97). They
  # used to run one after another in one job, about 6 minutes each. Each step runs
  # only in its own leg; test_workflows.py checks that every leg runs its suite, so a
  # leg that runs nothing cannot pass for one that ran.
  server:
    name: server (${{ matrix.suite }}, PostgreSQL 18)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # The agent API's mutation tests run a copy of the server once per broken guard.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [owner, app-role, mcp]
    services:
      postgres:
        # The major version compose.yaml pins. test_workflows.py fails if the two
        # drift, because a test against the wrong Postgres proves nothing.
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/chai_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - run: pip install -e "server[dev]"

      # The merge-parity test runs the browser's own deepMerge under node.
      - run: node --version

      - name: pytest, connected as the table owner
        if: ${{ matrix.suite == 'owner' }}
        working-directory: server
        run: pytest -q -rs

      # The same suite, with the API connected as the restricted role it serves as
      # in a real deployment (#48). "The role can do its job" is only shown by
      # doing it: this is every API test passing without the owner's privileges.
      - name: pytest, connected as the restricted role
        if: ${{ matrix.suite == 'app-role' }}
        working-directory: server
        env:
          TEST_APP_ROLE: "1"
        run: pytest -q -rs

      # The optional MCP service (#164, R-73, D-91): the SDK's own client against the
      # real service in front of the real API on this PostgreSQL, and every guard broken
      # in a copy and noticed. No network is used: the service is called on loopback.
      - if: ${{ matrix.suite == 'mcp' }}
        run: pip install -e "mcp[dev]"
      - name: pytest, the MCP service
        if: ${{ matrix.suite == 'mcp' }}
        working-directory: mcp
        run: pytest -q -rs

  # The Chromium suites, dealt into three jobs that run side by side (D-97). They
  # are balanced by measured time (run 38307463666, about 400 seconds of suites
  # each): one long suite, test-rules-banner, sets the floor. One step per suite so
  # the run shows which failed, and `!cancelled()` so one failure does not hide the
  # rest; test_workflows.py checks both, and that every suite still runs.
  browser-1:
    name: browser (integration, Chromium, 1 of 3)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - run: pixi run playwright install --with-deps chromium

      - name: the CHAI and OPTICA dashboard
        run: pixi run test-app
      # check-app is shown failing on broken, rebuilt copies of app/, and every
      # browser global it accepts is shown to exist in this engine (#176).
      - name: check-app finds undefined names and use before declaration
        if: ${{ !cancelled() }}
        run: pixi run test-check-app
      - name: boot, storage mode, and the saved label
        if: ${{ !cancelled() }}
        run: pixi run test-boot
      - name: access control in the UI
        if: ${{ !cancelled() }}
        run: pixi run test-access
      - name: the page says when its server retires records by other rules
        if: ${{ !cancelled() }}
        run: pixi run test-rules-banner

  browser-2:
    name: browser (integration, Chromium, 2 of 3)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - run: pixi run playwright install --with-deps chromium

      # The Markdown report rendered by CommonMark renderers, the HTML audited (#167).
      - name: the Markdown report, rendered, is still only text
        run: pixi run test-markdown-render
      - name: a refused save is sent once, kept, and explained
        if: ${{ !cancelled() }}
        run: pixi run test-save-refused
      - name: changelog
        if: ${{ !cancelled() }}
        run: pixi run test-changelog
      - name: delete dialog and destroying history
        if: ${{ !cancelled() }}
        run: pixi run test-disposal-ui

      # The litigation hold on the setup page: owner only, needs a reason, and sends
      # what the owner chose (#57).
      - name: hold UI
        if: ${{ !cancelled() }}
        run: pixi run test-holds-ui
      - name: exports
        if: ${{ !cancelled() }}
        run: pixi run test-exports
      - name: untrusted keys cannot reach a prototype
        if: ${{ !cancelled() }}
        run: pixi run test-untrusted-keys
      - name: search all text on the portfolio
        if: ${{ !cancelled() }}
        run: pixi run test-text-search
      - name: languages
        if: ${{ !cancelled() }}
        run: pixi run test-i18n
      - name: framework content in other languages
        if: ${{ !cancelled() }}
        run: pixi run test-framework-i18n
      - name: audit log writes
        if: ${{ !cancelled() }}
        run: pixi run test-audit

  browser-3:
    name: browser (integration, Chromium, 3 of 3)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - run: pixi run playwright install --with-deps chromium

      - name: exports are reported to the read trail
        run: pixi run test-export-beacon

      # Each export states which storage mode produced it (#93).
      - name: export provenance
        if: ${{ !cancelled() }}
        run: pixi run test-export-provenance

      # Every export carries a SHA-256 and MD5 of its record, recomputed in Python from
      # the file alone (#150).
      - name: fingerprint
        if: ${{ !cancelled() }}
        run: pixi run test-fingerprint
      - name: real exports validate against the published schema
        if: ${{ !cancelled() }}
        run: pixi run test-export-schema

      # Text a person types stays text, on every screen and in every export: each string
      # in a project poisoned with markup and script payloads, then audited (#154).
      - name: injection
        if: ${{ !cancelled() }}
        run: pixi run test-injection

      # Governance metadata only, never patient data (#34): the in-app notice is in
      # test-boot; the pages' statement is in the docs job (test-data-scope).
      - name: session controls (idle lock, sign-out, lost stream)
        if: ${{ !cancelled() }}
        run: pixi run test-session-ui
      - name: the agent access page mints, lists and revokes, and never keeps the token
        if: ${{ !cancelled() }}
        run: pixi run test-agent-access
      - name: user ids become people
        if: ${{ !cancelled() }}
        run: pixi run test-people
      - name: audit history window and paging
        if: ${{ !cancelled() }}
        run: pixi run test-log-window
      - name: free-text fields do not feed the browser's spellchecker
        if: ${{ !cancelled() }}
        run: pixi run test-text-fields
      - name: evidence references are links and fingerprints, never the file
        if: ${{ !cancelled() }}
        run: pixi run test-refs
      - name: credentials in an address are removed on entry, import and export
        if: ${{ !cancelled() }}
        run: pixi run test-address-credentials
      - name: notes take a Markdown subset and nothing that carries markup
        if: ${{ !cancelled() }}
        run: pixi run test-markdown
      - name: the framework engine's rules on stand-in definitions
        if: ${{ !cancelled() }}
        run: pixi run test-engine
      - name: what the default build shows and exports is pinned
        if: ${{ !cancelled() }}
        run: pixi run test-snapshot
      - name: the shell never names a framework
        if: ${{ !cancelled() }}
        run: pixi run test-framework-boundary
      - name: a build of other frameworks works and names nothing of CHAI or OPTICA
        if: ${{ !cancelled() }}
        run: pixi run test-custom-build
      - name: CHAI metric picker
        if: ${{ !cancelled() }}
        run: pixi run test-te
      - name: PDF export
        if: ${{ !cancelled() }}
        run: pixi run test-pdf
      - name: no third-party requests
        if: ${{ !cancelled() }}
        run: pixi run test-no-3p

      # The proxy's Content-Security-Policy names the dashboard's script by its hash and
      # refuses any other; the exported report carries a policy that allows no script (#154).
      - name: content security policy
        if: ${{ !cancelled() }}
        run: pixi run test-csp

  stack:
    name: stack (end to end, Docker Compose)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - run: pixi run playwright install --with-deps chromium

      # The proxy against a real Caddy: identity handoff, security headers, body
      # cap. Needs Docker, which the runner has.
      - name: proxy
        run: pixi run test-proxy

      # The agent API's route in the Caddyfile: each guard (only the three GET routes,
      # every identity header stripped, none set) broken in a copy, and noticed (#164).
      - name: proxy, the agent route's guards
        run: pixi run test-proxy-agent

      # The identity handoff in the Caddyfile (strip, then set), each step broken in a
      # copy and noticed: a forged header beside a valid identity must be replaced (C-01).
      - name: proxy, the identity handoff's guards
        run: pixi run test-proxy-identity

      # Locked and hashed dependencies, digest-pinned images and actions, a watch for
      # updates, a security policy, and the real image built from the lock (#37).
      - name: supply chain
        run: pixi run test-supply-chain

      # Subject access: find one person's identifier everywhere, against a real
      # PostgreSQL (#57).
      - name: subject access
        run: pixi run test-subject-access

      # make phi-scan: finds a pasted identifier in the live record, the history and
      # the audit log, and is silent on the sample projects (#66).
      - name: phi scan
        run: pixi run test-phi-scan

      # A restore puts purges back: a real dump taken before a purge, restored after
      # it, and the ledger re-applied (#116).
      - name: purge ledger
        run: pixi run test-purge-ledger

      # `make dispose`: a report that changes nothing and never prints content, and an
      # --apply that disposes of what it reported and records who ran it (#57).
      - name: dispose
        run: pixi run test-dispose

      # `make agent-tokens`: an operator lists and revokes agent tokens, as the database
      # owner, on a real PostgreSQL (#164).
      - name: agent tokens
        run: pixi run test-agent-tokens

      # `make verify-backup`: a real dump restored into a throwaway PostgreSQL, and
      # `make restore` asking before it overwrites anything (#52).
      - name: backups restore
        run: pixi run test-verify-backup

      # What `docker build` uploads to the daemon: no .env, backups, .git or PDF.
      - name: build contexts
        run: pixi run test-dockerignore

      # The cloud proxy image rebuilds Caddy with a patched Go (D-72); nothing else
      # starts that binary, so build it, run it, and check it is the stack's release.
      - name: the cloud proxy image
        run: pixi run test-proxy-image

      - name: bring up the stack
        run: |
          # The generator the docs and preflight tell people to use. Base64 emits
          # "/", "+" and "=", which once crashed the API on startup about half the
          # time (R-25), so this exercises the documented first-run path.
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          # A throwaway .env. It goes straight to `docker compose`, not through
          # `make up`, so preflight's refusal of a literal identity does not
          # apply; this stack exists for one test run and is then destroyed.
          {
            echo "POSTGRES_PASSWORD=$password"
            # The API's restricted role gets its own password (#48).
            echo "APP_POSTGRES_PASSWORD=$(openssl rand -base64 32)"
            echo "IDENTITY_ID_SOURCE=ci@localhost"
            echo "IDENTITY_NAME_SOURCE=CI User"
            echo "IDENTITY_EMAIL_SOURCE=ci@localhost"
            echo "HTTP_PORT=8080"
            # On, so the end-to-end run exercises the shared-secret control (#61).
            echo "PROXY_SHARED_SECRET=$(openssl rand -hex 32)"
            # On, so the end-to-end run exercises the agent API (#164).
            echo "AGENT_ID_SECRET=$(openssl rand -base64 48)"
            # The host the MCP service answers to when its profile is turned on. The
            # profile is NOT: `up` below starts the default services only (#164).
            echo "MCP_ALLOWED_HOSTS=localhost:8080"
          } > .env
          docker compose up -d --build
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "stack did not become healthy"
          docker compose ps
          docker compose logs
          exit 1

      # Off by default, then on with the profile: the protocol through the real proxy to
      # the real API, the isolation of the container, the logs and the read trail (#164).
      - name: the MCP service, off and on
        run: pixi run test-stack-mcp

      - name: end to end
        run: pixi run test-stack

      - name: logs on failure
        if: ${{ failure() }}
        run: docker compose --profile agent-mcp logs --no-color

      - name: tear down
        if: ${{ always() }}
        run: docker compose --profile agent-mcp down -v

  # The optional MCP service's route in the Caddyfile and its gate: only the
  # transport's methods on /mcp, every identity header stripped and none set, a 502
  # with nothing behind it, each guard broken in a copy and noticed (#164). Its own
  # job: it restarts a real Caddy for every broken copy and took about 26 minutes in
  # one piece, which timed out the stack job it first ran in. It is split into
  # shards that partition the mutants (D-97): MUTANT_SHARD=i/n runs every n-th one,
  # and `test-mutant-shards` shows the shards run each mutant exactly once.
  proxy-mcp:
    name: proxy, the MCP route and the gate (each guard broken, ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      MUTANT_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Print each mutant, and how long it took, as it runs.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      - run: pixi run test-proxy-mcp

  # The page's own policy is enforced by each browser's own implementation, so the
  # two suites that depend on it run in Firefox and WebKit as well (#160). The
  # matrix value reaches the tests as TEST_BROWSER, and an unknown value is an
  # error there, not a fallback to Chromium.
  engines:
    name: browser engines (${{ matrix.engine }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.engine }}
      # Print each check as it runs, so a log shows where a run stopped.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          locked: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('pixi.lock') }}

      - run: pixi run playwright install --with-deps ${{ matrix.engine }}

      - name: the page policy refuses injected script in this engine
        run: pixi run test-csp
      # The browser globals check-app accepts exist in this engine too (#176).
      - name: check-app's accepted globals exist in this engine
        if: ${{ !cancelled() }}
        run: pixi run test-check-app
      - name: poisoned text stays text in this engine
        if: ${{ !cancelled() }}
        run: pixi run test-injection
      - name: the rendered Markdown report is audited in this engine
        if: ${{ !cancelled() }}
        run: pixi run test-markdown-render

  # One check that means "everything passed", so branch protection can require a
  # single name and a new job cannot be forgotten. It reports on every pull request,
  # docs-only or not, which a workflow-level `paths-ignore` could not do (D-105).
  # `skipped` counts as a failure: a job that did not run proved nothing. The one
  # exception is a heavy job when `changes` says the pull request is prose only.
  tests-passed:
    name: tests passed
    if: ${{ always() }}
    needs: [changes, docs, workflows, server, browser-1, browser-2, browser-3, engines, stack, proxy-mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: a job failed or was canceled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      # These three run for every change, so for them skipped is never fine.
      - name: changes, docs or workflows did not succeed
        if: ${{ needs.changes.result != 'success' || needs.docs.result != 'success' || needs.workflows.result != 'success' }}
        run: exit 1
      # A heavy job may be skipped only because the change is prose only.
      - name: a job was skipped, and the change is not docs only
        if: ${{ contains(needs.*.result, 'skipped') && needs.changes.outputs.docs_only != 'true' }}
        run: exit 1
      - run: echo "every job that should have run passed"
