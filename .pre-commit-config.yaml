# Git hooks, run with prek (https://prek.j178.dev) — a drop-in, dependency-free
# replacement for pre-commit. Install the shims once with: pixi run hooks-install
#
# The vendored single-file dashboard is excluded from the whitespace fixers.
# It is a self-contained app with inline JS template literals, where rewriting
# whitespace is not reliably a no-op.
exclude: '^docs/app/index\.html$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Lint first, then format: ruff-check --fix can rewrite code, and
      # ruff-format should have the last word on layout.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      # Reads .rumdl.toml, so the mkdocs flavor applies here too and Material
      # admonitions are not reported as errors.
      - id: rumdl-check

  - repo: local
    hooks:
      # Catches broken internal links before they reach CI, where the same
      # --strict build gates the deploy. Note: --strict does NOT flag a nav
      # entry pointing at a missing page -- that builds clean, so nav changes
      # still want a look at the rendered site.
      # Blocks non-Latin characters that render like ASCII letters. A URL
      # shared with this project used a Cyrillic o in "who"; that class of
      # substitution is invisible in review and breaks search and anchors.
      - id: check-homographs
        name: check for confusable characters
        entry: pixi run check-homographs
        language: system
        types: [text]

      # Regenerates the published CHAI checklist from the app. prek fails the
      # run if this modifies the file, so the docs cannot drift from the app.
      - id: gen-checklists
        name: regenerate generated checklist pages
        entry: pixi run gen-docs
        language: system
        pass_filenames: false
        files: '^(data/optica_items\.json|scripts/gen_.*\.py)$'

      # Rebuilds the single-file dashboard from app/. prek fails the run if
      # this changes docs/app/index.html, so the generated file can never be
      # stale relative to its sources.
      - id: build-app
        name: rebuild the dashboard from app/
        entry: pixi run build-app
        language: system
        pass_filenames: false
        files: '^(app/|scripts/build_app\.py$)'

      # Syntax and duplicate-declaration checks on the concatenated bundle.
      - id: check-app
        name: check the built dashboard
        entry: pixi run check-app
        language: system
        pass_filenames: false
        files: '^(app/|docs/app/index\.html$|scripts/(build|check)_app\.py$)'

      - id: zensical-build
        name: zensical build (strict)
        entry: pixi run zensical build --clean --strict
        language: system
        pass_filenames: false
        files: '^(docs/|zensical\.toml$)'
