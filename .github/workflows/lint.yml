name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true

      # Same hooks a contributor gets locally, so CI cannot drift from them.
      - run: pixi run prek run --all-files --show-diff-on-failure
